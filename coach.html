<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Coach Board" />
<title>Coach Board</title>
<style>
  :root { --bg: #0a0a0a; --panel: #161616; --panel-2: #1f1f1f; --border: #2c2c2c; --text: #f2f2f2; --dim: #9a9a9a; --accent: #c8102e; }
  :root[data-holiday] { --accent: var(--hol-1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* sign in */
  .login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 28px; text-align: center; }
  .login img { height: 40px; margin-bottom: 14px; }
  .login h1 { font-size: 20px; margin: 0 0 4px; }
  .login p { color: var(--dim); font-size: 13px; margin: 0 0 18px; }
  .login label { display: block; text-align: left; font-size: 12px; color: var(--dim); margin: 12px 0 4px; }
  .login input { width: 100%; height: 46px; font-size: 16px; background: var(--panel-2); border: 1px solid #444; border-radius: 8px; padding: 0 12px; }
  .login button { width: 100%; height: 48px; margin-top: 18px; border: none; border-radius: 10px; background: var(--accent); font-size: 16px; font-weight: 700; }
  .login .err { color: #ff8a8a; font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* the board: athletes down the side, the picked athlete's program beside them */
  .board { display: grid; grid-template-columns: 290px 1fr; height: 100%; }
  .side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--panel); }
  .side-head { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 14px 10px; }
  .side-head img { height: 26px; }
  .side-head strong { font-size: 15px; }
  .add { position: relative; padding: 0 14px 10px; }
  .add input { width: 100%; height: 44px; font-size: 16px; background: var(--panel-2); border: 1px solid #444; border-radius: 10px; padding: 0 12px; }
  .results { position: absolute; left: 14px; right: 14px; top: 46px; z-index: 10; max-height: 60vh; overflow-y: auto; background: var(--panel-2); border: 1px solid #444; border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); }
  .result { display: block; width: 100%; text-align: left; padding: 10px 12px; background: none; border: none; border-bottom: 1px solid var(--border); font-size: 14px; }
  .result:last-child { border-bottom: none; }
  .result:hover, .result:focus { background: var(--panel); outline: none; }
  .result small, .who small { display: block; color: var(--dim); font-size: 11px; }
  .result.none { color: var(--dim); }
  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px; }
  .list-hint { color: var(--dim); font-size: 13px; padding: 12px 8px; }
  .who { display: flex; align-items: center; gap: 6px; width: 100%; margin-bottom: 6px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); }
  .who.on { border-color: var(--accent); background: var(--accent); }
  .who.on small { color: rgba(255, 255, 255, 0.8); }
  .who-pick { flex: 1; min-width: 0; text-align: left; background: none; border: none; padding: 9px 4px 9px 12px; font-size: 14px; font-weight: 600; }
  .who-pick span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who-x { flex: 0 0 36px; height: 36px; background: none; border: none; font-size: 18px; color: var(--dim); }
  .who.on .who-x { color: #fff; }
  .side-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); font-size: 12px; color: var(--dim); }
  .side-foot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-foot button { background: none; border: none; text-decoration: underline; color: var(--dim); font-size: 12px; flex: 0 0 auto; }
  .stage { position: relative; min-width: 0; min-height: 0; }
  .stage iframe { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 680px; height: 100%; border: 0; border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--bg); }
  .stage .empty { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--dim); padding: 24px; font-size: 15px; }

  /* KPI sheet: athletes down the side, trials across */
  .kpi-btn { margin-left: auto; height: 34px; padding: 0 12px; border: 1px solid #555; border-radius: 8px; background: none; font-size: 13px; font-weight: 700; }
  .kpi-btn.on { background: var(--accent); border-color: var(--accent); }
  .kpi { position: absolute; inset: 0; overflow-y: auto; padding: 18px; }
  .kpi-note { color: var(--dim); padding: 24px 0; font-size: 15px; }
  .kpi-head, .kpi-new, .kpi-foot { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-bottom: 14px; }
  .kpi label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); }
  .kpi select, .kpi-head input, .kpi-new input { height: 44px; font-size: 16px; color: var(--text); background: var(--panel-2); border: 1px solid #444; border-radius: 8px; padding: 0 10px; color-scheme: dark; }
  .kpi-new { padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .kpi-ghost { height: 44px; padding: 0 14px; background: none; border: 1px solid #555; border-radius: 8px; font-size: 14px; }
  .kpi-save { height: 44px; padding: 0 18px; background: var(--accent); border: none; border-radius: 8px; font-size: 15px; font-weight: 700; }
  .kpi-save:disabled { opacity: 0.6; }
  .kpi-status, .kpi-err { font-size: 13px; color: var(--dim); align-self: center; }
  .kpi-err { color: #ff8a8a; }
  .kpi-hint { color: var(--dim); font-size: 12px; margin: 0; max-width: 640px; }
  .kpi-scroll { overflow-x: auto; margin-bottom: 14px; border: 1px solid var(--border); border-radius: 10px; }
  .kpi-sheet { border-collapse: collapse; font-size: 14px; }
  .kpi-sheet th, .kpi-sheet td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0; text-align: center; white-space: nowrap; }
  .kpi-sheet tr:last-child > * { border-bottom: none; }
  .kpi-sheet thead th { padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); background: var(--panel); }
  .kpi-sheet tbody th, .kpi-sheet thead th:first-child { position: sticky; left: 0; z-index: 1; text-align: left; padding: 0 12px; background: var(--panel); min-width: 150px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .kpi-sheet td input { display: block; width: 78px; height: 44px; border: none; background: transparent; text-align: center; font-size: 16px; }
  .kpi-sheet td input:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--panel-2); }
  .kpi-num { padding: 0 12px !important; min-width: 64px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--panel); }
  .kpi-num.past, .kpi-sheet th.past { font-weight: 400; color: var(--dim); }
  .kpi-num em { margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: var(--accent); color: #fff; font-size: 10px; font-style: normal; font-weight: 700; }
  .kpi-num small { display: block; font-size: 10px; line-height: 1; padding-bottom: 3px; }

  /* phone: the athletes become a strip across the top */
  @media (max-width: 780px) {
    .board { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .kpi { padding: 12px; }
    .kpi-sheet tbody th, .kpi-sheet thead th:first-child { min-width: 110px; max-width: 130px; }
    .side { min-width: 0; border-right: none; border-bottom: 1px solid var(--border); }
    .side-head { padding-bottom: 6px; }
    .add { padding-bottom: 8px; }
    .list { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 0 14px 8px; flex: 0 0 auto; scrollbar-width: none; }
    .list::-webkit-scrollbar { display: none; }
    .list-hint { padding: 4px 0 8px; white-space: nowrap; }
    .who { flex: 0 0 auto; width: auto; max-width: 200px; margin-bottom: 0; }
    .who small { display: none; }
    .side-foot { display: none; }
    .stage iframe { max-width: none; border-left: none; border-right: none; }
  }
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="login-form">
    <img src="assets/dst-logo-light.png" alt="Dynamic Sports Training" />
    <h1>Coach Board</h1>
    <p>Sign in with your dashboard account.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="login-btn">Sign In</button>
    <div class="err" id="login-err" role="alert"></div>
  </form>
</div>

<div class="board" id="board" hidden>
  <aside class="side">
    <div class="side-head"><img src="assets/dst-logo-light.png" alt="Dynamic Sports Training" /><strong>Coach Board</strong><button id="kpi-btn" class="kpi-btn" type="button">Log KPI</button></div>
    <div class="add">
      <input id="search" type="search" placeholder="Add an athlete…" aria-label="Add an athlete" autocomplete="off" />
      <div class="results" id="results" hidden></div>
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot"><span id="me"></span><button id="signout">Sign out</button></div>
  </aside>
  <main class="stage" id="stage"></main>
</div>

<script crossorigin src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="holiday.js"></script>
<script src="coach.js"></script>
</body>
</html>
