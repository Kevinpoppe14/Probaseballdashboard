<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="My DST Program" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="manifest" href="athlete.webmanifest" />
<link rel="apple-touch-icon" href="assets/app-icon-180.png" />
<link rel="icon" type="image/png" href="assets/app-icon-180.png" />
<title>My Program</title>
<style>
  :root { --bg: #0a0a0a; --panel: #161616; --panel-2: #1f1f1f; --border: #2c2c2c; --text: #f2f2f2; --dim: #9a9a9a; --accent: #c8102e; --pct: #00ffff; --line: #444; --placeholder: #666; --good: #6fd58a; --gold: #f0c040; }
  /* Cubs players: navy and Cubs blue, with Cubs red for the superset labels */
  body.cubs { --bg: #06122b; --panel: #0c1d42; --panel-2: #12285a; --border: #23407a; --dim: #a9b8d6; --accent: #0e3386; --label: #ff5a59; --pct: #d6e2f7; }
  body.cubs .chip.on { border-color: #4a74d1; }
  body.cubs .set input { border-color: #3a5a9c; }
  body.cubs .set input:focus { outline-color: #cc3433; }
  /* Light mode (the sun/moon button at the top, remembered on the phone; see athlete.js): the same layout on light
     panels, for DST and for the Cubs look. Text on a red or blue fill stays white. */
  :root[data-theme="light"] { --bg: #f2f3f5; --panel: #ffffff; --panel-2: #eceef1; --border: #d8dbe0; --text: #16181b; --dim: #5d636b; --pct: #00e5ee; --line: #c2c7ce; --placeholder: #9aa0a8; --good: #1f8a45; --gold: #9a6b00; color-scheme: light; }
  :root[data-theme="light"] body.cubs { --bg: #eef2fa; --panel: #ffffff; --panel-2: #e4ebf7; --border: #c7d3e8; --dim: #4b5a77; --label: #cc3433; --pct: #cfe0fb; }
  :root[data-theme="light"] .chip.on, :root[data-theme="light"] .now-tag, :root[data-theme="light"] .swap-actions .primary, :root[data-theme="light"] .session-log { color: #fff; }
  :root[data-theme="light"] .overlay { background: rgba(20, 22, 26, 0.55); }
  :root[data-theme="light"] .sheet, :root[data-theme="light"] .card, :root[data-theme="light"] .group { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06); }
  /* the sun/moon button, top right */
  .theme-toggle { position: absolute; right: 10px; top: calc(8px + env(safe-area-inset-top)); width: 34px; height: 34px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 17px; border: 1px solid var(--border); background: var(--panel); color: var(--dim); }
  /* Holiday colors (see holiday.js): only while <html data-holiday> is set, which is on the holiday itself */
  :root[data-holiday] body, :root[data-holiday] body.cubs { --accent: var(--hol-1); --label: var(--hol-1); }
  :root[data-holiday] .top { border-bottom: 5px solid; border-image: linear-gradient(90deg, var(--hol-1) 0 33.3%, var(--hol-3) 33.3% 66.6%, var(--hol-2) 66.6% 100%) 1; }
  :root[data-holiday] .chips.days .chip.on { background: var(--hol-2); border-color: var(--hol-3); }
  :root[data-holiday] .session-done { border-color: var(--hol-2); }
  .holiday-greeting { font-size: 12px; font-weight: 700; padding: 2px 12px; border-radius: 999px; background: var(--hol-1); color: #fff; border: 1px solid var(--hol-3); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  body { padding: 0 0 calc(84px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); padding: calc(6px + env(safe-area-inset-top)) 12px 6px; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .brand img { height: 28px; width: auto; max-width: 140px; object-fit: contain; }
  body.cubs .brand img { height: 36px; }
  .menu { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--panel); border-top: 1px solid var(--border); padding: 0 0 env(safe-area-inset-bottom); }
  .menu-item { flex: 1; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; border-top: 3px solid transparent; font-size: 11px; color: var(--dim); }
  .menu-icon { display: flex; }
  .menu-item.on { color: var(--text); font-weight: 700; border-top-color: var(--label, var(--accent)); }
  .menu-item.on .menu-icon { color: var(--label, var(--accent)); }
  .section { font-size: 15px; margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .section small { font-size: 12px; font-weight: 400; color: var(--dim); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .card-title { font-weight: 700; font-size: 15px; }
  .card-sub { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .bar { height: 8px; border-radius: 4px; background: var(--panel-2); margin-top: 8px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--label, var(--accent)); }
  .phase { border-left: 4px solid #666; padding: 6px 0 6px 10px; margin-top: 10px; }
  .phase.past { opacity: 0.5; }
  .phase-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .phase-when { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .now-tag { font-size: 11px; font-weight: 700; background: var(--accent); border-radius: 10px; padding: 1px 8px; }
  .goal { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; font-size: 14px; }
  .goal + .goal { border-top: 1px solid var(--border); }
  .goal-rank { color: var(--dim); font-size: 12px; min-width: 14px; }
  .goal.done { color: var(--dim); }
  .action { font-size: 14px; white-space: pre-wrap; line-height: 1.45; }
  .action .lead { margin: 0 0 8px; font-weight: 600; white-space: normal; }
  .who { font-size: 12px; color: var(--dim); text-align: center; }
  .weekbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .weekbar h1 { font-size: 13px; margin: 0; text-align: center; line-height: 1.15; }
  .weekbar h1 small { display: block; font-size: 10.5px; font-weight: 400; color: var(--dim); }
  .nav { width: 32px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); font-size: 16px; line-height: 1; padding: 0; }
  .nav:disabled { opacity: 0.3; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; min-height: 40px; padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--panel); font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .chips.days .chip { border-radius: 10px; }
  /* days already logged step back so the ones still to do stand out; they can still be opened and edited */
  .chips.days .chip.done:not(.on) { background: transparent; border-style: dashed; color: var(--dim, #8a8a8a); opacity: 0.6; }
  .chips.days .chip.done.on { opacity: 0.75; }
  main { padding: 12px 16px 0; }
  .program-name { font-size: 13px; color: var(--dim); margin: 0 0 10px; }
  .warmup { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; white-space: pre-wrap; }
  .group { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .ex { padding: 12px; }
  .ex + .ex { border-top: 1px solid var(--border); }
  .ex-head { display: flex; align-items: baseline; gap: 8px; }
  .label { color: var(--label, var(--accent)); font-weight: 700; flex: 0 0 auto; }
  .name { font-weight: 700; font-size: 16px; text-transform: uppercase; background: none; border: none; padding: 0; text-align: left; }
  button.name { text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; }
  .ex-head .swap { margin-left: auto; flex: 0 0 auto; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); font-size: 16px; color: var(--dim); align-self: center; }
  /* a coach's camera button, on an exercise with no video: films one for it */
  .ex-head .film { margin-left: auto; flex: 0 0 auto; width: 36px; height: 36px; border-radius: 8px; border: 1px dashed var(--label, var(--accent)); background: var(--panel-2); color: var(--label, var(--accent)); align-self: center; display: flex; align-items: center; justify-content: center; padding: 0; }
  .ex-head .film + .swap { margin-left: 6px; }
  .ex-head .film + .film { margin-left: 6px; }
  /* a remote athlete's form-check camera, and what was sent / the coach's reply under the exercise */
  .ex-head .film.check { border-style: solid; border-color: var(--border); color: var(--text); }
  .check-line { margin-top: 6px; font-size: 13px; }
  .check-sent { color: var(--good); font-weight: 600; }
  .check-reply { margin-top: 4px; padding: 6px 10px; border-left: 3px solid var(--label, var(--accent)); background: var(--panel-2); border-radius: 0 6px 6px 0; white-space: pre-wrap; }
  .check-note { width: 100%; margin-top: 10px; font: inherit; font-size: 16px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
  .ex-head .swap.on { color: var(--text); border-color: var(--label, var(--accent)); }
  .swap-coach { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
  .swap-label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 4px; }
  .sheet input { width: 100%; height: 44px; font-size: 16px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; }
  .swap-name { margin-top: 4px; }
  .matches { display: flex; flex-direction: column; }
  .match { text-align: left; min-height: 40px; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--border); border-top: none; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .match small { color: var(--dim); }
  .swap-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
  .swap-row label { flex: 1; font-size: 11px; color: var(--dim); }
  .swap-row input { text-align: center; padding: 0 4px; margin-top: 2px; }
  .swap-x { flex: 0 0 40px; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); font-size: 18px; }
  .swap-add { background: none; border: none; color: var(--dim); font-size: 14px; padding: 6px 0; text-decoration: underline; }
  .swap-note { font-size: 14px; min-height: 20px; margin: 12px 0 8px; }
  .swap-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .swap-actions button { flex: 1 1 auto; min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2); font-size: 15px; }
  .swap-actions .primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .coach-menu .swap-actions { flex-direction: column; }
  .session-end { margin: 6px 0 20px; }
  .session-log { width: 100%; min-height: 52px; border-radius: 12px; border: none; background: var(--accent); font-size: 17px; font-weight: 700; }
  .session-done { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #2e9e4f; color: var(--good); font-weight: 700; }
  .session-undo { background: none; border: none; color: var(--dim); font-size: 14px; text-decoration: underline; min-height: 44px; }
  .log-ex { margin: 12px 0; padding-top: 10px; border-top: 1px solid var(--border); }
  .log-name { font-weight: 700; text-transform: uppercase; font-size: 14px; }
  .sheet .set input { border-radius: 0; padding: 0 4px; }
  .eq-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .eq-tile { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); font-size: 14px; }
  .eq-tile.on { border-color: var(--label, var(--accent)); font-weight: 600; }
  .eq-tile input { width: 22px; height: 22px; margin: 0; flex: 0 0 auto; accent-color: var(--accent); }
  .eq-tile span:first-of-type { flex: 1; min-width: 0; }
  .eq-len-wrap { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; color: var(--dim); }
  .eq-len { width: 84px; height: 36px; font-size: 16px; text-align: center; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 2px; }
  .eq-new-row { display: flex; gap: 8px; margin-top: 8px; }
  .eq-new { flex: 1; min-width: 0; height: 48px; font-size: 16px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
  .eq-new-btn { flex: 0 0 auto; min-width: 72px; height: 48px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); font-size: 15px; }
  .session-log:disabled { opacity: 0.6; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 6px 0 0; font-size: 13px; color: var(--dim); }
  .meta .tempo { border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; }
  .notes { font-size: 13px; color: var(--dim); margin-top: 4px; }
  /* a note the coach added to the exercise: set off so it is read */
  .coach-note { color: var(--text); border-left: 3px solid var(--label, var(--accent)); padding-left: 8px; margin-top: 6px; }
  /* the video thumbnail beside an exercise name */
  .ex-head .thumb { margin-left: auto; flex: 0 0 64px; width: 64px; height: 36px; padding: 0; border-radius: 6px; overflow: hidden; position: relative; border: 1px solid var(--border); background: #000; align-self: center; }
  .ex-head .thumb + .swap, .ex-head .thumb + .film { margin-left: 6px; }
  .thumb img, .thumb video { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .thumb-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.25); }
  .thumb-play::before { content: ""; margin-left: 3px; border-left: 12px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6)); }
  /* a finished block, folded to one line (tap to open it again) */
  .blk-sum { display: none; width: 100%; align-items: center; gap: 10px; padding: 12px; background: none; border: none; text-align: left; font-size: 14px; }
  .group.folded { border-color: rgba(47, 180, 99, 0.5); }
  .group.folded > .blk-sum { display: flex; }
  .group.folded > .ex, .group.folded > .blk-foot { display: none; }
  .blk-check { color: #2fb463; font-weight: 700; }
  .blk-letter { font-weight: 700; color: var(--label, var(--accent)); }
  .blk-names { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; text-transform: uppercase; font-size: 13px; }
  .blk-open { flex: 0 0 auto; font-size: 12px; color: var(--dim); }
  .blk-foot { display: flex; justify-content: flex-end; padding: 0 12px 12px; }
  .blk-done { min-height: 34px; padding: 6px 14px; border-radius: 17px; border: 1px solid var(--border); background: var(--panel-2); font-size: 13px; color: var(--dim); }
  .group.done .blk-done { color: var(--text); }
  .sets { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .set { display: flex; flex-direction: column; text-align: center; flex: 0 0 calc((100% - 30px) / 4); min-width: 68px; }
  .set.fail { flex-basis: calc((100% - 10px) / 2); min-width: 140px; }
  .set .reps { font-weight: 700; font-size: 15px; padding-bottom: 3px; }
  .set .boxes { display: flex; }
  .set input { width: 100%; min-width: 0; height: 44px; font-size: 16px; text-align: center; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 0; padding: 0 4px; -moz-appearance: textfield; appearance: textfield; }
  .set input + input { border-left: none; }
  .set input::placeholder { color: var(--placeholder); }
  .set input.auto { font-style: italic; color: var(--dim); }
  .set input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .set .pct { background: var(--pct); color: #000; font-size: 12px; font-style: italic; padding: 2px 4px; }
  .set .est { font-size: 12px; font-weight: 700; padding-top: 3px; min-height: 0; }
  .set .last { font-size: 11px; color: var(--dim); padding-top: 3px; white-space: nowrap; }
  /* faster logging: -5 / +5 under the weight box, last week's numbers as a tap-to-copy button, no box on unloaded drills */
  .set .steps { display: flex; }
  .set .step { flex: 1; height: 28px; padding: 0; font-size: 12px; font-weight: 700; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-top: none; }
  .set .step + .step { border-left: none; }
  .set .step:active { background: var(--accent); color: #fff; }
  .set button.last { background: none; border: none; font: inherit; font-size: 11px; color: var(--dim); padding: 4px 0 0; cursor: pointer; }
  .set button.last b { color: var(--accent); font-weight: 700; }
  /* timed sets: a timer button under the set, and the countdown sheet */
  .set .timer-btn { margin-top: 4px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--label, var(--accent)); background: transparent; color: var(--text); font: inherit; font-size: 13px; font-weight: 700; }
  .timer-sheet { text-align: center; }
  .timer-round { font-size: 13px; color: var(--dim); min-height: 18px; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
  .timer-face { font-size: 72px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 6px 0 14px; line-height: 1; }
  .timer-face.ending { color: var(--gold); }
  .timer-face.done { color: var(--good); }
  .timer-sheet .swap-actions button { font-size: 17px; min-height: 52px; }
  body.cubs .set button.last b { color: var(--label); }
  .set.noload .reps { padding-bottom: 2px; }
  /* "add to home screen" tip */
  .install-tip { display: flex; align-items: flex-start; gap: 10px; margin: 10px 16px 0; padding: 10px 12px; border: 1px solid var(--accent); border-radius: 10px; background: var(--panel); font-size: 13px; line-height: 1.35; }
  .install-tip strong { display: block; margin-bottom: 2px; }
  .install-tip .install-go { margin-top: 6px; height: 34px; padding: 0 14px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; }
  .install-tip .install-x { flex: 0 0 auto; margin-left: auto; background: none; border: none; color: var(--dim); font-size: 18px; line-height: 1; padding: 0 2px; }
  /* the end of a logged day: the week so far, the streak and anything new */
  .session-summary { display: flex; flex-direction: column; gap: 10px; }
  .sum-stats { display: flex; gap: 10px; margin-top: 8px; }
  .sum-stats > div { flex: 1; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
  .sum-stats b { display: block; font-size: 22px; font-weight: 800; }
  .sum-stats span { font-size: 12px; color: var(--dim); }
  .session-summary .sum-stats { margin-top: 0; }
  .session-summary .sum-stats > div { background: var(--panel); border: 1px solid var(--border); }
  .sum-wins { display: flex; flex-direction: column; gap: 6px; }
  .sum-win { display: flex; flex-direction: column; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid #b8860b; }
  .sum-win span { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); }
  .sum-win b { font-size: 15px; margin-top: 2px; }
  .sum-more { align-self: center; background: none; border: none; color: var(--dim); font-size: 14px; min-height: 40px; }
  /* My Progress */
  .weeks { display: flex; align-items: flex-end; gap: 6px; margin-top: 12px; }
  .wk { flex: 1; max-width: 40px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .wk-bar { width: 100%; height: 56px; border-radius: 6px; background: var(--panel-2); display: flex; align-items: flex-end; overflow: hidden; }
  .wk-bar span { display: block; width: 100%; background: var(--dim); }
  .wk.now .wk-bar span { background: var(--label, var(--accent)); }
  .wk small { font-size: 10px; color: var(--dim); }
  .prog-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
  .prog-row + .prog-row { border-top: 1px solid var(--border); }
  .prog-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
  .spark { flex: 0 0 auto; color: var(--label, var(--accent)); display: flex; }
  .prog-val { flex: 0 0 auto; min-width: 74px; text-align: right; }
  .prog-val b { display: block; font-size: 17px; }
  .prog-val small { display: block; font-size: 11px; color: var(--dim); white-space: nowrap; }
  .empty { text-align: center; color: var(--dim); padding: 48px 16px; font-size: 15px; }
  /* Progress: the body composition graph and its pickers */
  .bc-chips { padding: 0 0 8px; gap: 6px; flex-wrap: wrap; overflow: visible; }
  .bc-chips .chip { min-height: 34px; padding: 6px 12px; font-size: 13px; }
  .bc-graph svg { display: block; width: 100%; height: auto; margin: 4px 0 6px; }
