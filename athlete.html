<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="My Program" />
<title>My Program</title>
<style>
  :root { --bg: #0a0a0a; --panel: #161616; --panel-2: #1f1f1f; --border: #2c2c2c; --text: #f2f2f2; --dim: #9a9a9a; --accent: #c8102e; --pct: #00ffff; }
  /* Cubs players: navy and Cubs blue, with Cubs red for the superset labels */
  body.cubs { --bg: #06122b; --panel: #0c1d42; --panel-2: #12285a; --border: #23407a; --dim: #a9b8d6; --accent: #0e3386; --label: #ff5a59; --pct: #d6e2f7; }
  body.cubs .chip.on { border-color: #4a74d1; }
  body.cubs .set input { border-color: #3a5a9c; }
  body.cubs .set input:focus { outline-color: #cc3433; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  body { padding: 0 0 calc(24px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .brand img { height: 26px; width: auto; max-width: 120px; object-fit: contain; }
  body.cubs .brand img { height: 36px; }
  .who { font-size: 13px; color: var(--dim); text-align: center; }
  .weekbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .weekbar h1 { font-size: 18px; margin: 0; }
  .weekbar h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--dim); }
  .nav { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); font-size: 20px; }
  .nav:disabled { opacity: 0.3; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; min-height: 40px; padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--panel); font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .chips.days .chip { border-radius: 10px; }
  main { padding: 12px 16px 0; }
  .program-name { font-size: 13px; color: var(--dim); margin: 0 0 10px; }
  .warmup { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; white-space: pre-wrap; }
  .group { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .ex { padding: 12px; }
  .ex + .ex { border-top: 1px solid var(--border); }
  .ex-head { display: flex; align-items: baseline; gap: 8px; }
  .label { color: var(--label, var(--accent)); font-weight: 700; flex: 0 0 auto; }
  .name { font-weight: 700; font-size: 16px; text-transform: uppercase; background: none; border: none; padding: 0; text-align: left; }
  button.name { text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 6px 0 0; font-size: 13px; color: var(--dim); }
  .meta .tempo { border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; }
  .notes { font-size: 13px; color: var(--dim); margin-top: 4px; }
  .sets { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .set { display: flex; flex-direction: column; text-align: center; flex: 0 0 calc((100% - 30px) / 4); min-width: 68px; }
  .set.fail { flex-basis: calc((100% - 10px) / 2); min-width: 140px; }
  .set .reps { font-weight: 700; font-size: 15px; padding-bottom: 3px; }
  .set .boxes { display: flex; }
  .set input { width: 100%; min-width: 0; height: 44px; font-size: 16px; text-align: center; color: var(--text); background: var(--panel-2); border: 1px solid #444; border-radius: 0; padding: 0 4px; -moz-appearance: textfield; appearance: textfield; }
  .set input + input { border-left: none; }
  .set input::placeholder { color: #666; }
  .set input.auto { font-style: italic; color: var(--dim); }
  .set input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .set .pct { background: var(--pct); color: #000; font-size: 12px; font-style: italic; padding: 2px 4px; }
  .set .est { font-size: 12px; font-weight: 700; padding-top: 3px; min-height: 0; }
  .set .last { font-size: 11px; color: var(--dim); padding-top: 3px; white-space: nowrap; }
  .empty { text-align: center; color: var(--dim); padding: 48px 16px; font-size: 15px; }
  .status { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); background: #333; color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 20px; display: none; z-index: 20; }
  .status.show { display: block; }
  .status.bad { background: #8a1c1c; }
  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 30; display: none; overflow-y: auto; padding: calc(12px + env(safe-area-inset-top)) 12px 24px; }
  .overlay.show { display: block; }
  .sheet { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; max-width: 560px; margin: 0 auto; }
  .sheet h2 { font-size: 17px; margin: 0 44px 10px 0; text-transform: uppercase; }
  .sheet .close { position: absolute; right: 22px; top: calc(22px + env(safe-area-inset-top)); width: 40px; height: 40px; border-radius: 20px; border: 1px solid var(--border); background: var(--panel-2); font-size: 20px; }
  .video { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 10px; overflow: hidden; }
  .video.vertical { padding-top: 0; height: 70vh; max-width: 40vh; margin: 0 auto; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .cues { font-size: 14px; white-space: pre-wrap; margin-top: 12px; }
  .sheet a { color: var(--text); }
</style>
</head>
<body>
<div id="app"><div class="empty">Loading your program…</div></div>
<div class="status" id="status" role="status"></div>
<div class="overlay" id="overlay"></div>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="program_rx.js"></script>
<script src="athlete.js"></script>
</body>
</html>
