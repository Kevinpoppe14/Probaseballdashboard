// ---- VALD ForceDecks CSV import (Cubs Roster force plate tests) --------------------------
// VALD's export shares no field names or units with Hawkin's, and several values the rest of the
// app expects aren't exported directly - they're derived here from what VALD does give (e.g. jump
// momentum = bodyweight x takeoff velocity). Two things VALD's standard CMJ export has no honest
// equivalent for: a true NET impulse for either phase (only raw per-sub-phase concentric impulse
// is given) - so Propulsive Net Impulse and Braking Net Impulse are left blank for VALD-sourced
// tests rather than filled with a number that isn't really that metric.
const VALD_G = 9.80665;

const VALD_FIELD_DEFS = [
  { key: "athleteName", label: "Athlete Name", required: true, guesses: ["name"], excludes: ["external"] },
  { key: "date", label: "Test Date", required: true, guesses: ["date"] },
  { key: "testType", label: "Test Type", required: false, guesses: ["test type"] },
  { key: "bodyWeightKg", label: "Body Weight (kg)", required: false, guesses: ["bw [kg]", "bodyweight in kilograms", "kilograms"] },
  { key: "jumpHeightCm", label: "Jump Height (cm)", required: false, guesses: ["jump height"] },
  { key: "countermovementDepthCm", label: "Countermovement Depth (cm)", required: false, guesses: ["countermovement depth"] },
  { key: "peakPowerW", label: "Peak Power (W)", required: false, guesses: ["peak power"] },
  { key: "p1ConcentricImpulse", label: "P1 Concentric Impulse (Ns)", required: false, guesses: ["p1 concentric impulse"] },
  { key: "p2ConcentricImpulse", label: "P2 Concentric Impulse (Ns)", required: false, guesses: ["p2 concentric impulse"] },
  { key: "takeoffVelocity", label: "Takeoff Velocity (m/s)", required: false, guesses: ["takeoff"] },
  { key: "rsiModified", label: "RSI-Modified", required: false, guesses: ["rsi-modified", "rsi modified"] },
];
const VALD_NUMERIC_KEYS = [
  "bodyWeightKg", "jumpHeightCm", "countermovementDepthCm", "peakPowerW",
  "p1ConcentricImpulse", "p2ConcentricImpulse", "takeoffVelocity", "rsiModified",
];

// VALD's "CMJ" is the hands-on-hips test the MLB norms apply to; every other CMJ variant (e.g.
// "ABCMJ" = arm-swing) is kept out of the Positional CMJ Profile the same way Hawkin's non-
// "Countermovement Jump" variants are - tagged so it's still visible/countable, just excluded.
function valdTestType(code) {
  return (code || "").trim().toUpperCase() === "CMJ" ? "Countermovement Jump" : "Arm Swing Countermovement Jump";
}

function resolveValdAthlete(rawName) {
  const athlete = window.AthleteStore.findAthleteByName(rawName);
  return athlete ? { status: "matched", athlete } : { status: "no-match" };
}

// Converts one mapped VALD row into the same normalized force-test shape every other source
// produces, plus a synthetic Hawkin-field-named `raw` blob - the Positional CMJ Profile
// (cmj_norms.js) only scores tests that carry a `.raw` object shaped like Hawkin's API response,
// so this is what lets a VALD-sourced test show up there at all.
function valdTransformEntry(entry) {
  const bwKg = typeof entry.bodyWeightKg === "number" ? entry.bodyWeightKg : null;
  const jumpHeightM = typeof entry.jumpHeightCm === "number" ? entry.jumpHeightCm / 100 : null;
  const depthIn = typeof entry.countermovementDepthCm === "number" ? round2(entry.countermovementDepthCm * 0.393701) : null;
  const peakPowerW = typeof entry.peakPowerW === "number" ? entry.peakPowerW : null;
  const p1 = typeof entry.p1ConcentricImpulse === "number" ? entry.p1ConcentricImpulse : null;
  const p2 = typeof entry.p2ConcentricImpulse === "number" ? entry.p2ConcentricImpulse : null;
  const concentricImpulse = p1 !== null && p2 !== null ? round2(p1 + p2) : null;
  const relativePeakPower = bwKg && peakPowerW !== null ? round2(peakPowerW / bwKg) : null;
  const jumpMomentum = bwKg && typeof entry.takeoffVelocity === "number" ? round2(bwKg * entry.takeoffVelocity) : null;
  const systemWeightN = bwKg ? round2(bwKg * VALD_G) : null;
  const rsiModified = typeof entry.rsiModified === "number" ? entry.rsiModified : null;

  return {
    athleteId: entry.athleteId,
    date: entry.date,
    testType: valdTestType(entry.testType),
    source: "vald-import",
    jumpHeight: jumpHeightM !== null ? round2(jumpHeightM * 39.3701) : null,
    countermovementDepth: depthIn,
    peakPower: peakPowerW,
    relativePeakPower,
    takeoffVelocity: typeof entry.takeoffVelocity === "number" ? entry.takeoffVelocity : null,
    rsiModified,
    systemWeight: systemWeightN,
    jumpMomentum,
    concentricImpulse,
    raw: {
      "System Weight(N)": systemWeightN,
      "Jump Height(m)": jumpHeightM,
      "Jump Momentum(kg.m/s)": jumpMomentum,
      "Peak Relative Propulsive Power(W/kg)": relativePeakPower,
      "mRSI": rsiModified,
    },
  };
}

function guessMapping(headers, fieldDefs) {
  const mapping = {};
  fieldDefs.forEach((f) => {
    const found = headers.find((h) => {
      const hl = h.toLowerCase();
      if ((f.excludes || []).some((x) => hl.includes(x))) return false;
      return f.guesses.some((g) => hl.includes(g));
    });
    mapping[f.key] = found || "";
  });
  return mapping;
}

// Evolt360's kiosk export only gives a first name + last initial (e.g. "Shane B"), so rows
// can't be matched by exact name like other imports. Instead, match against the EXISTING
// roster only — first name must match exactly, and the last-initial must match the start of
// the roster athlete's last name. Never creates a new athlete: if nobody on the roster fits,
// or more than one athlete shares that first name + last initial (ambiguous), the row is
// skipped rather than guessed.
function resolveEvoltAthlete(rawName) {
  const parts = (rawName || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length < 2) return { status: "no-match" };
  const firstLower = parts[0].toLowerCase();
  const lastLower = parts[parts.length - 1].replace(/\.$/, "").toLowerCase();
  if (!lastLower) return { status: "no-match" };

  const matches = window.AthleteStore.allAthletes().filter((a) => {
    const nameParts = a.name.trim().split(/\s+/).filter(Boolean);
    if (nameParts.length < 2) return false;
    const rFirst = nameParts[0].toLowerCase();
    const rLast = nameParts[nameParts.length - 1].toLowerCase();
    if (rFirst !== firstLower) return false;
    // Single-letter initial from Evolt -> match by prefix. A fully-spelled last name in the
    // export (some accounts show it) still has to match exactly.
    return lastLower.length <= 1 ? rLast.startsWith(lastLower) : rLast === lastLower;
  });

  if (matches.length === 1) return { status: "matched", athlete: matches[0] };
  if (matches.length > 1) return { status: "ambiguous" };
  return { status: "no-match" };
}

function CsvImporter({ title, description, fieldDefs, numericKeys, saveEntry, onImported, dedupe, resolveAthlete, transformEntry }) {
  const [fileName, setFileName] = useState("");
  const [headers, setHeaders] = useState([]);
  const [rawRows, setRawRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setError("");
    setResult(null);
    setFileName(file.name);
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const fields = results.meta.fields || [];
        if (!fields.length || !results.data.length) {
          setError("Couldn't find any rows/columns in that file. Is it a valid CSV export?");
          setHeaders([]);
          setRawRows([]);
          return;
        }
        setHeaders(fields);
        setRawRows(results.data);
        setMapping(guessMapping(fields, fieldDefs));
      },
      error: (err) => setError(`Failed to parse CSV: ${err.message}`),
    });
  };

  const requiredMissing = fieldDefs.some((f) => f.required && !mapping[f.key]);

  const previewRows = rawRows.slice(0, 5).map((row) => {
    const out = {};
    fieldDefs.forEach((f) => {
      out[f.key] = mapping[f.key] ? row[mapping[f.key]] : "";
    });
    return out;
  });

  const handleImport = () => {
    let skipped = 0;
    let noMatch = 0;
    let ambiguous = 0;
    const athleteNamesUsed = new Set();
    const beforeCount = window.AthleteStore.allAthletes().length;
    let entries = [];

    rawRows.forEach((row) => {
      const rawName = mapping.athleteName ? row[mapping.athleteName] : "";
      const rawDate = mapping.date ? row[mapping.date] : "";
      const dateKey = toDateKey(rawDate);
      if (!rawName || !dateKey) {
        skipped++;
        return;
      }
      let athlete;
      if (resolveAthlete) {
        const resolved = resolveAthlete(rawName);
        if (resolved.status === "no-match") { noMatch++; return; }
        if (resolved.status === "ambiguous") { ambiguous++; return; }
        athlete = resolved.athlete;
      } else {
        athlete = window.AthleteStore.findOrCreateAthlete(rawName);
      }
      athleteNamesUsed.add(athlete.name);
      const entry = { athleteId: athlete.id, date: dateKey };
      fieldDefs.forEach((f) => {
        if (f.key === "athleteName" || f.key === "date") return;
        const col = mapping[f.key];
        if (!col) return;
        const val = row[col];
        if (val === undefined || val === null || val === "") return;
        entry[f.key] = numericKeys.includes(f.key) ? round2(Number(val)) : val;
      });
      entries.push(transformEntry ? transformEntry(entry) : entry);
    });

    const beforeDedupe = entries.length;
    if (dedupe) entries = dedupe(entries);
    const dedupedCount = beforeDedupe - entries.length;

    entries.forEach((entry) => saveEntry(entry));

    const afterCount = window.AthleteStore.allAthletes().length;
    setResult({
      imported: entries.length,
      skipped,
      noMatch,
      ambiguous,
      dedupedCount,
      athleteCount: athleteNamesUsed.size,
      newAthletes: afterCount - beforeCount,
    });
    onImported();
  };

  const reset = () => {
    setFileName("");
    setHeaders([]);
    setRawRows([]);
    setMapping({});
    setResult(null);
    setError("");
  };

  return (
    <div className="panel">
      <h2>{title}</h2>
      <p style={{ color: "var(--text-dim)", fontSize: 13, marginTop: -6 }}>{description}</p>

      {error && <div className="success-banner" style={{ background: "#3a1414", color: "var(--danger)", borderColor: "#5a1f1f" }}>{error}</div>}

      {result && (
        <div className="success-banner">
          Imported {result.imported} row{result.imported === 1 ? "" : "s"} across {result.athleteCount} athlete
          {result.athleteCount === 1 ? "" : "s"}
          {result.newAthletes > 0 ? ` (${result.newAthletes} new athlete profile${result.newAthletes === 1 ? "" : "s"} created)` : ""}.
          {result.dedupedCount > 0 ? ` Kept only the best test per athlete/date — ${result.dedupedCount} duplicate or already-imported row${result.dedupedCount === 1 ? "" : "s"} skipped.` : ""}
          {result.skipped > 0 ? ` Skipped ${result.skipped} row(s) missing an athlete name or a parseable date.` : ""}
          {result.noMatch > 0 ? ` Skipped ${result.noMatch} row(s) that didn't match anyone currently on the roster.` : ""}
          {result.ambiguous > 0 ? ` Skipped ${result.ambiguous} row(s) where more than one roster athlete shares that first name + last initial — add those manually instead.` : ""}
          {" "}
          <button className="btn-link" onClick={reset}>Import another file</button>
        </div>
      )}

      {!rawRows.length && !result && (
        <div className="file-drop">
          <input type="file" accept=".csv" onChange={handleFile} />
          <span style={{ color: "var(--text-dim)", fontSize: 12 }}>Accepts a .csv export.</span>
        </div>
      )}

      {rawRows.length > 0 && !result && (
        <div>
          <p style={{ fontSize: 12, color: "var(--text-dim)" }}>
            Loaded <strong style={{ color: "var(--text)" }}>{fileName}</strong> &middot; {rawRows.length} rows detected.
            Confirm which column maps to each field below (auto-guessed where possible).
          </p>
          <table className="mapping-table">
            <tbody>
              {fieldDefs.map((f) => (
                <tr key={f.key}>
                  <td style={{ width: 220 }}>
                    {f.label}
                    {f.required && <span className="required-mark">*</span>}
                  </td>
                  <td>
                    <select
                      value={mapping[f.key] || ""}
                      onChange={(e) => setMapping({ ...mapping, [f.key]: e.target.value })}
                    >
                      <option value="">— none —</option>
                      {headers.map((h) => (
                        <option key={h} value={h}>{h}</option>
                      ))}
                    </select>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          <h2 style={{ fontSize: 13 }}>Preview (first 5 rows)</h2>
          <table>
            <thead>
              <tr>
                {fieldDefs.map((f) => <th key={f.key}>{f.label}</th>)}
              </tr>
            </thead>
            <tbody>
              {previewRows.map((row, i) => (
                <tr key={i} style={{ cursor: "default" }}>
                  {fieldDefs.map((f) => <td key={f.key}>{row[f.key] || "—"}</td>)}
                </tr>
              ))}
            </tbody>
          </table>

          <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
            <button className="btn btn-primary" disabled={requiredMissing} onClick={handleImport}>
              Import {rawRows.length} rows
            </button>
            <button className="btn btn-secondary" onClick={reset}>Cancel</button>
          </div>
          {requiredMissing && (
            <p style={{ fontSize: 12, color: "var(--warn)", marginTop: 8 }}>
              Map all required (*) fields before importing.
            </p>
          )}
        </div>
      )}
    </div>
  );
}

// ---- MLB / MiLB profile + photo linker -------------------------------------------------
// Looks each roster athlete up in MLB's official player database (MLB + MiLB), links their
// MLBAM ID (which is also their Baseball Savant ID — it powers the Statcast tab), and sets
// their headshot. Birth date is used to confirm matches when we have it on file.

const MLB_HEADSHOT = (id) =>
  `https://img.mlbstatic.com/mlb-photos/image/upload/w_213,d_people:generic:headshot:67:current.png,q_auto:best,f_auto/v1/people/${id}/headshot/67/current`;

const NAME_ALIAS_MAP = (() => {
  const groups = [
    ["gabriel", "gabe"], ["cameron", "cam"], ["alexander", "alex", "lex"], ["nicholas", "nick", "nico", "nicolas"],
    ["joshua", "josh"], ["zachary", "zach", "zac"], ["matthew", "matt"], ["michael", "mike", "mikey"],
    ["robert", "rob", "robby", "bobby", "bob"], ["daniel", "dan", "danny"], ["jonathan", "jon", "jonny"],
    ["thomas", "tom", "tommy"], ["patrick", "pat"], ["joseph", "joe"], ["christopher", "chris"],
    ["anthony", "tony"], ["benjamin", "ben"], ["nathan", "nate"], ["charles", "chuck", "chuckie", "charlie"],
    ["william", "will", "bill", "billy"], ["samuel", "sam"], ["timothy", "tim"], ["andrew", "andy", "drew"],
    ["jacob", "jake", "jakob"], ["lucas", "luke"], ["calvin", "cal"], ["connor", "conor"],
    ["james", "jim", "jimmy"], ["jeffrey", "jeff"], ["kenneth", "kenny", "ken"], ["steven", "steve"],
    ["edward", "ed", "eddie"], ["richard", "rick", "rich", "ricky"], ["david", "dave"], ["stanley", "stan"],
  ];
  const map = {};
  groups.forEach((g) => g.forEach((n) => { map[n] = g.filter((x) => x !== n); }));
  return map;
})();

const mlbSearchCache = new Map();

function stripAccents(s) {
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
}

async function mlbSearchPlayers(name) {
  if (mlbSearchCache.has(name)) return mlbSearchCache.get(name);
  const res = await fetch(`https://statsapi.mlb.com/api/v1/people/search?names=${encodeURIComponent(name)}&hydrate=currentTeam`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  // Drop historical players (the database includes everyone back to the 1800s).
  const people = (json.people || []).filter(
    (p) => p.isPlayer !== false && (p.active || (p.birthDate && Number(p.birthDate.slice(0, 4)) >= 1975))
  );
  mlbSearchCache.set(name, people);
  return people;
}

// Tries the roster name as-is, then common nickname/formal-name swaps (Gabriel <-> Gabe,
// Cam <-> Cameron, ...), stopping at the first spelling that finds anyone.
async function findMlbCandidates(fullName) {
  const clean = stripAccents(fullName).trim().replace(/\s+/g, " ");
  const parts = clean.split(" ");
  const first = (parts[0] || "").toLowerCase();
  const rest = parts.slice(1).join(" ");
  const variants = [clean, ...(NAME_ALIAS_MAP[first] || []).map((alt) => `${alt} ${rest}`)];
  for (const v of variants) {
    const found = await mlbSearchPlayers(v);
    if (found.length) return found;
  }
  return [];
}

function mapMlbPosition(abbr) {
  const a = (abbr || "").toUpperCase();
  if (a === "P") return "Pitcher";
  if (a === "C") return "Catcher";
  if (["1B", "2B", "3B", "SS", "IF"].includes(a)) return "Infield";
  if (["LF", "CF", "RF", "OF"].includes(a)) return "Outfield";
  return null;
}

function describeMlbCandidate(c) {
  const pos = c.primaryPosition ? c.primaryPosition.abbreviation : "?";
  const team = c.currentTeam ? c.currentTeam.name : "no current team";
  return `${c.fullName} · b. ${c.birthDate || "?"} · ${pos} · ${team} · #${c.id}`;
}

function classifyMlbMatch(athlete, candidates) {
  if (!candidates.length) return { status: "not-found", candidates };
  const dobHits = athlete.dob ? candidates.filter((c) => c.birthDate === athlete.dob) : [];
  if (dobHits.length === 1) return { status: "auto", pick: dobHits[0], reason: "name + birth date match", candidates };
  if (athlete.dob && !dobHits.length) {
    return { status: "review", candidates, reason: "the birth date on file doesn't match any player with this name" };
  }
  if (!athlete.dob && candidates.length === 1) {
    const c = candidates[0];
    if (c.active && c.currentTeam) {
      return { status: "auto", pick: c, reason: "only active player with this name (no birth date on file to confirm)", candidates };
    }
    return { status: "review", candidates, reason: "only match isn't currently active with a team" };
  }
  return { status: "review", candidates, reason: "more than one player has this name" };
}

function applyMlbMatch(athlete, cand) {
  const patch = { mlbamId: String(cand.id) };
  const hasManualPhoto = athlete.photoUrl && !/img\.mlbstatic\.com/.test(athlete.photoUrl);
  if (!hasManualPhoto) patch.photoUrl = MLB_HEADSHOT(cand.id);
  if (!athlete.position || athlete.position === "Unassigned") {
    const pos = mapMlbPosition(cand.primaryPosition && cand.primaryPosition.abbreviation);
    if (pos) patch.position = pos;
  }
  window.AthleteStore.updateAthlete(athlete.id, patch);
}

function MlbLinkRow({ row, onUpdate, onChanged }) {
  const [choice, setChoice] = useState(row.candidates && row.candidates[0] ? String(row.candidates[0].id) : "");
  const [manualId, setManualId] = useState("");
  const athlete = window.AthleteStore.allAthletes().find((a) => a.id === row.athleteId);
  if (!athlete) return null;

  const links = (id) => (
    <span style={{ marginLeft: 8, fontSize: 12 }}>
      <a href={`https://www.mlb.com/player/${id}`} target="_blank" rel="noopener noreferrer">MLB.com</a>
      {" · "}
      <a href={`https://baseballsavant.mlb.com/savant-player/${id}`} target="_blank" rel="noopener noreferrer">Savant</a>
    </span>
  );

  const applyPick = (cand) => {
    applyMlbMatch(athlete, cand);
    onUpdate(row.athleteId, { status: "applied", pick: cand, reason: "confirmed manually" });
    onChanged();
  };

  const unlink = () => {
    const isMlbPhoto = /img\.mlbstatic\.com/.test(athlete.photoUrl || "");
    window.AthleteStore.updateAthlete(athlete.id, {
      mlbamId: "",
      photoUrl: isMlbPhoto ? "" : athlete.photoUrl,
      mlbStats: null,
    });
    onUpdate(row.athleteId, { status: "not-found", pick: null, reason: "unlinked", candidates: row.candidates || [] });
    onChanged();
  };

  let tone = "neutral";
  let label = "Not found";
  let body = null;

  if (row.status === "applied") {
    tone = "good";
    label = "Linked";
    body = (
      <span>
        {describeMlbCandidate(row.pick)}
        {links(row.pick.id)}
        <div style={{ fontSize: 11, color: "var(--text-dim)" }}>{row.reason}</div>
        <button className="btn-link" onClick={unlink}>Unlink</button>
      </span>
    );
  } else if (row.status === "linked") {
    label = "Already linked";
    body = <span>MLBAM #{row.mlbamId}{links(row.mlbamId)}</span>;
  } else if (row.status === "review") {
    tone = "warn";
    label = "Needs review";
    body = (
      <span>
        <div style={{ fontSize: 11, color: "var(--text-dim)", marginBottom: 4 }}>{row.reason}</div>
        <select value={choice} onChange={(e) => setChoice(e.target.value)} style={{ maxWidth: 420 }}>
          {row.candidates.map((c) => (
            <option key={c.id} value={String(c.id)}>{describeMlbCandidate(c)}</option>
          ))}
        </select>{" "}
        <button
          className="btn-link"
          onClick={() => applyPick(row.candidates.find((c) => String(c.id) === choice) || row.candidates[0])}
        >
          Use this one
        </button>
        {choice && links(choice)}
      </span>
    );
  } else if (row.status === "error") {
    tone = "danger";
    label = "Error";
    body = <span>{row.reason}</span>;
  } else {
    body = (
      <span>
        <span style={{ fontSize: 11, color: "var(--text-dim)" }}>
          No MLB/MiLB profile found by name — paste their MLBAM ID if you know it:
        </span>{" "}
        <input
          className="inline-select"
          style={{ width: 110 }}
          placeholder="e.g. 680755"
          value={manualId}
          onChange={(e) => setManualId(e.target.value)}
        />{" "}
        <button
          className="btn-link"
          disabled={!/^\d+$/.test(manualId.trim())}
          onClick={() => applyPick({ id: manualId.trim(), fullName: athlete.name })}
        >
          Link
        </button>
      </span>
    );
  }

  return (
    <tr style={{ cursor: "default" }}>
      <td>{lastFirstName(athlete.name)}</td>
      <td><Badge tone={tone}>{label}</Badge></td>
      <td>{body}</td>
    </tr>
  );
}

function MlbLinkerPanel({ onImported }) {
  const [recheck, setRecheck] = useState(false);
  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState({ done: 0, total: 0 });
  const [rows, setRows] = useState(null);
  const [listText, setListText] = useState("");

  // Plain-text export of the active roster (name, position, MLBAM ID, team, birth date) so it
  // can be pasted somewhere else — e.g. to line athletes up with the research tool.
  const showRosterList = () => {
    const active = window.AthleteStore.allAthletes()
      .filter((a) => (a.status || "active").toLowerCase() === "active")
      .sort((a, b) => lastNameOnly(a.name).localeCompare(lastNameOnly(b.name)));
    const text = ["Name\tPosition\tMLBAM ID\tLeague\tTeam\tBirth date"]
      .concat(active.map((a) => [a.name, a.position || "", extractMlbamId(a) || "", a.league || "", a.team || "", a.dob || ""].join("\t")))
      .join("\n");
    setListText(text);
    try { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {}); } catch (e) { /* the box below still works */ }
  };

  const run = async () => {
    setRunning(true);
    setRows(null);
    const roster = window.AthleteStore.allAthletes();
    const out = [];
    const todo = [];
    roster.forEach((a) => {
      const existing = extractMlbamId(a);
      if (existing && !recheck) {
        if (!a.photoUrl) window.AthleteStore.updateAthlete(a.id, { photoUrl: MLB_HEADSHOT(existing) });
        out.push({ athleteId: a.id, status: "linked", mlbamId: existing });
      } else {
        todo.push(a);
      }
    });

    setProgress({ done: 0, total: todo.length });
    let done = 0;
    const queue = [...todo];
    const worker = async () => {
      while (queue.length) {
        const a = queue.shift();
        try {
          const candidates = await findMlbCandidates(a.name);
          const cls = classifyMlbMatch(a, candidates);
          const existing = extractMlbamId(a);
          if (cls.status === "auto" && existing && String(cls.pick.id) === existing) {
            out.push({ athleteId: a.id, status: "linked", mlbamId: existing });
          } else if (cls.status === "auto" && existing) {
            out.push({
              athleteId: a.id,
              status: "review",
              candidates: candidates,
              reason: `differs from the currently linked ID (#${existing})`,
            });
          } else if (cls.status === "auto") {
            applyMlbMatch(a, cls.pick);
            out.push({ athleteId: a.id, status: "applied", pick: cls.pick, reason: cls.reason });
          } else {
            out.push({ athleteId: a.id, ...cls });
          }
        } catch (e) {
          out.push({ athleteId: a.id, status: "error", reason: `Lookup failed (${e.message})` });
        }
        done++;
        setProgress({ done, total: todo.length });
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);

    const order = { review: 0, "not-found": 1, error: 2, applied: 3, linked: 4 };
    const nameOf = (r) => {
      const a = window.AthleteStore.allAthletes().find((x) => x.id === r.athleteId);
      return a ? lastNameOnly(a.name) : "";
    };
    out.sort((x, y) => order[x.status] - order[y.status] || nameOf(x).localeCompare(nameOf(y)));
    setRows(out);
    setRunning(false);
    onImported();
  };

  const updateRow = (athleteId, patch) => {
    setRows((prev) => prev.map((r) => (r.athleteId === athleteId ? { ...r, ...patch } : r)));
  };

  const count = (s) => (rows ? rows.filter((r) => r.status === s).length : 0);

  return (
    <div className="panel">
      <h2>MLB / MiLB Profiles &amp; Photos</h2>
      <p style={{ color: "var(--text-dim)", fontSize: 13, marginTop: -6 }}>
        Looks up every athlete on the roster in MLB's official player database (MLB and MiLB), links their MLBAM ID —
        the same ID Baseball Savant uses, so their Statcast tab works — and sets their headshot. Birth date is used to
        confirm a match when it's on file. Athletes that can't be matched with confidence are listed for you to check
        rather than guessed. Existing manual photos are never overwritten, and a blank Position is filled in from
        their MLB position.
      </p>

      <label style={{ fontSize: 13, display: "block", marginBottom: 10 }}>
        <input type="checkbox" checked={recheck} onChange={(e) => setRecheck(e.target.checked)} disabled={running} />{" "}
        Also re-check athletes who are already linked (flags any whose ID looks different)
      </label>

      <button className="btn btn-primary" disabled={running} onClick={run}>
        {running ? `Looking up… ${progress.done} / ${progress.total}` : "Find MLB profiles & photos for the roster"}
      </button>{" "}
      <button className="btn btn-secondary" disabled={running} onClick={showRosterList}>
        Copy active roster list
      </button>
      {listText && (
        <div style={{ marginTop: 10 }}>
          <p className="timestamp-note" style={{ marginTop: 0 }}>
            Copied to your clipboard (also in the box below in case that didn't work) — {listText.split("\n").length - 1} active athletes.
          </p>
          <textarea readOnly value={listText} rows={8} style={{ width: "100%", fontFamily: "monospace", fontSize: 12 }} onFocus={(e) => e.target.select()} />
        </div>
      )}

      {rows && (
        <div style={{ marginTop: 16 }}>
          <div className="store-stats">
            <span><strong>{count("applied")}</strong> newly linked</span>
            <span><strong>{count("linked")}</strong> already linked</span>
            <span><strong>{count("review")}</strong> need review</span>
            <span><strong>{count("not-found")}</strong> not found</span>
            {count("error") > 0 && <span><strong>{count("error")}</strong> errors</span>}
          </div>
          <table style={{ marginTop: 10 }}>
            <thead>
              <tr>
                <th>Athlete</th>
                <th>Result</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <MlbLinkRow key={r.athleteId} row={r} onUpdate={updateRow} onChanged={onImported} />
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// Status + manual trigger for the daily Hawkin Dynamics sync (api/sync-hawkin.js, runs on its own
// once a day via Vercel Cron). "Sync Now" calls the same function on demand, authenticated with
// the coach's own logged-in session instead of the cron secret (which never reaches the browser).
function HawkinSyncPanel({ onImported }) {
  const [lastSynced, setLastSynced] = useState(undefined); // undefined = loading, null = never run yet
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);

  const loadLastSynced = async () => {
    const { data, error } = await window.supabaseClient.from("app_meta").select("value").eq("key", "hawkinLastRunAt").maybeSingle();
    setLastSynced(!error && data ? data.value : null);
  };
  React.useEffect(() => { loadLastSynced(); }, []);

  const syncNow = async () => {
    setBusy(true);
    setResult(null);
    try {
      const { data: sessionData } = await window.supabaseClient.auth.getSession();
      const token = sessionData.session && sessionData.session.access_token;
      const res = await fetch("/api/sync-hawkin", { headers: { Authorization: `Bearer ${token}` } });
      const json = await res.json();
      setResult(json);
      await loadLastSynced();
      if (json.ok && json.inserted) onImported();
    } catch (e) {
      setResult({ ok: false, errors: [String((e && e.message) || e)] });
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="panel">
      <h2 style={{ fontSize: 13 }}>Hawkin Dynamics Sync</h2>
      <p className="timestamp-note">
        Runs automatically once a day &middot; Last synced: {lastSynced === undefined ? "checking…" : lastSynced == null ? "never" : new Date(lastSynced * 1000).toLocaleString()}
      </p>

function resolveRowName(row, mapping) {
  if (mapping.athleteName && row[mapping.athleteName]) return row[mapping.athleteName].trim();
  const first = mapping.firstName ? (row[mapping.firstName] || "").trim() : "";
  const last = mapping.lastName ? (row[mapping.lastName] || "").trim() : "";
  return `${first} ${last}`.trim();
}

function planStatusTone(status) {
  const s = (status || "").toLowerCase();
  if (!s) return "neutral";
  if (s.includes("risk") || s.includes("behind") || s.includes("off track") || s.includes("stalled")) return "danger";
  if (s.includes("complete") || s.includes("done") || s.includes("achieved")) return "info";
  if (s.includes("track") || s.includes("progress") || s.includes("active")) return "good";
  return "neutral";
}

function letterToIndex(letters) {
  let n = 0;
  for (let i = 0; i < letters.length; i++) {
    n = n * 26 + (letters.charCodeAt(i) - 64);
  }
  return n - 1;
}

function parseColumnSpec(spec) {
  const clean = (spec || "").toUpperCase().replace(/\s+/g, "");
  if (!clean) return null;
  const indices = new Set();
  clean.split(",").filter(Boolean).forEach((token) => {
    const rangeMatch = token.match(/^([A-Z]+)-([A-Z]+)$/);
    if (rangeMatch) {
      const start = letterToIndex(rangeMatch[1]);
      const end = letterToIndex(rangeMatch[2]);
      for (let i = Math.min(start, end); i <= Math.max(start, end); i++) indices.add(i);
    } else if (/^[A-Z]+$/.test(token)) {
      indices.add(letterToIndex(token));
    }
  });
  return indices;
}

function applyColumnFilter(allHeaders, spec) {
  const indices = parseColumnSpec(spec);
  if (!indices) return allHeaders;
  return allHeaders.filter((_, i) => indices.has(i));
}

function toGvizCsvUrl(input) {
  const trimmed = (input || "").trim();
  const match = trimmed.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if (!match) return trimmed;
  const id = match[1];
  const gidMatch = trimmed.match(/[?#&]gid=([0-9]+)/);
  const gid = gidMatch ? gidMatch[1] : null;
  let url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`;
  if (gid) url += `&gid=${gid}`;
  return url;
}

function MappingPreviewImport({ headers, rawRows, fieldDefs, mapping, setMapping, onCommit, commitLabel, disabled, disabledHint }) {
  const requiredMissing = fieldDefs.some((f) => f.required && !mapping[f.key]);
  const isDisabled = requiredMissing || !!disabled;
  const previewRows = rawRows.slice(0, 5).map((row) => {
    const out = {};
    fieldDefs.forEach((f) => {
      out[f.key] = mapping[f.key] ? row[mapping[f.key]] : "";
    });
    return out;
  });

  return (
    <div>
      <table className="mapping-table">
        <tbody>
          {fieldDefs.map((f) => (
            <tr key={f.key}>
              <td style={{ width: 220 }}>
                {f.label}
                {f.required && <span className="required-mark">*</span>}
              </td>
              <td>
                <select value={mapping[f.key] || ""} onChange={(e) => setMapping({ ...mapping, [f.key]: e.target.value })}>
                  <option value="">— none —</option>
                  {headers.map((h) => <option key={h} value={h}>{h}</option>)}
                </select>
              </td>
            </tr>
          ))}
        </tbody>
      </table>

      <h2 style={{ fontSize: 13 }}>Preview (first 5 rows)</h2>
      <table>
        <thead>
          <tr>{fieldDefs.map((f) => <th key={f.key}>{f.label}</th>)}</tr>
        </thead>
        <tbody>
          {previewRows.map((row, i) => (
            <tr key={i} style={{ cursor: "default" }}>
              {fieldDefs.map((f) => <td key={f.key}>{row[f.key] || "—"}</td>)}
            </tr>
          ))}
        </tbody>
      </table>

      <button className="btn btn-primary" disabled={isDisabled} style={{ marginTop: 14 }} onClick={onCommit}>
        {commitLabel}
      </button>
      {requiredMissing && (
        <p style={{ fontSize: 12, color: "var(--warn)", marginTop: 8 }}>Map all required (*) fields before importing.</p>
      )}
      {!requiredMissing && disabled && disabledHint && (
        <p style={{ fontSize: 12, color: "var(--warn)", marginTop: 8 }}>{disabledHint}</p>
      )}
    </div>
  );
}

function TeamReportPage({ onSelect, dataVersion, onEditPeriodization }) {
  const roster = getRoster().filter((a) => (a.status || "active").toLowerCase() === "active");
  // Every known league is always selectable; any custom league already on the roster is added after them.
  const leagues = useMemo(() => {
    const extra = [...new Set(roster.map((a) => a.league).filter(Boolean))].filter((l) => !LEAGUES.includes(l)).sort();
    return [...LEAGUES, ...extra];
    // eslint-disable-next-line
  }, [dataVersion]);

  const [selectedLeague, setSelectedLeague] = useState("");
  const [selectedTeam, setSelectedTeam] = useState("");
  React.useEffect(() => { window.scrollTo(0, 0); }, [selectedTeam]);
  const [perfRange, setPerfRange] = useState("all"); // date range for each athlete's performance graphs

  const teamsInLeague = useMemo(() => {
    if (!selectedLeague) return [];
    // Start with every team in the league (so teams with nobody rostered still get a tile),
    // then add rostered athletes — including teams typed in by hand that aren't in the list.
    const byTeam = new Map();
    (LEAGUE_TEAMS[selectedLeague] || []).forEach((team) => byTeam.set(team, []));
    roster.forEach((a) => {
      if (a.league !== selectedLeague || !a.team) return;
      if (!byTeam.has(a.team)) byTeam.set(a.team, []);
      byTeam.get(a.team).push(a);
    });
    return Array.from(byTeam.entries())
      .map(([team, athletes]) => ({ team, athletes }))
      .sort((a, b) => a.team.localeCompare(b.team));
    // eslint-disable-next-line
  }, [selectedLeague, dataVersion]);

  const teamAthletes = selectedTeam ? roster.filter((a) => a.team === selectedTeam) : [];

  const rows = useMemo(() => {
    return teamAthletes.map((a) => ({ athlete: a }));
    // eslint-disable-next-line
  }, [selectedTeam, dataVersion]);

  const activeCount = rows.filter((r) => (r.athlete.status || "active").toLowerCase() === "active").length;

  // ---- printing: one athlete sheet per portrait Letter page ----
  // Each sheet keeps its on-screen width, is measured, and is scaled down (never up) so the whole
  // sheet fits one page; a page break follows every sheet. Cleaned up again after printing.
  const sheetPrint = React.useRef(null);
  const prepareSheets = () => {
    if (sheetPrint.current) return;
    const sheets = [...document.querySelectorAll(".report-sheet")].filter((s) => s.offsetParent !== null);
    if (!sheets.length) return;
    const PAGE_W = 725; // printable area of a Letter portrait page (0.35in margins), in CSS px, with headroom
    const PAGE_H = 925;
    sheets.forEach((s) => {
      const w = s.offsetWidth;
      s.style.zoom = "";
      s.style.width = `${w}px`;
      s.classList.add("measuring"); // hides screen-only controls so we measure what will print
      const h = s.scrollHeight;
      s.classList.remove("measuring");
      s.style.zoom = String(Math.min(1, PAGE_W / w, PAGE_H / h));
    });
    const pageStyle = document.createElement("style");
    pageStyle.textContent = "@page { size: letter portrait; margin: 0.35in; }";
    document.head.appendChild(pageStyle);
    document.body.classList.add("print-team-sheets");
    sheetPrint.current = { sheets, pageStyle };
  };
  const cleanupSheets = () => {
    const s = sheetPrint.current;
    if (!s) return;
    sheetPrint.current = null;
    document.body.classList.remove("print-team-sheets");
    if (s.pageStyle.parentNode) s.pageStyle.parentNode.removeChild(s.pageStyle);
    s.sheets.forEach((el) => { el.style.zoom = ""; el.style.width = ""; });
  };
  const printTeamReport = () => { prepareSheets(); window.print(); };

  React.useEffect(() => {
    if (!selectedTeam) return undefined;
    window.addEventListener("beforeprint", prepareSheets); // also covers Ctrl+P

// The old Player Plans page (Google Sheet sync + summary table). It now lives under Import & Manual Entry.
function PlayerPlansSyncPage({ onSelect, onImported }) {
  const [method, setMethod] = useState("url");
  const [sheetUrl, setSheetUrl] = useState("");
  const [pasteText, setPasteText] = useState("");
  const [columnSpec, setColumnSpec] = useState("");
  const [allHeaders, setAllHeaders] = useState([]);
  const [headers, setHeaders] = useState([]);
  const [rawRows, setRawRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [result, setResult] = useState(null);
  const [search, setSearch] = useState("");

  const parseCsvText = (text) => {
    const results = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
    const fields = results.meta.fields || [];
    if (!fields.length || !results.data.length) {
      setError("Couldn't find any rows/columns in that data. Check the sheet has a header row and at least one data row.");
      return;
    }
    setAllHeaders(fields);
    setRawRows(results.data);
    const filtered = applyColumnFilter(fields, columnSpec);
    setHeaders(filtered);
    setMapping(guessMapping(filtered, PLAYER_PLAN_FIELD_DEFS));
    setError("");
    setResult(null);
  };

  const applyFilter = () => {
    const filtered = applyColumnFilter(allHeaders, columnSpec);
    setHeaders(filtered);
    setMapping(guessMapping(filtered, PLAYER_PLAN_FIELD_DEFS));
  };

  const handleFetchUrl = async () => {
    if (!sheetUrl.trim()) {
      setError("Paste a Google Sheet link first.");
      return;
    }
    setLoading(true);
    setError("");
    try {
      const url = toGvizCsvUrl(sheetUrl);
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`Request failed (HTTP ${res.status}).`);
      }
      const text = await res.text();
      parseCsvText(text);
    } catch (e) {
      setError(
        `Couldn't fetch that sheet (${e.message}). This is usually because the sheet isn't shared as "Anyone with the link can view" / published to the web, or the browser blocked the cross-origin request. Try "Paste CSV/Text" below instead — open the sheet, select the range (including headers), copy, and paste it in.`
      );
    } finally {
      setLoading(false);
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setError("");
    const reader = new FileReader();
    reader.onload = (ev) => parseCsvText(ev.target.result);
    reader.readAsText(file);
  };

  const handleImport = () => {
    let skipped = 0;
    let duplicatesCollapsed = 0;
    const beforeCount = window.AthleteStore.allAthletes().length;
    const mappedCols = new Set(Object.values(mapping).filter(Boolean));
    const extraHeaders = headers.filter((h) => !mappedCols.has(h));
    const entryByAthleteId = new Map();

    rawRows.forEach((row) => {
      const rawName = resolveRowName(row, mapping);
      if (!rawName) {
        skipped++;
        return;
      }
      // Every name becomes (or matches) a roster entry, so the sheet's athlete
      // list drives who shows up across the dashboard, not just the mock roster.
      const athlete = window.AthleteStore.findOrCreateAthlete(rawName);
      const entry = { athleteId: athlete.id };
      PLAYER_PLAN_FIELD_DEFS.forEach((f) => {
        if (f.key === "athleteName" || f.key === "firstName" || f.key === "lastName") return;
        const col = mapping[f.key];
        if (!col) return;
        const val = row[col];
        if (val === undefined || val === null || val === "") return;
        entry[f.key] = val;
      });
      const extra = {};
      extraHeaders.forEach((h) => {
        const val = row[h];
        if (val !== undefined && val !== null && val !== "") extra[h] = val;
      });
      if (Object.keys(extra).length) entry.extra = extra;

      if (entryByAthleteId.has(athlete.id)) duplicatesCollapsed++;
      // Sheet rows are in submission order, so the last row for a given
      // athlete is the most recent one — overwrite rather than keep both.
      entryByAthleteId.set(athlete.id, entry);
    });

    const entries = Array.from(entryByAthleteId.values());
    window.AthleteStore.setPlayerPlans(entries);
    const afterCount = window.AthleteStore.allAthletes().length;
    setResult({
      imported: entries.length,
      skipped,
      duplicatesCollapsed,
      newAthletes: afterCount - beforeCount,
    });
    setAllHeaders([]);
    setHeaders([]);
    setRawRows([]);
    onImported();
  };

  const syncedAt = window.AthleteStore.getPlayerPlansSyncedAt();
  const allPlans = window.AthleteStore
    .getAllPlayerPlans()
    .map((p) => ({ plan: p, athlete: getRoster().find((a) => a.id === p.athleteId) }))
    .filter((row) => row.athlete && row.athlete.name.toLowerCase().includes(search.toLowerCase()));

  return (
    <div>
      <div className="panel">
        <h2>Sync Player Plans from Google Sheets</h2>
        <p style={{ color: "var(--text-dim)", fontSize: 13, marginTop: -6 }}>
          Each sync replaces the current plan list with what's in the sheet — this is meant to mirror the sheet's
          current state, not build up history. You need either a single Full Name column mapped, or both First Name
          and Last Name columns — plus whichever of Focus Area, Goal, Target Date, Status, Coach, and Notes your
          sheet has. Any column naming works, you'll confirm the mapping below.
        </p>

        <div className="sync-row" style={{ marginBottom: 4 }}>
          <div className="field">
            <label>Columns to include (optional)</label>
            <input
              placeholder="e.g. I,J,K,N,O,P,AC-AX — leave blank to include every column"
              value={columnSpec}
              onChange={(e) => setColumnSpec(e.target.value)}
            />
          </div>
          <button className="btn btn-secondary" onClick={applyFilter} disabled={!allHeaders.length}>
            Apply Filter
          </button>
        </div>
        <p style={{ fontSize: 11, color: "var(--text-dim)", marginTop: 0, marginBottom: 14 }}>
          Use spreadsheet column letters, comma-separated, with ranges like <code>AC-AX</code>. Columns you don't map
          to a field below are still imported and shown as additional data on each athlete's Player Plan panel — they
          just won't clutter the mapping list or the summary table here.
        </p>

        <div className="method-switch">
          <button className={method === "url" ? "active" : ""} onClick={() => setMethod("url")}>Google Sheet link</button>
          <button className={method === "paste" ? "active" : ""} onClick={() => setMethod("paste")}>Paste CSV / Text</button>
          <button className={method === "file" ? "active" : ""} onClick={() => setMethod("file")}>Upload File</button>
        </div>

        {error && (
          <div className="success-banner" style={{ background: "#3a1414", color: "var(--danger)", borderColor: "#5a1f1f" }}>
            {error}
          </div>
        )}
        {result && (
          <div className="success-banner">
            Synced plans for {result.imported} athlete{result.imported === 1 ? "" : "s"}
            {result.newAthletes > 0 ? ` — ${result.newAthletes} new athlete profile${result.newAthletes === 1 ? "" : "s"} added to the roster` : ""}.
            {result.duplicatesCollapsed > 0
              ? ` ${result.duplicatesCollapsed} repeat submission${result.duplicatesCollapsed === 1 ? "" : "s"} from the same athlete collapsed to their most recent entry.`
              : ""}
            {result.skipped > 0 ? ` Skipped ${result.skipped} row(s) missing an athlete name.` : ""}
          </div>
        )}

        {method === "url" && (
          <div className="sync-row">
            <div className="field">
              <label>Published Google Sheet link</label>
              <input
                placeholder="https://docs.google.com/spreadsheets/d/.../edit#gid=0"
                value={sheetUrl}
                onChange={(e) => setSheetUrl(e.target.value)}
              />
            </div>
            <button className="btn btn-primary" onClick={handleFetchUrl} disabled={loading}>
              {loading ? "Fetching..." : "Fetch"}
            </button>
          </div>
        )}

        {method === "paste" && (
          <div>
            <div className="field">
              <label>Paste CSV or copied sheet cells</label>
              <textarea rows={6} value={pasteText} onChange={(e) => setPasteText(e.target.value)} />
            </div>
            <button className="btn btn-primary" style={{ marginTop: 8 }} onClick={() => parseCsvText(pasteText)}>
              Parse
            </button>
          </div>
        )}

        {method === "file" && (
          <div className="file-drop">
            <input type="file" accept=".csv,.tsv,.txt" onChange={handleFileUpload} />
            <span style={{ color: "var(--text-dim)", fontSize: 12 }}>Accepts a CSV exported from Google Sheets (File &gt; Download &gt; CSV).</span>
          </div>
        )}

        {syncedAt && (
          <p className="timestamp-note">Last synced {new Date(syncedAt).toLocaleString()}</p>
        )}

        {rawRows.length > 0 && (
          <div style={{ marginTop: 16 }}>
            <p style={{ fontSize: 12, color: "var(--text-dim)" }}>{rawRows.length} rows detected. Confirm the mapping below.</p>
            <MappingPreviewImport
              headers={headers}
              rawRows={rawRows}
              fieldDefs={PLAYER_PLAN_FIELD_DEFS}
              mapping={mapping}
              setMapping={setMapping}
              onCommit={handleImport}
              disabled={!mapping.athleteName && !(mapping.firstName && mapping.lastName)}
              disabledHint="Map either a Full Name column, or both First Name and Last Name columns, before syncing."
              commitLabel={`Sync ${rawRows.length} rows (replaces current plans)`}
            />
          </div>
        )}
      </div>

      <div className="panel">
        <h2>
          Player Plans <small>{allPlans.length} plan{allPlans.length === 1 ? "" : "s"} on file</small>
        </h2>
        <input
          placeholder="Search athlete..."
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          style={{ marginBottom: 12, maxWidth: 260 }}
        />
        {allPlans.length ? (
          <table>
            <thead>
              <tr>
                <th>Athlete</th>
                <th>Focus Area</th>
                <th>Goal</th>
                <th>Target Date</th>
                <th>Status</th>
                <th>Coach</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody>
              {allPlans.map(({ plan, athlete }, i) => (
                <tr key={i} onClick={() => onSelect(athlete.id)}>
                  <td><Avatar athlete={athlete} />{displayName(athlete)}</td>
                  <td>{plan.focusArea || "—"}</td>
                  <td>{plan.goal || "—"}</td>
                  <td>{plan.targetDate || "—"}</td>
                  <td><Badge tone={planStatusTone(plan.status)}>{plan.status || "No Status"}</Badge></td>
                  <td>{plan.coach || "—"}</td>
                  <td>{plan.notes || "—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        ) : (
          <div className="empty-state">No player plans synced yet — pull them in from a Google Sheet above.</div>
        )}
      </div>
    </div>
  );
}

// Reuses an MLBAM id already captured in photoUrl (from the mlbstatic.com headshot CDN
// pattern) when no explicit id has been set, so athletes already photo-matched don't
// need a second manual lookup.
function extractMlbamId(athlete) {
  if (athlete.mlbamId) return String(athlete.mlbamId).trim();
  const m = /\/people\/(\d+)\//.exec(athlete.photoUrl || "");
  return m ? m[1] : null;
}

async function fetchSavantText(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.text();
}

async function fetchSavantCsv(url) {
  const text = await fetchSavantText(url);
  const parsed = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
  return parsed.data;
}

// Same as fetchSavantCsv but swallows failures (rate limits, dropped connections, etc.) and
// returns an empty result instead of throwing — used anywhere we fire off many requests, so
// one bad request doesn't wipe out an entire refresh that would otherwise have succeeded.
async function fetchSavantCsvSafe(url) {
  try {
    return await fetchSavantCsv(url);
  } catch (e) {
    console.warn("Savant fetch failed, skipping:", url, e);
    return [];
  }
}

function findByPlayerId(rows, idKey, id) {
  return rows.find((r) => String(r[idKey] || "").trim() === String(id));
}

// Raw pitch-level export (not a pre-aggregated leaderboard) so we can derive both the
// average AND peak fastball velocity for a given season from one source.
async function fetchFastballVelocityForYear(mlbamId, yr) {
  const url =
    `https://baseballsavant.mlb.com/statcast_search/csv?all=true&hfPT=FF%7C&hfSea=${yr}%7C&player_type=pitcher` +
    `&pitchers_lookup%5B%5D=${mlbamId}&min_pitches=0&min_results=0&group_by=name&sort_col=pitches` +
    `&player_event_sort=api_p_release_speed&sort_order=desc&min_abs=0&type=details`;
  const rows = await fetchSavantCsvSafe(url);
  const speeds = rows.map((r) => Number(r.release_speed)).filter((v) => !isNaN(v) && v > 0);
  if (!speeds.length) return { avg: null, peak: null };
  return {
    avg: round2(speeds.reduce((s, v) => s + v, 0) / speeds.length),
    peak: round2(Math.max(...speeds)),
  };
}

async function fetchSprintSpeedForYear(mlbamId, yr) {
  const rows = await fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/sprint_speed?year=${yr}&position=&team=&min=0&csv=true`);
  const row = findByPlayerId(rows, "player_id", mlbamId);
  return row && row.sprint_speed ? round2(Number(row.sprint_speed)) : null;
}

// Raw batted-ball export (same pitch-level search endpoint, queried as a batter) so we can
// derive both average and peak exit velocity for a season, same approach as fastball velo.
async function fetchExitVelocityForYear(mlbamId, yr) {
  const url =
    `https://baseballsavant.mlb.com/statcast_search/csv?all=true&hfSea=${yr}%7C&player_type=batter` +
    `&batters_lookup%5B%5D=${mlbamId}&min_pitches=0&min_results=0&group_by=name&sort_col=pitches` +
    `&player_event_sort=api_p_release_speed&sort_order=desc&min_abs=0&type=details`;
  const rows = await fetchSavantCsvSafe(url);
  const speeds = rows.map((r) => Number(r.launch_speed)).filter((v) => !isNaN(v) && v > 0);
  if (!speeds.length) return { avg: null, peak: null };
  return {
    avg: round2(speeds.reduce((s, v) => s + v, 0) / speeds.length),
    peak: round2(Math.max(...speeds)),
  };
}

// Savant's leaderboards silently default to fastball-only unless a pitch type is explicitly
// requested (an empty/omitted pitch_type param does NOT mean "all types") — so a full arsenal
// requires one request per type, per endpoint.
const PITCH_TYPE_CODES = ["FF", "SI", "FC", "SL", "ST", "SV", "CU", "KC", "CH", "FS", "FO", "KN", "EP", "SC"];

// Combines the pitch-movement leaderboard (shape: velo, induced vertical break, horizontal
// break, usage%) with the pitch-arsenal-stats leaderboard (results: whiff%, hard-hit%, run
// value) into one row per pitch type actually thrown — current season only.
// Fetches in small batches (not all 14 types x 2 endpoints at once) and uses the "safe" fetch
// wrapper, so a single rate-limited/dropped request only drops that one pitch type instead of
// failing the whole arsenal (and taking the rest of the refresh down with it).
async function fetchPitchArsenal(mlbamId, yr) {
  const BATCH_SIZE = 3;
  const perType = [];
  for (let i = 0; i < PITCH_TYPE_CODES.length; i += BATCH_SIZE) {
    const batch = PITCH_TYPE_CODES.slice(i, i + BATCH_SIZE);
    const batchResults = await Promise.all(
      batch.map(async (code) => {
        const [movementRows, statsRows] = await Promise.all([
          fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/pitch-movement?year=${yr}&team=&min=1&pitch_type=${code}&pitcherHand=&csv=true`),
          fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/pitch-arsenal-stats?type=pitcher&pitchType=${code}&year=${yr}&min=1&csv=true`),
        ]);
        const moveRow = findByPlayerId(movementRows, "pitcher_id", mlbamId);
        const statRow = findByPlayerId(statsRows, "player_id", mlbamId);
        if (!moveRow && !statRow) return null;
        return {
          pitchType: code,
          pitchName: (moveRow && moveRow.pitch_type_name) || (statRow && statRow.pitch_name) || code,
          usagePct: moveRow && moveRow.pitch_per ? Number(moveRow.pitch_per) : statRow && statRow.pitch_usage ? Number(statRow.pitch_usage) : null,
          avgVelo: moveRow && moveRow.avg_speed ? Number(moveRow.avg_speed) : null,
          inducedVertBreak: moveRow && moveRow.pitcher_break_z_induced ? Number(moveRow.pitcher_break_z_induced) : null,
          horizBreak: moveRow && moveRow.pitcher_break_x ? Number(moveRow.pitcher_break_x) : null,
          whiffPct: statRow && statRow.whiff_percent ? Number(statRow.whiff_percent) : null,
          hardHitPct: statRow && statRow.hard_hit_percent ? Number(statRow.hard_hit_percent) : null,
          runValuePer100: statRow && statRow.run_value_per_100 ? Number(statRow.run_value_per_100) : null,
        };
      })
    );
    perType.push(...batchResults);
  }
  return perType.filter(Boolean).sort((a, b) => (b.usagePct || 0) - (a.usagePct || 0));
}

// ---- Percentile Rankings (Baseball Savant) ------------------------------------------------
// Savant's own percentile-rankings leaderboard already does the work of converting raw stats
// into 0-100 percentiles against that season's qualified players (2.1 PA/team game for batters,
// 1.25 PA/team game for pitchers) — every column is oriented so 100 is always "best", including
// ones where a lower raw number is actually better (K%, Whiff%, Chase%, xERA), so no column needs
// inverting here. FanGraphs was evaluated too, but its leaderboard pages sit behind a Cloudflare
// bot challenge that blocks automated fetches (and shouldn't be bypassed), so this covers Savant
// only — which is also the only one of the two with a public, pre-computed percentile product.
const PERCENTILE_METRIC_GROUPS = {
  batter: [
    { group: "Offense", metrics: [
      { key: "xwoba", label: "xwOBA" },
      { key: "xba", label: "xBA" },
      { key: "xslg", label: "xSLG" },
      { key: "xiso", label: "xISO" },
      { key: "xobp", label: "xOBP" },
      { key: "brl_percent", label: "Barrel %" },
      { key: "exit_velocity", label: "Exit Velocity" },
      { key: "max_ev", label: "Max Exit Velo" },
      { key: "hard_hit_percent", label: "Hard-Hit %" },
      { key: "bat_speed", label: "Bat Speed" },
      { key: "squared_up_rate", label: "Squared-Up Rate" },
      { key: "k_percent", label: "Strikeout %" },
      { key: "bb_percent", label: "Walk %" },
      { key: "whiff_percent", label: "Whiff %" },
      { key: "chase_percent", label: "Chase %" },
    ] },

      { key: "oaa", label: "Outs Above Average" },
      { key: "arm_strength", label: "Arm Strength" },
    ] },
    { group: "Baserunning", metrics: [
      { key: "sprint_speed", label: "Sprint Speed" },
    ] },
  ],
  pitcher: [
    { group: "Pitching", metrics: [
      { key: "xera", label: "xERA" },
      { key: "xwoba", label: "xwOBA Against" },
      { key: "xba", label: "xBA Against" },
      { key: "xslg", label: "xSLG Against" },
      { key: "xiso", label: "xISO Against" },
      { key: "xobp", label: "xOBP Against" },
      { key: "brl_percent", label: "Barrel % Against" },
      { key: "exit_velocity", label: "Exit Velo Against" },
      { key: "hard_hit_percent", label: "Hard-Hit % Against" },
      { key: "k_percent", label: "Strikeout %" },
      { key: "bb_percent", label: "Walk %" },
      { key: "whiff_percent", label: "Whiff %" },
      { key: "chase_percent", label: "Chase %" },
      { key: "fb_velocity", label: "Fastball Velocity" },
      { key: "fb_spin", label: "Fastball Spin" },
      { key: "curve_spin", label: "Curveball Spin" },
