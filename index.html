        {match && <FacilityDetails f={match} />}
        {current && !match && <div className="facility-note">Not in the facility directory yet. Add it on the Facilities page to see its address.</div>}
        <button className="btn-link no-print" style={{ marginTop: 8 }} onClick={startEdit}>Edit</button>
      </div>
    );
  }

  if (unsaved) {
    return (
      <div className="panel">
        <h2>Off-Season Training Facility</h2>
        <div className="facility-note" style={{ marginTop: 0, marginBottom: 10 }}>
          “{unsaved}” isn’t in the facility database yet. Add its address and contact to save it for everyone, or keep just the name for this athlete.
        </div>
        <FacilityForm initial={{ name: unsaved }} onSave={saveNewFacility} onCancel={() => setUnsaved(null)} />
        <button className="btn-link" style={{ marginTop: 8 }} onClick={() => assign(unsaved)}>Keep name only</button>
      </div>
    );
  }

  return (
    <div className="panel">
      <h2>Off-Season Training Facility</h2>
      <div className="field">
        <input
          list="facility-directory-names"
          value={value}
          onChange={(e) => setValue(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") saveValue(); }}

          style={{ width: "100%" }}
        />

          {directory.map((f) => <option key={f.id} value={f.name} />)}
        </datalist>
      </div>
      <button className="btn-link" style={{ marginRight: 10, marginTop: 8 }} onClick={saveValue}>Save</button>
      <button className="btn-link" style={{ marginTop: 8 }} onClick={() => setEditing(false)}>Cancel</button>

}

// Looks up coordinates for a query with OpenStreetMap's Nominatim service (US only).
// Resolves to { lat, lng }, or null when the service has no match. Throws on network / rate-limit errors.
async function geocodeAddress(q) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${encodeURIComponent(q)}`;
  const res = await fetch(url, { headers: { Accept: "application/json" } });
  if (!res.ok) throw new Error(`geocode failed: HTTP ${res.status}`);
  const rows = await res.json();
  return rows[0] ? { lat: Number(rows[0].lat), lng: Number(rows[0].lon) } : null;
}

// Bump when the lookup changes, so facilities located under the old rules get another try.
const GEO_VERSION = 2;

// Tries the most exact form of the address first, then looser ones: without the suite number, then the city alone.
// A city-only match is marked approximate, since the pin is then only the city's center.
async function locateFacility(f) {
  const street = (f.address1 || "").trim().replace(/\.$/, "");
  const cityState = [f.city, [f.state, f.zip].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const full = facilityAddressLine(f).replace(/\.(?=,|$)/g, "");
  const attempts = [
    street && { q: [street, cityState].filter(Boolean).join(", "), approx: false },
    full && full !== [street, cityState].filter(Boolean).join(", ") && { q: full, approx: false },
    cityState && { q: cityState, approx: true },
  ].filter(Boolean);
  for (let i = 0; i < attempts.length; i++) {
    if (i > 0) await new Promise((r) => setTimeout(r, 1100));
    const hit = await geocodeAddress(attempts[i].q);
    if (hit) return { ...hit, approx: attempts[i].approx };
  }
  return null;
}

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Map of every located facility, centered on the continental US. One dot per facility; click for details.
function FacilityMap({ facilities, color }) {
  const elRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const layerRef = React.useRef(null);

  React.useEffect(() => {
    if (!window.L || !elRef.current) return;
    const map = L.map(elRef.current, { scrollWheelZoom: false }).setView([39.8, -98.6], 4);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    mapRef.current = map;
    layerRef.current = L.layerGroup().addTo(map);
    return () => { map.remove(); mapRef.current = null; layerRef.current = null; };
  }, []);

  // Re-draw only when the pins actually change (not on every render), so panning and zooming survive typing in the search box.
  const pinKey = facilities
    .filter((f) => f.geo && f.geo.lat != null)
    .map((f) => `${f.id}|${f.name}|${f.geo.lat},${f.geo.lng}|${f.phone || ""}|${f.contactName || ""}|${facilityAddressLine(f)}`)
    .join(";");
  React.useEffect(() => {
    if (!mapRef.current || !layerRef.current) return;
    layerRef.current.clearLayers();
    const pts = [];
    facilities.forEach((f) => {
      if (!f.geo || f.geo.lat == null || f.geo.lng == null) return;
      const addr = facilityAddressLine(f);
      const popup = `<strong>${escapeHtml(f.name)}</strong>` +
        (addr ? `<br>${escapeHtml(addr)}` : "") +
        (f.phone ? `<br>${escapeHtml(f.phone)}` : "") +
        (f.contactName ? `<br>Contact: ${escapeHtml(f.contactName)}` : "") +
        (f.geo.approx ? `<br><em>Approximate: only the city could be matched</em>` : "");
      L.circleMarker([f.geo.lat, f.geo.lng], { radius: 7, color: "#fff", weight: 2, fillColor: color, fillOpacity: 0.95 })
        .bindPopup(popup)
        .addTo(layerRef.current);
      pts.push([f.geo.lat, f.geo.lng]);
    });
    if (pts.length > 1) mapRef.current.fitBounds(pts, { padding: [30, 30], maxZoom: 7 });
    else if (pts.length === 1) mapRef.current.setView(pts[0], 7);
    else mapRef.current.setView([39.8, -98.6], 4);
  }, [pinKey, color]);

  return <div ref={elRef} className="facility-map" />;
}

// Facilities tab: the whole shared directory, searchable, with add / edit / delete.
function OffseasonFacilitiesPage() {
  const [editing, setEditing] = useState(null); // null = list, {} = new facility, record = editing that one
  const [query, setQuery] = useState("");
  const [version, setVersion] = useState(0);
  const facilities = window.AthleteStore.allOffseasonFacilities();
  const q = query.trim().toLowerCase();
  const athletes = window.AthleteStore.allAthletes();
  const countAt = (f) => athletes.filter((a) => ((a.offseasonFacility || "").trim().toLowerCase() === (f.name || "").trim().toLowerCase())).length;
  // Most athletes first; facilities with the same count are alphabetical.
  const shown = facilities
    .filter((f) => !q || [f.name, f.city, f.state, f.contactName].some((v) => (v || "").toLowerCase().includes(q)))
    .map((f) => ({ f, n: countAt(f) }))
    .sort((a, b) => b.n - a.n || (a.f.name || "").localeCompare(b.f.name || ""))
    .map((x) => x.f);
  const athletesAt = (f) => athletes
    .filter((a) => ((a.offseasonFacility || "").trim().toLowerCase() === (f.name || "").trim().toLowerCase()))
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  const usedBy = (f) => athletesAt(f).length;

  // Pins need coordinates: any facility whose address has no coordinates yet (or whose address changed) is looked up
  // once, one request a second to respect the geocoding service's limit, and the result is saved on the record.
  const addressKey = facilities.map((f) => `${f.id}:${facilityAddressLine(f)}`).join("|");
  const needsGeo = (f) => {
    const q = facilityAddressLine(f);
    if (!q) return false;
    return !(f.geo && f.geo.q === q && (f.geo.lat != null || f.geo.v === GEO_VERSION));
  };
  const pendingGeo = facilities.filter(needsGeo).length;
  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      for (const f of window.AthleteStore.allOffseasonFacilities()) {
        if (cancelled) return;
        if (!needsGeo(f)) continue;
        const q = facilityAddressLine(f);
        try {
          const hit = await locateFacility(f);
          if (cancelled) return;
          const latest = window.AthleteStore.allOffseasonFacilities().find((x) => x.id === f.id);
          if (latest) {
            window.AthleteStore.saveOffseasonFacility({
              ...latest,
              geo: { q, v: GEO_VERSION, lat: hit ? hit.lat : null, lng: hit ? hit.lng : null, approx: hit ? hit.approx : false },
            });
            setVersion((v) => v + 1);
          }
        } catch (e) {
          // Network or rate-limit error: leave it unlocated and try again the next time the page opens.
          console.warn("Facility map: couldn't locate", f.name, e);
        }
        await new Promise((r) => setTimeout(r, 1100));
      }
    })();
    return () => { cancelled = true; };
  }, [addressKey]);

  const save = (rec) => {
    const old = editing && editing.id ? editing : null;
    const saved = window.AthleteStore.saveOffseasonFacility(rec);
    // Renaming a facility carries the new name over to every athlete already assigned to it.
    if (old && (old.name || "").trim().toLowerCase() !== saved.name.trim().toLowerCase()) {
      const oldNorm = (old.name || "").trim().toLowerCase();
      athletes
        .filter((a) => (a.offseasonFacility || "").trim().toLowerCase() === oldNorm)
        .forEach((a) => window.AthleteStore.updateAthlete(a.id, { offseasonFacility: saved.name }));
    }
    setEditing(null);
    setVersion((v) => v + 1);
  };

  const remove = (f) => {
    const n = usedBy(f);
    const msg = `Delete ${f.name} from the facility directory?` +
      (n ? ` ${n} athlete${n === 1 ? " is" : "s are"} assigned to it; their facility name stays, but it will no longer show an address.` : "");
    if (!window.confirm(msg)) return;
    window.AthleteStore.deleteOffseasonFacility(f.id);
    setVersion((v) => v + 1);
  };

  if (editing) {
    return (
      <div className="panel">
        <h2>{editing.id ? `Edit ${editing.name}` : "Add an off-season facility"}</h2>
        <FacilityForm initial={editing.id ? editing : null} onSave={save} onCancel={() => setEditing(null)} />
      </div>
    );
  }

  return (
    <div className="panel">
      <h2>Off-Season Facilities <small>{facilities.length} in the directory</small></h2>
      <FacilityMap facilities={facilities} color="#0E3386" />
      <div className="facility-map-note">
        {facilities.filter((f) => f.geo && f.geo.lat != null).length} of {facilities.length} on the map
        {pendingGeo > 0 && ` · locating ${pendingGeo} address${pendingGeo === 1 ? "" : "es"}…`}
        {facilities.some((f) => f.geo && f.geo.v === GEO_VERSION && f.geo.lat == null) && " · some addresses weren't found, so check them with Edit"}
      </div>
      <div className="facility-toolbar">
        <input className="facility-search" value={query} placeholder="Search by name, city, or contact" onChange={(e) => setQuery(e.target.value)} />
        <button className="btn" onClick={() => setEditing({})}>+ Add facility</button>
      </div>
      {shown.length === 0 && (
        <div className="empty-state">{facilities.length ? "No facilities match that search." : "No facilities yet. Add one to start the directory."}</div>
      )}
      <div className="facility-list">
        {shown.map((f) => (
          <div className="facility-card" key={f.id}>
            <div className="facility-card-head">
              <strong>{f.name}</strong>
              <span className="facility-used">{usedBy(f)} athlete{usedBy(f) === 1 ? "" : "s"}</span>
            </div>
            {usedBy(f) > 0 && (
              <div className="facility-athletes">
                <span>Training here:</span> {athletesAt(f).map((a) => a.name).join(", ")}
              </div>
            )}
            <FacilityDetails f={f} />
            <div className="facility-card-actions no-print">
              <button className="btn-link" onClick={() => setEditing(f)}>Edit</button>
              <button className="btn-link" onClick={() => remove(f)}>Delete</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// Pulls every rule out of this page's @media print blocks and hands it back as plain, unconditional
// CSS text. html2canvas renders a print-accurate snapshot by injecting this into the *cloned*
// document it snapshots (see renderTabToPdf) — reusing the exact same print styling (colors,
// hidden buttons, print-only marks) the "Print / Save PDF" buttons already rely on, rather than
// maintaining a second copy of those rules just for this feature.
function extractPrintCss() {
  const parts = [];
  for (const sheet of Array.from(document.styleSheets)) {
    let rules;
    try { rules = sheet.cssRules; } catch (e) { continue; } // cross-origin sheet — nothing of ours lives there
    if (!rules) continue;
    for (const rule of Array.from(rules)) {
      if (rule.media && rule.media.mediaText && rule.media.mediaText.includes("print")) {
        for (const inner of Array.from(rule.cssRules)) parts.push(inner.cssText);
      }
    }
  }
  return parts.join("\n");
}

// Blank space kept around every emailed PDF's content, on every page — plain full-bleed pages
// looked cramped right up against the edges.
const PDF_MARGIN_IN = 0.35;

// Slices a (probably page-taller-than-one-page) canvas into a multi-page PDF, one page-height's
// worth of pixels at a time, instead of squashing everything onto a single page. isFirstPage
// controls whether the very first slice reuses the PDF's current page (the normal case) or forces
// a new one first — needed when compositing several elements into one document (see
// renderTeamReportToPdf), where every element after the first must start on its own fresh page.
function addCanvasAsPages(pdf, canvas, pageW, pageH, isFirstPage = true) {
  const usableW = pageW - PDF_MARGIN_IN * 2;
  const usableH = pageH - PDF_MARGIN_IN * 2;
  const pageHeightPx = Math.floor((usableH / usableW) * canvas.width);
  let renderedPx = 0;
  let first = true;
  while (renderedPx < canvas.height) {
    const sliceHeightPx = Math.min(pageHeightPx, canvas.height - renderedPx);
    const slice = document.createElement("canvas");
    slice.width = canvas.width;
    slice.height = sliceHeightPx;
    slice.getContext("2d").drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
    const sliceHeightIn = (sliceHeightPx * usableW) / canvas.width;
    if (!(first && isFirstPage)) pdf.addPage();
    pdf.addImage(slice.toDataURL("image/jpeg", 0.92), "JPEG", PDF_MARGIN_IN, PDF_MARGIN_IN, usableW, sliceHeightIn);
    renderedPx += sliceHeightPx;
    first = false;
  }
}

// Snapshots one element at its natural (un-zoomed) size — html2canvas doesn't reproduce CSS zoom
// correctly (it reads back as overlapping, garbled text), so every capture in this file avoids it
// entirely by setting a plain pixel width instead. printCss (see extractPrintCss) is injected into
// html2canvas's cloned document so the snapshot picks up print colors and print-vs-screen element
// swaps, the same as actually printing would.
async function captureElement(el, printCss, width) {
  const savedWidth = el.style.width;
  const savedZoom = el.style.zoom;
  // Two more things that would otherwise clip content out of the snapshot entirely (not garble it
  // like zoom does — just leave it missing): a textarea only shows what fits its current height
  // (the Player Plan's action-plan boxes are the main case), and the plan's week-by-week grid
  // scrolls horizontally in its own container rather than growing the page. Both are plain
  // width/height/overflow changes, so — unlike zoom — html2canvas renders them correctly; expanding
  // every one every time is harmless on tabs that have none.
  const textareas = Array.from(el.querySelectorAll("textarea"));
  const savedTextareas = textareas.map((ta) => ({ ta, height: ta.style.height, overflow: ta.style.overflow }));
  textareas.forEach((ta) => {
    ta.style.overflow = "hidden";
    ta.style.height = "auto";
    ta.style.height = `${ta.scrollHeight + 4}px`;
  });
  const scrollers = Array.from(el.querySelectorAll(".period-scroll"));
  const savedScrollers = scrollers.map((s) => ({ s, width: s.style.width, overflow: s.style.overflow }));
  // Widening a scroller only helps if nothing between it and `el` clips it back down — the plan's
  // own panel around it (.period-visual) hides overflow on purpose on screen, for its rounded
  // corners, which would otherwise cut the now-wider grid right back off before it ever reaches
  // `el` (and so before `el.scrollWidth`, read below, would ever reflect it).
  const savedAncestors = [];
  scrollers.forEach((s) => {
    s.style.overflow = "visible";
    s.style.width = `${s.scrollWidth}px`;
    let node = s.parentElement;
    while (node && node !== el.parentElement) {
      if (getComputedStyle(node).overflow !== "visible" && !savedAncestors.some((a) => a.node === node)) {
        savedAncestors.push({ node, overflow: node.style.overflow });
        node.style.overflow = "visible";
      }
      node = node.parentElement;
    }
  });
  el.style.zoom = "";
  el.style.width = `${width}px`;
  await new Promise((r) => setTimeout(r, 30)); // let layout settle at the new width before snapshotting
  // html2canvas sizes its output canvas from el's own rendered width, not just the target `width`
  // — el's scrollWidth reflects any scrollers just widened above (now that their clipping ancestors
  // are out of the way too), so re-applying it as el's actual width is what makes the wider content
  // actually part of the capture instead of still being cropped off at the original `width`.
  const captureWidth = Math.max(width, el.scrollWidth);
  el.style.width = `${captureWidth}px`;
  await new Promise((r) => setTimeout(r, 30));
  try {
    return await window.html2canvas(el, {
      backgroundColor: "#ffffff",
      scale: 2,
      useCORS: true,
      windowWidth: captureWidth,
      onclone: (clonedDoc) => {
        const style = clonedDoc.createElement("style");
        style.textContent = printCss;
        clonedDoc.head.appendChild(style);
        // html2canvas approximates native <input>/<select> rendering rather than drawing them
        // properly, and consistently clips text a little at the edges (the assessment header's
        // Name/Date/Coach fields have no print-only text swap like the table cells do, since a
        // real browser print — unlike html2canvas — renders native inputs just fine). Swapping
        // each visible input for a plain text element sidesteps that entirely.
        clonedDoc.querySelectorAll("input").forEach((input) => {
          if (getComputedStyle(input).display === "none") return; // already hidden by printCss
          const replacement = clonedDoc.createElement("div");
          replacement.textContent = input.value || "";
          replacement.style.cssText = getComputedStyle(input).cssText;
          replacement.style.display = "flex";
          replacement.style.alignItems = "center";
          input.replaceWith(replacement);
        });
      },
    });
  } finally {
    el.style.width = savedWidth;
    el.style.zoom = savedZoom;
    savedScrollers.forEach((s) => { s.s.style.width = s.width; s.s.style.overflow = s.overflow; });
    savedAncestors.forEach((a) => { a.node.style.overflow = a.overflow; });
    savedTextareas.forEach((s) => { s.ta.style.height = s.height; s.ta.style.overflow = s.overflow; });
  }
}

// Scales a canvas to fit within a box (preserving aspect ratio) and draws it centered there.
function addImageFitted(pdf, canvas, x, y, boxW, boxH) {
  const ratio = canvas.width / canvas.height;
  const boxRatio = boxW / boxH;
  const w = ratio > boxRatio ? boxW : boxH * ratio;
  const h = ratio > boxRatio ? boxW / ratio : boxH;
  pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", x + (boxW - w) / 2, y + (boxH - h) / 2, w, h);
}

// The assessment's own "Print / Save PDF" lays out its header full-width, then its two columns
// side by side, each independently scaled to fill its half of one landscape page — captured live
// via CSS zoom (see preparePrint in assessment.js), which is exactly what html2canvas can't
// reproduce. This gets the same one-page, three-piece layout a different way: capture the header
// and each column separately at their own natural size, then place each into its own box on one
// PDF page, letting jsPDF's own image scaling do the fitting instead of CSS zoom.
async function renderAssessmentToPdf() {
  const wrap = document.querySelector(".assess-wrap");
  if (!wrap) throw new Error("Couldn't find this assessment to render — try reopening it.");
  const header = wrap.querySelector(".assess-header");
  const cols = wrap.querySelectorAll(".assess-col");
  if (!header || cols.length !== 2) throw new Error("Unexpected assessment layout — try reopening it.");
  const printCss = extractPrintCss();

  const headerCanvas = await captureElement(header, printCss, 1400);
  const col0Canvas = await captureElement(cols[0], printCss, 900);
  const col1Canvas = await captureElement(cols[1], printCss, 900);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "landscape", unit: "in", format: "letter" });
  const m = PDF_MARGIN_IN;
  const pageW = pdf.internal.pageSize.getWidth() - m * 2;
  const pageH = pdf.internal.pageSize.getHeight() - m * 2;
  const gap = 0.15;

  const headerH = Math.min(pageH * 0.25, (headerCanvas.height * pageW) / headerCanvas.width);
  addImageFitted(pdf, headerCanvas, m, m, pageW, headerH);

  const colY = m + headerH + 0.1;
  const colBoxW = (pageW - gap) / 2;
  const colBoxH = pageH - headerH - 0.1;
  addImageFitted(pdf, col0Canvas, m, colY, colBoxW, colBoxH);
  addImageFitted(pdf, col1Canvas, m + colBoxW + gap, colY, colBoxW, colBoxH);

  return pdf.output("datauristring").split(",")[1];
}

// Shared fallback for any tab without a fixed one-page layout to composite (the plan, and the
// chart-heavy Statcast/Performance tabs): capture the whole section at a comfortable natural width
// and let it span as many pages as it needs, rather than shrinking it down to fit one.
async function renderElementToPdf(selector, { width, orientation }) {
  const el = document.querySelector(selector);
  if (!el) throw new Error("Couldn't find this tab's content to render — try reopening it.");
  const printCss = extractPrintCss();
  const canvas = await captureElement(el, printCss, width);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation, unit: "in", format: "letter" });
  addCanvasAsPages(pdf, canvas, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
  return pdf.output("datauristring").split(",")[1];
}

async function renderTabToPdf(tab) {
  if (tab === "assessment") return renderAssessmentToPdf();
  if (tab === "plan") return renderElementToPdf(".period-wrap", { width: 1000, orientation: "portrait" });
  // Statcast/Performance are chart grids with no fixed page design of their own to match — wide
  // landscape gives their side-by-side charts more room than a portrait page would.
  return renderElementToPdf(`[data-tab-content="${tab}"]`, { width: 1300, orientation: "landscape" });
}

// The team report is one ".report-sheet" per athlete (same markup "Print / Save PDF" uses,
// prepared per-sheet with its own zoom-based one-page fit — see prepareSheets in TeamReportPage).
// That zoom fit is exactly what html2canvas can't reproduce, so each sheet is captured here at its
// natural size instead and given its own page(s) in the PDF, in roster order.
async function renderTeamReportToPdf() {
  const sheets = Array.from(document.querySelectorAll(".report-sheet")).filter((s) => s.offsetParent !== null);
  if (!sheets.length) throw new Error("This team has no player report sheets to render yet.");
  const printCss = extractPrintCss();
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "portrait", unit: "in", format: "letter" });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  for (let i = 0; i < sheets.length; i++) {
    const canvas = await captureElement(sheets[i], printCss, 900);
    addCanvasAsPages(pdf, canvas, pageW, pageH, i === 0);
  }
  return pdf.output("datauristring").split(",")[1];
}

// Generic "compose + send a PDF" panel — used both for a single athlete's tab and for a team
// report going out to several contacts at once. `renderPdf` does the actual snapshot (different
// for each caller); everything else (recipients, status, error handling) is shared.
function EmailComposer({ title, defaultTo, defaultSubject, defaultBody, attachmentNote, renderPdf, filename, logContext, onClose }) {
  const [to, setTo] = useState(defaultTo || "");
  const [cc, setCc] = useState("");
  const [subject, setSubject] = useState(defaultSubject);
  const [body, setBody] = useState(defaultBody);
  const [sending, setSending] = useState(false);
  const [status, setStatus] = useState(""); // progress text while sending
  const [error, setError] = useState("");
  const [sent, setSent] = useState(false);

  const send = async () => {
    setError("");
    const emailRe = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    const toList = to.split(",").map((s) => s.trim()).filter(Boolean);
    if (!toList.length || toList.some((addr) => !emailRe.test(addr))) { setError("Enter at least one valid recipient email."); return; }
    const ccList = cc.split(",").map((s) => s.trim()).filter(Boolean);
    if (ccList.some((addr) => !emailRe.test(addr))) { setError("One of the CC addresses doesn't look like a valid email."); return; }
    if (!subject.trim() || !body.trim()) { setError("Subject and message can't be empty."); return; }
    setSending(true);
    try {
      setStatus("Rendering PDF…");
      const pdfBase64 = await renderPdf();
      setStatus("Sending…");
      const { data } = await window.supabaseClient.auth.getSession();
      const token = data.session && data.session.access_token;
      if (!token) throw new Error("You're not signed in — reload and sign in again.");
      const res = await fetch("/api/send-athlete-email", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ to: toList.join(", "), cc: ccList.join(", "), subject: subject.trim(), body, filename, pdfBase64, ...(logContext || {}) }),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || `Send failed (${res.status})`);
      setSent(true);
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setSending(false);
      setStatus("");
    }
  };

  return (
    <div className="panel no-print" style={{ marginTop: 10 }}>
      <h2>{title}</h2>
      {sent ? (
        <React.Fragment>
          <div className="success-banner">Sent to {to}{cc.trim() ? ` (cc: ${cc.trim()})` : ""}.</div>
          <button className="btn btn-secondary" style={{ marginTop: 8 }} onClick={onClose}>Close</button>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <div className="form-row">
            <div className="field" style={{ minWidth: 220 }}>
              <label>To</label>
              <input value={to} onChange={(e) => setTo(e.target.value)} placeholder="athlete@example.com" disabled={sending} />
            </div>
            <div className="field" style={{ minWidth: 220 }}>
              <label>CC (optional)</label>
              <input value={cc} onChange={(e) => setCc(e.target.value)} placeholder="parent@example.com, coach@example.com" disabled={sending} />
            </div>
            <div className="field" style={{ flex: 1, minWidth: 260 }}>
              <label>Subject</label>
              <input value={subject} onChange={(e) => setSubject(e.target.value)} disabled={sending} />
            </div>
          </div>
          <div className="field" style={{ marginTop: 10 }}>
            <label>Message</label>
            <textarea rows={6} value={body} onChange={(e) => setBody(e.target.value)} disabled={sending} style={{ width: "100%" }} />
          </div>
          <div className="assess-row-note" style={{ marginTop: 6 }}>{attachmentNote}</div>
          {error && <div className="success-banner" style={{ marginTop: 8, background: "#3a1414", color: "var(--danger)", borderColor: "#5a1f1f" }}>{error}</div>}
          <div style={{ marginTop: 10, display: "flex", gap: 8 }}>
            <button className="btn btn-primary" onClick={send} disabled={sending}>{sending ? status || "Sending…" : "Send"}</button>
            <button className="btn btn-secondary" onClick={onClose} disabled={sending}>Cancel</button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// Sends the whole team report (one sheet per athlete) to one or more contacts at once, replacing
// the old per-contact "open a Gmail draft and drag in a PDF the local dev server built" flow —
// that relied on a local server this app no longer runs since moving to Supabase/Vercel.
function EmailTeamReportButton({ team, defaultRecipients }) {
  const [open, setOpen] = useState(false);
  const dateText = new Date().toLocaleDateString(undefined, { year: "numeric", month: "2-digit", day: "2-digit" }).replace(/\//g, "-");
  const provider = team === "Chicago Cubs" ? "Chicago Cubs Strength & Conditioning" : "Dynamic Sports Training";
  return (
    <React.Fragment>
      <button type="button" className="btn btn-secondary no-print" onClick={() => setOpen(true)} title={`Email the ${team} report to its contacts`}>
        Email Team Report
      </button>
      {open && (
        <EmailComposer
          title={`Email ${team} Report`}
          defaultTo={defaultRecipients || ""}
          defaultSubject={`${team} player reports - ${provider}`}
          defaultBody={`Hi,\n\nAttached is the latest ${team} player report from ${provider}, covering each player's periodization, performance metrics and coaching notes.\n\nLet me know if you have any questions.\n\nThank you,`}
          attachmentNote="A PDF with one page per player will be attached, sent from your own email address."
          renderPdf={renderTeamReportToPdf}
          filename={`${team.replace(/[^a-z0-9]+/gi, "_")}-team-report-${dateText}.pdf`}
          logContext={{ kind: "team_report", athleteName: team }}
          onClose={() => setOpen(false)}
        />
      )}
    </React.Fragment>
  );
}

function MergeControl({ athlete, onChanged }) {
  const [open, setOpen] = useState(false);
  const [targetId, setTargetId] = useState("");

  if (!open) {
    return (
      <button className="btn-link" style={{ marginRight: 10 }} onClick={(e) => { e.stopPropagation(); setOpen(true); }}>
        Merge
      </button>
    );
  }

  const others = getRoster()
    .filter((a) => a.id !== athlete.id)
    .sort((a, b) => lastNameOnly(a.name).localeCompare(lastNameOnly(b.name)));

  const handleMerge = (e) => {
    e.stopPropagation();
    if (!targetId) return;
    const target = others.find((a) => String(a.id) === String(targetId));
    if (!target) return;
    if (
      window.confirm(
        `Merge ${athlete.name}'s data into ${target.name}? All of ${athlete.name}'s wellness, force plate, body comp, plan, and note data moves to ${target.name}, and ${athlete.name}'s profile is then deleted. This can't be undone.`
      )
    ) {
      window.AthleteStore.mergeAthletes(target.id, athlete.id);
      onChanged();
    }
  };

  return (
    <span onClick={(e) => e.stopPropagation()} style={{ display: "inline-flex", gap: 4, alignItems: "center", marginRight: 10 }}>
      <select className="inline-select" value={targetId} onChange={(e) => setTargetId(e.target.value)}>
        <option value="">Merge into…</option>
        {others.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
      </select>
      <button className="btn-link" disabled={!targetId} onClick={handleMerge}>Go</button>
      <button className="btn-link" onClick={(e) => { e.stopPropagation(); setOpen(false); setTargetId(""); }}>Cancel</button>
    </span>
  );
}

function BulkActionsBar({ selectedIds, roster, onApplied, onClear }) {
  const [status, setStatus] = useState("");
  const [dstLocation, setDstLocation] = useState("");
  const [position, setPosition] = useState("");
  const [league, setLeague] = useState("");

  const handleApply = () => {
    const patch = {};
    if (status) patch.status = status;
    if (dstLocation) patch.dstLocation = dstLocation;
    if (position) patch.position = position;
    if (league) {
      patch.league = league;
      patch.team = ""; // a team from the old league won't be valid in the new one
    }
    if (Object.keys(patch).length === 0) return;

    const names = roster.filter((a) => selectedIds.has(a.id)).map((a) => a.name);
    if (!window.confirm(`Apply this change to ${selectedIds.size} athlete(s)?\n\n${names.join(", ")}`)) return;

    selectedIds.forEach((id) => window.AthleteStore.updateAthlete(id, patch));
    setStatus("");
    setDstLocation("");
    setPosition("");
    setLeague("");
    onApplied();
  };

  return (
    <div className="panel bulk-actions-bar">
      <div className="bulk-actions-header">
        <strong>{selectedIds.size} athlete{selectedIds.size === 1 ? "" : "s"} selected</strong>
        <button className="btn-link" onClick={onClear}>Clear selection</button>
      </div>
      <div className="form-row">
        <div className="field">
          <label>Set Status</label>
          <select value={status} onChange={(e) => setStatus(e.target.value)}>
            <option value="">— no change —</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="alumni">Alumni</option>
          </select>
        </div>
        <div className="field">
          <label>Set DST Location</label>
          <select value={dstLocation} onChange={(e) => setDstLocation(e.target.value)}>
            <option value="">— no change —</option>
            {DST_LOCATIONS.map((l) => <option key={l} value={l}>{l}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Set Position</label>
          <select value={position} onChange={(e) => setPosition(e.target.value)}>
            <option value="">— no change —</option>
            <option value="Unassigned">Unassigned</option>
            <option value="Pitcher">Pitcher</option>
            <option value="Catcher">Catcher</option>
            <option value="Infield">Infield</option>
            <option value="Outfield">Outfield</option>
          </select>
        </div>
        <div className="field">
          <label>Set League</label>
          <select value={league} onChange={(e) => setLeague(e.target.value)}>
            <option value="">— no change —</option>
            {LEAGUES.map((l) => <option key={l} value={l}>{l}</option>)}
          </select>
        </div>
      </div>
      <button className="btn btn-primary" onClick={handleApply}>
        Apply to {selectedIds.size} athlete{selectedIds.size === 1 ? "" : "s"}
      </button>
      {league && (
        <p style={{ fontSize: 11, color: "var(--text-dim)", marginTop: 8 }}>
          Setting League also clears Team for the selected athletes, since their old team may not exist in the new league.
        </p>
      )}
    </div>
  );
}

  const [selectedIds, setSelectedIds] = useState(() => new Set());

  const handleSort = (key) => {
    setSortConfig((prev) => (prev.key === key ? { key, dir: prev.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" }));
  };

  const toggleSelect = (id) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const clearSelection = () => setSelectedIds(new Set());

  const filtered = useMemo(() => {
    return getRoster().filter((a) => {
      const matchesPos = positionFilter === "All" || a.position === positionFilter;
      const matchesStatus = statusFilter === "All" || (a.status || "active").toLowerCase() === statusFilter.toLowerCase();
      const matchesLeague = leagueFilter === "All" || (a.league || "") === leagueFilter;
      const matchesSearch = a.name.toLowerCase().includes(search.toLowerCase());
      // Chicago Cubs is its own bucket, never part of "All" or any real DST location — shown
      // only when that button is the one actually selected.
      if (locationFilter === CUBS_LOCATION_LABEL) {
        return isCubs(a) && matchesPos && matchesStatus && matchesLeague && matchesSearch;
      }
      const matchesLocation = locationFilter === "All" || (a.dstLocation || "") === locationFilter;
      return !isCubs(a) && matchesPos && matchesStatus && matchesLeague && matchesLocation && matchesSearch;
    });
    // eslint-disable-next-line
  }, [positionFilter, statusFilter, leagueFilter, locationFilter, search, dataVersion]);

  const rows = useMemo(() => {
    return filtered.map((a) => {
      const { wellness, load } = latestOf(a);
      return { athlete: a, wellness, load };
    });
  }, [filtered, dataVersion]);

  // Alumni are excluded from every top-of-page roster number regardless of the current
  // Status filter — they're former athletes, not part of the active program counts, even
  // when you've filtered the table itself to show them.
  const kpiRows = rows.filter((r) => (r.athlete.status || "active").toLowerCase() !== "alumni");
  const kpiFiltered = filtered.filter((a) => (a.status || "active").toLowerCase() !== "alumni");

  // Location breakdown ignores the location filter itself (though it still respects every
  // other filter) so the counts stay visible for every location even after you've clicked
  // into one — otherwise every other card would collapse to 0 and you couldn't see enough
  // to switch to a different location.
  const forLocationCounts = useMemo(() => {
    return getRoster().filter((a) => {
      const matchesPos = positionFilter === "All" || a.position === positionFilter;
      const matchesStatus = statusFilter === "All" || (a.status || "active").toLowerCase() === statusFilter.toLowerCase();
      const matchesLeague = leagueFilter === "All" || (a.league || "") === leagueFilter;
      const matchesSearch = a.name.toLowerCase().includes(search.toLowerCase());
      return !isCubs(a) && matchesPos && matchesStatus && matchesLeague && matchesSearch && (a.status || "active").toLowerCase() !== "alumni";
    });
    // eslint-disable-next-line
  }, [positionFilter, statusFilter, leagueFilter, search, dataVersion]);

  // Same filters as the DST location buttons, but counting Cubs roster athletes instead — kept
  // separate from forLocationCounts so Cubs never land in "No Location Set" or any DST count.
  const cubsCount = useMemo(() => {
    return getRoster().filter((a) => {
      const matchesPos = positionFilter === "All" || a.position === positionFilter;
      const matchesStatus = statusFilter === "All" || (a.status || "active").toLowerCase() === statusFilter.toLowerCase();
      const matchesLeague = leagueFilter === "All" || (a.league || "") === leagueFilter;
      const matchesSearch = a.name.toLowerCase().includes(search.toLowerCase());
      return isCubs(a) && matchesPos && matchesStatus && matchesLeague && matchesSearch && (a.status || "active").toLowerCase() !== "alumni";
    }).length;
    // eslint-disable-next-line
  }, [positionFilter, statusFilter, leagueFilter, search, dataVersion]);

  const locationCounts = DST_LOCATIONS.map((loc) => ({
    location: loc,
    count: forLocationCounts.filter((a) => a.dstLocation === loc).length,
  }));
  const noLocationCount = forLocationCounts.filter((a) => !a.dstLocation).length;

  const sortedRows = useMemo(() => {
    if (!sortConfig.key) {
      return [...rows].sort((a, b) => lastNameOnly(a.athlete.name).localeCompare(lastNameOnly(b.athlete.name)));
    }
    const column = ROSTER_COLUMNS.find((c) => c.key === sortConfig.key);
    const sorted = [...rows].sort((a, b) => {
      const va = column.getValue(a);
      const vb = column.getValue(b);
      if (typeof va === "string" || typeof vb === "string") {
        return String(va).localeCompare(String(vb));
      }
      return (va ?? 0) - (vb ?? 0);
    });
    if (sortConfig.dir === "desc") sorted.reverse();
    return sorted;
  }, [rows, sortConfig]);

  const allVisibleSelected = sortedRows.length > 0 && sortedRows.every((r) => selectedIds.has(r.athlete.id));
  const toggleSelectAll = () => {
    setSelectedIds((prev) => {
      if (allVisibleSelected) {
        const next = new Set(prev);
        sortedRows.forEach((r) => next.delete(r.athlete.id));
        return next;
      }
      const next = new Set(prev);
      sortedRows.forEach((r) => next.add(r.athlete.id));
      return next;
    });
  };

  if (getRoster().length === 0) {
    return (
      <div>
        <AddAthleteForm onAdded={onDataChange} />
        <div className="panel">
          <div className="empty-state">
            No athletes on the roster yet. Sync a Google Sheet on the Player Plans page, import Hawkin Dynamics /
            Evolt360 data, or add someone above to get started.
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="kpi-row">
        <KpiCard
          label={locationFilter === "All" ? "Roster (filtered)" : `Roster (${locationFilter}) — click to show all`}
          value={kpiRows.length}
          active={locationFilter === "All"}
          onClick={() => setLocationFilter("All")}
        />
      </div>

      <div className="panel">
        <h2>Roster by Location <small>Click a location to filter the roster below</small></h2>
        <div className="location-kpi-row">
          {locationCounts.map(({ location, count }) => (
            <KpiCard
              key={location}
              label={location}
              value={count}
              active={locationFilter === location}
              onClick={() => setLocationFilter(locationFilter === location ? "All" : location)}
            />
          ))}
          {noLocationCount > 0 && <KpiCard label="No Location Set" value={noLocationCount} tone="warn" />}
          <KpiCard
            label={CUBS_LOCATION_LABEL}
            value={cubsCount}
            active={locationFilter === CUBS_LOCATION_LABEL}
            onClick={() => setLocationFilter(locationFilter === CUBS_LOCATION_LABEL ? "All" : CUBS_LOCATION_LABEL)}
          />
        </div>
      </div>

      {filterControls}

      <AddAthleteForm onAdded={onDataChange} />
      {selectedIds.size > 0 && (
        <BulkActionsBar
          selectedIds={selectedIds}
          roster={getRoster()}
          onApplied={() => { onDataChange(); clearSelection(); }}
          onClear={clearSelection}
        />
      )}
      <div className="panel">
        <h2>
          Athlete Status <small>Sorted A-Z by default &middot; click a column header to sort &middot; click a row for detail</small>
        </h2>
        {sortedRows.length ? (
          <table>
            <thead>
              <tr>
                <th>
                  <input type="checkbox" checked={allVisibleSelected} onChange={toggleSelectAll} />
                </th>
                {ROSTER_COLUMNS.slice(0, 2).map((col) => (
                  <SortableHeader key={col.key} column={col} sortConfig={sortConfig} onSort={handleSort} />
                ))}
                {locationFilter === CUBS_LOCATION_LABEL && <th>Off-Season Facility / Contact</th>}
                <th title="Latest force-plate test vs. the closest one from about a week earlier. Click to jump to Performance Metrics.">This Week</th>
                <th title="Any periodization block ending this week or that ended last week with nothing lined up">Program</th>
                <th title="Red: no assessment on file. Yellow: latest one is 3+ weeks old. Green: current. Click to jump to it.">Assessment</th>
                {ROSTER_COLUMNS.slice(2).map((col) => (
                  <SortableHeader
                    key={col.key}
                    column={locationFilter === CUBS_LOCATION_LABEL && col.key === "location" ? { ...col, label: "Location" } : col}
                    sortConfig={sortConfig}
                    onSort={handleSort}
                  />
                ))}
                <th></th>
              </tr>
            </thead>
            <tbody>
              {sortedRows.map(({ athlete }) => (
                <AthleteRow
                  key={athlete.id}
                  athlete={athlete}
                  onSelect={onSelect}
                  onOpenTab={onOpenTab}
                  onDataChange={onDataChange}
                  checked={selectedIds.has(athlete.id)}
                  onToggleCheck={() => toggleSelect(athlete.id)}
                  showFacility={locationFilter === CUBS_LOCATION_LABEL}
                />
              ))}
            </tbody>
          </table>
        ) : (
          <div className="empty-state">No athletes match the current filters.</div>
        )}
      </div>
    </div>
  );
}

// Shared definition of the "individual KPI trend" metrics requested for both the player
// profile and team report — one entry per metric, with how to pull its value off a raw
// Hawkin Dynamics force test record. Body Weight and mRSI are derived/renamed from the
// underlying systemWeight (N) and rsiModified fields respectively.
// Tests synced before jumpMomentum was stored as its own field still carry it in the raw Hawkin record.
function jumpMomentumOf(t) {
  if (typeof t.jumpMomentum === "number") return round2(t.jumpMomentum);
  const v = t.raw && t.raw["Jump Momentum(kg.m/s)"];
  return typeof v === "number" ? round2(v) : null;
}

// Hawkin reports this as a negative displacement (how far below standing height the dip went);
// shown here as a positive depth since that's the more natural read on a KPI trend chart ("how
// deep" rather than "how negative"). Falls back to the raw Hawkin record (in meters) for tests
// synced before countermovementDepth was stored as its own field, same as jumpMomentumOf above.
function countermovementDepthOf(t) {
  if (typeof t.countermovementDepth === "number") return Math.abs(round2(t.countermovementDepth));
  const v = t.raw && t.raw["Countermovement Depth(m)"];
  return typeof v === "number" ? Math.abs(round2(v * 39.3701)) : null;
}

const FORCE_KPI_METRICS = [
  { key: "bodyWeightLbs", label: "Body Weight", unit: "lbs", getValue: (t) => (typeof t.systemWeight === "number" ? round2(t.systemWeight / N_TO_LBF) : null) },
  { key: "jumpHeight", label: "Jump Height", unit: "in", getValue: (t) => (typeof t.jumpHeight === "number" ? t.jumpHeight : null) },
  { key: "jumpMomentum", label: "Jump Momentum", unit: "kg·m/s", getValue: jumpMomentumOf },
  { key: "peakPower", label: "Peak Power", unit: "W", getValue: (t) => (typeof t.peakPower === "number" ? t.peakPower : null) },
  { key: "countermovementDepth", label: "Countermovement Depth", unit: "in", getValue: countermovementDepthOf },
  { key: "relativePeakPower", label: "Relative Peak Power", unit: "W/kg", getValue: (t) => (typeof t.relativePeakPower === "number" ? t.relativePeakPower : null) },
  { key: "takeoffVelocity", label: "Takeoff Velocity", unit: "m/s", getValue: (t) => (typeof t.takeoffVelocity === "number" ? t.takeoffVelocity : null) },
  { key: "totalImpulse", label: "Propulsive Net Impulse", unit: "Ns", getValue: (t) => (typeof t.totalImpulse === "number" ? t.totalImpulse : null) },
  { key: "mRSI", label: "mRSI", unit: "", getValue: (t) => (typeof t.rsiModified === "number" ? t.rsiModified : null) },
];

// Roster-row ticker: body weight / jump height / relative peak power, latest force test vs. the
// closest one from roughly a week earlier. "Roughly" because testing isn't always on a strict
// weekly cadence — this walks back from the latest test to the first one at least 4 days earlier,
// rather than requiring exactly 7, so a slightly early or late session still counts as "last week"
// instead of the ticker just going blank. Two guards keep it from reaching past "recent", though:
// the latest test itself has to actually be from about this week (not an athlete's last test ever,
// however old), and the comparison test has to be from about last week too, not just however far
// back happens to be the next one on file — an athlete tested this week and then not again since
// February shouldn't show a "week over week" change spanning that whole gap.
const WEEK_TICKER_METRICS = ["bodyWeightLbs", "jumpHeight", "relativePeakPower"];
const WEEK_TICKER_MIN_GAP_DAYS = 4;
const WEEK_TICKER_MAX_GAP_DAYS = 10;
const WEEK_TICKER_MAX_RECENCY_DAYS = 10;

function weekOverWeekDelta(tests, metric) {
  const withValue = tests
    .map((t) => ({ t, v: metric.getValue(t) }))
    .filter((r) => typeof r.v === "number")
    .sort((a, b) => a.t.date.localeCompare(b.t.date));
  if (!withValue.length) return null;
  const latest = withValue[withValue.length - 1];
  const latestMs = new Date(`${latest.t.date}T00:00:00`).getTime();
  if ((Date.now() - latestMs) / 864e5 > WEEK_TICKER_MAX_RECENCY_DAYS) return null; // no test from this week — nothing to show
  let prev = null;
  for (let i = withValue.length - 2; i >= 0; i--) {
    const daysBack = (latestMs - new Date(`${withValue[i].t.date}T00:00:00`).getTime()) / 864e5;
    if (daysBack > WEEK_TICKER_MAX_GAP_DAYS) break; // everything from here back is even further away — give up
    if (daysBack >= WEEK_TICKER_MIN_GAP_DAYS) { prev = withValue[i]; break; }
  }
  if (!prev || !prev.v) return null;
  return { metric, latestVal: latest.v, latestDate: latest.t.date, prevVal: prev.v, prevDate: prev.t.date, delta: latest.v - prev.v };
}

// A plain left-click navigates within the app (no full reload); a modified click (ctrl/cmd/shift/
// middle button) is left alone so the browser's own "open in new tab" still works off the real href.
function handleAppLinkClick(e, onOpenTab) {
  e.stopPropagation();
  if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  onOpenTab();
}

function WeekOverWeekTicker({ athleteId, onOpenTab }) {
  const tests = window.AthleteStore.getForceTests(athleteId);
  const href = `?athlete=${athleteId}&tab=performance`;
  const entries = tests.length
    ? WEEK_TICKER_METRICS.map((key) => {
        const metric = FORCE_KPI_METRICS.find((m) => m.key === key);
        return { metric, change: weekOverWeekDelta(tests, metric) };
      }).filter((e) => e.change)
    : [];
  if (!entries.length) {
    return <a href={href} className="week-ticker-empty week-ticker-link" onClick={(e) => handleAppLinkClick(e, onOpenTab)} title="View Performance Metrics">—</a>;
  }
  return (
    <a href={href} className="week-ticker week-ticker-link" onClick={(e) => handleAppLinkClick(e, onOpenTab)}>
      {entries.map(({ metric, change }) => {
        const flat = Math.abs(change.delta) < 0.05;
        const dir = flat ? "flat" : change.delta > 0 ? "up" : "down";
        const arrow = flat ? "▬" : change.delta > 0 ? "▲" : "▼";
        const abbrev = metric.key === "bodyWeightLbs" ? "BW" : metric.key === "jumpHeight" ? "JH" : "RPP";
        const title = `${metric.label}: ${fmt2(change.latestVal)} ${metric.unit} on ${shortDate(change.latestDate)} vs ${fmt2(change.prevVal)} ${metric.unit} on ${shortDate(change.prevDate)}`;
        return (
          <span key={metric.key} className={`week-ticker-item week-ticker-${dir}`} title={title}>
            {abbrev} {arrow}{fmt2(Math.abs(change.delta))}
          </span>
        );
      })}
    </a>
  );
}

// Roster-row flag: is a training block (any lane — Strength, Running/Speed, Throwing, whatever the
// plan uses) ending this week or did one end last week with nothing picking it up. Only athletes
// with an actual saved periodization plan show anything here — most of the roster has none.
// Yellow: some block's last week is this week (line up what's next). Red: some block's last week
// was last week and nothing in that lane covers this week either (the athlete's plan has a gap
// right now). Green: an active plan, but no block boundary to flag — mid-block is the normal case.
function ProgramStatusBadge({ athleteId }) {
  const plan = window.AthleteStore.getPeriodization(athleteId);
  if (!plan || !window.PeriodizationLib) {
    return <span className="badge neutral" title="No periodization plan saved for this athlete">No Program</span>;
  }
  const progress = window.PeriodizationLib.planProgress(plan);
  if (progress.state === "upcoming") {
    return <span className="badge neutral" title={`Plan starts ${shortDate(plan.startDate)}`}>Upcoming</span>;
  }
  if (progress.state === "complete") {
    return <span className="badge neutral" title={`${plan.weeks}-week plan finished`}>Complete</span>;
  }
  const wk = progress.week - 1; // 0-based
  const endsThisWeek = plan.blocks.filter((b) => b.start + b.len - 1 === wk);
  const endedLastWeek = plan.blocks.filter((b) => b.start + b.len - 1 === wk - 1 && !plan.blocks.some((o) => o.lane === b.lane && o.start <= wk && wk < o.start + o.len));
  const laneName = (b) => (plan.lanes.find((l) => l.id === b.lane) || {}).name || "Program";
  if (endedLastWeek.length) {
    const title = `Ended last week with nothing scheduled this week: ${endedLastWeek.map((b) => `${laneName(b)} (${b.label || "untitled"})`).join(", ")}`;
    return <span className="badge danger" title={title}>Program gap</span>;
  }
  if (endsThisWeek.length) {
    const title = `Ending this week: ${endsThisWeek.map((b) => `${laneName(b)} (${b.label || "untitled"})`).join(", ")}`;
    return <span className="badge warn" title={title}>Ending this week</span>;
  }
  return <span className="badge good" title={`Week ${progress.week} of ${plan.weeks} — on track`}>On track</span>;
}

// Roster-row flag: whether a biomechanical assessment is on file and how current it is. All three
// states link to the athlete's most recent assessment (or the tab itself, if none exists yet).
// Red: nothing on file. Yellow: latest assessment is 3+ weeks old — assuming a roughly monthly
// cadence, the next one is coming up. Green: current, just a quick link to the one on file.
const ASSESSMENT_DUE_SOON_DAYS = 21;
function AssessmentDueBadge({ athleteId, onOpenTab }) {
  const assessments = window.AthleteStore.getAssessments(athleteId);
  const href = `?athlete=${athleteId}&tab=assessment`;
  const onClick = (e) => handleAppLinkClick(e, onOpenTab);
  if (!assessments.length) {
    return <a href={href} onClick={onClick} className="badge danger badge-link" title="No biomechanical assessment on file yet">Due for Assessment</a>;
  }
  const latest = assessments[assessments.length - 1];
  const daysSince = Math.floor((Date.now() - new Date(`${latest.date}T00:00:00`).getTime()) / 864e5);
  if (daysSince >= ASSESSMENT_DUE_SOON_DAYS) {
    return <a href={href} onClick={onClick} className="badge warn badge-link" title={`Last assessed ${shortDate(latest.date)} (${daysSince} days ago)`}>Due for Assessment Next Week</a>;
  }
  return <a href={href} onClick={onClick} className="badge good badge-link" title={`Last assessed ${shortDate(latest.date)} (${daysSince} days ago)`}>View Most Recent Assessment</a>;
}

// ---- Automated CMJ summary ----
// Rule-based (no AI): the latest values, the jump-height trend, and which other metrics are moving.
// A "trend" is the least-squares slope across the tests in the selected range, expressed as the
// estimated % change over that span; anything within +/-2% counts as holding steady.
const CMJ_STEADY_BAND_PCT = 2;

function cmjTrend(tests, metric) {
  const pts = tests
    .map((t) => ({ x: new Date(`${t.date}T00:00:00`).getTime() / 864e5, y: metric.getValue(t) }))
    .filter((p) => typeof p.y === "number");
  if (pts.length < 3) return null;
  const n = pts.length;
  const mx = pts.reduce((s, p) => s + p.x, 0) / n;
  const my = pts.reduce((s, p) => s + p.y, 0) / n;
  const sxx = pts.reduce((s, p) => s + (p.x - mx) ** 2, 0);
  if (!sxx || !my) return null;
  const slope = pts.reduce((s, p) => s + (p.x - mx) * (p.y - my), 0) / sxx;
  return { pct: ((slope * (pts[n - 1].x - pts[0].x)) / Math.abs(my)) * 100 };
}

function summarizeCmj(tests, athleteName) {
  if (!tests.length) return "";
  const who = (athleteName || "").trim().split(/\s+/)[0] || "The athlete";
  const metricOf = (key) => FORCE_KPI_METRICS.find((m) => m.key === key);
  const withUnit = (m, v) => `${fmt2(v)}${m.unit ? ` ${m.unit}` : ""}`;
  const signed = (pct) => `${pct > 0 ? "+" : pct < 0 ? "−" : ""}${Math.abs(pct).toFixed(1)}%`;
  const last = tests[tests.length - 1];
  const first = tests[0];

  // 1) latest test snapshot
  const snap = [["jumpHeight", "jump height"], ["mRSI", "mRSI"], ["peakPower", "peak power"]]
    .map(([key, label]) => { const m = metricOf(key); const v = m.getValue(last); return typeof v === "number" ? `${label} ${withUnit(m, v)}` : null; })
    .filter(Boolean);
  let s = `Latest test (${shortDate(last.date)})${snap.length ? `: ${snap.join(", ")}` : ""}.`;
  const jumpM = metricOf("jumpHeight");
  const jumps = tests.map((t) => jumpM.getValue(t)).filter((v) => typeof v === "number");
  if (jumps.length > 1 && typeof jumpM.getValue(last) === "number") {
    const best = Math.max(...jumps);
    if (jumpM.getValue(last) < best) s += ` The best jump in this range is ${withUnit(jumpM, best)}.`;
    else s += " That is the best jump in this range.";
  }

  // 2) trends
  if (tests.length < 3) {
    return `${s} Only ${tests.length} test${tests.length === 1 ? "" : "s"} in this range — at least 3 are needed to show a trend.`;
  }
  const span = `${tests.length} tests, ${shortDate(first.date)} – ${shortDate(last.date)}`;
  const jt = cmjTrend(tests, jumpM);
  if (jt) {
    const dir = Math.abs(jt.pct) < CMJ_STEADY_BAND_PCT ? "holding steady" : jt.pct > 0 ? `trending up (${signed(jt.pct)})` : `trending down (${signed(jt.pct)})`;
    s += ` Across ${span}, jump height is ${dir}.`;
  } else {
    s += ` Across ${span}.`;
  }
  const up = [], down = [], steady = [];
  FORCE_KPI_METRICS.filter((m) => m.key !== "jumpHeight").forEach((m) => {
    const t = cmjTrend(tests, m);
    if (!t) return;
    const name = m.key === "mRSI" ? "mRSI" : m.label.toLowerCase();
    if (Math.abs(t.pct) < CMJ_STEADY_BAND_PCT) steady.push(name);
    else if (t.pct > 0) up.push(`${name} (${signed(t.pct)})`);
    else down.push(`${name} (${signed(t.pct)})`);
  });
  const parts = [];
  if (up.length) parts.push(`up: ${up.join(", ")}`);
  if (down.length) parts.push(`down: ${down.join(", ")}`);
  if (steady.length) parts.push(`steady: ${steady.join(", ")}`);
  if (parts.length) s += ` Other metrics — ${parts.join("; ")}.`;
  return s;
}

function CmjSummary({ tests, athleteId }) {
  const athlete = getRoster().find((a) => a.id === athleteId);
  const text = summarizeCmj(tests, athlete && athlete.name);
  if (!text) return null;
  return <p className="auto-caption"><strong>Summary:</strong> {text}</p>;
}

function MiniTrendChart({ title, unit, data, dataKey, color, showTrend = true, showCounts = false, yearLines }) {
  const { grid, axis } = useChartColors();
  const theme = useTheme();
  const hasData = data.some((d) => typeof d[dataKey] === "number");
  const withValue = data.filter((d) => typeof d[dataKey] === "number").length;
  const trend = showTrend ? computeLinearTrend(data, dataKey) : null;
  const chartData = data.map((d, i) => ({ ...d, __trend: trend ? trend[i] : null }));
  const domain = paddedDomain(chartData, showTrend ? [dataKey, "__trend"] : [dataKey]);
  // `date` is a numeric timestamp (see ForcePlatePanel/AthletePerformanceGraphs) so ticks land at
  // real time intervals instead of Recharts spacing out arbitrary category strings, and a
  // <ReferenceLine> at a real timestamp always lands correctly regardless of which ticks are drawn.
  const showYear = spansMultipleYears(data.map((d) => d.date));
  const axisProps = { dataKey: "date", type: "number", domain: ["dataMin", "dataMax"], scale: "time", tickFormatter: (ts) => axisDateLabel(ts, showYear) };
  return (
    <div className="panel">

// ---- Positional CMJ profile: Hawkin + VALD MLB norms -------------------------------------------
const BAND_COLORS = { Elite: "#16a34a", Good: "#4ade80", Average: "#9ca3af", Below: "#f59e0b", Poor: "#ef4444" };
const NORM_ZONES = [
  { from: 0, to: 27.5, color: "#5b1a1a" },
  { from: 27.5, to: 47.5, color: "#5a4210" },
  { from: 47.5, to: 52.5, color: "#3a3a3a" },
  { from: 52.5, to: 77.5, color: "#1f4a2c" },
  { from: 77.5, to: 100, color: "#14532d" },
];

function pctLabel(p) {
  if (p === null || p === undefined) return "—";
  if (p < 5) return "<5th";
  if (p >= 99) return "99th+";
  return ordinal(Math.round(p));
}

function NormBar({ pct, zoned, title }) {
  if (pct === null || pct === undefined) return <div className="norm-bar-empty">no norm</div>;
  const b = window.CmjNorms.band(pct);
  return (
    <div className="norm-bar-wrap" title={title}>
      <div className="norm-bar">
        {zoned
          ? NORM_ZONES.map((z) => <div key={z.from} className="norm-zone" style={{ left: `${z.from}%`, width: `${z.to - z.from}%`, background: z.color }} />)
          : <div className="norm-zone" style={{ left: 0, width: `${pct}%`, background: "#1e3a5f" }} />}
        {[25, 50, 75].map((t) => <div key={t} className="norm-tick" style={{ left: `${t}%` }} />)}
        <div className="norm-marker" style={{ left: `${Math.max(1, Math.min(99, pct))}%`, background: BAND_COLORS[b] }} />
      </div>
      <span className="norm-pct" style={{ color: BAND_COLORS[b] }}>{pctLabel(pct)}</span>
    </div>
  );
}

// Hawkin and VALD are two different MLB samples scored two different ways — averaging them into one
// number would imply an agreement/precision that isn't really there. Showing the span between the two
// is the more honest read, so jump height and relative peak power (the two metrics requested) render
// as a range instead of collapsing to a point.
function NormRangeBar({ lo, hi, title }) {
  if (lo === null || hi === null) return <div className="norm-bar-empty">no norm</div>;
  const loB = window.CmjNorms.band(lo), hiB = window.CmjNorms.band(hi);
  const left = Math.max(1, Math.min(99, lo)), right = Math.max(1, Math.min(99, hi));
  return (
    <div className="norm-bar-wrap" title={title}>
      <div className="norm-bar">
        {NORM_ZONES.map((z) => <div key={z.from} className="norm-zone" style={{ left: `${z.from}%`, width: `${z.to - z.from}%`, background: z.color }} />)}
        {[25, 50, 75].map((t) => <div key={t} className="norm-tick" style={{ left: `${t}%` }} />)}
        <div className="norm-range-band" style={{ left: `${left}%`, width: `${Math.max(2, right - left)}%` }} />
        <div className="norm-marker norm-marker-sm" style={{ left: `${left}%`, background: BAND_COLORS[loB] }} />
        <div className="norm-marker norm-marker-sm" style={{ left: `${right}%`, background: BAND_COLORS[hiB] }} />
      </div>
      <span className="norm-pct">{pctLabel(lo)}–{pctLabel(hi)}</span>
    </div>
  );
}

// Jump height and relative peak power: show the Hawkin/VALD span when both exist, otherwise whichever
// one does. mRSI: Hawkin only, even though VALD also publishes it — picking one keeps that metric
// simple since it's the "speed of movement" figure the recommendations are built on. Everything else
// only ever has one source to begin with.
const NORM_RANGE_METRICS = new Set(["jumpHeight", "peakRelPropPower"]);
function combinedPercentile(r) {
  if (NORM_RANGE_METRICS.has(r.key) && r.hawkinPct !== null && r.valdPct !== null) {
    return { type: "range", lo: Math.min(r.hawkinPct, r.valdPct), hi: Math.max(r.hawkinPct, r.valdPct) };
  }
  if (r.key === "mRSI") return { type: "point", pct: r.hawkinPct, title: "Hawkin MLB norm" };
  if (r.hawkinPct !== null) return { type: "point", pct: r.hawkinPct, title: "Hawkin MLB norm" };
  return { type: "point", pct: r.valdPct, title: "VALD MLB norm" };
}
const hasNorm = (c) => (c.type === "range" ? c.lo != null && c.hi != null : c.pct != null);

function formatProfileValue(r) {
  if (r.value === null) return "—";
  const v = r.displayValue.toFixed(r.decimals);
  const extra = r.key === "jumpHeight" ? ` (${(r.value * 100).toFixed(1)} cm)` : "";
  return `${v}${r.unit ? " " + r.unit : ""}${extra}`;
}

const PROFILE_TONE = { good: "var(--good)", warn: "var(--warn)", info: "var(--info)" };

// Offseason percentile history for one metric, in the {year, value} shape TrendSpark already expects
// (same component used for the Percentile Rankings trend) — "year" here is an offseason label like
// '24-'25 rather than a calendar year, but TrendSpark only ever treats it as a point label.
function offseasonSpark(trendPoints, key) {
  if (!trendPoints) return null;
  return trendPoints.map((p) => ({ year: p.offseason, value: p[key] }));
}

function PositionalProfilePanel({ athlete, planView = false, compact = false }) {
  const N = window.CmjNorms;
  const [groupKey, setGroupKey] = useState(() => (N ? N.defaultGroupFor(athlete.position) : "allPosition"));
  const theme = useTheme();
  if (!N) return null;
  const chartLineColor = isCubsOnlyAthlete(athlete) ? CUBS_CHART_COLOR : DST_CHART_COLOR;
  const tests = window.AthleteStore.getForceTests(athlete.id);
  const profile = N.buildProfile(tests, groupKey);
  if (!profile) {
    return (
      <div className="panel">
        <h2>Positional CMJ Profile <small>Hawkin &amp; VALD MLB norms</small></h2>
        <div className="empty-state">No hands-on-hips countermovement jumps on file — the MLB norms only apply to that test.</div>
      </div>
    );
  }
  const recs = N.recommendations(profile, { name: athlete.name });
  // Short enough that the outward-pointing labels on the left/right points of the radar don't run
  // past the edge of the chart and get clipped.
  const radarLabel = { peakRelPropPower: "Rel. Power", propulsiveNetImpulse: "Prop. Impulse", brakingNetImpulse: "Braking Impulse", jumpMomentum: "Jump Mom." };
  const radarData = profile.rows.filter((r) => r.hawkinPct !== null).map((r) => ({ metric: radarLabel[r.key] || r.label, pct: Math.round(r.hawkinPct), median: 50 }));
  const bodyMassRow = profile.rows.find((r) => r.key === "bodyMassKg");
  const hawkinRows = profile.rows.filter((r) => r.hawkin && hasNorm(combinedPercentile(r)));
  const range = profile.firstDate === profile.lastDate ? shortDate(profile.lastDate) : `${shortDate(profile.firstDate)} – ${shortDate(profile.lastDate)}`;
  const trendPoints = N.offseasonTrend(tests, groupKey);

  return (
    <div className={compact ? "cmj-mini" : "panel"}>
      <h2>
        Positional CMJ Profile{" "}
        <small>

      </h2>
      <div className="profile-controls no-print">
        <label>
          Compare against{" "}
          <select value={groupKey} onChange={(e) => setGroupKey(e.target.value)}>

          </select>
        </label>
        <span className="timestamp-note">
          Hawkin MLB: {profile.groupLabel} · VALD 2025 MLB: {profile.valdGroupLabel || "no matching group"}
        </span>
      </div>

      <div className="profile-layout" style={planView ? { gridTemplateColumns: "1fr" } : undefined}>
        {!planView && (
          <div className="profile-radar">
            <ResponsiveContainer width="100%" height={320}>
              <RadarChart data={radarData} outerRadius="58%" margin={{ top: 16, right: 36, bottom: 16, left: 36 }}>
                <PolarGrid stroke={theme === "light" ? "#dddddd" : "#2e2e2e"} />
                <PolarAngleAxis dataKey="metric" tick={{ fill: theme === "light" ? "#444" : "#bbb", fontSize: 10 }} />
                <PolarRadiusAxis domain={[0, 100]} tickCount={5} tick={{ fill: theme === "light" ? "#777" : "#666", fontSize: 9 }} axisLine={false} />
                <Radar name="MLB median" dataKey="median" stroke="#6b7280" strokeDasharray="4 3" fill="none" isAnimationActive={false} />
                <Radar name="Percentile" dataKey="pct" stroke={chartLineColor} fill={chartLineColor} fillOpacity={0.35} isAnimationActive={false} />
                <Tooltip contentStyle={theme === "light" ? { background: "#ffffff", border: "1px solid #c7cbd1", color: "#1a1a1a" } : { background: "#141414", border: "1px solid #3a3a3a" }} formatter={(v, n) => [n === "Percentile" ? ordinal(v) : "50th", n]} />
              </RadarChart>
            </ResponsiveContainer>
            <p className="timestamp-note" style={{ textAlign: "center" }}>Hawkin MLB percentile by metric · dashed ring = MLB median</p>
          </div>
        )}

        <div className="profile-table">
          <div className="profile-row profile-head">
            <span>Metric</span><span>Athlete</span><span>MLB Percentile</span>
            <span>
              Offseason Trend
              {trendPoints && <small> {trendPoints[0].offseason}{trendPoints.length > 1 ? `–${trendPoints[trendPoints.length - 1].offseason}` : ""}</small>}
            </span>
          </div>
          {bodyMassRow && bodyMassRow.value !== null && hasNorm(combinedPercentile(bodyMassRow)) && (() => {
            const c = combinedPercentile(bodyMassRow);
            const spark = offseasonSpark(trendPoints, "bodyMassKg");
            return (
              <div className="profile-row">
                <span className="profile-metric" title="Context, not a performance output — shown first since it shapes how to read every other row.">{bodyMassRow.label}</span>
                <span className="profile-value">{formatProfileValue(bodyMassRow)}</span>

                {spark ? <TrendSpark points={spark} width={56} height={24} domain={[0, 100]} describe={describePercentilePoint} /> : <span />}
              </div>
            );
          })()}
          {hawkinRows.map((r) => {
            const c = combinedPercentile(r);
            const spark = offseasonSpark(trendPoints, r.key);
            return (
              <div key={r.key} className="profile-row">
                <span className="profile-metric">{r.label}{r.lowerIsBetter ? <em> (lower is better)</em> : null}</span>
                <span className="profile-value">{formatProfileValue(r)}</span>
                {c.type === "range"
                  ? <NormRangeBar lo={c.lo} hi={c.hi} title={`Hawkin: ${pctLabel(r.hawkinPct)} · VALD: ${pctLabel(r.valdPct)}`} />
                  : <NormBar pct={c.pct} title={c.title} zoned />}
                {spark ? <TrendSpark points={spark} width={56} height={24} domain={[0, 100]} describe={describePercentilePoint} /> : <span />}
              </div>
            );
          })}
          {!compact && (
            <div className="profile-legend">
              {Object.entries(BAND_COLORS).map(([k, c]) => <span key={k}><i style={{ background: c }} />{k}</span>)}
              <span className="timestamp-note">Jump Height and Relative Peak Power show the Hawkin–VALD span when both have a norm, rather than averaging two differently-built MLB samples into one number.</span>
            </div>
          )}
          {!compact && trendPoints && (
            <p className="timestamp-note">
              Offseason trend: one point per Sep 1 – May 31 offseason (in-season Jun–Aug CMJs aren't included), scored against
              the same {profile.groupLabel} norms as the bar — only as far back as this athlete has tracked data. A gap means no
              CMJ that offseason, not zero.
            </p>
          )}
        </div>
      </div>

      {!planView && (
        <React.Fragment>
          <h2 style={{ marginTop: 18 }}>Profile Summary &amp; Recommendations</h2>
          <ul className="profile-recs">
            {recs.map((r, i) => <li key={i} style={{ borderLeftColor: PROFILE_TONE[r.tone] }}>{r.text}</li>)}
          </ul>
          <p className="timestamp-note">
            Norms: Hawkin Dynamics MLB normative data (CMJ hands on hips) and VALD's 2025 MLB ForceDecks report. Profile averages every
            hands-on-hips CMJ in the {N.PROFILE_WINDOW_DAYS} days up to the latest one{profile.excludedVariants ? `; ${profile.excludedVariants} arm-swing/weighted/other CMJ variants are left out` : ""}.
          </p>
        </React.Fragment>
      )}
    </div>
  );
}

// A small "signature" line — who created/last touched this record and when — fed by the
// created_by/updated_by columns Supabase stamps server-side (see supabase/migration_002_activity_tracking.sql).
// Renders nothing for records saved before that migration ran (no _activity) or fully offline.
function ActivitySignature({ activity, className }) {
  if (!activity || (!activity.createdBy && !activity.updatedBy)) return null;
  const fmt = (iso) => (iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "");
  const parts = [];
  if (activity.createdBy) parts.push(`Created by ${activity.createdBy}${activity.createdAt ? ` on ${fmt(activity.createdAt)}` : ""}`);
  if (activity.updatedBy && activity.updatedAt !== activity.createdAt) {
    parts.push(`Last updated by ${activity.updatedBy}${activity.updatedAt ? ` on ${fmt(activity.updatedAt)}` : ""}`);
  }
  return <div className={`activity-signature no-print ${className || ""}`}>{parts.join(" · ")}</div>;
}
