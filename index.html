function TeamReportPage({ onSelect, dataVersion, onEditPeriodization }) {
  const roster = getRoster().filter((a) => (a.status || "active").toLowerCase() === "active");
  // Every known league is always selectable; any custom league already on the roster is added after them.
  const leagues = useMemo(() => {
    const extra = [...new Set(roster.map((a) => a.league).filter(Boolean))].filter((l) => !LEAGUES.includes(l)).sort();
    return [...LEAGUES, ...extra];
    // eslint-disable-next-line
  }, [dataVersion]);

  const [selectedLeague, setSelectedLeague] = useState("");
  const [selectedTeam, setSelectedTeam] = useState("");
  React.useEffect(() => { window.scrollTo(0, 0); }, [selectedTeam]);
  const [perfRange, setPerfRange] = useState("all"); // date range for each athlete's performance graphs

  const teamsInLeague = useMemo(() => {
    if (!selectedLeague) return [];
    // Start with every team in the league (so teams with nobody rostered still get a tile),
    // then add rostered athletes — including teams typed in by hand that aren't in the list.
    const byTeam = new Map();
    (LEAGUE_TEAMS[selectedLeague] || []).forEach((team) => byTeam.set(team, []));
    roster.forEach((a) => {
      if (a.league !== selectedLeague || !a.team) return;
      if (!byTeam.has(a.team)) byTeam.set(a.team, []);
      byTeam.get(a.team).push(a);
    });
    return Array.from(byTeam.entries())
      .map(([team, athletes]) => ({ team, athletes }))
      .sort((a, b) => a.team.localeCompare(b.team));
    // eslint-disable-next-line
  }, [selectedLeague, dataVersion]);

  const teamAthletes = selectedTeam ? roster.filter((a) => a.team === selectedTeam) : [];

  const rows = useMemo(() => {
    return teamAthletes.map((a) => ({ athlete: a }));
    // eslint-disable-next-line
  }, [selectedTeam, dataVersion]);

  const activeCount = rows.filter((r) => (r.athlete.status || "active").toLowerCase() === "active").length;

  // ---- printing: one athlete sheet per portrait Letter page ----
  // Each sheet keeps its on-screen width, is measured, and is scaled down (never up) so the whole
  // sheet fits one page; a page break follows every sheet. Cleaned up again after printing.
  const sheetPrint = React.useRef(null);
  const prepareSheets = () => {
    if (sheetPrint.current) return;
    const sheets = [...document.querySelectorAll(".report-sheet")].filter((s) => s.offsetParent !== null);
    if (!sheets.length) return;
    const PAGE_W = 725; // printable area of a Letter portrait page (0.35in margins), in CSS px, with headroom
    const PAGE_H = 925;
    sheets.forEach((s) => {
      const w = s.offsetWidth;
      s.style.zoom = "";
      s.style.width = `${w}px`;
      s.classList.add("measuring"); // hides screen-only controls so we measure what will print
      const h = s.scrollHeight;
      s.classList.remove("measuring");
      s.style.zoom = String(Math.min(1, PAGE_W / w, PAGE_H / h));
    });
    const pageStyle = document.createElement("style");
    pageStyle.textContent = "@page { size: letter portrait; margin: 0.35in; }";
    document.head.appendChild(pageStyle);
    document.body.classList.add("print-team-sheets");
    sheetPrint.current = { sheets, pageStyle };
  };
  const cleanupSheets = () => {
    const s = sheetPrint.current;
    if (!s) return;
    sheetPrint.current = null;
    document.body.classList.remove("print-team-sheets");
    if (s.pageStyle.parentNode) s.pageStyle.parentNode.removeChild(s.pageStyle);
    s.sheets.forEach((el) => { el.style.zoom = ""; el.style.width = ""; });
  };
  const printTeamReport = () => { prepareSheets(); window.print(); };

  React.useEffect(() => {
    if (!selectedTeam) return undefined;
    window.addEventListener("beforeprint", prepareSheets); // also covers Ctrl+P
    window.addEventListener("afterprint", cleanupSheets);
    return () => {
      window.removeEventListener("beforeprint", prepareSheets);
      window.removeEventListener("afterprint", cleanupSheets);
      cleanupSheets();
    };
    // eslint-disable-next-line
  }, [selectedTeam]);

  return (
    <div>
      {!selectedLeague && (
        <div className="panel no-print">
          <h2>Team Reports <small>Select a league</small></h2>
          <div className="team-select-grid">
            {leagues.map((league) => {
              const count = roster.filter((a) => a.league === league).length;
              const logo = LEAGUE_LOGOS[league];
              return (
                <button key={league} className="team-select-btn league-select-btn" onClick={() => { setSelectedLeague(league); setSelectedTeam(""); }}>
                  {logo ? (
                    <img src={logo} alt={league} className="league-tile-logo" />
                  ) : (
                    <div className="league-tile-word">{league}</div>
                  )}
                  {logo && <div className="team-select-name">{league}</div>}
                  <div className="team-select-count">{count}</div>
                  <div className="team-select-names">athlete{count === 1 ? "" : "s"}</div>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {selectedLeague && !selectedTeam && (
        <div className="panel">
          <button className="btn-link no-print" onClick={() => setSelectedLeague("")}>&larr; All leagues</button>
          <h2>{selectedLeague} Teams</h2>
          {teamsInLeague.length ? (
            <div className="team-select-grid">
              {teamsInLeague.map(({ team, athletes }) => (
                <button key={team} className={`team-select-btn ${athletes.length === 0 ? "team-select-empty" : ""}`} onClick={() => setSelectedTeam(team)}>
                  <TeamLogo team={team} size={TEAM_TILE_LOGO_SIZE} />
                  <div className="team-select-name">{team}</div>
                  <div className="team-select-count">{athletes.length}</div>
                  <div className="team-select-names">
                    {athletes.map((a) => <div key={a.id}>{lastFirstName(a.name)}</div>)}
                  </div>
                </button>
              ))}
            </div>
          ) : (
            <div className="empty-state">No teams in {selectedLeague} yet — set a Team on an athlete's roster entry to add one.</div>
          )}
        </div>
      )}

      {selectedTeam && (
        <div>
          <div className="report-header no-print">
            <TeamLogo team={selectedTeam} />
            <div>
              <button className="btn-link no-print" onClick={() => setSelectedTeam("")}>&larr; Back to {selectedLeague} teams</button>
              <h1 className="report-title">{selectedTeam}</h1>
              <div className="report-subtitle">
                {rows.length} player{rows.length === 1 ? "" : "s"} monitored &middot; one sheet per athlete &middot; generated {new Date().toLocaleDateString()}
              </div>
            </div>
            <div className="no-print" style={{ marginLeft: "auto", display: "flex", gap: 10 }}>
              <button className="btn btn-secondary" onClick={printTeamReport} title="Prints one page per athlete">
                Print / Save PDF
              </button>
              <EmailTeamReportButton
                team={selectedTeam}
                defaultRecipients={
                  window.MLB_TEAM_CONTACTS && window.MLB_TEAM_CONTACTS[selectedTeam]
                    ? window.MLB_TEAM_CONTACTS[selectedTeam].contacts.flatMap((c) => c.e).join(", ")
                    : ""
                }
              />
            </div>
          </div>

          <div className="kpi-row no-print">
            <KpiCard label="Players" value={rows.length} />
            <KpiCard label="Active" value={activeCount} />
          </div>

          {selectedLeague === "MLB" && <TeamContactsPanel team={selectedTeam} />}

          <h2 className="no-print" style={{ marginBottom: 14 }}>Players <small style={{ color: "var(--text-dim)", fontSize: 12 }}>One sheet per athlete &middot; click a name to open their profile</small></h2>
          <RangeSelector range={perfRange} onChange={setPerfRange} />
          {rows.length ? (
            rows.map(({ athlete }) => {
              const plan = window.AthleteStore.getPeriodization(athlete.id);
              const hasPlan = !!plan && plan.blocks.length > 0;
              const rangeText = rangeLabel(perfRange);
              return (
                <div className={`report-sheet${isCubsOnlyAthlete(athlete) ? " cubs-theme" : ""}`} key={athlete.id}>
                  {window.PlanSheetHeader && (
                    <window.PlanSheetHeader
                      athlete={athlete}
                      title="Player Report"
                      subtitle={`${selectedTeam} · generated ${new Date().toLocaleDateString()}`}
                      onOpen={() => onSelect(athlete.id)}
                    />
                  )}

                  <div className="panel report-section">
                    <h2>
                      Periodization
                      <button className="btn-link no-print" style={{ marginLeft: 12 }} onClick={() => onEditPeriodization(athlete.id)}>
                        {hasPlan ? "Edit plan" : "Build plan"} &rarr;
                      </button>
                    </h2>
                    {hasPlan && window.PeriodizationView
                      ? <window.PeriodizationView athleteId={athlete.id} bare showGoals={false} />
                      : <div className="empty-state">No periodization saved for this athlete yet.</div>}
                  </div>

                  <div className="panel report-section">
                    <h2>Performance Metrics <small>{rangeText}</small></h2>
                    <AthletePerformanceGraphs athleteId={athlete.id} range={perfRange} />
                  </div>

                  <div className="panel report-section">
                    <NotesPanel athleteId={athlete.id} embedded />
                  </div>
                </div>
              );
            })
          ) : (
            <div className="panel"><div className="empty-state">No athletes on {selectedTeam} yet.</div></div>
          )}
        </div>
      )}
    </div>
  );
}

// Reuses an MLBAM id already captured in photoUrl (from the mlbstatic.com headshot CDN
// pattern) when no explicit id has been set, so athletes already photo-matched don't
// need a second manual lookup.
function extractMlbamId(athlete) {
  if (athlete.mlbamId) return String(athlete.mlbamId).trim();
  const m = /\/people\/(\d+)\//.exec(athlete.photoUrl || "");
  return m ? m[1] : null;
}

async function fetchSavantText(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.text();
}

async function fetchSavantCsv(url) {
  const text = await fetchSavantText(url);
  const parsed = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
  return parsed.data;
}

// Same as fetchSavantCsv but swallows failures (rate limits, dropped connections, etc.) and
// returns an empty result instead of throwing — used anywhere we fire off many requests, so
// one bad request doesn't wipe out an entire refresh that would otherwise have succeeded.
async function fetchSavantCsvSafe(url) {
  try {
    return await fetchSavantCsv(url);
  } catch (e) {
    console.warn("Savant fetch failed, skipping:", url, e);
    return [];
  }
}

function findByPlayerId(rows, idKey, id) {
  return rows.find((r) => String(r[idKey] || "").trim() === String(id));
}

// Raw pitch-level export (not a pre-aggregated leaderboard) so we can derive both the
// average AND peak fastball velocity for a given season from one source.
async function fetchFastballVelocityForYear(mlbamId, yr) {
  const url =
    `https://baseballsavant.mlb.com/statcast_search/csv?all=true&hfPT=FF%7C&hfSea=${yr}%7C&player_type=pitcher` +
    `&pitchers_lookup%5B%5D=${mlbamId}&min_pitches=0&min_results=0&group_by=name&sort_col=pitches` +
    `&player_event_sort=api_p_release_speed&sort_order=desc&min_abs=0&type=details`;
  const rows = await fetchSavantCsvSafe(url);
  const speeds = rows.map((r) => Number(r.release_speed)).filter((v) => !isNaN(v) && v > 0);
  if (!speeds.length) return { avg: null, peak: null };
  return {
    avg: round2(speeds.reduce((s, v) => s + v, 0) / speeds.length),
    peak: round2(Math.max(...speeds)),
  };
}

async function fetchSprintSpeedForYear(mlbamId, yr) {
  const rows = await fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/sprint_speed?year=${yr}&position=&team=&min=0&csv=true`);
  const row = findByPlayerId(rows, "player_id", mlbamId);
  return row && row.sprint_speed ? round2(Number(row.sprint_speed)) : null;
}

// Raw batted-ball export (same pitch-level search endpoint, queried as a batter) so we can
// derive both average and peak exit velocity for a season, same approach as fastball velo.
async function fetchExitVelocityForYear(mlbamId, yr) {
  const url =
    `https://baseballsavant.mlb.com/statcast_search/csv?all=true&hfSea=${yr}%7C&player_type=batter` +
    `&batters_lookup%5B%5D=${mlbamId}&min_pitches=0&min_results=0&group_by=name&sort_col=pitches` +
    `&player_event_sort=api_p_release_speed&sort_order=desc&min_abs=0&type=details`;
  const rows = await fetchSavantCsvSafe(url);
  const speeds = rows.map((r) => Number(r.launch_speed)).filter((v) => !isNaN(v) && v > 0);
  if (!speeds.length) return { avg: null, peak: null };
  return {
    avg: round2(speeds.reduce((s, v) => s + v, 0) / speeds.length),
    peak: round2(Math.max(...speeds)),
  };
}

// Savant's leaderboards silently default to fastball-only unless a pitch type is explicitly
// requested (an empty/omitted pitch_type param does NOT mean "all types") — so a full arsenal
// requires one request per type, per endpoint.
const PITCH_TYPE_CODES = ["FF", "SI", "FC", "SL", "ST", "SV", "CU", "KC", "CH", "FS", "FO", "KN", "EP", "SC"];

// Combines the pitch-movement leaderboard (shape: velo, induced vertical break, horizontal
// break, usage%) with the pitch-arsenal-stats leaderboard (results: whiff%, hard-hit%, run
// value) into one row per pitch type actually thrown — current season only.
// Fetches in small batches (not all 14 types x 2 endpoints at once) and uses the "safe" fetch
// wrapper, so a single rate-limited/dropped request only drops that one pitch type instead of
// failing the whole arsenal (and taking the rest of the refresh down with it).
async function fetchPitchArsenal(mlbamId, yr) {
  const BATCH_SIZE = 3;
  const perType = [];
  for (let i = 0; i < PITCH_TYPE_CODES.length; i += BATCH_SIZE) {
    const batch = PITCH_TYPE_CODES.slice(i, i + BATCH_SIZE);
    const batchResults = await Promise.all(
      batch.map(async (code) => {
        const [movementRows, statsRows] = await Promise.all([
          fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/pitch-movement?year=${yr}&team=&min=1&pitch_type=${code}&pitcherHand=&csv=true`),
          fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/pitch-arsenal-stats?type=pitcher&pitchType=${code}&year=${yr}&min=1&csv=true`),
        ]);
        const moveRow = findByPlayerId(movementRows, "pitcher_id", mlbamId);
        const statRow = findByPlayerId(statsRows, "player_id", mlbamId);
        if (!moveRow && !statRow) return null;
        return {
          pitchType: code,
          pitchName: (moveRow && moveRow.pitch_type_name) || (statRow && statRow.pitch_name) || code,
          usagePct: moveRow && moveRow.pitch_per ? Number(moveRow.pitch_per) : statRow && statRow.pitch_usage ? Number(statRow.pitch_usage) : null,
          avgVelo: moveRow && moveRow.avg_speed ? Number(moveRow.avg_speed) : null,
          inducedVertBreak: moveRow && moveRow.pitcher_break_z_induced ? Number(moveRow.pitcher_break_z_induced) : null,
          horizBreak: moveRow && moveRow.pitcher_break_x ? Number(moveRow.pitcher_break_x) : null,
          whiffPct: statRow && statRow.whiff_percent ? Number(statRow.whiff_percent) : null,
          hardHitPct: statRow && statRow.hard_hit_percent ? Number(statRow.hard_hit_percent) : null,
          runValuePer100: statRow && statRow.run_value_per_100 ? Number(statRow.run_value_per_100) : null,
        };
      })
    );
    perType.push(...batchResults);
  }
  return perType.filter(Boolean).sort((a, b) => (b.usagePct || 0) - (a.usagePct || 0));
}

// Savant's own percentile-rankings leaderboard already does the work of converting raw stats
// into 0-100 percentiles against that season's qualified players (2.1 PA/team game for batters,
// 1.25 PA/team game for pitchers) — every column is oriented so 100 is always "best", including
// ones where a lower raw number is actually better (K%, Whiff%, Chase%, xERA), so no column needs

// bot challenge that blocks automated fetches (and shouldn't be bypassed), so this covers Savant
// only — which is also the only one of the two with a public, pre-computed percentile product.
const PERCENTILE_METRIC_GROUPS = {

    { group: "Offense", metrics: [
      { key: "xwoba", label: "xwOBA" },
      { key: "xba", label: "xBA" },
      { key: "xslg", label: "xSLG" },

      { key: "max_ev", label: "Max Exit Velo" },

      { key: "k_percent", label: "Strikeout %" },
      { key: "bb_percent", label: "Walk %" },
      { key: "whiff_percent", label: "Whiff %" },
      { key: "chase_percent", label: "Chase %" },

    ] },

    ] },

  pitcher: [
    { group: "Pitching", metrics: [

      { key: "xwoba", label: "xwOBA Against" },
      { key: "xba", label: "xBA Against" },
      { key: "xslg", label: "xSLG Against" },
      { key: "xiso", label: "xISO Against" },
      { key: "xobp", label: "xOBP Against" },
      { key: "brl_percent", label: "Barrel % Against" },
      { key: "exit_velocity", label: "Exit Velo Against" },
      { key: "hard_hit_percent", label: "Hard-Hit % Against" },
      { key: "k_percent", label: "Strikeout %" },
      { key: "bb_percent", label: "Walk %" },
      { key: "whiff_percent", label: "Whiff %" },
      { key: "chase_percent", label: "Chase %" },
      { key: "fb_velocity", label: "Fastball Velocity" },
      { key: "fb_spin", label: "Fastball Spin" },

async function fetchPercentileRow(mlbamId, isPitcher, yr) {
  const rows = await fetchSavantCsvSafe(
    `https://baseballsavant.mlb.com/leaderboard/percentile-rankings?type=${isPitcher ? "pitcher" : "batter"}&year=${yr}&team=&csv=true`
  );
  return findByPlayerId(rows, "player_id", mlbamId) || null;
}

// Matches Savant's own percentile-chart palette: a diverging blue -> pale grey -> red scale keyed
// purely to the number itself (not to whether high or low is "good" for that stat) — blue at 0,
// white-grey at 50, red at 100. Every column in PERCENTILE_METRIC_GROUPS is already oriented so
// 100 = best, so "red" always lines up with the GREAT end of the legend below.
function percentileColor(pct) {
  const p = Math.max(0, Math.min(100, pct));
  const stops = p <= 50
    ? [[37, 99, 201], [228, 230, 233], p / 50]
    : [[228, 230, 233], [196, 46, 46], (p - 50) / 50];
  const [from, to, t] = stops;
  const mix = (i) => Math.round(from[i] + (to[i] - from[i]) * t);
  return `rgb(${mix(0)}, ${mix(1)}, ${mix(2)})`;
}

// One shared legend for the whole panel (every bar uses the same 0-100 scale), styled after the
// POOR / AVERAGE / GREAT header on Savant's own percentile chart.
function PercentileLegend() {
  return (
    <div className="percentile-legend-bar">
      <span className="percentile-legend-poor">POOR</span>
      <span className="percentile-legend-avg">AVERAGE</span>
      <span className="percentile-legend-great">GREAT</span>
    </div>
  );
}

// Same rule as the year-over-year ticker: a change that rounds away at one decimal counts as flat.
function trendDir(from, to) {
  if (Math.round(from * 10) === Math.round(to * 10)) return "flat";
  return to > from ? "up" : "down";
}
const TREND_COLORS = { up: "var(--good)", down: "var(--danger)", flat: "#6b7280" };

function ordinal(n) {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function signedChange(d, digits) {
  const r = digits === 0 ? Math.round(d) : Number(fmt2(d));
  if (!r) return "no change";
  return (r > 0 ? "+" : "−") + (digits === 0 ? Math.abs(r) : fmt2(Math.abs(r)));
}

// Small year-by-year line, oldest to newest left to right. Each segment is green when the number
// went up that year and red when it went down; hovering a point shows the year, value and change.
// `domain` pins the y-scale (percentiles use 0-100); omit it to scale to the data itself.
function TrendSpark({ points, width, height, domain, describe }) {
  const [hoverYear, setHoverYear] = useState(null);
  const pad = 4;
  const vals = points.filter((p) => typeof p.value === "number" && !isNaN(p.value)).map((p) => p.value);
  if (!vals.length) return <span className="percentile-trend-empty">—</span>;
  const [lo, hi] = domain || [Math.min(...vals), Math.max(...vals)];
  const span = hi - lo || Math.abs(hi) || 1;
  const n = points.length;
  const valid = points
    .map((p, i) => ({
      ...p,
      x: pad + (i * (width - pad * 2)) / (n - 1 || 1),
      y: typeof p.value === "number" && !isNaN(p.value) ? pad + (1 - (p.value - lo) / span) * (height - pad * 2) : null,
    }))
    .filter((c) => c.y !== null);
  const prevOf = (c) => {
    const i = valid.findIndex((v) => v.year === c.year);
    return i > 0 ? valid[i - 1] : null;
  };
  const hovered = valid.find((c) => c.year === hoverYear);
  return (
    <div className="trend-spark" style={{ width, height }}>
      <svg width={width} height={height}>
        {valid.slice(1).map((c, i) => (
          <line key={c.year} x1={valid[i].x} y1={valid[i].y} x2={c.x} y2={c.y} strokeWidth="1.5" strokeLinecap="round" style={{ stroke: TREND_COLORS[trendDir(valid[i].value, c.value)] }} />
        ))}
        {valid.map((c) => {
          const prev = prevOf(c);
          return (
            <g key={c.year} onMouseEnter={() => setHoverYear(c.year)} onMouseLeave={() => setHoverYear(null)}>
              <circle cx={c.x} cy={c.y} r={7} fill="transparent" />
              <circle cx={c.x} cy={c.y} r={c.year === hoverYear ? 3.4 : 2.4} style={{ fill: TREND_COLORS[prev ? trendDir(prev.value, c.value) : "flat"] }} />
            </g>
          );
        })}
      </svg>
      {hovered && (
        <div className="trend-tooltip" style={{ left: hovered.x, top: hovered.y }}>
          {describe(hovered, prevOf(hovered))}
        </div>
      )}
    </div>
  );
}

function describePercentilePoint(c, prev) {
  const pct = Math.round(c.value);
  return `${c.year}: ${ordinal(pct)} percentile` + (prev ? ` (${signedChange(pct - Math.round(prev.value), 0)} vs ${prev.year})` : "");
}

function PercentileBar({ label, pct, trend }) {
  const has = typeof pct === "number" && !isNaN(pct);
  const clamped = has ? Math.max(2, Math.min(98, pct)) : 0; // keep the badge from hanging off either edge
  return (
    <div className="percentile-row">
      <div className="percentile-label">{label}</div>
      <div className="percentile-track">
        <div className="percentile-track-line" />
        {has && (
          <React.Fragment>
            <div className="percentile-fill" style={{ width: `${pct}%`, background: percentileColor(pct) }} />
            <div className="percentile-badge" style={{ left: `${clamped}%`, background: percentileColor(pct) }}>
              {Math.round(pct)}
            </div>
          </React.Fragment>
        )}
        {!has && <span className="percentile-nodata">—</span>}
      </div>
      {trend ? <TrendSpark points={trend} width={44} height={18} domain={[0, 100]} describe={describePercentilePoint} /> : <span />}
    </div>
  );
}

function PercentileRankingsPanel({ athlete, onChanged }) {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const resolvedId = extractMlbamId(athlete);
  if (!resolvedId) return null; // MlbStatsPanel below already prompts for linking an MLBAM ID

  const isPitcher = athlete.position === "Pitcher";
  const data = athlete.mlbPercentiles;
  const year = new Date().getFullYear();
  const groups = isPitcher ? PERCENTILE_METRIC_GROUPS.pitcher : PERCENTILE_METRIC_GROUPS.batter;

  const TREND_SEASONS = 3;

  const refresh = async () => {
    setLoading(true);
    setError("");
    try {
      const years = []; // most recent first: [year, year-1, year-2]
      for (let i = 0; i < TREND_SEASONS; i++) years.push(year - i);
      const rows = await Promise.all(years.map((y) => fetchPercentileRow(resolvedId, isPitcher, y)));
      const trendRows = {};
      years.forEach((y, i) => { trendRows[y] = rows[i]; });
      const usedYear = years.find((y) => trendRows[y]) || null;
      if (!usedYear) {
        setError(
          `No percentile ranking data found for this player in the last ${TREND_SEASONS} seasons — this is expected for anyone who isn't on an active MLB roster with tracked Statcast games.`
        );
      }
      window.AthleteStore.updateAthlete(athlete.id, {
        mlbPercentiles: usedYear
          ? { type: isPitcher ? "pitcher" : "batter", year: usedYear, values: trendRows[usedYear], years, trendRows, fetchedAt: new Date().toISOString() }
          : null,
      });
      onChanged();
    } catch (e) {
      setError(`Couldn't fetch percentile rankings from Baseball Savant (${e.message}).`);
    } finally {
      setLoading(false);
    }
  };

  const values = data && data.values;
  const trendYears = data && data.years ? [...data.years].reverse() : null; // oldest -> newest, for left-to-right reading

  const trendFor = (key) => {
    if (!trendYears) return null;
    return trendYears.map((y) => {
      const row = data.trendRows[y];
      const raw = row ? row[key] : null;
      return { year: y, value: raw !== undefined && raw !== null && raw !== "" ? Number(raw) : null };
    });
  };

  return (
    <div className="panel" style={{ marginBottom: 14 }}>
      <h2>
        Percentile Rankings{" "}
        <small>
          Baseball Savant &middot; {data ? `${data.year} season` : `${year} season`}
          {trendYears ? ` · ${trendYears[0]}–${trendYears[trendYears.length - 1]} trend` : ""}
        </small>
      </h2>
      {error && (
        <div className="success-banner" style={{ background: "#3a1414", color: "var(--danger)", borderColor: "#5a1f1f" }}>{error}</div>
      )}
      {values ? (
        <div>
          <PercentileLegend />
          <div className="percentile-groups">
          {groups.map((g) => (
            <div key={g.group} className="percentile-group">
              <h3>{g.group}</h3>
              {g.metrics.map((m) => {
                const raw = values[m.key];
                const pct = raw !== undefined && raw !== null && raw !== "" ? Number(raw) : null;
                return <PercentileBar key={m.key} label={m.label} pct={pct} trend={trendFor(m.key)} />;
              })}
            </div>
          ))}
          </div>
        </div>
      ) : (
        <div className="empty-state">No percentile data fetched yet. Click Refresh below to pull the last {TREND_SEASONS} seasons' rankings from Baseball Savant.</div>
      )}
      <button className="btn btn-secondary no-print" disabled={loading} onClick={refresh} style={{ marginTop: 10 }}>
        {loading ? "Fetching…" : "Refresh Percentile Rankings"}
      </button>
      {!loading && data && data.fetchedAt && (
        <p className="timestamp-note">
          Last refreshed {new Date(data.fetchedAt).toLocaleString()} &middot; qualifies at 2.1 PA/team game (batters) or 1.25 PA/team game (pitchers)
        </p>
      )}
    </div>
  );
}

// ---- MLB Research tool snapshot (research_snapshots.js) ---------------------------------
// Tracked data for athletes Baseball Savant doesn't cover (mostly minor leaguers), copied
// from research.mlb.com. It's a point-in-time snapshot, not a live feed.

function findResearchEntry(athlete) {
  const list = window.MLB_RESEARCH || [];
  const id = extractMlbamId(athlete);
  const norm = (s) => stripAccents(s || "").toLowerCase().replace(/\s+/g, " ").trim();
  return (
    list.find((e) => id && String(e.id) === String(id)) ||
    list.find((e) => norm(e.name) === norm(athlete.name)) ||
    null
  );
}

function ResearchLineChart({ title, unit, data, lines, trendKey, height }) {
  const { grid, axis } = useChartColors();
  const theme = useTheme();
  const hasData = data.some((d) => lines.some((l) => typeof d[l.key] === "number"));
  const trend = trendKey ? computeLinearTrend(data, trendKey) : null;
  const chartData = data.map((d, i) => ({ ...d, __trend: trend ? trend[i] : null }));
  const domain = paddedDomain(chartData, lines.map((l) => l.key).concat(trend ? ["__trend"] : []));
  const tip = ({ active, payload }) => {
    if (!active || !payload || !payload.length) return null;
    const row = payload[0].payload;
    const tipBg = theme === "light" ? { background: "#ffffff", border: "1px solid #c7cbd1", color: "#1a1a1a" } : { background: "#141414", border: "1px solid #3a3a3a" };
    return (
      <div style={{ ...tipBg, padding: "6px 10px", fontSize: 12 }}>
        <div><strong>{row.date}</strong>{row.matchup ? ` · ${row.matchup}` : ""}</div>
        {row.play && <div style={{ color: axis }}>{row.play}</div>}
        {lines.map((l) => (
          typeof row[l.key] === "number" ? <div key={l.key} style={{ color: l.color }}>{l.name}: {fmt2(row[l.key])}</div> : null
        ))}
      </div>
    );
  };
  return (
    <div className="panel">
      <h2>{title} {unit ? <small>{unit}</small> : null}</h2>
      {hasData ? (
        <ResponsiveContainer width="100%" height={height || 220}>
          <LineChart data={chartData}>
            <CartesianGrid strokeDasharray="3 3" stroke={grid} />
            <XAxis dataKey="date" stroke={axis} fontSize={11} tickFormatter={(d) => (/^\d{4}-\d{2}-\d{2}$/.test(d) ? shortDate(d) : d)} minTickGap={24} />
            <YAxis stroke={axis} fontSize={11} width={40} domain={domain} />
            <Tooltip content={tip} />
            {lines.length > 1 && <Legend />}
            {lines.map((l) => (
              <Line key={l.key} type="monotone" dataKey={l.key} name={l.name} stroke={l.color} strokeWidth={2} strokeDasharray={l.dashed ? "4 3" : undefined} dot={{ r: 2 }} connectNulls />
            ))}
            {trend && <Line type="monotone" dataKey="__trend" name="Trend" stroke="#f59e0b" strokeWidth={1.5} strokeDasharray="6 3" dot={false} connectNulls />}
          </LineChart>
        </ResponsiveContainer>
      ) : (
        <div className="empty-state">No tracked data.</div>
      )}
    </div>
  );
}

// Shared by the summary panel above and the per-game charts below.
function maxOf(rows, i) {
  const v = rows.map((g) => g[i]).filter((x) => typeof x === "number");
  return v.length ? Math.max(...v) : null;
}
function wAvg(rows, vi, ni) {
  const n = rows.reduce((s, g) => s + (g[ni] || 0), 0);
  return n ? rows.reduce((s, g) => s + (g[vi] || 0) * (g[ni] || 0), 0) / n : null;
}

// ---- Research tool summary: 3-year trend + year-over-year ticker --------------------------
// Independent of the Statcast tab's date-range selector (that's for the game-by-game charts
// below) — this always looks at the last 3 calendar years so a coach can see whether a number is
// trending up or down, same idea as the roster ticker but year-over-year instead of week-over-week.
const RESEARCH_TREND_YEARS = 3;

function groupGamesByYear(games) {
  const byYear = {};
  (games || []).forEach((g) => {
    const y = String(g[0] || "").slice(0, 4);
    if (y) (byYear[y] = byYear[y] || []).push(g);
  });
  return byYear;
}

function lastNYearsAgg(games, computeFn) {
  const byYear = groupGamesByYear(games);
  const currentYear = new Date().getFullYear();
  const years = [];
  for (let i = RESEARCH_TREND_YEARS - 1; i >= 0; i--) years.push(String(currentYear - i));
  return years.map((y) => ({ year: y, value: byYear[y] && byYear[y].length ? computeFn(byYear[y]) : null }));
}

// Flat if the two most recent years round to the same displayed number, so the ticker never
// shows an arrow for a "change" too small to actually see in the big number above it.
function yearOverYearDelta(yearValues) {
  const withVal = yearValues.filter((d) => typeof d.value === "number");
  if (withVal.length < 2) return null;
  const latest = withVal[withVal.length - 1];
  const prev = withVal[withVal.length - 2];
  const delta = latest.value - prev.value;
  const flat = Math.round(latest.value * 10) === Math.round(prev.value * 10);
  return { latest, prev, delta, dir: flat ? "flat" : delta > 0 ? "up" : "down" };
}

function StatTicker({ yearValues }) {
  const delta = yearOverYearDelta(yearValues);
  if (!delta) return <span className="week-ticker-empty">—</span>;
  const arrow = delta.dir === "flat" ? "▬" : delta.dir === "up" ? "▲" : "▼";
  return (
    <span className={`week-ticker-item week-ticker-${delta.dir}`} title={`${delta.prev.year}: ${fmt2(delta.prev.value)} → ${delta.latest.year}: ${fmt2(delta.latest.value)}`}>
      {arrow}{fmt2(Math.abs(delta.delta))}
    </span>
  );
}

function ResearchStatCard({ label, unit, yearValues }) {
  const withVal = yearValues.filter((d) => typeof d.value === "number");
  const current = withVal.length ? withVal[withVal.length - 1] : null;
  const withUnit = (v) => `${fmt2(v)}${unit ? " " + unit : ""}`;
  const describe = (c, prev) => `${c.year}: ${withUnit(c.value)}` + (prev ? ` (${signedChange(c.value - prev.value)} vs ${prev.year})` : "");
  return (
    <div className="research-stat-card">
      <div className="research-stat-label">{label}</div>
      <div className="research-stat-value">{current ? withUnit(current.value) : "—"}</div>
      <div className="research-stat-row">
        <TrendSpark points={yearValues} width={60} height={24} describe={describe} />
        <StatTicker yearValues={yearValues} />
      </div>
    </div>
  );
}

function ResearchToolSummaryPanel({ athlete }) {
  const e = findResearchEntry(athlete);
  if (!e) return null;
  const p = e.pitching;

  const cards = [];
  if (e.running) cards.push({ key: "sprint", label: "Top Sprint Speed", unit: "ft/s", yearValues: lastNYearsAgg(e.running.games, (g) => maxOf(g, 3)) });
  if (e.hitting) {
    cards.push({ key: "topEv", label: "Top Exit Velo", unit: "mph", yearValues: lastNYearsAgg(e.hitting.games, (g) => maxOf(g, 3)) });
    cards.push({ key: "avgEv", label: "Avg Exit Velo", unit: "mph", yearValues: lastNYearsAgg(e.hitting.games, (g) => wAvg(g, 4, 5)) });
    cards.push({ key: "topBat", label: "Top Bat Speed", unit: "mph", yearValues: lastNYearsAgg(e.hitting.games, (g) => maxOf(g, 6)) });
    cards.push({ key: "avgBat", label: "Avg Bat Speed", unit: "mph", yearValues: lastNYearsAgg(e.hitting.games, (g) => wAvg(g, 7, 8)) });
  }
  if (p) {
    // The research tool's own season totals (p.seasons) reach back further than the per-game rows,
    // which only cover the current season — use them wherever a year has one.
    const preferSeason = (key, fromGames) => fromGames.map((d) => {
      const s = p.seasons && p.seasons[d.year];
      return { year: d.year, value: s && typeof s[key] === "number" ? s[key] : d.value };
    });
    cards.push({ key: "avgFb", label: "Avg Fastball Velo", unit: "mph", yearValues: preferSeason("avgFB", lastNYearsAgg(p.games, (g) => wAvg(g, 6, 7))) });
    cards.push({ key: "peakFb", label: "Peak Fastball Velo", unit: "mph", yearValues: preferSeason("maxFB", lastNYearsAgg(p.games, (g) => maxOf(g, 8))) });
    cards.push({ key: "pitches", label: "Pitches Tracked", unit: "", yearValues: preferSeason("tracked", lastNYearsAgg(p.games, (g) => g.reduce((s, row) => s + (row[3] || 0), 0))) });
  }

  if (!cards.length) {
    return e.note ? (
      <div className="panel" style={{ marginBottom: 14 }}>
        <h2>MLB Research Tool</h2>
        <div className="empty-state">{e.note}</div>
      </div>
    ) : null;
  }

  return (
    <div className="panel" style={{ marginBottom: 14 }}>
      <h2>MLB Research Tool <small>snapshot copied {e.pulled} &middot; {RESEARCH_TREND_YEARS}-year trend</small></h2>
      {e.note && <div className="empty-state">{e.note}</div>}
      <div className="research-stat-row-wrap">
        {cards.map((c) => <ResearchStatCard key={c.key} label={c.label} unit={c.unit} yearValues={c.yearValues} />)}
      </div>
    </div>
  );
}

            <table>

                </tr>

const MLB_TREND_YEARS = 6; // current season + 5 prior, for the year-over-year charts

function MlbStatsPanel({ athlete, onChanged }) {
  const { grid, axis } = useChartColors();
  const theme = useTheme();
  const tooltipStyle = theme === "light" ? { background: "#ffffff", border: "1px solid #c7cbd1", color: "#1a1a1a" } : { background: "#141414", border: "1px solid #3a3a3a" };
  const chartLineColor = isCubsOnlyAthlete(athlete) ? CUBS_CHART_COLOR : DST_CHART_COLOR;
  const [idInput, setIdInput] = useState(athlete.mlbamId || "");
  const [loading, setLoading] = useState(false);
  const [loadingNote, setLoadingNote] = useState("");
  const [error, setError] = useState("");
  const resolvedId = extractMlbamId(athlete);
  const stats = athlete.mlbStats;
  const year = new Date().getFullYear();

  const saveId = () => {
    if (!idInput.trim()) return;
    window.AthleteStore.updateAthlete(athlete.id, { mlbamId: idInput.trim() });
    onChanged();
  };

  // Position now fully drives which side of Statcast we fetch/show — safe to do since
  // Position is a directly user-editable dropdown on the roster, not an unreliable synced
  // field. Pitchers get pitching metrics only (fastball velocity, pitch arsenal); Catcher /
  // Infield / Outfield get fielding+hitting metrics only (throwing velocity, exit velocity,
  // sprint speed, bat speed).
  const isPitcher = athlete.position === "Pitcher";

  const refresh = async () => {
    if (!resolvedId) return;
    setLoading(true);
    setError("");
    try {
      const years = [];
      for (let y = year - (MLB_TREND_YEARS - 1); y <= year; y++) years.push(y);

      let batRow = null;
      let armRow = null;
      const sprintSpeedTrend = [];
      const fastballVeloAvgTrend = [];
      const fastballVeloPeakTrend = [];
      let exitVeloAvg = null;
      let exitVeloPeak = null;
      let pitchArsenal = [];

      if (isPitcher) {
        for (const y of years) {
          setLoadingNote(`Fetching ${y} fastball velocity…`);
          const velo = await fetchFastballVelocityForYear(resolvedId, y);
          fastballVeloAvgTrend.push({ year: y, fastballVeloAvg: velo.avg });
          fastballVeloPeakTrend.push({ year: y, fastballVeloPeak: velo.peak });
        }
        setLoadingNote("Fetching pitch arsenal (shape, usage, results)…");
        pitchArsenal = await fetchPitchArsenal(resolvedId, year);
      } else {
        setLoadingNote("Fetching current-season bat speed & arm strength…");
        const [bat, arm] = await Promise.all([
          fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/bat-tracking?year=${year}&csv=true`),
          fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/arm-strength?year=${year}&csv=true`),
        ]);
        batRow = findByPlayerId(bat, "id", resolvedId);
        armRow = findByPlayerId(arm, "player_id", resolvedId);

        for (const y of years) {
          setLoadingNote(`Fetching ${y} sprint speed…`);
          sprintSpeedTrend.push({ year: y, sprintSpeed: await fetchSprintSpeedForYear(resolvedId, y) });
        }
        setLoadingNote("Fetching exit velocity…");
        const exitVelo = await fetchExitVelocityForYear(resolvedId, year);
        exitVeloAvg = exitVelo.avg;
        exitVeloPeak = exitVelo.peak;
      }

      const currentSprint = sprintSpeedTrend.find((d) => d.year === year);
      const currentVeloAvg = fastballVeloAvgTrend.find((d) => d.year === year);
      const currentVeloPeak = fastballVeloPeakTrend.find((d) => d.year === year);

      const anyData = isPitcher
        ? fastballVeloAvgTrend.some((d) => d.fastballVeloAvg != null) || pitchArsenal.length > 0
        : batRow || armRow || sprintSpeedTrend.some((d) => d.sprintSpeed != null) || exitVeloAvg != null;
      if (!anyData) {
        setError(
          isPitcher
            ? "No matching Statcast pitching data found for this player ID — they may not have enough qualifying pitches tracked in any of the last few seasons (common for minor leaguers, since Savant mainly covers MLB games), the ID may be incorrect, or their Position may be set to Pitcher when they're actually a position player."
            : "No matching Statcast fielding/hitting data found for this player ID — they may not have enough qualifying plate appearances/throws tracked in any of the last few seasons (common for minor leaguers, since Savant mainly covers MLB games), the ID may be incorrect, or their Position may need to be set to Pitcher if they actually pitch."
        );
      }

      window.AthleteStore.updateAthlete(athlete.id, {
        mlbStats: {
          sprintSpeed: currentSprint ? currentSprint.sprintSpeed : null,
          batSpeed: batRow && batRow.avg_bat_speed ? Number(batRow.avg_bat_speed) : null,
          armStrength: armRow && armRow.arm_overall ? Number(armRow.arm_overall) : null,
          fastballVeloAvg: currentVeloAvg ? currentVeloAvg.fastballVeloAvg : null,
          fastballVeloPeak: currentVeloPeak ? currentVeloPeak.fastballVeloPeak : null,
          exitVeloAvg,
          exitVeloPeak,
          pitchArsenal,
          sprintSpeedTrend,
          fastballVeloAvgTrend,
          fastballVeloPeakTrend,
          fetchedAt: new Date().toISOString(),
          year,
        },
      });
      onChanged();
    } catch (e) {
      setError(
        `Couldn't fetch from Baseball Savant (${e.message}). This is most likely a cross-origin (CORS) restriction on Savant's end blocking the browser request — if this keeps happening, let me know and I'll look into a workaround.`
      );
    } finally {
      setLoading(false);
      setLoadingNote("");
    }
  };

  const fastballYoYData = stats && stats.fastballVeloAvgTrend
    ? stats.fastballVeloAvgTrend.map((d, i) => ({
        date: String(d.year),
        avg: d.fastballVeloAvg,
        peak: stats.fastballVeloPeakTrend && stats.fastballVeloPeakTrend[i] ? stats.fastballVeloPeakTrend[i].fastballVeloPeak : null,
      }))
      // seasons with no data at all are left off the chart entirely rather than plotted as gaps
      .filter((d) => d.avg != null || d.peak != null)
    : [];
  const fastballYoYHasData = fastballYoYData.length > 0;
  const fastballYoYDomain = paddedDomain(fastballYoYData, ["avg", "peak"]);

  const sprintYoYData = stats && stats.sprintSpeedTrend
    ? stats.sprintSpeedTrend
        .map((d) => ({ date: String(d.year), sprintSpeed: d.sprintSpeed }))
        .filter((d) => d.sprintSpeed != null)
    : [];

  return (
    <div className="panel">
      <h2>
        MLB Statcast <small>Baseball Savant &middot; {year} season, plus {MLB_TREND_YEARS}-year trends</small>
      </h2>
      {!resolvedId ? (
        <div>
          <div className="empty-state">
            No MLB player ID linked for this athlete yet. If they already have a photo pulled from MLB/MiLB, their ID
            may already be usable once you save it below — otherwise find their numeric MLBAM ID from their
            mlb.com/milb.com player page URL (e.g. mlb.com/player/name-<strong>669713</strong>).
          </div>
          <div className="form-row" style={{ marginTop: 10 }}>
            <div className="field">
              <label>MLB Player ID (MLBAM)</label>
              <input value={idInput} onChange={(e) => setIdInput(e.target.value)} placeholder="e.g. 669713" style={{ maxWidth: 160 }} />
            </div>
          </div>
          <button className="btn btn-secondary" disabled={!idInput.trim()} onClick={saveId}>Save ID</button>
        </div>
      ) : (
        <div>
          <p className="timestamp-note">
            Resolved MLBAM ID: <strong>{resolvedId}</strong> — if this looks wrong, correct it via the field below and Refresh.
            {" "}
            <span className="no-print">
              <a href={`https://baseballsavant.mlb.com/savant-player/${resolvedId}`} target="_blank" rel="noopener noreferrer">Baseball Savant profile</a>
              {" · "}
              <a href={`https://www.mlb.com/player/${resolvedId}`} target="_blank" rel="noopener noreferrer">MLB.com profile</a>
            </span>
          </p>
          <div className="form-row">
            <div className="field">
              <label>MLB Player ID (MLBAM)</label>
              <input value={idInput} onChange={(e) => setIdInput(e.target.value)} placeholder="e.g. 669713" style={{ maxWidth: 160 }} />
            </div>
            <button className="btn btn-secondary" disabled={!idInput.trim() || idInput.trim() === resolvedId} onClick={saveId} style={{ alignSelf: "flex-end" }}>
              Save ID
            </button>
          </div>
          {error && (
            <div className="success-banner" style={{ background: "#3a1414", color: "var(--danger)", borderColor: "#5a1f1f" }}>
              {error}
            </div>
          )}
          <div className="location-kpi-row">
            {isPitcher ? (
              <>
                <KpiCard label="Fastball Velo (Avg)" value={stats && stats.fastballVeloAvg != null ? `${fmt2(stats.fastballVeloAvg)} mph` : "—"} />
                <KpiCard label="Fastball Velo (Peak)" value={stats && stats.fastballVeloPeak != null ? `${fmt2(stats.fastballVeloPeak)} mph` : "—"} />
              </>
            ) : (
              <>
                <KpiCard label="Sprint Speed" value={stats && stats.sprintSpeed != null ? `${fmt2(stats.sprintSpeed)} ft/s` : "—"} />
                <KpiCard label="Bat Speed" value={stats && stats.batSpeed != null ? `${fmt2(stats.batSpeed)} mph` : "—"} />
                <KpiCard label="Throwing Velocity" value={stats && stats.armStrength != null ? `${fmt2(stats.armStrength)} mph` : "—"} />
                <KpiCard label="Exit Velo (Avg)" value={stats && stats.exitVeloAvg != null ? `${fmt2(stats.exitVeloAvg)} mph` : "—"} />
                <KpiCard label="Exit Velo (Peak)" value={stats && stats.exitVeloPeak != null ? `${fmt2(stats.exitVeloPeak)} mph` : "—"} />

          )}

          {stats && stats.pitchArsenal && stats.pitchArsenal.length > 0 && (
            <div className="panel" style={{ marginTop: 14 }}>
              <h2>Pitch Arsenal <small>{stats.year} season &middot; shape, usage &amp; results</small></h2>
              <table>
                <thead>
                  <tr>
                    <th>Pitch</th>
                    <th>Usage</th>
                    <th>Velo</th>
                    <th>Induced Vert. Break</th>
                    <th>Horizontal Break</th>
                    <th>Whiff %</th>
                    <th>Hard Hit %</th>
                    <th>Run Value/100</th>
                  </tr>
                </thead>
                <tbody>
                  {stats.pitchArsenal.map((p, i) => (
                    <tr key={i} style={{ cursor: "default" }}>
                      <td>{p.pitchName || p.pitchType || "—"}</td>
                      <td>{p.usagePct != null ? `${fmt2(p.usagePct)}%` : "—"}</td>
                      <td>{p.avgVelo != null ? `${fmt2(p.avgVelo)} mph` : "—"}</td>
                      <td>{p.inducedVertBreak != null ? `${fmt2(p.inducedVertBreak)} in` : "—"}</td>
                      <td>{p.horizBreak != null ? `${fmt2(p.horizBreak)} in` : "—"}</td>
                      <td>{p.whiffPct != null ? `${fmt2(p.whiffPct)}%` : "—"}</td>
                      <td>{p.hardHitPct != null ? `${fmt2(p.hardHitPct)}%` : "—"}</td>
                      <td>{p.runValuePer100 != null ? fmt2(p.runValuePer100) : "—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {sprintYoYData.length > 0 && (
            <div style={{ marginTop: 14 }}>
              <MiniTrendChart title="Sprint Speed" unit="ft/s, year over year" data={sprintYoYData} dataKey="sprintSpeed" showTrend={false} color={chartLineColor} />
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Reads ?athlete=<id>&tab=<tabKey> from the URL, once, for deep-linking straight to a specific
// athlete's tab — used by the "Email to Athlete" PDF rendering (a headless page load navigates
// here directly instead of clicking through Team Overview → search → profile → tab) and doubles
// as a shareable link for a coach's own use.
function readDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const athlete = Number(params.get("athlete"));
  const tab = params.get("tab") || "";
  return Number.isFinite(athlete) && athlete > 0 ? { athlete, tab } : null;
}

// ---- guided tours (tour.js) -------------------------------------------------------------------------------
// Team Overview and Player Profiles each have a tour that plays by itself the first time a coach opens that page
// (after the welcome popup, for someone brand new), counted on their login. The Tour link in the top bar plays the
// one for the page that's open.
const HOME_TOUR = [
  { title: "Welcome to Team Overview", text: "Your home page: what needs a coach today, the whole roster with its flags, and the way into every athlete. Here’s a quick look around." },
  { sel: ".nav-tabs", title: "The pages", text: "Team Overview is this page. Player Profiles has a card for everyone, Team Reports builds a one-page report per player, Programs is where programs are built and assigned, and In the News follows your players." },
  { sel: ".today-panel", title: "Today", text: "What needs a coach right now: program gaps, programs ending this week, athletes not logging, re-assessments and assessments due, and form checks to review. Click a name to open that athlete where it gets dealt with." },
  { sel: ".today-panel", title: "Close what you’ve handled", text: "The × beside a name (or on a card) closes it until Monday, when anything that still applies comes back. Show closed brings them all back now, and Hide folds the panel away." },
  { sel: ".location-kpi-row", title: "Roster by location", text: "Click a location to show only the athletes there; click it again for everyone. Chicago Cubs switches to the Cubs roster and look, and Coaches lists everyone with a login." },
  { sel: ".controls-right", title: "Search and filters", text: "Find an athlete by name, or narrow the list by position, status and league. The day range sets how far back the roster’s numbers look." },
  { sel: "[data-tour='add']", title: "Add people", text: "+ Add Athlete puts one athlete on the roster. + Add Coach adds a coach once their login has been made in Supabase. + Import Athletes adds several at once from a sheet." },
  { sel: "[data-tour='status']", title: "Athlete Status", text: "Everyone on the roster, A to Z. Click a column header to sort, or a row to open that athlete’s profile. The badges and flags in a row jump straight to the tab they’re about. Tick boxes to change several athletes at once." },
  { sel: ".coach-switch", title: "Coach Mode", text: "Flip this to run a session for a group from a tablet or phone: everyone’s program side by side, logged as you go, plus group speed and testing." },
  { sel: ".topbar-account", title: "Help any time", text: "Help explains every page in detail, and Tour plays the tour for the page you’re on. The sun and moon switch light and dark mode." },
];
const PROFILES_TOUR = [
  { title: "Player Profiles", text: "A card for everyone you work with. Open a card for that athlete’s whole profile: plan, programs, testing, assessments, body composition and their training log." },
  { sel: "[data-tour='profiles-add']", title: "Add an athlete or coach", text: "+ Add Athlete puts someone new on the roster. For a coach, make their login in Supabase first (Authentication › Users › Add user); + Add Coach then lists it, and adds them under the name you give." },
  { sel: ".pill-tabs", title: "The rosters", text: "Active Players are your DST athletes. Chicago Cubs, Alumni and Inactive each have their own list, and Coaches lists everyone with a login (coaches get a plan and an app too)." },
  { sel: "[data-tour='profiles-search']", title: "Search", text: "Type part of a name to find someone on the list that’s showing." },
  { sel: ".player-card", optional: true, title: "Open a profile", text: "Click a card to open that athlete. Their profile’s tabs hold the player plan, programs, testing, assessments, the training log and more." },
  { sel: ".player-card .card-edit", optional: true, title: "Quick edits", text: "The pencil changes a name, jersey number, position or status right on the card, without opening the profile." },
  { sel: ".player-card .status-toggle", optional: true, title: "Active or inactive", text: "Click the badge to switch someone between Active and Inactive. Inactive players move to the Inactive tab, where the same badge brings them back." },
];
const TOURS = { team: { name: "home", steps: HOME_TOUR }, players: { name: "profiles", steps: PROFILES_TOUR } };

function App({ userEmail, onLogout }) {
  const deepLink = useMemo(() => readDeepLink(), []);
  // A refresh opens where the coach was: the page, athlete, profile tab and Programs screen are kept in the browser's
  // history entry (see Back below), which survives reloading the page. A new tab, or a deep link, starts as usual;
  // an athlete who's no longer there falls back to the Team Overview.
  const resumed = useMemo(() => {
    const s = deepLink ? null : window.history.state;
    if (!s || !s.dst || !s.view) return null;
    if (s.view === "athlete" && !window.AthleteStore.allAthletes().some((a) => String(a.id) === String(s.selectedId))) return null;
    return s;
  }, []); // eslint-disable-line
  const [view, setView] = useState(deepLink ? "athlete" : resumed ? resumed.view : "team");
  const [selectedId, setSelectedId] = useState(deepLink ? deepLink.athlete : resumed ? resumed.selectedId : null);
  const [positionFilter, setPositionFilter] = useState("All");
  const [statusFilter, setStatusFilter] = useState("Active");
  const [leagueFilter, setLeagueFilter] = useState("All");
  // a coach with locations set opens on their (first) location's roster; they can click out of it as usual
  const [locationFilter, setLocationFilter] = useState(() => {
    const me = (userEmail || "").toLowerCase();
    const rec = window.AthleteStore.allAthletes().find((a) => a.rosterGroup === COACH_ROSTER_GROUP && (a.coachEmail || "").toLowerCase() === me);
    return coachLocationsOf(rec)[0] || "All";
  });
  const [search, setSearch] = useState("");
  const [rangeDays, setRangeDays] = useState(30);
  const [dataVersion, setDataVersion] = useState(0);

  const bumpVersion = () => setDataVersion((v) => v + 1);

  const goHome = () => {
    setView("team");
    setSelectedId(null);
  };

  const goImport = () => setView("import");
  const goTeamReport = () => setView("teamreport");
  const goPlayers = () => setView("players");
  const goNews = () => setView("news");
  const goFacilities = () => setView("facilities");
  const [programsNav, setProgramsNav] = useState(() => (resumed && resumed.programsNav) || PROGRAMS_NAV_HOME);
  const goPrograms =() => { setProgramsNav(PROGRAMS_NAV_HOME); setView("programs"); };
  const goHelp = () => setView("help");
  // What's new: its top-bar dot shows until the coach has opened the page since the newest addition (per login, per browser)
  const whatsNewKey = `whatsNewSeen:${userEmail}`;
  const [whatsNewSeen, setWhatsNewSeen] = useState(() => { try { return localStorage.getItem(whatsNewKey) || ""; } catch (e) { return ""; } });
  const whatsNewUnseen = latestWhatsNew() > whatsNewSeen;
  const goWhatsNew = () => { const l = latestWhatsNew(); setWhatsNewSeen(l); try { localStorage.setItem(whatsNewKey, l); } catch (e) { /* private window */ } setView("whatsnew"); };

  const welcomeKey = `dstWelcomeSeen:${userEmail}`;
  const [showWelcome, setShowWelcome] = useState(() => {
    try { return !localStorage.getItem(welcomeKey); } catch (e) { return false; }
  });
  const closeWelcome = () => {
    try { localStorage.setItem(welcomeKey, "1"); } catch (e) {}
    setShowWelcome(false);
  };

  // Light/dark theme — remembered per user (same `${userEmail}` keying as the welcome popup above),
  // so each coach's choice sticks on their own login rather than being one shared app-wide setting.
  const themeKey = `themePref:${userEmail}`;
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem(themeKey) || "dark"; } catch (e) { return "dark"; }
  });
  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem(themeKey, theme); } catch (e) {}
  }, [theme, themeKey]);
  const toggleTheme = () => setTheme((t) => (t === "dark" ? "light" : "dark"));

  // the page's tour plays by itself the first time it's opened (once the welcome popup is closed and the roster
  // has drawn); Tour in the top bar plays it again
  const tour = TOURS[view] || null;
  React.useEffect(() => {
    if (!tour || showWelcome || !window.DSTTour) return undefined;
    const t = setTimeout(() => window.DSTTour.autoPlay(tour.name, tour.steps, { who: userEmail }), 900);
    return () => clearTimeout(t);
  }, [view, showWelcome]); // eslint-disable-line
  React.useEffect(() => () => window.DSTTour && window.DSTTour.end(), [view]); // leaving the page ends its tour
  const playTour = tour && window.DSTTour ? () => window.DSTTour.start(tour.steps) : null;

  // Which tab the profile opens on: normally the Player Plan, or the tab an
  // "Edit plan" link on the team report (or whatever tab a deep link asked for).
  const [profileTab, setProfileTab] = useState(deepLink ? deepLink.tab : resumed ? resumed.profileTab || "" : "");
  // Opening a different page or athlete should land at the top, not wherever the list was scrolled to.
  React.useEffect(() => { window.scrollTo(0, 0); }, [view, selectedId]);

  // Back: every page change (a different tab, or a different athlete) is recorded in the browser's history, so the
  // in-app Back button and the browser's own back button both return to the page that was open before.
  const navIdx = React.useRef(resumed && resumed.idx > 0 ? resumed.idx : 0); // after a refresh, Back still steps through the pages before it
  const navFromPop = React.useRef(false);
  const navFirst = React.useRef(true);
  // Screens inside the Programs page (which folder is open, which program is being edited or assigned) are part
  // of the same history, so Back steps out of a program to its folder, then to the Programs page.
  const programsKey = JSON.stringify(programsNav);
  const tabKey = profileTab || "plan"; // the athlete profile's open tab is a Back step too
  const navNow = React.useRef({ view, selectedId, programsKey, tabKey });
  navNow.current = { view, selectedId, programsKey, tabKey };
  const navReplace = React.useRef(false); // set when a change should overwrite the current history entry (a renamed or deleted folder)
  const [canGoBack, setCanGoBack] = useState(navIdx.current > 0);
  const updateProgramsNav = (updater, opts) => {
    if (opts && opts.replace) navReplace.current = true;
    setProgramsNav(updater);
  };
  React.useEffect(() => {
    window.history.replaceState({ dst: true, idx: navIdx.current, view, selectedId, profileTab, programsNav }, "");
    const onPop = (e) => {
      const s = e.state;
      if (!s || !s.dst) return;
      const nextKey = JSON.stringify(s.programsNav || PROGRAMS_NAV_HOME);
      navFromPop.current = s.view !== navNow.current.view || s.selectedId !== navNow.current.selectedId || nextKey !== navNow.current.programsKey || (s.profileTab || "plan") !== navNow.current.tabKey;
      navIdx.current = s.idx;
      setView(s.view);
      setSelectedId(s.selectedId);
      setProfileTab(s.profileTab || "");
      setProgramsNav(s.programsNav || PROGRAMS_NAV_HOME);
      setCanGoBack(s.idx > 0);
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  React.useEffect(() => {
    if (navFirst.current) { navFirst.current = false; return; }
    if (navFromPop.current) { navFromPop.current = false; return; }
    if (navReplace.current) {
      navReplace.current = false;
      window.history.replaceState({ dst: true, idx: navIdx.current, view, selectedId, profileTab, programsNav }, "");
      return;
    }
    navIdx.current += 1;
    window.history.pushState({ dst: true, idx: navIdx.current, view, selectedId, profileTab, programsNav }, "");
    setCanGoBack(true);
  }, [view, selectedId, programsKey, tabKey]);

  const editPeriodization = (id) => {
    setSelectedId(id);
    setProfileTab("plan");
    setView("athlete");
  };

  const selectAthlete = (id) => {
    setSelectedId(id);
    setProfileTab("");
    setView("athlete");
  };

  // Roster-row badge/ticker links (performance ticker, assessment flag) jump straight to that
  // athlete's tab instead of just the overview.
  const openAthleteTab = (id, tab) => {
    setSelectedId(id);
    setProfileTab(tab);
    setView("athlete");
  };

  // The whole app chrome goes Cubs-branded while Team Overview is actually showing the Chicago
  // Cubs roster (not just whenever a Cubs athlete happens to be selected elsewhere).
  const cubsTheme = view === "team" && locationFilter === CUBS_LOCATION_LABEL;

  return (
    <ThemeContext.Provider value={theme}>
    <div className="app">
      <TopBar
        view={view}
        onHome={goHome}
        onGoTeamReport={goTeamReport}
        onGoPlayers={goPlayers}
        onGoNews={goNews}
        onGoFacilities={goFacilities}
        showFacilities={locationFilter === CUBS_LOCATION_LABEL}
        onGoPrograms={goPrograms}
        onGoHelp={goHelp}
        onGoWhatsNew={goWhatsNew}
        whatsNewUnseen={whatsNewUnseen}
        onTour={playTour}
        userEmail={userEmail}
        onLogout={onLogout}
        cubsTheme={cubsTheme}
        theme={theme}
        onToggleTheme={toggleTheme}
      />
      <ExerciseViewerHost />
      <window.FormCheckHost />
      {showWelcome && <WelcomeModal onClose={closeWelcome} onOpenGuide={() => { closeWelcome(); goHelp(); }} />}
      <div className="main">
        {canGoBack && (
          <button className="nav-back no-print" onClick={() => window.history.back()} title="Go back to the previous page">&larr; Back</button>
        )}
        {view === "team" && (
          <TeamOverview
            positionFilter={positionFilter}
            statusFilter={statusFilter}
            leagueFilter={leagueFilter}
            locationFilter={locationFilter}
            setLocationFilter={setLocationFilter}
            search={search}
            rangeDays={rangeDays}
            onSelect={selectAthlete}
            onOpenTab={openAthleteTab}
            dataVersion={dataVersion}
            onDataChange={bumpVersion}
            filterControls={
              <FilterControls
                positionFilter={positionFilter}
                setPositionFilter={setPositionFilter}
                statusFilter={statusFilter}
                setStatusFilter={setStatusFilter}
                leagueFilter={leagueFilter}
                setLeagueFilter={setLeagueFilter}
                locationFilter={locationFilter}
                setLocationFilter={setLocationFilter}
                search={search}
                setSearch={setSearch}
                rangeDays={rangeDays}
                setRangeDays={setRangeDays}
              />
            }
          />
        )}
        {view === "athlete" && (
          <AthleteDetail
            athleteId={selectedId}
            rangeDays={rangeDays}
            onBack={goHome}
            dataVersion={dataVersion}
            onDataChange={bumpVersion}
            tab={profileTab}
            onTabChange={setProfileTab}
          />
        )}
        {view === "teamreport" && <TeamReportPage onSelect={selectAthlete} dataVersion={dataVersion} onEditPeriodization={editPeriodization} />}
        {view === "players" && <PlayerProfilesPage onSelect={selectAthlete} dataVersion={dataVersion} onDataChange={bumpVersion} />}
        {view === "news" && (window.NewsPage
          ? <window.NewsPage dataVersion={dataVersion} />
          : <div className="panel"><div className="empty-state">The In the News page didn't load — make sure news.js is next to index.html and that you're opening the dashboard through start-dashboard.bat (localhost).</div></div>)}
        {view === "facilities" && <OffseasonFacilitiesPage />}
        {view === "programs" && <ProgramsPage nav={programsNav} setNav={updateProgramsNav} />}
        {view === "help" && <HelpPage />}
        {view === "whatsnew" && <WhatsNewPage />}
        {view === "import" && <ImportPage onImported={bumpVersion} onSelect={selectAthlete} />}
      </div>
      <div className="footer-note">
        Roster is built from Player Plan syncs, imports, and manual adds &middot; force plate &amp; body comp data comes from your imports
      </div>
      <BottomMenu view={view} onGoImport={goImport} />
    </div>
    </ThemeContext.Provider>
  );
}

// ---- Sign-in gate: nothing in the dashboard renders until someone's logged in and the roster
// has finished loading from Supabase (every read AthleteStore does is synchronous, so `state`
// needs real data in it *before* <App/> mounts, not streamed in after). ----
function LoadingGate({ message }) {
  return (
    <div style={{ padding: 60, textAlign: "center", color: "var(--text-dim)" }}>
      <img src={dstLogoForTheme()} alt="" style={{ height: 40, marginBottom: 18, opacity: 0.85 }} />
      <div>{message}</div>
    </div>
  );
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    setError("");
    const { error } = await window.supabaseClient.auth.signInWithPassword({ email: email.trim(), password });
    setBusy(false);
    if (error) setError(error.message || "Sign-in failed.");
    // On success, the onAuthStateChange listener in Root picks it up and swaps to the dashboard.
  };

  return (
    <div className="login-screen">
      <form className="login-card" onSubmit={submit}>
        <img className="brand-logo" src={dstLogoForTheme()} alt="Dynamic Sports Training" />
        <h1>Professional Baseball Dashboard</h1>
        <p className="login-sub">Sign in with the account your admin created for you.</p>
        <div className="field">
          <label>Email</label>
          <input type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} required />
        </div>
        <div className="field">
          <label>Password</label>
          <input type="password" autoComplete="current-password" value={password} onChange={(e) => setPassword(e.target.value)} required />
        </div>
        {error && <div className="login-error">{error}</div>}
        <button className="btn btn-primary" type="submit" disabled={busy} style={{ width: "100%" }}>
          {busy ? "Signing in…" : "Sign In"}
        </button>
        <p className="login-note">Don't have a login yet? Ask whoever manages this dashboard to add you in Supabase (Authentication &rarr; Users).</p>
        {FROM_APP && <p className="login-note"><a href="athlete.html">‹ Back to my program</a></p>}
      </form>
    </div>
  );
}

function Root() {
  const [status, setStatus] = useState("loading"); // loading | signedOut | ready
  const [session, setSession] = useState(null);

  React.useEffect(() => {
    let mounted = true;
    const enterWithSession = async (s) => {
      window.AthleteStore.setCurrentUser({ id: s.user.id, email: s.user.email });
      await window.AthleteStore.initFromSupabase();
      if (!mounted) return;
      setSession(s);
      setStatus("ready");
      // every athlete's phone copy of their nutrition plan, brought up to date (nutrition.js), once the page has settled
      setTimeout(() => { if (window.NutritionPlan && window.NutritionPlan.refreshAll) window.NutritionPlan.refreshAll(); }, 2000);
    };
    window.supabaseClient.auth.getSession().then(({ data }) => {
      if (!mounted) return;
      if (data.session) enterWithSession(data.session);
      else setStatus("signedOut");
    });
    const { data: listener } = window.supabaseClient.auth.onAuthStateChange((event, s) => {
      if (!mounted) return;
      if (event === "SIGNED_IN" && s) enterWithSession(s);
      else if (event === "SIGNED_OUT") { setSession(null); setStatus("signedOut"); }
    });
    return () => { mounted = false; listener.subscription.unsubscribe(); };
  }, []);

  if (status === "loading") return <LoadingGate message="Loading…" />;
  if (status === "signedOut") return <LoginScreen />;
  return <App userEmail={session.user.email} onLogout={() => window.supabaseClient.auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
