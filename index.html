// Light/dark theme — read by any chart below that needs to pick axis/grid colors manually
// (CSS variables repaint everything else; Recharts' stroke/fill props are plain SVG attributes,
// not CSS, so they can't just reference var(--chart-axis) the way the rest of the app does).
const ThemeContext = React.createContext("dark");
function useTheme() { return React.useContext(ThemeContext); }
function useChartColors() {
  const theme = useTheme();
  return theme === "light" ? { grid: "#dddddd", axis: "#555555" } : { grid: "#2a2a2a", axis: "#9a9a9a" };
}
const {
  ResponsiveContainer: RechartsResponsiveContainer,
  LineChart,
  Line,
  ComposedChart,
  Bar,
  XAxis,
  YAxis,
  CartesianGrid,
  Tooltip,
  Legend,
  ReferenceArea,
  ReferenceLine,
  RadarChart,

} = Recharts;

// Every chart in the app goes through this wrapper: click a chart to open it larger in a window
// (the same chart, just taller), click outside or press Esc to close. Keeps every chart the same
// base size on the page, so one chart never looks bigger than another just because of its data.
function ResponsiveContainer(props) {
  const [open, setOpen] = React.useState(false);
  React.useEffect(() => {
    if (!open) return undefined;
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open]);
  return (
    <>
      <div className="zoom-chart" title="Click to enlarge" onClick={() => setOpen(true)}>
        <RechartsResponsiveContainer {...props} />
      </div>
      {open && (
        <div className="zoom-overlay no-print" onClick={() => setOpen(false)}>
          <div className="zoom-modal" onClick={(e) => e.stopPropagation()}>
            <button className="zoom-close" onClick={() => setOpen(false)} aria-label="Close">×</button>
            <RechartsResponsiveContainer {...props} width="100%" height={Math.round(window.innerHeight * 0.7)} />
          </div>
        </div>
      )}
    </>
  );
}

// Coaches (the people with a login) each get a record of their own so they can build a plan and run programs
// for themselves. It works like an athlete's everywhere a single person is opened, but is tagged with this
// roster group and left out of the roster: getRoster() is athletes only, getPeople() is everyone.
const COACH_ROSTER_GROUP = "coaches";
function getRoster() {
  return window.AthleteStore.allAthletes().filter((a) => a.rosterGroup !== COACH_ROSTER_GROUP);
}
function getPeople() {
  return window.AthleteStore.allAthletes();
}
function getCoaches() {
  return window.AthleteStore.allAthletes().filter((a) => a.rosterGroup === COACH_ROSTER_GROUP);
}

// Tags an athlete as belonging to the separate Chicago Cubs 40-man roster tab rather than the
// regular DST client roster — the two lists share every profile feature (same AthleteDetail,
// same tabs) but are kept out of each other's Team Overview / Team Report rosters.
const CUBS_ROSTER_GROUP = "cubs-40man";

function lastN(arr, n) {
  return arr.slice(Math.max(0, arr.length - n));
}

// A bare "YYYY-MM-DD" is parsed as UTC midnight per the ECMAScript spec, but every date this app
// stores is a calendar date, not a moment in time — reading it back with local getters (getMonth,
// getDate, getFullYear) after that UTC parse rolls it back a day in any timezone behind UTC (all of
// the US). Anchoring to local midnight first is what keeps a "2026-01-26" test showing as 1/26
// instead of 1/25.
function localDateMs(key) {
  return new Date(`${key}T00:00:00`).getTime();
}

function shortDate(key) {
  const d = new Date(`${key}T00:00:00`);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

// Now that force-test history can span several years (Hawkin backfills go back to 2020), a plain
// "10/7" x-axis label is ambiguous — the same label repeats once per year. A *categorical* axis
// (a string per point) can't fix this reliably: Recharts thins out category ticks on its own once
// there are more than a handful of points, so a year appended to just one specific point's label
// routinely gets dropped along with that tick. The fix is a real numeric time axis instead — ticks
// are then positioned by actual elapsed time (Recharts/d3 pick sensible ones on their own) and a
// <ReferenceLine> at a real timestamp always lands in the right place regardless of which ticks
// happen to be drawn. axisDateLabel formats a tick (showing the year whenever the chart's own data
// spans more than one), and yearStartTimestamps gives the Jan-1 boundaries to draw those lines at.
function axisDateLabel(ts, includeYear) {
  const d = new Date(ts);
  const base = `${d.getMonth() + 1}/${d.getDate()}`;
  return includeYear ? `${base}/${String(d.getFullYear()).slice(2)}` : base;
}
function spansMultipleYears(dateKeys) {
  const years = new Set(dateKeys.filter(Boolean).map((k) => new Date(localDateMs(k)).getFullYear()));
  return years.size > 1;
}
function yearStartTimestamps(dateKeys) {
  const years = Array.from(new Set(dateKeys.filter(Boolean).map((k) => new Date(localDateMs(k)).getFullYear()))).sort((a, b) => a - b);
  return years.slice(1).map((y) => new Date(y, 0, 1).getTime()); // skip the first year — no boundary before the data starts
}

function dateRangeKeys(days) {
  const out = [];
  const today = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    out.push(d.toISOString().slice(0, 10));
  }
  return out;
}

// Simple least-squares linear regression over a series' index position (not calendar
// gaps), returned as one value per input point so it can be plotted as its own line
// alongside the raw data. Needs at least 2 real (non-null) points to fit a slope.
function computeLinearTrend(data, key) {
  const valid = [];
  data.forEach((d, i) => {
    if (typeof d[key] === "number") valid.push({ x: i, y: d[key] });
  });
  if (valid.length < 2) return data.map(() => null);

  const n = valid.length;
  const sumX = valid.reduce((s, p) => s + p.x, 0);
  const sumY = valid.reduce((s, p) => s + p.y, 0);
  const sumXY = valid.reduce((s, p) => s + p.x * p.y, 0);
  const sumXX = valid.reduce((s, p) => s + p.x * p.x, 0);
  const denom = n * sumXX - sumX * sumX;

  if (denom === 0) {
    const avg = round2(sumY / n);
    return data.map(() => avg);
  }

  const slope = (n * sumXY - sumX * sumY) / denom;
  const intercept = (sumY - slope * sumX) / n;
  return data.map((_, i) => round2(intercept + slope * i));
}

// Y-axis limits fitted to the data actually plotted (plus a little headroom) instead of
// Recharts' default of starting at zero, which flattens narrow-range metrics like velocity.
// Bounds snap to a 1/2/5 step so the axis ticks still land on round numbers.
function paddedDomain(rows, keys, include) {
  const vals = [];
  rows.forEach((r) => keys.forEach((k) => { if (typeof r[k] === "number" && isFinite(r[k])) vals.push(r[k]); }));
  (include || []).forEach((v) => vals.push(v));
  if (!vals.length) return ["auto", "auto"];
  let lo = Math.min(...vals);
  let hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.15, Math.abs(hi) * 0.01, 0.05);
  lo -= pad;
  hi += pad;
  const raw = (hi - lo) / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const fix = (v) => Math.round(v * 1000) / 1000;
  return [fix(Math.floor(lo / step) * step), fix(Math.ceil(hi / step) * step)];
}

// Date-range options for the Statcast / Performance tabs.
const RANGE_OPTIONS = [
  { key: "90d", label: "Last 90 days" },
  { key: "6m", label: "Last 6 months" },
  { key: "1y", label: "Last year" },
  { key: "all", label: "All-Time" },
];

// A range is one of the preset keys above, or "custom|FROM|TO" (YYYY-MM-DD; either end may be blank).
function parseRange(range) {
  if (typeof range === "string" && range.startsWith("custom")) {
    const [, from = "", to = ""] = range.split("|");
    return { key: "custom", from, to };
  }
  return { key: range, from: "", to: "" };
}

// Earliest date (YYYY-MM-DD) to include for a range option, or null for no limit.
function rangeCutoffKey(range) {
  const r = parseRange(range);
  if (r.key === "custom") return r.from || null;
  const d = new Date();
  if (r.key === "90d") d.setDate(d.getDate() - 90);
  else if (r.key === "6m") d.setMonth(d.getMonth() - 6);
  else if (r.key === "1y") d.setFullYear(d.getFullYear() - 1);
  else return null;
  return d.toISOString().slice(0, 10);
}

// Latest date to include (only custom ranges have an end), or null for no limit.
function rangeEndKey(range) {
  const r = parseRange(range);
  return r.key === "custom" && r.to ? r.to : null;
}

// True when a YYYY-MM-DD date falls inside the selected range.
function dateInRange(dateKey, range) {
  const start = rangeCutoffKey(range);
  const end = rangeEndKey(range);
  return (!start || dateKey >= start) && (!end || dateKey <= end);
}

// Human-readable name of a range, e.g. "Last 90 days" or "Jan 5, 2026 – Mar 1, 2026".
// One test per calendar day for the trend charts: the highest jump height that day wins, so a
// session with several jumps plots a single point rather than a vertical stack of them.
function oneTestPerDay(tests) {
  const best = new Map();
  tests.forEach((t) => {
    const cur = best.get(t.date);
    const jh = typeof t.jumpHeight === "number" ? t.jumpHeight : -Infinity;
    const curJh = cur && typeof cur.jumpHeight === "number" ? cur.jumpHeight : -Infinity;
    if (!cur || jh > curJh) best.set(t.date, t);
  });
  return Array.from(best.values()).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

function rangeLabel(range) {
  const r = parseRange(range);
  if (r.key === "custom") {
    const fmt = (k) => new Date(`${k}T00:00:00`).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    return `${r.from ? fmt(r.from) : "Beginning"} – ${r.to ? fmt(r.to) : "Today"}`;
  }
  return (RANGE_OPTIONS.find((o) => o.key === r.key) || {}).label || "All-Time";
}

function RangeSelector({ range, onChange, note }) {
  const r = parseRange(range);
  const isCustom = r.key === "custom";
  const todayKey = new Date().toISOString().slice(0, 10);
  const startCustom = () => {
    if (isCustom) return;
    const d = new Date();
    d.setDate(d.getDate() - 90);
    onChange(`custom|${d.toISOString().slice(0, 10)}|${todayKey}`); // starts from the last 90 days, then adjust
  };
  const backwards = isCustom && r.from && r.to && r.from > r.to;
  return (
    <div className="no-print" style={{ marginBottom: 14 }}>
      <div className="pill-tabs" style={{ marginBottom: note || isCustom ? 6 : 0 }}>
        {RANGE_OPTIONS.map((o) => (
          <button key={o.key} className={`pill-tab ${r.key === o.key ? "active" : ""}`} onClick={() => onChange(o.key)}>{o.label}</button>
        ))}
        <button className={`pill-tab ${isCustom ? "active" : ""}`} onClick={startCustom}>Custom</button>
      </div>
      {isCustom && (
        <div className="range-custom">
          <label>From <input type="date" value={r.from} max={r.to || undefined} onChange={(e) => onChange(`custom|${e.target.value}|${r.to}`)} /></label>
          <label>To <input type="date" value={r.to} min={r.from || undefined} onChange={(e) => onChange(`custom|${r.from}|${e.target.value}`)} /></label>
          <span>{backwards ? "The start date is after the end date." : "Leave a date blank for no limit on that end."}</span>
        </div>
      )}
      {note && <p className="timestamp-note" style={{ marginTop: 0 }}>{note}</p>}
    </div>
  );
}

function toDateKey(raw) {
  if (!raw) return null;
  const d = new Date(raw);
  if (isNaN(d.getTime())) return null;
  return d.toISOString().slice(0, 10);
}

function latestOf(athlete) {
  const wellnessSeries = window.AthleteStore.getWellnessSeries(athlete);
  const wellness = wellnessSeries.length ? wellnessSeries[wellnessSeries.length - 1] : null;
  const load = athlete.load && athlete.load.length ? athlete.load[athlete.load.length - 1] : null;
  return { wellness, load };
}

function hasJersey(athlete) {
  return !!athlete.jersey && athlete.jersey !== "--";
}

// Names are stored as "First Last" (that's what matching/import/autocomplete rely on) —
// these only reformat for on-screen display, never the underlying stored value.
function lastNameOnly(name) {
  const parts = (name || "").trim().split(/\s+/);
  return parts[parts.length - 1] || "";
}

function lastFirstName(name) {
  const parts = (name || "").trim().split(/\s+/);
  if (parts.length < 2) return name || "";
  const last = parts[parts.length - 1];
  const first = parts.slice(0, -1).join(" ");
  return `${last}, ${first}`;
}

// Rounds to the hundredths place. Used both when storing imported/manual numeric
// values and when displaying anything computed (averages, trend lines, etc.).
function round2(n) {
  if (typeof n !== "number" || isNaN(n)) return n;
  return Math.round(n * 100) / 100;
}

// Display-time rounding for values that may have been stored before this existed,
// or that come from a data source we don't control the precision of.
function fmt2(n) {
  if (n === null || n === undefined || n === "") return n;
  const num = Number(n);
  return isNaN(num) ? n : round2(num);
}

function displayName(athlete) {
  const formatted = lastFirstName(athlete.name);
  return hasJersey(athlete) ? `#${athlete.jersey} ${formatted}` : formatted;
}

// No verified logo source for LMB/Independent/manually-typed teams, so those (and any
// logo that fails to load) fall back to a deterministic abbreviation badge instead —
// same team always gets the same badge, no broken images, no unverified artwork sourcing.
function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (hash << 5) - hash + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function teamAbbreviation(teamName) {
  const skip = new Set(["de", "del", "los", "la", "las", "the", "of", "and", "&"]);
  const words = teamName.split(/\s+/).filter((w) => !skip.has(w.toLowerCase()));
  const letters = words.map((w) => w.charAt(0).toUpperCase()).join("");
  return (letters.slice(0, 3) || teamName.slice(0, 3).toUpperCase());
}

function teamColor(teamName) {
  const hue = hashString(teamName) % 360;
  return `hsl(${hue}, 55%, 38%)`;
}

function computeAge(dob) {
  if (!dob) return null;
  const birth = new Date(dob);
  if (isNaN(birth.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const m = now.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
  return age;
}

// ---- Texting and calling a player from the dashboard -------------------------------------------------
// "Text" opens the device's own messaging app (Messages on a phone, or on a Mac signed in to iMessage) with
// the player's number filled in and the saved message typed out, ready to send from the coach's own number.
// "Call" opens the phone dialer the same way. Nothing is sent by the dashboard itself. Using either one marks
// the player as texted or called today (see ContactFlag on the Cubs roster).
// The message is a template kept in this browser; "{first}" in it becomes the player's first name.
const dialable = (phone) => { const d = String(phone || "").replace(/[^\d+]/g, ""); return /^\d{10}$/.test(d) ? `+1${d}` : d; };
const prettyPhone = (phone) => { const d = String(phone || "").replace(/\D/g, "").replace(/^1(?=\d{10}$)/, ""); return d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : String(phone || ""); };
const TEXT_TEMPLATE_KEY = "textTemplate";
const getTextTemplate = () => { try { return localStorage.getItem(TEXT_TEMPLATE_KEY) || ""; } catch (e) { return ""; } };
const setTextTemplate = (v) => { try { localStorage.setItem(TEXT_TEMPLATE_KEY, v); } catch (e) { /* private window: it just is not remembered */ } };
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
// "?&body=" is the form both iPhone and Android accept
const smsHref = (athlete) => {
  const body = getTextTemplate().replace(/\{first\}/gi, (athlete.name || "").trim().split(/\s+/)[0] || "");
  return `sms:${dialable(athlete.phone)}${body ? `?&body=${encodeURIComponent(body)}` : ""}`;
};
function TextCallLinks({ athlete, onChanged, text = true, call = true }) {
  // the link is rebuilt at the moment it is tapped, so it carries whatever the message box says right now
  // (built only when the row was drawn, it missed a message typed afterwards and opened an empty text)
  const mark = (field) => (e) => {
    if (field === "lastTexted" && e && e.currentTarget) e.currentTarget.href = smsHref(athlete); window.AthleteStore.updateAthlete(athlete.id, { [field]: todayISO() }); if (onChanged) setTimeout(onChanged, 0); };
  const addNumber = (e) => {
    e.stopPropagation();
    const typed = window.prompt(`Mobile number for ${athlete.name}:`, "");
    if (typed == null || !typed.trim()) return;
    window.AthleteStore.updateAthlete(athlete.id, { phone: typed.trim() });
    if (onChanged) onChanged();
  };
  // typing over the number changes it; clearing the box removes it
  const editNumber = (e) => {
    e.stopPropagation();
    e.preventDefault();
    const typed = window.prompt(`Mobile number for ${athlete.name} (clear it to remove):`, athlete.phone || "");
    if (typed == null) return;
    window.AthleteStore.updateAthlete(athlete.id, { phone: typed.trim() });
    if (onChanged) onChanged();
  };
  if (!athlete.phone) return <button className="btn-link text-link no-print" onClick={addNumber} title={`Add a mobile number for ${athlete.name}`}>+ number</button>;
  return (
    <span className="text-links no-print" onClick={(e) => e.stopPropagation()}>
      {text && <a className="text-link" href={smsHref(athlete)} onClick={mark("lastTexted")} title={`Text ${prettyPhone(athlete.phone)} from this device`}>Text</a>}
      {call && <a className="text-link" href={`tel:${dialable(athlete.phone)}`} onClick={mark("lastCalled")} title={`Call ${prettyPhone(athlete.phone)} from this device`}>Call</a>}
      {text && <button className="text-link text-edit" onClick={editNumber} title={`Change the mobile number (${prettyPhone(athlete.phone)})`} aria-label={`Change the mobile number for ${athlete.name}`}>&#9998;</button>}
    </span>
  );
}

// Exercises in programs link to the library by name. Videos are never stored here, only linked and embedded.
const EXERCISE_TIERS = ["Main Lift", "Secondary", "Accessory", "Power / Plyometric", "Speed", "Core", "Arm Care", "Mobility / Prep", "Conditioning"];
const EXERCISE_PATTERNS = ["Squat", "Hinge", "Lunge / Single-Leg", "Horizontal Push", "Vertical Push", "Horizontal Pull", "Vertical Pull", "Rotation", "Anti-Rotation", "Carry", "Jump", "Sprint", "Med Ball Throw", "Isolation"];
const EXERCISE_REGIONS = ["Lower Body", "Upper Body", "Core", "Full Body"];
const EXERCISE_LATERALITY = ["Bilateral", "Unilateral"];
// "Equipment Needed" on an exercise: the same list remote athletes' equipment is ticked from (see EquipmentCheck
// in program_rx.js), plus Bodyweight.
const EXERCISE_EQUIPMENT = [...window.EquipmentCheck.LIST, "Bodyweight"];
// Extra tags an exercise can carry on top of its tier: Arm Care (scap, forearm or rotator cuff work, whatever
// tier the exercise is) and Elbow Enforcer (the EE series).
const EXERCISE_EXTRA_TAGS = ["Arm Care", "Elbow Enforcer"];
const exerciseTags = (e) => [...new Set([e.tier, ...(e.tags || []), e.pattern, e.region, e.laterality, ...(e.equipment || [])].filter(Boolean))];

// Turns a YouTube or Vimeo link (including YouTube Shorts) into its embeddable player address; null for anything else.
// (the same as the phone page's, in program_rx.js: YouTube, Vimeo, or a clip a coach filmed or uploaded)
function videoEmbed(url) {
  return window.videoEmbedOf(url);
}

// Opens an exercise's library entry from anywhere (a program, the plan, the library itself).

// Mounted once by App: shows the pop-up whenever something calls window.openExercise(name).

    <div className="zoom-overlay exercise-overlay" onClick={() => setName(null)}>

        <button className="zoom-close" onClick={() => setName(null)} aria-label="Close">×</button>

    </div>,
    document.body
  );
}

// Upload (or replace) an exercise's video with a clip from this computer or phone. The clip is stored (see
// ExerciseVideo in program_rx.js) and its address goes in the video link box; Save exercise keeps it.
function ExerciseVideoUpload({ name, has, onUploaded }) {
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");
  const inputRef = React.useRef(null);
  const pick = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setBusy(true);
    setNote(`Uploading… (${Math.max(1, Math.round(file.size / 1048576))} MB)`);
    try {
      const url = await window.ExerciseVideo.upload(file, name);
      onUploaded(url);
      setNote("Uploaded. Click Save exercise to keep it.");
    } catch (err) {
      setNote(err.message || "Could not upload the video.");
    }
    setBusy(false);
  };
  return (
    <div className="facility-field wide exercise-upload">
      <input ref={inputRef} type="file" accept="video/*" hidden onChange={pick} />
      <button type="button" className="btn btn-secondary" disabled={busy || !name} onClick={() => inputRef.current && inputRef.current.click()}>
        {busy ? "Uploading…" : has ? "Replace video" : "Upload a video"}
      </button>
      <small>{note || (name ? `A short clip, under ${window.ExerciseVideo.MAX_MB} MB (about 20 seconds).` : "Name the exercise first.")}</small>
    </div>
  );
}

function ExerciseForm({ initial, onSave, onCancel, onDelete }) {
  const [draft, setDraft] = useState(() => ({ equipment: [], ...(initial || {}) }));
  const set = (key, v) => setDraft((d) => ({ ...d, [key]: v }));
  const name = (draft.name || "").trim();
  // names are compared ignoring case, spaces, hyphens and punctuation, as everywhere exercises link (Push-up = Pushup)
  const nameKey = window.exerciseNameKey;
  const clash = name && window.AthleteStore.allExercises().some((e) => e.id !== draft.id && [e.name, ...(e.aliases || [])].some((n) => nameKey(n) === nameKey(name)));
  // another name typed in: not this exercise's own name or one it already has, and not another exercise's name
  // (that one would need merging instead, in the library list)
  const [aliasText, setAliasText] = useState("");
  const [aliasNote, setAliasNote] = useState("");
  const addAlias = () => {
    const alias = aliasText.trim().replace(/\s+/g, " ");
    const key = nameKey(alias);
    if (!key) return;
    if (key === nameKey(name) || (draft.aliases || []).some((a) => nameKey(a) === key)) { setAliasNote(`"${alias}" is already a name for this exercise (case, spaces and hyphens don't matter).`); return; }
    const other = window.AthleteStore.allExercises().find((e) => e.id !== draft.id && [e.name, ...(e.aliases || [])].some((n) => nameKey(n) === key));
    if (other) { setAliasNote(`"${alias}" is ${nameKey(other.name) === key ? "its own exercise" : `already a name for ${other.name}`} in the library. Merge the two from the library list instead.`); return; }
    set("aliases", [...(draft.aliases || []), alias]);
    setAliasText("");
    setAliasNote("");
  };
  const pick = (label, key, options) => (
    <label className="facility-field"><span>{label}</span>
      <select value={draft[key] || ""} onChange={(e) => set(key, e.target.value)}>
        <option value="">—</option>
        {options.map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
    </label>
  );
  const submit = () => {
    const rec = { name, videoUrl: (draft.videoUrl || "").trim(), tier: draft.tier || "", pattern: draft.pattern || "", region: draft.region || "", laterality: draft.laterality || "", equipment: draft.equipment || [], tags: draft.tags || [], cues: (draft.cues || "").trim(), aliases: draft.aliases || [] };
    if (draft.id) rec.id = draft.id;
    onSave(rec);
  };
  return (
    <div className="panel">
      <h2>{draft.id ? "Edit exercise" : "Add an exercise"}</h2>
      <div className="facility-form-grid">
        <label className="facility-field wide"><span>Exercise name * (programs link to it by this name)</span>
          <input value={draft.name || ""} onChange={(e) => set("name", e.target.value)} placeholder="e.g. Trap Bar Deadlift" />
        </label>
        <label className="facility-field wide"><span>Video link (YouTube, YouTube Shorts, or Vimeo), or upload a clip</span>
          <input value={draft.videoUrl || ""} onChange={(e) => set("videoUrl", e.target.value)} placeholder="https://www.youtube.com/watch?v=..." />
        </label>
        <ExerciseVideoUpload name={name} has={!!(draft.videoUrl || "").trim()} onUploaded={(url) => set("videoUrl", url)} />
        {/* other names for the same exercise (typed here, or from a merge): programs written with any of them link
            here for the video and cues, and weights logged under any of them track together as one lift */}
        <div className="facility-field wide"><span>Also called (other names for this exercise: they link here, and their weights track together)</span>
          {(draft.aliases || []).length > 0 && (
            <div className="exercise-aliases">
              {draft.aliases.map((a) => (
                <span className="exercise-tag" key={a}>{a}
                  <button type="button" className="exercise-alias-x" title={`Stop linking "${a}" to this exercise`} aria-label={`Remove ${a}`} onClick={() => set("aliases", draft.aliases.filter((x) => x !== a))}>×</button>
                </span>
              ))}
            </div>
          )}
          <div className="exercise-alias-add">
            <input value={aliasText} onChange={(e) => setAliasText(e.target.value)} placeholder="e.g. Hex Bar Deadlift" aria-label="Another name for this exercise"
              onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addAlias(); } }} />
            <button type="button" className="btn btn-secondary" disabled={!aliasText.trim()} onClick={addAlias}>Add name</button>
          </div>
          {aliasNote && <small className="exercise-equipment-hint">{aliasNote}</small>}
        </div>
        {pick("Tier", "tier", EXERCISE_TIERS)}
        {pick("Movement pattern", "pattern", EXERCISE_PATTERNS)}
        {pick("Body region", "region", EXERCISE_REGIONS)}
        {pick("Bilateral / unilateral", "laterality", EXERCISE_LATERALITY)}
        <div className="facility-field wide"><span>Equipment Needed</span>
          {/* what the name already gives away is found on its own; tick anything the name doesn't say */}
          <small className="exercise-equipment-hint">
            {window.EquipmentCheck.fromName(draft.name).length
              ? `Picked up from the name: ${window.EquipmentCheck.fromName(draft.name).join(", ")}. Tick anything else it needs.`
              : "Nothing in the name says what it needs. Tick the equipment so it can be flagged for remote athletes who don't have it."}
          </small>
          <div className="exercise-equipment">
            {EXERCISE_EQUIPMENT.map((q) => (

                {q}
              </label>
            ))}

// 1RM Chart section of the Programs tab: the % of 1RM assumed for each number of reps reached on a set taken to

// Exercise Library section of the Programs tab: search, filter by tier, add / edit, click a name to view.
// Merges two library entries for the same exercise written two ways ("RFESS" and "Rear Foot Elevated Split
// Squat"). The coach picks which one is kept: its name and details win, it takes anything it is missing from the
// other (a video, cues…), and the other name keeps working everywhere as another name for it (see mergeExercises).
function ExerciseMerge({ onDone }) {
  const S = window.AthleteStore;
  const all = S.allExercises();
  const [a, setA] = useState("");
  const [b, setB] = useState("");
  const [keep, setKeep] = useState("a");
  const [done, setDone] = useState("");
  const find = (n) => all.find((e) => (e.name || "").trim().toLowerCase() === n.trim().toLowerCase()) || null;
  const ea = find(a), eb = find(b);
  const same = ea && eb && ea.id === eb.id;
  const kept = keep === "a" ? ea : eb, other = keep === "a" ? eb : ea;
  const facts = (e) => [e.videoUrl ? "video" : "no video", e.cues ? "cues" : "", e.tier || "", (e.equipment || []).length ? `${e.equipment.length} equipment` : ""].filter(Boolean).join(" · ");
  const merge = () => {
    if (!kept || !other || same) return;
    if (!window.confirm(`Merge "${other.name}" into "${kept.name}"?\n\n"${other.name}" will be removed from the library, and programs that use that name will link to "${kept.name}" (its video and cues) from now on.`)) return;
    S.mergeExercises(kept.id, other.id);
    setDone(`Merged. "${other.name}" now links to "${kept.name}".`);
    setA(""); setB(""); setKeep("a");
  };
  const picker = (label, value, setValue, e) => (
    <label className="facility-field wide"><span>{label}</span>
      <input list="merge-exercise-names" value={value} onChange={(ev) => { setValue(ev.target.value); setDone(""); }} placeholder="Type to find an exercise" />
      {value && !e && <small className="exercise-equipment-hint">Pick an exercise from the library list.</small>}
      {e && <small className="exercise-equipment-hint">{facts(e)}</small>}
    </label>
  );
  return (
    <div className="panel">
      <h2>Merge exercises</h2>
      <p className="facility-note">For one exercise that is in the library twice under different wording. Pick both, then choose which one to keep. Programs written with either name will show the kept one's video and cues.</p>
      <datalist id="merge-exercise-names">{all.map((e) => <option key={e.id} value={e.name} />)}</datalist>
      <div className="facility-form-grid">
        {picker("First exercise", a, setA, ea)}
        {picker("Second exercise", b, setB, eb)}
      </div>
      {same && <div className="facility-note">Those are the same exercise. Pick two different ones.</div>}
      {ea && eb && !same && (
        <div className="exercise-merge-choice">
          <strong>Which one wins?</strong>
          {[["a", ea, eb], ["b", eb, ea]].map(([k, x, y]) => (
            <label key={k}>
              <input type="radio" name="merge-keep" checked={keep === k} onChange={() => setKeep(k)} />
              <span>Keep <b>{x.name}</b>. "{y.name}" becomes another name for it.</span>
            </label>
          ))}
          <small className="exercise-equipment-hint">
            {`"${kept.name}" keeps its own details. ${!kept.videoUrl && other.videoUrl ? `It has no video, so it takes "${other.name}"'s. ` : ""}${!kept.cues && other.cues ? `It takes "${other.name}"'s cues. ` : ""}Equipment and tags from both are kept.`}
          </small>
        </div>
      )}
      {done && <div className="facility-note">{done}</div>}
      <div className="facility-form-actions">
        <button className="btn" disabled={!ea || !eb || same} onClick={merge}>Merge</button>
        <button className="btn-link" onClick={onDone}>Back to the library</button>
      </div>
    </div>
  );
}

// ---- Training programs ----------------------------------------------------------------------
// A program is a reusable template: weeks, each with sessions, each with exercises (sets / reps / load / rest).
// Intensity is prescribed, never the weight itself: a percentage, reps in reserve (RIR), RPE, or nothing.
const INTENSITY_UNITS = [["%", "% of max"], ["RIR", "RIR"], ["RPE", "RPE"], ["lb", "A set weight in pounds"], ["kg", "A set weight in kilograms"], ["", "No intensity"]];
const newSetGroup = () => ({ sets: "", reps: "", intensity: "" });
const newExercise = () => ({ id: `ex-${Math.random().toString(36).slice(2, 9)}`, name: "", tempo: "", intensityUnit: "%", groups: [newSetGroup()], rest: "", notes: "" });
// Brings a program saved in the older single sets / reps / load format up to set groups (see ProgramRx in periodization.js).
const normalizeProgramWeeks = (weeks) => (weeks || []).map((w) => ({ ...w, sessions: (w.sessions || []).map((s) => ({ ...s, exercises: (s.exercises || []).map((e) => window.ProgramRx.normalize(e)) })) }));
const DEFAULT_DAYS = 1; // a new program starts with one day; more are added with "+ Add day"
const MAX_DAYS = 7; // a week holds at most seven days
const newSession = (n) => ({ name: `Day ${n}`, exercises: [newExercise()] });
const newWeek = (n) => ({ name: `Week ${n}`, sessions: Array.from({ length: DEFAULT_DAYS }, (_, i) => newSession(i + 1)) });
// A week added to a program starts as a copy of the week before it: same days, exercises and supersets.
const copyWeek = (week, n) => {
  const c = JSON.parse(JSON.stringify(week));
  c.name = `Week ${n}`;
  c.sessions.forEach((s) => s.exercises.forEach((e) => { e.id = newExercise().id; }));
  return c;
};
const programCounts = (p) => {
  const weeks = (p.weeks || []).length;
  const sessions = (p.weeks || []).reduce((s, w) => s + (w.sessions || []).length, 0);
  const exercises = (p.weeks || []).reduce((s, w) => s + (w.sessions || []).reduce((t, x) => t + (x.exercises || []).length, 0), 0);
  return { weeks, sessions, exercises };
};


// Opens a program's PDF in a new browser tab instead of downloading it, so it can be printed or saved from
// there. The tab is opened straight away (browsers block one opened after a wait) and filled once the PDF is
// built. If the browser blocks the tab anyway, the PDF downloads as before.
async function openProgramPdf(program, athleteName, cubsLogo) {
  const title = [athleteName, program.name].filter(Boolean).join(" - ");
  const tab = window.open("", "_blank");
  if (tab) tab.document.title = `Building ${title}…`;
  try {
    const built = await buildProgramPdf(program, athleteName, cubsLogo);
    const { pdf, fits } = built;
    pdf.setProperties({ title });
    const { pages } = built;
    // No question or alert is put up here: by now the new tab is in front, and a browser quietly cancels a
    // dialog raised from a tab that is not (which used to leave the PDF never opening). How many pages it took,
    // and whether anything had to be cut off, is handed back for the caller to show beside its button instead.
    if (tab) tab.location.href = pdf.output("bloburl");
    else pdf.save(`${title.replace(/[\\/:*?"<>|]/g, "")}.pdf`);
    return { pages, fits, fontSize: built.fontSize };
  } catch (e) {
    if (tab) tab.close();
    throw e;
  }
}
// Several programs in one PDF, each starting on a new page, opened in a new tab like openProgramPdf (Print all
// on the Player Plan). Resolves to { programs, pages }.
async function openProgramsPdf(programs, athleteName, cubsLogo, title) {
  const tab = window.open("", "_blank");
  if (tab) tab.document.title = `Building ${title}…`;
  try {
    let pdf = null, pages = 0;
    for (const program of programs) {
      const built = await buildProgramPdf(program, athleteName, cubsLogo, pdf);
      pdf = built.pdf;
      pages += built.pages;
    }
    pdf.setProperties({ title });
    if (tab) tab.location.href = pdf.output("bloburl");
    else pdf.save(`${title.replace(/[\\/:*?"<>|]/g, "")}.pdf`);
    return { programs: programs.length, pages };
  } catch (e) {
    if (tab) tab.close();
    throw e;
  }
}
window.openProgramsPdf = openProgramsPdf;
// what to tell the coach after a PDF opens, or "" when it fitted on one page
function programPdfNote(result) {
  if (!result) return "";
  if (!result.fits) return "One week is too long to fit on a page even at the smallest text size, so part of it is cut off. Try fewer exercises per day.";
  return result.pages > 1 ? `Too long for one page at a readable size, so it is on ${result.pages} pages.` : "";
}
window.programPdfNote = programPdfNote;
window.openProgramPdf = openProgramPdf;

// Moves one exercise of a day into another superset. `target` is the letter of an existing superset (the
// exercise joins the end of it, so a B1 moved to A becomes the next A), or "__new__" to make it a superset of
// its own right after the one it left. Returns the day's exercises in their new order, re-linked.
function moveToSuperset(exercises, index, target) {
  const letters = window.exerciseLabels(exercises).map((l) => l.replace(/\d+\.$/, ""));
  const groups = [];
  exercises.forEach((e, i) => {
    if (i === 0 || letters[i] !== letters[i - 1]) groups.push({ letter: letters[i], items: [] });
    groups[groups.length - 1].items.push(e);
  });
  const moving = exercises[index];
  const from = groups.find((g) => g.items.includes(moving));
  from.items = from.items.filter((e) => e !== moving);
  if (target === "__new__") groups.splice(groups.indexOf(from) + 1, 0, { letter: null, items: [moving] });
  else (groups.find((g) => g.letter === target) || from).items.push(moving);
  return groups.filter((g) => g.items.length).flatMap((g) => g.items.map((e, i) => ({ ...e, linked: i > 0 })));
}

// Swaps an exercise with its neighbor (dir -1 = earlier, 1 = later) inside the same superset, so A2 can become
// A1. The superset keeps its place and its links; only the two exercises trade positions.
function swapInSuperset(exercises, index, dir) {
  const j = index + dir;
  if (j < 0 || j >= exercises.length) return exercises;
  const next = exercises.map((e) => ({ ...e }));
  const linkedAt = [next[index].linked, next[j].linked];
  [next[index], next[j]] = [next[j], next[index]];
  next[index].linked = linkedAt[0];
  next[j].linked = linkedAt[1];
  return next;
}

// Create or edit one program. Works on a copy, so Cancel leaves the saved program untouched.
// Tags on a program ("Pitchers", "In-season", "Hypertrophy"…), for sorting the Programs list. Shown as chips
// with a "+ Add tags" link, both on a program's card and in the builder. Several can be typed at once with
// commas, and tags already used on other programs are offered while typing so the spelling stays the same.
function ProgramTags({ tags, all, onChange }) {
  const [adding, setAdding] = useState(false);
  const [text, setText] = useState("");
  const list = tags || [];
  const listId = useMemo(() => `program-tags-${Math.random().toString(36).slice(2, 8)}`, []);
  const add = () => {
    const typed = text.split(",").map((t) => t.trim()).filter(Boolean);
    const fresh = [];
    typed.forEach((t) => {
      const known = (all || []).find((a) => a.toLowerCase() === t.toLowerCase()) || t;
      if (![...list, ...fresh].some((x) => x.toLowerCase() === known.toLowerCase())) fresh.push(known);
    });
    if (fresh.length) onChange([...list, ...fresh]);
    setText("");
    setAdding(false);
  };
  return (
    <div className="program-tags">
      {list.map((t) => (
        <span className="program-tag" key={t}>{t}<button title={`Remove the tag ${t}`} aria-label={`Remove the tag ${t}`} onClick={() => onChange(list.filter((x) => x !== t))}>×</button></span>
      ))}
      {adding ? (
        <React.Fragment>
          <input
            className="program-tag-input" autoFocus list={listId} value={text} placeholder="Tag, or several with commas"
            onChange={(e) => setText(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); add(); } else if (e.key === "Escape") { setText(""); setAdding(false); } }}
            onBlur={add}
          />
          <datalist id={listId}>{(all || []).filter((a) => !list.includes(a)).map((a) => <option key={a} value={a} />)}</datalist>
        </React.Fragment>
      ) : (
        <button className="btn-link program-add-tags no-print" title="Add tags to this program" onClick={() => setAdding(true)}>+ Tag</button>
      )}
    </div>
  );
}

// A speed program (sections and series, speed_builder.js) opens in its own builder; every other program in this one.
function ProgramEditor(props) {
  if (props.initial && props.initial.layout === "throwing" && window.SpeedProgramEditor) return <window.SpeedProgramEditor {...props} kind="throwing" />; // a throwing program: the same builder, with intensities
  if (props.initial && props.initial.layout === "reed" && window.SpeedProgramEditor) return <window.SpeedProgramEditor {...props} kind="reed" />; // a re-education program: the same builder, in re-ed sections
  return props.initial && window.isSpeedProgram(props.initial) && window.SpeedProgramEditor ? <window.SpeedProgramEditor {...props} /> : <StandardProgramEditor {...props} />;
}
// A placeholder for the athlete's own re-ed work in a program template: "Re-Ed", "RE-ED", "Re-Education", "Insert
// Re-Ed", "Corrective(s)", "Mobility", "Mobility Drill", "Re-Ed Exercise"… (see StandardProgramEditor's reedPicker)
const REED_PLACEHOLDER = /^(insert\s+(an?\s+)?)?(re-?ed(ucation)?s?|correctives?|mobility)(\s+(drills?|exercises?|work))?\.?$/i;
const isReedPlaceholder = (name) => REED_PLACEHOLDER.test((name || "").trim());
// An athlete's re-ed drills: the exercises in the programs on their plan that are re-education programs (layout
// "reed") or sit in a Re-Ed / Correctives / Mobility row, each once, with its sets and reps there and the section
// (or phase) it's in to group the list by
function reedDrillsFor(athlete) {
  const S = window.AthleteStore, plan = athlete && S.getPeriodization ? S.getPeriodization(athlete.id) : null;
  if (!plan) return [];
  const laneName = (id) => ((plan.lanes || []).find((l) => l.id === id) || {}).name || "";
  // the Re-Ed program running this week comes first (marked current), then the plan's others, earliest first
  const start = plan.startDate ? new Date(`${plan.startDate}T00:00:00`) : null;

      [...new Set([fromW, toW])].forEach((w) => d.weeks[w].sessions.forEach((s, i) => { if (/^Day \d+$/.test((s.name || "").trim())) s.name = `Day ${i + 1}`; }));
