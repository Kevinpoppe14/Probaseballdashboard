    const addAll = (label) => label && edit((d) => d.weeks[wi].sessions[si].exercises.forEach((e) => {
      const extras = Array.isArray(e.extras) ? e.extras : [];
      if (!extras.some((x) => (x.label || "").toLowerCase() === label.toLowerCase())) e.extras = [...extras, { label, value: "" }];
    }));
    if (what === "custom") window.askText({ title: "New box on every exercise", text: `Added to every exercise in ${draft.weeks[wi].sessions[si].name || `Day ${si + 1}`}.`, placeholder: "Height, Load, Holds…", maxLength: 20 }).then(addAll);
    else addAll(what.replace(/^x:/, ""));
  };
  const input = (value, onChange, props = {}) => (
    <input value={value || ""} onChange={(e) => onChange(e.target.value)} {...props} />
  );
  // A week's grid rows: the day names, the warm-ups, then one per exercise label used in any of its days, in order
  // (A1, A2, A3, B1, B2, C1…), so each day's A2 is in the A2 row and its B1 in the B1 row, with a gap where a day has
  // no such exercise. Repeated labels can't happen (they're worked out from the order), so a label is a row.
  const labelRowsOf = (week) => {
    const key = (l) => { const m = /^([A-Za-z]+)(\d+)/.exec(l || ""); return m ? [m[1].length, m[1].toUpperCase(), Number(m[2])] : [99, "", 0]; };
    const all = [...new Set(week.sessions.flatMap((s) => window.exerciseLabels(s.exercises)))];
    all.sort((a, b) => { const x = key(a), y = key(b); return x[0] - y[0] || x[1].localeCompare(y[1]) || x[2] - y[2]; });
    return all;
  };
  const weekRowsOf = (week) => 2 + Math.max(1, labelRowsOf(week).length);

  // Moving between boxes like a spreadsheet: Tab / Shift+Tab to the next or previous box in the day (past the
  // buttons in between), Enter / Shift+Enter (or the down / up arrow) to the same column on the next or previous line
  // (A1's reps to its next set line's reps, then A2's). Arriving in a box selects what's in it, so typing replaces it.
  // The boxes carry data-cell (their column) and data-row (the exercise and set line). The arrows are left alone in
  // the exercise name, where they move through the library suggestions.
  const cellNav = (e) => {
    const t = e.target, col = t && t.dataset ? t.dataset.cell : null;
    if (!col || e.altKey || e.ctrlKey || e.metaKey) return false;
    const k = e.key;
    const down = (k === "Enter" && !e.shiftKey) || (k === "ArrowDown" && col !== "name");
    const up = (k === "Enter" && e.shiftKey) || (k === "ArrowUp" && col !== "name");
    if (!down && !up && k !== "Tab") return false;
    const day = t.closest(".program-day");
    if (!day) return false;
    const cells = [...day.querySelectorAll("[data-cell]")];
    const i = cells.indexOf(t);
    let to = null;
    if (k === "Tab") {
      to = cells[i + (e.shiftKey ? -1 : 1)] || null;
      if (!to) return false; // past the day's first or last box: the browser's own Tab
    } else {
      const step = down ? 1 : -1;
      for (let j = i + step; j >= 0 && j < cells.length; j += step) if (cells[j].dataset.row !== t.dataset.row && cells[j].dataset.cell === col) { to = cells[j]; break; }
      if (!to) { e.preventDefault(); if (k === "Enter") t.blur(); return true; }
    }
    e.preventDefault();
    to.focus();
    if (to.select) to.select();
    return true;
  };

  return (
    <div className={`panel program-editor ${zoomMode === "fit" ? "program-fit" : ""}`} ref={rootRef} tabIndex={-1} onKeyDown={(e) => { if (handleKey(e) || cellNav(e)) e.stopPropagation(); }}>
      {/* exercise names suggest from the library; a name that matches links to its library entry */}
      <datalist id="exercise-library-names">
        {window.AthleteStore.allExercises().map((e) => <option key={e.id} value={e.name} />)}
      </datalist>
      <div className="program-editor-top">
        <h2>{initial && initial.id ? "Edit program" : "New program"}</h2>
        <button className="btn btn-small-grey" disabled={!history.current.past.length} title="Undo the last change (Ctrl+Z)" onClick={undo}>↶ Undo</button>
        <button className="btn btn-small-grey" disabled={!history.current.future.length} title="Redo (Ctrl+Y)" onClick={redo}>↷ Redo</button>
        {window.ProgramTableWeek && (
          <span className="program-zoom" role="group" aria-label="View">
            <button className={`btn btn-small-grey ${!tableView ? "on" : ""}`} title="Each day as a column of exercise boxes" onClick={() => setView("boxes")}>Boxes</button>
            <button className={`btn btn-small-grey ${tableView ? "on" : ""}`} title="Each day as a spreadsheet: one row per exercise. Paste rows from Google Sheets or Excel." onClick={() => setView("table")}>Table</button>
          </span>
        )}
        {/* how big the days are drawn: smaller fits more across; Fit week shrinks each week just enough to show all its days */}
        <span className="program-zoom" role="group" aria-label="Size">
          {[["1", "100%"], ["0.85", "85%"], ["0.7", "70%"], ["fit", "Fit week"]].map(([v, label]) => (
            <button key={v} className={`btn btn-small-grey ${zoomMode === v ? "on" : ""}`} title={v === "fit" ? "Shrink each week so all its days fit across the screen" : `Draw the days at ${label}`} onClick={() => setZoom(v)}>{label}</button>
          ))}
        </span>
        {/* clicking into a week or a superset dims the rest; this brings everything back. Always in the toolbar (only
            hidden when nothing is dimmed), so its showing up never shifts the program down mid-click. */}
        {(() => {
          const dimmed = !!(focusSet || (focusWeek != null && draft.weeks.length > 1));
          return (
            <button className="btn btn-small-grey program-show-all" style={dimmed ? undefined : { visibility: "hidden" }} disabled={!dimmed} aria-hidden={dimmed ? undefined : "true"} tabIndex={dimmed ? undefined : -1} onClick={() => { setFocusWeek(null); setFocusSet(null); }}>Show everything at full brightness</button>
          );
        })()}
        {onSaveAndAssign && (
          <button className="btn btn-assign" disabled={!canSave} title={canSave ? "Saves this program, then lets you assign it to athletes or to a group" : "Give the program a name first"} onClick={saveAndAssign}>
            Save &amp; assign to athletes or a group
          </button>
        )}
        <ProgramPdfButton primary athlete={pdfAthlete} program={{ name: (draft.name || "").trim() || "Program", weeks: draft.weeks }} />
      </div>
      <div className="facility-form-grid">
        <label className="facility-field wide"><span>Program name *</span>
          {input(draft.name, (v) => edit((d) => { d.name = v; }), { placeholder: "e.g. Off-season strength, Phase 1" })}
        </label>
        {/* the description is optional: a box only once there is one, or after "+ Description" */}
        {(draft.description || "").trim() || descOpen ? (
          <label className="facility-field wide"><span>Description</span>
            <textarea rows={2} autoFocus={descOpen && !(draft.description || "").trim()} value={draft.description || ""} onChange={(e) => edit((d) => { d.description = e.target.value; })} onBlur={() => setDescOpen(false)} placeholder="Goal, who it's for, how it fits in the plan" />
          </label>
        ) : (
          <div className="facility-field wide"><button className="btn-link program-add-desc" onClick={() => setDescOpen(true)}>+ Description</button></div>
        )}
        {/* suggested next phase(s): only ever offered as a suggestion when assigning or building, never applied automatically */}
        <div className="facility-field wide"><span>Suggested next phase (optional, a suggestion only)</span>
          <div className="program-next">
            {(draft.nextProgramIds || []).map((id) => {
              const p = window.AthleteStore.allPrograms().find((x) => x.id === id);
              return (
                <span className="program-next-chip" key={id}>
                  {p ? p.name : "(deleted program)"}
                  <button title="Remove this suggestion" onClick={() => edit((d) => { d.nextProgramIds = (d.nextProgramIds || []).filter((x) => x !== id); })}>✕</button>
                </span>
              );
            })}
            <select value="" onChange={(e) => e.target.value && edit((d) => { d.nextProgramIds = [...(d.nextProgramIds || []), e.target.value]; })}>
              <option value="">+ Add a suggested next program…</option>
              {window.AthleteStore.allPrograms().filter((p) => p.id !== (initial && initial.id) && !(draft.nextProgramIds || []).includes(p.id)).map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
        </div>
        <div className="facility-field wide"><span>Tags</span>
          <ProgramTags tags={draft.tags} all={[...new Set(window.AthleteStore.allPrograms().flatMap((p) => p.tags || []))].sort((a, b) => a.localeCompare(b))} onChange={(t) => edit((d) => { d.tags = t; })} />
        </div>
      </div>

      {(ticks.size > 0 || clipNote) && (
        <div className="program-clipbar no-print">
          <strong>{ticks.size > 0 ? `${ticks.size} ticked` : "Copy and paste"}</strong>
          <button className="btn btn-small-grey" disabled={!ticks.size} onClick={copyTicked}>Copy (Ctrl+C)</button>
          <button className="btn btn-small-grey" disabled={!ticks.size || !readClip()} onClick={pasteClip}>Paste here (Ctrl+V)</button>
          <button className="btn btn-small-grey" disabled={!ticks.size} onClick={() => setTicks(new Set())}>Clear ticks</button>
          {clipNote && <span>{clipNote}</span>}
        </div>
      )}
      {draft.weeks.map((week, wi) => (
        <div
          className={`program-week ${focusWeek === wi ? "focused" : focusWeek != null ? "dimmed" : ""}`}
          key={wi}
          onMouseDown={() => setFocusWeek(wi)}
          onFocusCapture={() => setFocusWeek(wi)}
        >
          <div className="program-week-head">
            {input(week.name, (v) => edit((d) => { d.weeks[wi].name = v; }), { className: "program-week-name", "aria-label": "Week name" })}
            {/* week 2 on: make this week a copy of the one before it (days, exercises, sets), keeping its own name */}
            {wi > 0 && (
              <button
                className="btn btn-small-grey program-copy-prev-week"
                title={`Replace ${week.name || `week ${wi + 1}`} with a copy of ${draft.weeks[wi - 1].name || `week ${wi}`}`}
                onClick={() => {
                  const filled = (week.sessions || []).some((s) => (s.exercises || []).some((e) => (e.name || "").trim()));
                  if (filled && !window.confirm(`Replace everything in ${week.name || `week ${wi + 1}`} with a copy of ${draft.weeks[wi - 1].name || `week ${wi}`}? (You can undo with Ctrl+Z.)`)) return;
                  edit((d) => { const c = copyWeek(d.weeks[wi - 1], wi + 1); c.name = d.weeks[wi].name; d.weeks[wi] = c; });
                }}
              >
                Copy previous week
              </button>
            )}
            <button className="btn-link program-remove-week" disabled={draft.weeks.length === 1} title="Remove this week" aria-label="Remove this week" onClick={() => edit((d) => { d.weeks.splice(wi, 1); })}>✕</button>
          </div>

          {tableView ? (
            <window.ProgramTableWeek
              week={week}
              wi={wi}
              edit={edit}
              newExercise={newExercise}
              newSession={newSession}
              maxDays={MAX_DAYS}
              onNameFocus={(w, s, e, name) => { nameAtFocus.current = { wi: w, si: s, ei: e, name }; }}
              onNameBlur={(w, s, e) => offerSwapForward(w, s, e)}
              onProgress={window.ProgramProgressDialog ? (s, letter) => setProgress({ si: s, letter: letter || null }) : null}
              reedPicker={reedDrills ? reedPicker : null}
            />
          ) : (
          /* The week is a grid: each row is one exercise slot shared by every day (Day 1's A1 level with Day 2's A1),
             under the day names and warm-ups; each day spans all the rows (subgrid). */
          <div className="program-days program-grid" style={{ gridTemplateRows: `repeat(${weekRowsOf(week)}, auto)` }}>
            {week.sessions.map((session, si) => {
              const labels = window.exerciseLabels(session.exercises);
              const weekLabels = labelRowsOf(week);
              // the letter of the last block in this day, and the letter a new block would take (for the add buttons)
              const lastLetter = labels.length ? labels[labels.length - 1].replace(/[^A-Za-z]/g, "") : "";
              const blockLetters = { last: lastLetter, next: lastLetter ? String.fromCharCode(lastLetter.charCodeAt(lastLetter.length - 1) + 1) : "A" };
              const setEx = (ei, key, v) => edit((d) => { d.weeks[wi].sessions[si].exercises[ei][key] = v; });
              // The set lines are laid out like a sheet: sets, reps, intensity, tempo and rest each in a column of their
              // own, the same for every exercise in the day, so A1, A2, B1… line up down the day. A column (intensity,
              // tempo, rest) is there when any exercise in the day shows it; an exercise without one leaves it blank.
              const shownOf = (ex, ei) => {
                const k = ex.id || `${wi}-${si}-${ei}`, o = (f) => !!opened[`${k}:${f}`];
                return { int: ex.intensityUnit !== "" && (ex.groups.some((g) => `${g.intensity || ""}`.trim()) || o("int")), tempo: !!`${ex.tempo || ""}`.trim() || o("tempo"), rest: !!`${ex.rest || ""}`.trim() || o("rest") };
              };
              const dayCols = session.exercises.reduce((c, ex, ei) => { const s = shownOf(ex, ei); return { int: c.int || s.int, tempo: c.tempo || s.tempo, rest: c.rest || s.rest }; }, { int: false, tempo: false, rest: false });
              const lineCols = ["[sets] 32px [x] 10px [reps] 44px", dayCols.int ? "[at] 10px [int] 38px [unit] 46px" : "", dayCols.tempo ? "[tempo] 44px" : "", dayCols.rest ? "[rest] 44px" : "", "[more] 26px [del] 18px [end]"].filter(Boolean).join(" ");
              return (
                <div
                  className={`program-day ${focusSet && focusSet.wi === wi && focusSet.si !== si ? "day-dimmed" : ""} ${dayOver === `${wi}|${si}` ? "day-drop-over" : ""}`}
                  style={{ gridRow: `1 / span ${weekRowsOf(week)}` }}
                  key={si}
                  onDragOver={(e) => { if (dayDrag.current) { e.preventDefault(); if (dayOver !== `${wi}|${si}`) setDayOver(`${wi}|${si}`); } }}
                  onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDayOver(null); }}
                  onDrop={(e) => { if (!dayDrag.current) return; e.preventDefault(); const from = dayDrag.current; dayDrag.current = null; setDayOver(null); moveDay(from.wi, from.si, wi, si); }}
                >
                  <div className="program-session-head">
                    {/* drag this grip to put the day somewhere else in the week (or in another week) */}
                    <span
                      className="program-day-grip"
                      draggable
                      title="Drag to move this day"
                      aria-hidden="true"
                      onDragStart={(e) => { dayDrag.current = { wi, si }; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", session.name || ""); const card = e.currentTarget.closest(".program-day"); if (card && e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(card, 24, 18); }}
                      onDragEnd={() => { dayDrag.current = null; setDayOver(null); }}
                    >⠿</span>
                    <input type="checkbox" className="program-tick" title="Tick this whole day: to copy it (Ctrl+C), or as the day to paste into (Ctrl+V)" aria-label={`Select ${session.name || `Day ${si + 1}`}`} checked={dayTicked(wi, si)} onChange={() => toggleDay(wi, si)} />
                    {input(session.name, (v) => edit((d) => { d.weeks[wi].sessions[si].name = v; }), { className: "program-session-name", "aria-label": "Day name" })}
                    {progressBtn(si)}
                    {/* a box on every exercise in this day at once (addToDay) */}
                    <select className="pe-day-more" value="" title="Add a box to every exercise in this day: tempo, rest, intensity, time, distance…" aria-label="Add a box to every exercise in this day" onChange={(e) => addToDay(wi, si, e.target.value)}>
                      <option value="" disabled hidden>+ all</option>
                      <option value="tempo">Tempo on every exercise</option>
                      <option value="rest">Rest on every exercise</option>
                      <option value="%">Percentage on every exercise</option>
                      <option value="RPE">RPE on every exercise</option>
                      <option value="RIR">RIR on every exercise</option>
                      <option value="lb">Weight (lb) on every exercise</option>
                      <option value="kg">Weight (kg) on every exercise</option>
                      <option value="x:Time">Time on every exercise</option>
                      <option value="x:Distance">Distance on every exercise</option>
                      <option value="x:Speed">Speed on every exercise</option>
                      <option value="custom">A box you name, on every exercise…</option>
                    </select>
                    {/* the same move without dragging, for a tablet: one place earlier or later in the week */}
                    <button className="btn-link" title="Move this day earlier" aria-label="Move this day earlier" disabled={si === 0} onClick={() => moveDay(wi, si, wi, si - 1)}>‹</button>
                    <button className="btn-link" title="Move this day later" aria-label="Move this day later" disabled={si === week.sessions.length - 1} onClick={() => moveDay(wi, si, wi, si + 1)}>›</button>
                    <button className="btn-link" title="Remove this day" disabled={week.sessions.length === 1} onClick={() => edit((d) => { d.weeks[wi].sessions.splice(si, 1); })}>✕</button>
                  </div>
                  <textarea
                    className="program-warmup"
                    rows={2}
                    value={session.warmup || ""}
                    placeholder="Warm-up (optional), shown above A1"
                    onChange={(e) => edit((d) => { d.weeks[wi].sessions[si].warmup = e.target.value; })}
                  />
                  {session.exercises.map((ex, ei) => (
                    <div className="pe-slot" key={ex.id || ei} style={{ gridRow: 3 + Math.max(0, weekLabels.indexOf(labels[ei])) }}>
                    <div
                      className={`program-ex ${ei > 0 && ex.linked ? "superset-linked" : ""} ${focusSet && focusSet.wi === wi && focusSet.si === si ? (focusSet.letter === labels[ei].replace(/\d+\.$/, "") ? "set-focused" : "set-dimmed") : ""}`}
                      key={ex.id || ei}
                      onMouseDown={() => pickSet(wi, si, labels[ei])}
                      onFocusCapture={() => pickSet(wi, si, labels[ei])}
                    >
                      <div className="program-ex-top">
                        {/* ticks the whole block (this exercise and any supersetted under it), for copy and paste */}
                        {!(ei > 0 && ex.linked) ? (
                          <input type="checkbox" className="program-tick" title={`Tick the whole ${labels[ei].replace(/[^A-Za-z]/g, "")} block: to copy it (Ctrl+C), or to paste into this day (Ctrl+V)`} aria-label={`Select the ${labels[ei].replace(/[^A-Za-z]/g, "")} block`} checked={blockTicked(wi, si, ei)} onChange={() => toggleBlock(wi, si, ei)} />
                        ) : (
                          // A2, A3… keep the tick's room, so their labels and names line up under A1's
                          <input type="checkbox" className="program-tick" style={{ visibility: "hidden" }} tabIndex={-1} aria-hidden="true" disabled />
                        )}
                        {/* the label is a picker: choose another letter to move this exercise into that superset */}
                        <select
                          className="superset-pick"
                          value="__here__"
                          title="Change which superset this exercise belongs to"
                          onChange={(e) => {
                            const v = e.target.value;
                            if (v === "__here__") return;
                            if (v === "__progress__") { setProgress({ si, letter: labels[ei].replace(/\d+\.$/, "") }); return; }
                            edit((d) => { const s = d.weeks[wi].sessions[si]; s.exercises = moveToSuperset(s.exercises, ei, v); });
                          }}
                        >
                          <option value="__here__">{labels[ei]}</option>
                          {window.ProgramProgressDialog && <option value="__progress__">↗ Progress the {labels[ei].replace(/\d+\.$/, "")} series across the weeks…</option>}
                          {[...new Set(labels.map((l) => l.replace(/\d+\.$/, "")))].filter((l) => l !== labels[ei].replace(/\d+\.$/, "")).map((l) => <option key={l} value={l}>Move to {l}</option>)}
                          <option value="__new__">Its own superset</option>
                        </select>
                        {/* order within the superset: move this exercise earlier or later (A2 up to A1) */}
                        {(() => {
                          const letter = (i) => (labels[i] || "").replace(/\d+\.$/, "");
                          const canUp = ei > 0 && letter(ei - 1) === letter(ei);
                          const canDown = ei < session.exercises.length - 1 && letter(ei + 1) === letter(ei);
                          const move = (dir) => edit((d) => { const s = d.weeks[wi].sessions[si]; s.exercises = swapInSuperset(s.exercises, ei, dir); });
                          // an exercise on its own keeps the arrows' room (hidden), so its name lines up with the others
                          return (
                            <span className="superset-order" style={!canUp && !canDown ? { visibility: "hidden" } : undefined} aria-hidden={!canUp && !canDown ? "true" : undefined}>
                              <button title="Move earlier in this superset" disabled={!canUp} onClick={() => move(-1)}>▲</button>
                              <button title="Move later in this superset" disabled={!canDown} onClick={() => move(1)}>▼</button>
                            </span>
                          );
                        })()}
                        {/* the name sits on the same line as the label and buttons, taking the room between them */}
                        <ExerciseNameField
                          value={ex.name}
                          onChange={(v) => setEx(ei, "name", v)}
                          onFocus={() => { nameAtFocus.current = { wi, si, ei, name: ex.name }; }}
                          onBlur={() => offerSwapForward(wi, si, ei)}
                          row={`${ei}.name`}
                        />
                        {window.AthleteStore.findExerciseByName(ex.name) && (
                          <button className="exercise-view-btn" title="View this exercise from the library" onClick={() => window.openExercise(ex.name)}>▶</button>
                        )}
                        {ei > 0 && (
                          <button
                            className={`superset-toggle ${ex.linked ? "on" : ""}`}
                            title={ex.linked ? "Superset with the exercise above. Click to separate." : "Superset with the exercise above"}
                            onClick={() => edit((d) => { const e = d.weeks[wi].sessions[si].exercises[ei]; e.linked = !e.linked; })}
                          >
                            {ex.linked ? "Linked" : "Link"}
                          </button>
                        )}
                        <button className="btn-link" title="Remove exercise" onClick={() => edit((d) => { d.weeks[wi].sessions[si].exercises.splice(ei, 1); })}>✕</button>
                      </div>
                      {/* a Re-Ed placeholder in an athlete's program: pick one of their re-ed drills */}
                      {reedPicker(wi, si, ei, ex, "pe-reed")}
                      {/* Set lines: each is sets x reps, and an intensity when the exercise has one, so it can change set to
                          set. Intensity, tempo, rest and notes are optional: each shows once it has something in it, or after
                          the "+" at the end of the first line, so most exercises are a single short row. */}
                      {(() => {
                        const k = ex.id || `${wi}-${si}-${ei}`;
                        const isOpen = (f) => !!opened[`${k}:${f}`];
                        const open = (f) => setOpened((o) => ({ ...o, [`${k}:${f}`]: true }));
                        const showInt = ex.intensityUnit !== "" && (ex.groups.some((g) => `${g.intensity || ""}`.trim()) || isOpen("int"));
                        const showTempo = !!`${ex.tempo || ""}`.trim() || isOpen("tempo");
                        const showRest = !!`${ex.rest || ""}`.trim() || isOpen("rest");
                        const showNotes = !!`${ex.notes || ""}`.trim() || notesOpen === ex.id;
                        const extras = Array.isArray(ex.extras) ? ex.extras : [];
                        const hasExtra = (label) => extras.some((x) => (x.label || "").toLowerCase() === label.toLowerCase());
                        const addExtra = (label) => edit((d) => { const e = d.weeks[wi].sessions[si].exercises[ei]; e.extras = [...(Array.isArray(e.extras) ? e.extras : []), { label, value: "" }]; });
                        const setExtra = (xi, v) => edit((d) => { d.weeks[wi].sessions[si].exercises[ei].extras[xi].value = v; });
                        // an extra box stays, empty or not (empty, the athlete writes in their own), until its ✕ takes it off
                        const removeExtra = (xi) => edit((d) => { d.weeks[wi].sessions[si].exercises[ei].extras.splice(xi, 1); });
                        // what the "+" adds: another line of sets, an intensity, tempo, rest, notes, or an extra box
                        const addField = (what) => {
                          if (what === "sets") edit((d) => { d.weeks[wi].sessions[si].exercises[ei].groups.push(newSetGroup()); });
                          else if (what === "%" || what === "RIR" || what === "RPE" || what === "lb" || what === "kg") { setEx(ei, "intensityUnit", what); open("int"); }
                          else if (what === "notes") setNotesOpen(ex.id);
                          else if (what === "tempo" || what === "rest") open(what);
                          else if (what === "custom") {
                            window.askText({ title: "New box", text: `Added to ${ex.name || "this exercise"}.`, placeholder: "Height, Load, Holds…", maxLength: 20 }).then((label) => { if (label) addExtra(label); });
                          } else if (what.startsWith("x:")) addExtra(what.slice(2));
                          else if (what === "edt") setEx(ei, "edt", "");
                          else if (what === "acc") setEx(ei, "accumulate", true);
                          else if (what === "with") setEx(ei, "withSets", "");
                        };
                        // EDT (on a block's first exercise: the whole block is done back to back for so many minutes,
                        // the athlete logs the sets) and Accumulate (the reps box is a time built up in as many sets as
                        // it takes). Both give the athlete a timer on their phone (program_rx.js, athlete.js). An EDT
                        // or iso written into the notes / name the old way shows here too, and ✕ turns it off.
                        const blockFirst = !(ei > 0 && ex.linked);
                        const edtSet = ex.edt !== undefined && ex.edt !== 0;
                        const showEdt = blockFirst && (edtSet || !!window.ProgramRx.edtMinutes(ex));
                        const accOn = ex.groups.some((g) => window.ProgramRx.accumulated(ex, g)) || ex.accumulate === true;
                        // a superset partner that goes with only some of the first exercise's sets (A2 "with sets 1-2",
                        // A3 "with sets 3-4"), so a 4x5 with a changing partner stays one series (ProgramRx.withSetsText)
                        const showWith = !blockFirst && ex.withSets != null;
                        return (
                          <React.Fragment>
                            {ex.groups.map((g, gi) => {
                              const setG = (key, v) => edit((d) => { d.weeks[wi].sessions[si].exercises[ei].groups[gi][key] = v; });
                              return (
                                <div className="program-ex-group pe-grid" key={gi} style={{ gridTemplateColumns: lineCols }}>
                                  {input(g.sets, (v) => setG("sets", v), { placeholder: "Sets", className: "pe-num pe-sets", title: "Sets (leave blank for one set)", style: { gridColumn: "sets" }, "data-cell": "sets", "data-row": `${ei}.${gi}` })}
                                  <span style={{ gridColumn: "x" }}>×</span>
                                  {input(g.reps, (v) => setG("reps", v), { placeholder: "Reps", className: "pe-num pe-reps", title: "Reps", style: { gridColumn: "reps" }, "data-cell": "reps", "data-row": `${ei}.${gi}` })}
                                  {showInt && <span style={{ gridColumn: "at" }}>@</span>}
                                  {showInt && input(g.intensity, (v) => setG("intensity", v), { placeholder: ex.intensityUnit === "%" ? "%" : ex.intensityUnit, className: "pe-num", autoFocus: gi === 0 && isOpen("int") && !`${g.intensity || ""}`.trim(), title: `Intensity (${ex.intensityUnit})`, style: { gridColumn: "int" }, "data-cell": "int", "data-row": `${ei}.${gi}` })}
                                  {showInt && gi === 0 && (
                                    <select className="pe-unit" style={{ gridColumn: "unit" }} value={ex.intensityUnit} title="How intensity is prescribed: % of max, RIR, RPE, or none (removes it)" onChange={(e) => setEx(ei, "intensityUnit", e.target.value)}>
                                      {INTENSITY_UNITS.map(([v, label]) => <option key={v} value={v} title={label}>{v || "None"}</option>)}
                                    </select>
                                  )}
                                  {gi === 0 && showTempo && input(ex.tempo, (v) => setEx(ei, "tempo", v), { placeholder: "Tempo", className: "pe-num pe-wide", maxLength: 10, autoFocus: isOpen("tempo") && !ex.tempo, title: "Tempo: eccentric, iso, concentric. 30* = 3 seconds down, no pause, explosive up; *5* (or 050) = a 5-second iso; 6-1 = descending isos from 6 seconds to 1, 6-1-6 down and back up.", style: { gridColumn: "tempo" }, "data-cell": "tempo", "data-row": `${ei}.${gi}` })}
                                  {gi === 0 && showRest && input(ex.rest, (v) => setEx(ei, "rest", v), { placeholder: "Rest", className: "pe-num pe-wide", autoFocus: isOpen("rest") && !ex.rest, title: "Rest", style: { gridColumn: "rest" }, "data-cell": "rest", "data-row": `${ei}.${gi}` })}
                                  {/* "+" at the end of the first line: a menu of what can be added (only what isn't showing yet) */}
                                  {gi === 0 && (
                                    <select className="pe-more" style={{ gridColumn: "more" }} value="" title="Add another line of sets, an intensity, tempo, rest, time, distance, speed, a box you name, or notes" onChange={(e) => addField(e.target.value)}>
                                      <option value="" disabled hidden>+</option>
                                      <option value="sets">Another line of sets</option>
                                      {!showInt && <option value="%">Percentage</option>}
                                      {!showInt && <option value="RIR">RIR</option>}
                                      {!showInt && <option value="RPE">RPE</option>}
                                      {!showInt && <option value="lb">Weight (lb)</option>}
                                      {!showInt && <option value="kg">Weight (kg)</option>}
                                      {!showTempo && <option value="tempo">Tempo</option>}
                                      {!showRest && <option value="rest">Rest</option>}
                                      {!hasExtra("Time") && <option value="x:Time">Time</option>}
                                      {!hasExtra("Distance") && <option value="x:Distance">Distance</option>}
                                      {!hasExtra("Speed") && <option value="x:Speed">Speed</option>}
                                      <option value="custom">Custom…</option>
                                      {blockFirst && !showEdt && <option value="edt">EDT block (timed, log sets)</option>}
                                      {!accOn && <option value="acc">Accumulate time (log sets)</option>}
                                      {!blockFirst && !showWith && <option value="with">Goes with only some of {labels[ei].replace(/\d+\.$/, "")}1's sets…</option>}
                                      {!showNotes && <option value="notes">Notes/cues</option>}
                                    </select>
                                  )}
                                  {ex.groups.length > 1 && <button className="btn-link pe-x" style={{ gridColumn: "del" }} title="Remove this line" onClick={() => edit((d) => { d.weeks[wi].sessions[si].exercises[ei].groups.splice(gi, 1); })}>✕</button>}
                                  {/* boxes added with the "+" (Time, Distance…), EDT and Accumulate: a line of their own under the
                                      first set line, so they never push the columns out of line */}
                                  {gi === 0 && (extras.length > 0 || showEdt || accOn || showWith) && (
                                    <div className="pe-extras" style={{ gridColumn: "1 / -1" }}>
                                      {showWith && (
                                        <span className="pe-tag pe-with" title={`Which of ${labels[ei].replace(/\d+\.$/, "")}1's sets this goes with, for example 1-2 (and the next exercise 3-4). The athlete sees "With sets 1–2".`}>
                                          with sets
                                          {input(ex.withSets, (v) => setEx(ei, "withSets", v.replace(/[^\d\s,–-]/g, "")), { placeholder: "1-2", className: "pe-num pe-tag-min", autoFocus: ex.withSets === "", "aria-label": "With sets" })}
                                          <button className="btn-link pe-x" title="Goes with every set" onClick={() => edit((d) => { delete d.weeks[wi].sessions[si].exercises[ei].withSets; })}>✕</button>
                                        </span>
                                      )}
                                      {extras.map((x, xi) => (
                                        <span className="pe-extra" key={xi}>
                                          <span className="pe-xlabel" title={x.label}>{x.label}</span>
                                          {input(x.value, (v) => setExtra(xi, v), { placeholder: x.label, className: "pe-num pe-wide", autoFocus: !`${x.value || ""}`.trim(), title: `${x.label}: a target, or leave it empty for the athlete to write in their own`, "data-cell": `x:${x.label}`, "data-row": `${ei}.${gi}` })}
                                          <button className="btn-link pe-x" title={`Remove the ${x.label} box`} onClick={() => removeExtra(xi)}>✕</button>
                                        </span>
                                      ))}
                                      {showEdt && (
                                        <span className="pe-tag" title={`EDT: ${labels[ei].replace(/\d+\.$/, "")}1, ${labels[ei].replace(/\d+\.$/, "")}2… done back to back for this many minutes. The athlete gets a countdown and logs how many sets (times through) they got.`}>
                                          EDT
                                          {input(edtSet ? `${ex.edt}` : `${window.ProgramRx.edtMinutes(ex)}`, (v) => setEx(ei, "edt", v.replace(/[^\d.]/g, "")), { placeholder: "min", className: "pe-num pe-tag-min", autoFocus: ex.edt === "", "aria-label": "EDT minutes", "data-cell": "edt", "data-row": `${ei}.${gi}` })}
                                          min
                                          <button className="btn-link pe-x" title="Not an EDT block" onClick={() => setEx(ei, "edt", 0)}>✕</button>
                                        </span>
                                      )}
                                      {accOn && (
                                        <span className="pe-tag" title={`Accumulate: the time in Reps (${ex.groups.map((g) => g.reps).filter(Boolean).join(", ") || "for example 3 MIN, or 3 MIN E for each side"}) is built up in as many sets as it takes. The athlete gets a timer that counts the sets, and logs them (left and right on a sided one).${ex.accumulate === true ? "" : " On by itself because this is an iso longer than a minute."}`}>
                                          ⏱ Accumulate{ex.accumulate === true ? "" : " (auto)"}
                                          <button className="btn-link pe-x" title="Not accumulated time" onClick={() => setEx(ei, "accumulate", false)}>✕</button>
                                        </span>
                                      )}
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                            {(window.ProgramRx.text(ex) || window.ProgramRx.extrasText(ex)) && <div className="program-ex-preview">{[window.ProgramRx.text(ex), window.ProgramRx.extrasText(ex)].filter(Boolean).join(" · ")}</div>}
                            {showNotes && input(ex.notes, (v) => setEx(ei, "notes", v), { placeholder: "Notes: cues", className: "program-ex-notes", "data-cell": "notes", "data-row": `${ei}.notes`, autoFocus: notesOpen === ex.id, onFocus: () => setNotesOpen(ex.id), onBlur: () => setNotesOpen((id) => (id === ex.id ? null : id)) })}
                          </React.Fragment>
                        );
                      })()}
                    </div>
                    {/* under the last exercise of each block: add another exercise to that block (a superset: A2, A3…) */}
                    {!(session.exercises[ei + 1] && session.exercises[ei + 1].linked) && (
                      <button
                        className="btn btn-small-grey program-add-to-block"
                        title="Adds the next exercise to this block, as a superset (A1, A2…)"
                        onClick={() => edit((d) => { d.weeks[wi].sessions[si].exercises.splice(ei + 1, 0, { ...newExercise(), linked: true }); })}
                      >
                        Add {(() => { const m = /^([A-Za-z]+)([0-9]+)/.exec(labels[ei] || ""); return m ? `${m[1]}${Number(m[2]) + 1}.` : "exercise"; })()}
                      </button>
                    )}
                    </div>
                  ))}
                  <div className="program-day-actions">
                    <button className="program-add-block" title="Starts a new block of exercises" onClick={() => edit((d) => { d.weeks[wi].sessions[si].exercises.push(newExercise()); })}><span className="program-add-block-plus" aria-hidden="true">+</span>Add {blockLetters.next} Block</button>
                  </div>
                </div>
              );
            })}
            {/* a week holds at most seven days */}
            {week.sessions.length < MAX_DAYS && <button className="program-add-day" style={{ gridRow: `1 / span ${weekRowsOf(week)}` }} onClick={() => edit((d) => { if (d.weeks[wi].sessions.length < MAX_DAYS) d.weeks[wi].sessions.push(newSession(d.weeks[wi].sessions.length + 1)); })}>+ Add day</button>}
          </div>
          )}
        </div>
      ))}
      <button className="program-add-week" title="Adds a week that copies the one before it" onClick={() => edit((d) => { const n = d.weeks.length; d.weeks.push(n ? copyWeek(d.weeks[n - 1], n + 1) : newWeek(1)); })}>+ Add week (copies the last week)</button>

      {progress && window.ProgramProgressDialog && (
        <window.ProgramProgressDialog
          weeks={draft.weeks}
          si={progress.si}
          letter={progress.letter}
          onLetter={(l) => setProgress((p) => ({ ...p, letter: l }))}
          edit={edit}
          undo={undo}
          canUndo={history.current.past.length > 0}
          onClose={() => setProgress(null)}
        />
      )}
      {/* changed an exercise that also sits in the same spot in other weeks: change it there too? */}
      {swapAsk && ReactDOM.createPortal(
        <div className="zoom-overlay" onClick={() => setSwapAsk(null)}>
          <div className="zoom-modal program-swap-ask" onClick={(e) => e.stopPropagation()}>
            <h2>Change it in other weeks too?</h2>
            <p>You changed <strong>{swapAsk.oldName}</strong> to <strong>{swapAsk.newName}</strong> at {swapAsk.spot.replace(/\.$/, "")}. It's in the same spot in {[...swapAsk.earlier, ...swapAsk.later].map((i) => draft.weeks[i].name || `Week ${i + 1}`).join(", ")}.</p>
            <div className="program-swap-actions">
              {swapAsk.earlier.length > 0 && <button className="btn" onClick={() => applySwap([...swapAsk.earlier, ...swapAsk.later])}>Every week</button>}
              {swapAsk.later.length > 0 && <button className={swapAsk.earlier.length ? "btn btn-secondary" : "btn"} onClick={() => applySwap(swapAsk.later)}>{swapAsk.earlier.length ? "This week and the ones after" : "This week and every week after"}</button>}
              <button className="btn btn-secondary" onClick={() => setSwapAsk(null)}>Just this week</button>
            </div>
          </div>
        </div>,
        document.body
      )}
      <div className="facility-form-actions">
        {!autoSave && <button className="btn" disabled={!canSave} onClick={save}>Save program</button>}
        {onCancel && <button className={autoSave ? "btn" : "btn-link"} onClick={onCancel}>{cancelLabel || (autoSave ? "Done" : "Cancel")}</button>}
        {autoSave && <span className={`program-autosave ${saveState}`}>{saveState === "saved" ? "✓ Saved automatically" : saveState === "pending" ? "Saving…" : "Give the program a name and it saves automatically"}</span>}
        {initial && initial.id && onDelete && <button className="btn-link" style={{ marginLeft: "auto" }} onClick={onDelete}>Delete program</button>}
      </div>
    </div>
  );
}

// Athletes whose periodization chart already has a block linked to this program.
const athletesOnProgram = (programId) =>
  window.AthleteStore.allPeriodizationAthleteIds().filter((id) => {
    const plan = window.AthleteStore.getPeriodization(id);
    return plan && (plan.blocks || []).some((b) => b.programId === programId);
  });

// "Sykora" from "Travis Sykora"; a trailing Jr. / Sr. / II / III is skipped.
const athleteLastName = (name) => {
  const parts = (name || "").trim().split(/\s+/).filter((p) => !/^(jr\.?|sr\.?|ii|iii|iv)$/i.test(p));
  return parts[parts.length - 1] || (name || "").trim();
};

// Individualize an assigned program for one athlete: swap exercises, adjust sets and reps week by week, then
// save it as a new program named "<Last name> - <Program>" and point the athlete's chart at that copy.
function ProgramIndividualize({ program, athlete, onDone, skipLink = false }) {
  const own = String(program.athleteId) === String(athlete.id);
  const S = window.AthleteStore;
  const [weeks, setWeeks] = useState(() => normalizeProgramWeeks(JSON.parse(JSON.stringify(program.weeks || []))));
  // Swaps go by spot, not just by name: an exercise is the same one from week to week when it has the same
  // name on the same day in the same place (A2, B2…). So a placeholder used twice in a day, such as "Re-Ed" at
  // A2 and again at B2, is listed twice and each can be given its own replacement, which then applies to that
  // spot in every week.
  const [swaps, setSwaps] = useState({}); // spot key -> replacement
  const newName = own ? program.name : `${athleteLastName(athlete.name)} - ${program.name}`;
  const named = (e) => (e.name || "").trim();
  const spotOf = new Map(); // exercise -> its spot key
  // every spot in the program, once, in the order it first appears
  const unique = [];
  weeks.forEach((w) => (w.sessions || []).forEach((s, si) => {
    const labels = window.exerciseLabels(s.exercises || []);
    (s.exercises || []).forEach((e, ei) => {
      if (!named(e)) return;
      const label = (labels[ei] || "").replace(/\.$/, "");
      const key = `${si}|${label}|${named(e).toLowerCase()}`;
      spotOf.set(e, key);
      if (!unique.some((x) => x.key === key)) unique.push({ key, name: named(e), where: `${s.name || `Day ${si + 1}`} · ${label}` });
    });
  }));
  const shownName = (e) => { const typed = swaps[spotOf.get(e)]; return typed != null && typed.trim() ? typed.trim() : named(e); };
  const changed = unique.filter((u) => swaps[u.key] && swaps[u.key].trim() && swaps[u.key].trim() !== u.name).length;

  const maxDays = Math.max(0, ...weeks.map((w) => (w.sessions || []).length));
  const setCell = (wi, si, ei, gi, key, v) => setWeeks((ws) => { const c = JSON.parse(JSON.stringify(ws)); c[wi].sessions[si].exercises[ei].groups[gi][key] = v; return c; });

  const save = () => {
    const finalWeeks = JSON.parse(JSON.stringify(weeks));
    finalWeeks.forEach((w, wi) => (w.sessions || []).forEach((s, si) => (s.exercises || []).forEach((e, ei) => { e.name = shownName(weeks[wi].sessions[si].exercises[ei]); })));
    // a program that's already this athlete's own is updated in place; a shared one is copied for them
    const saved = own
      ? S.saveProgram({ ...program, weeks: finalWeeks })
      : S.saveProgram({ name: newName, description: program.description || "", weeks: finalWeeks, folder: program.folder || "", basedOn: program.id, athleteId: athlete.id, nextProgramIds: program.nextProgramIds || [] });
    // the athlete's chart now points at their own copy instead of the shared program
    // (when opened from the athlete's periodization, that page relinks its own block instead)
    const plan = S.getPeriodization(athlete.id);
    if (!own && !skipLink && plan && (plan.blocks || []).some((b) => b.programId === program.id)) {
      const next = JSON.parse(JSON.stringify(plan));
      next.blocks.forEach((b) => { if (b.programId === program.id) { b.programId = saved.id; if (b.label === program.name) b.label = saved.name; } });
      S.setPeriodization(athlete.id, next);
    }
    onDone(saved);
  };

  return (
    <div className="panel">
      <datalist id="individualize-exercise-names">
        {S.allExercises().map((e) => <option key={e.id} value={e.name} />)}
      </datalist>
      {/* a way out at the top as well as the bottom: this screen can be long */}
      <button className="btn btn-small-grey no-print" style={{ marginBottom: 10 }} onClick={() => onDone(null)}>← Back without saving</button>
      <h2>Individualize for {athlete.name} <small>saves as “{newName}”</small></h2>

      <h3 className="indiv-heading">1. Exercises <small>Type a replacement to swap an exercise in that spot (the same day and place, such as Day 1 · A2) in every week. Leave blank to keep it.</small></h3>
      <div className="indiv-swaps">
        {unique.map((u) => (
          <div className="indiv-swap" key={u.key}>
            <div className="indiv-swap-from">
              {S.findExerciseByName(u.name) ? <button className="exercise-link" onClick={() => window.openExercise(u.name)}>{u.name}</button> : u.name}
              <small>{u.where}</small>
            </div>
            <span className="indiv-arrow">→</span>
            <input list="individualize-exercise-names" value={swaps[u.key] || ""} placeholder="Keep as is" onChange={(e) => setSwaps((s) => ({ ...s, [u.key]: e.target.value }))} />
          </div>
        ))}
        {unique.length === 0 && <div className="empty-state">This program has no exercises yet.</div>}
      </div>

      <h3 className="indiv-heading">2. Sets and reps by week <small>{changed ? `${changed} exercise${changed === 1 ? "" : "s"} swapped. ` : ""}Each line is sets × reps @ intensity.</small></h3>
      {Array.from({ length: maxDays }, (_, si) => {
        const rows = Math.max(0, ...weeks.map((w) => ((w.sessions[si] || {}).exercises || []).length));
        const dayName = ((weeks.find((w) => w.sessions[si]) || {}).sessions || [])[si];
        return (
          <div className="indiv-day" key={si}>
            <h4>{(dayName && dayName.name) || `Day ${si + 1}`}</h4>
            <div className="indiv-grid-wrap">
              <table className="indiv-grid">
                <thead><tr><th>Exercise</th>{weeks.map((w, wi) => <th key={wi}>{w.name || `Week ${wi + 1}`}</th>)}</tr></thead>
                <tbody>
                  {Array.from({ length: rows }, (_, ei) => {
                    const first = weeks.map((w) => ((w.sessions[si] || {}).exercises || [])[ei]).find((e) => e && named(e));
                    if (!first) return null;
                    const labels = window.exerciseLabels(((weeks.find((w) => w.sessions[si]) || {}).sessions[si] || {}).exercises || []);
                    return (
                      <tr key={ei}>
                        <td className="indiv-ex"><strong className="superset-label">{labels[ei]}</strong> {shownName(first)}</td>
                        {weeks.map((w, wi) => {
                          const e = ((w.sessions[si] || {}).exercises || [])[ei];
                          if (!e || !named(e)) return <td key={wi} className="indiv-empty">—</td>;
                          const other = shownName(e) !== shownName(first);
                          return (
                            <td key={wi}>
                              {other && <div className="indiv-other">{shownName(e)}</div>}
                              {e.groups.map((g, gi) => (
                                <span className="indiv-cell" key={gi}>
                                  <input value={g.sets || ""} aria-label="Sets" placeholder="1" onChange={(ev) => setCell(wi, si, ei, gi, "sets", ev.target.value)} />
                                  <span>×</span>
                                  <input value={g.reps || ""} aria-label="Reps" onChange={(ev) => setCell(wi, si, ei, gi, "reps", ev.target.value)} />
                                  {e.intensityUnit !== "" && <span>@</span>}
                                  {e.intensityUnit !== "" && <input value={g.intensity || ""} aria-label={`Intensity (${e.intensityUnit})`} placeholder={e.intensityUnit} onChange={(ev) => setCell(wi, si, ei, gi, "intensity", ev.target.value)} />}
                                </span>
                              ))}
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })}

      <div className="facility-form-actions">
        <button className="btn" onClick={save}>Save as “{newName}”</button>
        <button className="btn btn-small-grey" onClick={() => onDone(null)}>← Back without saving</button>
      </div>
    </div>
  );
}

// Assign one program to several athletes at once. Each gets a block on their periodization chart, linked to the program.
// The programs suggested to follow this one. An athlete's own copy falls back to its original's suggestions.
const suggestedNextPrograms = (program) => {
  const all = window.AthleteStore.allPrograms();
  const base = program && program.basedOn ? all.find((p) => p.id === program.basedOn) : null;
  const ids = (program && program.nextProgramIds && program.nextProgramIds.length ? program.nextProgramIds : (base && base.nextProgramIds) || []);
  return ids.map((id) => all.find((p) => p.id === id)).filter(Boolean);
};
window.suggestedNextPrograms = suggestedNextPrograms;

// Assigning a program to a speed group (e.g. "DST North Pro Group") instead of to athletes one by one. The

// chosen here, and logs each day as done for whoever is on their board. Nothing is added to any athlete's
// plan or phone app. Groups and assignments are small shared lists in app_meta.
function ProgramGroupAssign({ program, startDate }) {
  const store = window.AthleteStore;

  const [newName, setNewName] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const read = async () => {
    const [g, a] = await Promise.all([store.loadMeta("speedGroups"), store.loadMeta("speedAssignments")]);
    return { g: Array.isArray(g) ? g : [], a: Array.isArray(a) ? a : [] };
  };
  const show = ({ g, a }) => { setGroups([...g].sort((x, y) => x.name.localeCompare(y.name))); setAssigns(a); };
  React.useEffect(() => { read().then(show); /* eslint-disable-next-line */ }, [program.id]);
  const nameOf = (id) => ((groups || []).find((g) => g.id === id) || {}).name || "Unknown group";
  const mine = assigns.filter((a) => a.programId === program.id);

  const assign = async () => {
    setBusy(true);
    const now = await read(); // someone may have changed these in Coach Mode since this panel opened
    let gid = groupId;
    if (gid === "__new__") {
      const name = newName.trim();
      if (!name) { setMsg("Give the group a name."); setBusy(false); return; }
      let g = now.g.find((x) => x.name.toLowerCase() === name.toLowerCase());
      if (!g) {
        g = { id: `${name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")}-${Date.now().toString(36)}`, name };
        now.g.push(g);
        if (!(await store.saveMeta("speedGroups", now.g))) { setMsg("Could not save the group. Try again."); setBusy(false); return; }
      }
      gid = g.id;
    }
    if (!gid) { setMsg("Pick a group."); setBusy(false); return; }
    if (now.a.some((x) => x.groupId === gid && x.programId === program.id && x.startDate === startDate)) {
      show(now); setMsg("Already assigned to that group for that week."); setBusy(false); return;
    }
    now.a.push({ id: `sa-${Math.random().toString(36).slice(2, 10)}`, groupId: gid, programId: program.id, programName: program.name, startDate, by: store.currentUserEmail(), at: new Date().toISOString() });
    const ok = await store.saveMeta("speedAssignments", now.a);
    show(now); setGroupId(gid); setNewName("");
    setMsg(ok ? `Assigned. It shows on the Speed screen in Coach Mode for ${(now.g.find((g) => g.id === gid) || {}).name} from the week of ${startDate}.` : "Could not save. Try again.");
    setBusy(false);
  };
  const remove = async (id) => {
    const now = await read();
    now.a = now.a.filter((x) => x.id !== id);
    if (await store.saveMeta("speedAssignments", now.a)) { show(now); setMsg("Removed from the group. Sessions already logged for athletes stay on their training logs."); }
  };

  return (
    <div className="group-assign">
      <strong>Assign to a group</strong>
      <span>For group speed work led from Coach Mode. The group's coach sees this program's week and days on the Speed screen, starting the week above. It is not added to any athlete's plan or phone app.</span>
      <div className="group-assign-row">
        <select value={groupId} onChange={(e) => { setGroupId(e.target.value); setMsg(""); }} aria-label="Group">
          <option value="">{groups === null ? "Loading groups…" : "Choose a group…"}</option>
          {(groups || []).map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
          <option value="__new__">+ New group…</option>
        </select>
        {groupId === "__new__" && <input value={newName} placeholder="e.g. DST North Pro Group" onChange={(e) => setNewName(e.target.value)} aria-label="New group name" />}
        <button className="btn btn-assign" onClick={assign} disabled={busy || !groupId}>Assign to group</button>
      </div>
      {msg && <div className="timestamp-note">{msg}</div>}
      {mine.length > 0 && (
        <ul className="group-assign-list">
          {mine.map((a) => (
            <li key={a.id}>{nameOf(a.groupId)} · from the week of {a.startDate} <button className="btn-link" onClick={() => remove(a.id)}>Remove</button></li>
          ))}
        </ul>
      )}
    </div>
  );
}

function ProgramAssignPanel({ program, onClose, initialStart, onAssignOther }) {
  const lib = window.PeriodizationLib;
  const [startDate, setStartDate] = useState(() => initialStart || lib.mondayOfToday());
  // the row follows the program (Speed, Arm Care, Throwing, Re-Education, Strength); changed here, every athlete gets that row,
  // and left alone, each athlete's own matching row is used (their Correctives row for a Re-Ed program, say)
  const suggested = window.programLaneName(program, []);
  const [laneName, setLaneNameState] = useState(suggested);
  const [laneTouched, setLaneTouched] = useState(false);
  const setLaneName = (v) => { setLaneNameState(v); setLaneTouched(true); };
  const [query, setQuery] = useState("");
  const [picked, setPicked] = useState(() => new Set());
  const [result, setResult] = useState(null);
  const already = new Set(athletesOnProgram(program.id).map(String));
  const athletes = window.AthleteStore.allAthletes()
    .filter((a) => (a.status || "active").toLowerCase() !== "alumni")
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  const q = query.trim().toLowerCase();
  const shown = athletes.filter((a) => !q || [a.name, a.team, a.dstLocation, a.position].some((v) => (v || "").toLowerCase().includes(q)));
  const weeks = (program.weeks || []).length;

  const toggle = (id) => setPicked((s) => { const n = new Set(s); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  const pickShown = () => setPicked((s) => { const n = new Set(s); shown.forEach((a) => { if (!already.has(String(a.id))) n.add(a.id); }); return n; });

  const [assigned, setAssigned] = useState([]); // athletes assigned in this visit, offered for individualizing
  const [individualizing, setIndividualizing] = useState(null); // athlete whose copy is being edited
  const [individualized, setIndividualized] = useState({}); // athlete id -> name of the saved copy

  const assign = () => {
    const out = { added: [], created: [], already: [], failed: [] };
    const done = [];
    athletes.filter((a) => picked.has(a.id)).forEach((a) => {
      const r = lib.assignProgram(a.id, program, { startDate, laneName: laneTouched ? laneName : "" });
      (out[r] || out.failed).push(a.name);
      if (r === "added" || r === "created") done.push(a);
    });
    setResult(out);
    setAssigned((prev) => [...prev, ...done.filter((a) => !prev.some((p) => p.id === a.id))]);
    setPicked(new Set());
  };

  if (individualizing) {
    return (
      <ProgramIndividualize
        program={program}
        athlete={individualizing}
        onDone={(saved) => { if (saved) setIndividualized((m) => ({ ...m, [individualizing.id]: saved.name })); setIndividualizing(null); }}
      />
    );
  }

  return (
    <div className="panel">
      <h2>Assign “{program.name}” <small>{weeks} week{weeks === 1 ? "" : "s"}</small></h2>
      <div className="facility-form-grid">
        <label className="facility-field"><span>Starts the week of</span>
          <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} />
        </label>
        <label className="facility-field"><span>Row on the periodization chart</span>
          <input list="program-assign-lanes" value={laneName} onChange={(e) => setLaneName(e.target.value)} />
          <datalist id="program-assign-lanes">
            {["Strength", "Speed", "Re-Education", "Arm Care", "Throwing", "Running", "Phase"].map((n) => <option key={n} value={n} />)}
          </datalist>
        </label>
      </div>
      <ProgramGroupAssign program={program} startDate={startDate} />
      <div className="facility-toolbar" style={{ marginBottom: 0 }}>
        <input className="facility-search" value={query} placeholder="Search by name, team, location, or position" onChange={(e) => setQuery(e.target.value)} />
        <button className="btn-link" onClick={pickShown}>Select all shown</button>
        <button className="btn-link" onClick={() => setPicked(new Set())}>Clear</button>
      </div>
      <div className="program-assign-list">
        {shown.map((a) => {
          const has = already.has(String(a.id));
          return (
            <label key={a.id}>
              <input type="checkbox" disabled={has} checked={has || picked.has(a.id)} onChange={() => toggle(a.id)} />
              <span>{a.name} {has && <small>(already assigned)</small>}</span>
            </label>
          );
        })}
        {shown.length === 0 && <div className="empty-state">No athletes match that search.</div>}
      </div>
      {result && (
        <div className="program-assign-result">
          {result.added.length > 0 && <div>Added to the chart for: {result.added.join(", ")}.</div>}
          {result.created.length > 0 && <div>New periodization chart started for: {result.created.join(", ")}.</div>}
          {result.already.length > 0 && <div>Already on the chart, left as is: {result.already.join(", ")}.</div>}
          {result.failed.length > 0 && <div>Couldn't be placed (start date is beyond the chart's limit): {result.failed.join(", ")}.</div>}
        </div>
      )}
      {result && onAssignOther && suggestedNextPrograms(program).length > 0 && (() => {
        // the week after this program ends, offered as the start date for the suggested next phase
        const d = new Date(`${startDate}T00:00:00`);
        d.setDate(d.getDate() + Math.max(1, weeks) * 7);
        const nextStart = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        return (
          <div className="indiv-offer">
            <strong>Suggested next phase</strong>
            <span>Only a suggestion. Nothing is assigned unless you choose it; the start date will be set to the week after this program ends ({nextStart}).</span>
            <div className="indiv-offer-list">
              {suggestedNextPrograms(program).map((p) => (
                <button className="btn btn-secondary" key={p.id} onClick={() => onAssignOther(p, nextStart)}>Assign “{p.name}” next</button>
              ))}
            </div>
          </div>
        );
      })()}
      {/* remote athletes only: a prompt, never a block. The program is assigned either way. */}
      {window.EquipmentFlags && assigned.filter((a) => (window.equipmentFlagsFor(a, program) || []).length > 0).map((a) => (
        <window.EquipmentFlags key={a.id} athlete={a} program={program} quietWhenClear onOpenChange={() => setIndividualizing(a)} />
      ))}
      {assigned.length > 0 && (
        <div className="indiv-offer">
          <strong>Individualize this program?</strong>
          <span>Pick an athlete to swap exercises and adjust sets and reps. Their own copy is saved and linked to their chart.</span>
          <div className="indiv-offer-list">
            {assigned.map((a) => (individualized[a.id]
              ? <span className="indiv-done" key={a.id}>✓ {a.name}: saved as “{individualized[a.id]}”</span>
              : <button className="btn btn-secondary" key={a.id} onClick={() => setIndividualizing(a)}>Individualize for {a.name}</button>
            ))}
          </div>
        </div>
      )}
      <div className="facility-form-actions">
        <button className="btn btn-assign" disabled={picked.size === 0 || !startDate} onClick={assign}>Assign to {picked.size} athlete{picked.size === 1 ? "" : "s"}</button>
        <button className="btn-link" onClick={onClose}>{result ? "Done" : "Cancel"}</button>
      </div>
    </div>
  );
}

// Programs tab: every saved program, plus the editor.
// Which screen of the Programs page is open. Kept by App (not here) so it's part of the Back history.
const PROGRAMS_NAV_HOME = { section: "programs", folder: "", editingId: null, assigningId: null };

function ProgramsPage({ nav, setNav }) {
  const [version, setVersion] = useState(0);
  const S = window.AthleteStore;
  // athletes' own programs saved before athlete folders existed are filed into theirs, once per visit
  React.useEffect(() => { if (S.fileAthletePrograms) { S.fileAthletePrograms(); setVersion((v) => v + 1); } }, []); // eslint-disable-line
  // The small one-week programs made when a session is sent to one athlete's app (group speed, or a quick
  // strength session; window.isSentProgram) are left out of this list unless asked for: one per athlete per week,
  // reached from the athlete's plan, so here they would only bury the real programs.
  const everyProgram = S.allPrograms();
  const sentCount = everyProgram.filter((p) => window.isSentProgram(p.id)).length;
  const [showSent, setShowSent] = useState(false);
  const programs = showSent ? everyProgram : everyProgram.filter((p) => !window.isSentProgram(p.id));
  const folders = S.getProgramFolders();
  // folder: path of the folder being viewed ("" is the top level). A folder that no longer exists falls back to the top.
  const folder = nav.folder && folders.includes(nav.folder) ? nav.folder : "";
  // editing: null = list, {} = new program, record = editing that one. assigning: the program being assigned, if any.
  const editing = nav.editingId === "new" || nav.editingId === "new-speed" || nav.editingId === "new-throwing" || nav.editingId === "new-reed" ? {} : (nav.editingId && programs.find((p) => p.id === nav.editingId)) || null;
  // a new program started from an existing one: a copy of it with its own exercise ids, saved as a separate program
  const copySource = nav.editingId === "new" && nav.copyFromId ? programs.find((p) => p.id === nav.copyFromId) : null;
  const copyStart = nav.editingId === "new-throwing" && window.SpeedKit ? window.SpeedKit.newThrowingProgram() : nav.editingId === "new-reed" && window.SpeedKit ? window.SpeedKit.newReedProgram() : nav.editingId === "new-speed" && window.SpeedKit ? window.SpeedKit.newSpeedProgram() : copySource ? { name: `${copySource.name} (copy)`, description: copySource.description || "", nextProgramIds: [], tags: [...(copySource.tags || [])], ...(copySource.layout ? { layout: copySource.layout } : {}), weeks: JSON.parse(JSON.stringify(copySource.weeks || [])).map((w) => ({ ...w, sessions: (w.sessions || []).map((s) => ({ ...s, exercises: (s.exercises || []).map((e) => ({ ...e, id: newExercise().id })) })) })) } : null;
  const [newChoice, setNewChoice] = useState(null); // null, "ask" (the two choices showing) or "copy" (picking a program)
  const [copyQuery, setCopyQuery] = useState("");
  const assigning = (nav.assigningId && programs.find((p) => p.id === nav.assigningId)) || null;
  // Opening a screen adds a step to the Back history; closing one (save, cancel, done) steps back out of it.
  const setEditing = (x) => (x ? setNav((n) => ({ ...n, editingId: x.id || "new", copyFromId: x.copyFromId || null })) : window.history.back());
  const setAssigning = (p) => (p ? setNav((n) => ({ ...n, assigningId: p.id, assignStart: null })) : window.history.back());
  const setFolder = (f, opts) => setNav((n) => ({ ...n, folder: f }), opts);
  const bump = () => setVersion((v) => v + 1);

  // ---- folders: paths like "Strength/Lower Body" ----
  const inFolder = (path, f) => path === f || path.startsWith(`${f}/`);
  const parentOf = (f) => (f.includes("/") ? f.slice(0, f.lastIndexOf("/")) : "");
  const leafOf = (f) => f.slice(f.lastIndexOf("/") + 1);
  const subfolders = folders.filter((f) => parentOf(f) === folder);
  // Search: by program name or coach, and a coach picker. While either is in use the list covers every folder.
  const [query, setQuery] = useState("");
  const [tag, setTag] = useState("");
  const allTags = [...new Set(programs.flatMap((p) => p.tags || []))].sort((a, b) => a.localeCompare(b));
  const [coach, setCoach] = useState("");
  const coachName = (email) => USER_DISPLAY_NAMES[email] || email;
  const coaches = [...new Set(programs.map((p) => p.createdBy).filter(Boolean))].sort((a, b) => coachName(a).localeCompare(coachName(b)));
  const q = query.trim().toLowerCase();
  const searching = !!q || !!coach || !!tag;
  const here = searching
    ? programs.filter((p) =>
        (!coach || (coach === "__none__" ? !p.createdBy : p.createdBy === coach)) &&
        (!tag || (p.tags || []).includes(tag)) &&
        (!q || [p.name, p.createdBy, p.createdBy && coachName(p.createdBy), ...(p.tags || [])].some((v) => (v || "").toLowerCase().includes(q))))
    : programs.filter((p) => ((window.isSentProgram(p.id) ? "" : p.folder) || "") === folder); // sent sessions, when shown, sit at the top level
  const countIn = (f) => programs.filter((p) => inFolder(p.folder || "", f)).length;
  const cleanName = (raw) => (raw || "").replace(/\//g, " ").trim();

  const addFolder = () => {
    const name = cleanName(window.prompt(folder ? `New subfolder in ${leafOf(folder)}:` : "New folder name:"));
    if (!name) return;
    const path = folder ? `${folder}/${name}` : name;
    if (folders.some((f) => f.toLowerCase() === path.toLowerCase())) { window.alert("A folder with that name is already here."); return; }
    S.setProgramFolders([...folders, path]);
    bump();
  };

  // Re-roots everything under `from` (the folder, its subfolders and their programs) onto `to`.
  const moveTree = (from, to, keepSelf) => {
    const swap = (path) => (path === from ? to : `${to}${to ? "/" : ""}${path.slice(from.length + 1)}`);
    S.setProgramFolders(folders.filter((f) => keepSelf || f !== from).map((f) => (inFolder(f, from) ? swap(f) : f)).filter(Boolean));
    programs.filter((p) => inFolder(p.folder || "", from)).forEach((p) => S.saveProgram({ ...p, folder: swap(p.folder) }));
  };

  const renameFolder = () => {
    const name = cleanName(window.prompt("Rename this folder:", leafOf(folder)));
    if (!name || name === leafOf(folder)) return;
    const path = parentOf(folder) ? `${parentOf(folder)}/${name}` : name;
    if (folders.some((f) => f.toLowerCase() === path.toLowerCase())) { window.alert("A folder with that name is already here."); return; }
    moveTree(folder, path, true);
    setFolder(path, { replace: true });
    bump();
  };

  const deleteFolder = () => {
    const n = countIn(folder);
    const subs = folders.filter((f) => f !== folder && inFolder(f, folder)).length;
    const where = parentOf(folder) ? leafOf(parentOf(folder)) : "the top level";
    const moved = [n && `${n} program${n === 1 ? "" : "s"}`, subs && `${subs} subfolder${subs === 1 ? "" : "s"}`].filter(Boolean).join(" and ");
    if (!window.confirm(`Delete the folder "${leafOf(folder)}"?${moved ? ` Its ${moved} will move up to ${where}; no programs are deleted.` : ""}`)) return;
    moveTree(folder, parentOf(folder), false);
    setFolder(parentOf(folder), { replace: true });
    bump();
  };


  // Drag a program card onto a folder tile, or onto a breadcrumb to move it back up.
  const [dropOver, setDropOver] = useState(null); // folder path being hovered while dragging, or null
  const dropTarget = (path) => ({
    onDragOver: (e) => { if (e.dataTransfer.types.includes("application/x-program")) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (dropOver !== path) setDropOver(path); } },
    onDragLeave: () => setDropOver((d) => (d === path ? null : d)),
    onDrop: (e) => {
      e.preventDefault();
      setDropOver(null);
      // one card, or every selected card when the dragged one is part of the selection
      const ids = e.dataTransfer.getData("application/x-program").split(",");
      movePrograms(programs.filter((x) => ids.includes(x.id)), path);
    },
  });

  // Selecting several programs: tick their boxes, then move them together (drag any one of them onto a folder,
  // or use the Move menu) or delete them together.
  const [selected, setSelected] = useState(() => new Set());
  const selectedPrograms = programs.filter((p) => selected.has(p.id));
  const toggleSelected = (id) => setSelected((s) => { const n = new Set(s); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  const movePrograms = (list, to) => {
    list.filter((p) => (p.folder || "") !== to).forEach((p) => S.saveProgram({ ...p, folder: to }));
    setSelected(new Set());
    bump();
  };
  const deleteSelected = () => {
    const n = selectedPrograms.length;
    const assigned = selectedPrograms.filter((p) => athletesOnProgram(p.id).length > 0).length;
    const warn = assigned ? ` ${assigned} of them ${assigned === 1 ? "is" : "are"} on athletes' periodization charts; those blocks will lose their program.` : "";
    if (!window.confirm(`Delete ${n} program${n === 1 ? "" : "s"}?${warn} This can't be undone.`)) return;
    selectedPrograms.forEach((p) => S.deleteProgram(p.id));
    setSelected(new Set());
    bump();
  };

  const save = (rec) => {
    // an edited program stays in its folder; a new one goes in the folder being viewed
    window.AthleteStore.saveProgram({ ...rec, folder: editing && editing.id ? (editing.folder || "") : folder });
    setEditing(null);
    setVersion((v) => v + 1);
  };

  const remove = (p) => {
    if (!window.confirm(`Delete the program "${p.name}"? This can't be undone.`)) return;
    window.AthleteStore.deleteProgram(p.id);
    setEditing(null);
    setVersion((v) => v + 1);
  };

  if (editing) {
    return (
      <ProgramEditor
        key={editing.id || `${nav.editingId}-${nav.copyFromId || ""}`}
        initial={editing.id ? editing : copyStart}
        onSave={save}
        onSaveAndAssign={(rec) => {
          const saved = window.AthleteStore.saveProgram({ ...rec, folder: editing && editing.id ? (editing.folder || "") : folder });
          setVersion((v) => v + 1);
          // fromEditor: closing the assign screen then goes to the Programs list, not back into the builder
          setNav((n) => ({ ...n, editingId: null, assigningId: saved.id, assignStart: null, fromEditor: true }));
        }}
        autoSave={(rec) => {
          const prev = rec.id ? window.AthleteStore.allPrograms().find((p) => p.id === rec.id) : null;
          return window.AthleteStore.saveProgram({ ...(prev || {}), ...rec, folder: prev ? prev.folder || "" : editing && editing.id ? editing.folder || "" : folder });
        }}
        onCancel={() => { setEditing(null); setVersion((v) => v + 1); }}
        onDelete={editing.id ? () => remove(editing) : null}
      />
    );
  }

  if (assigning) {
    return (
      <ProgramAssignPanel
        key={assigning.id}
        program={assigning}
        initialStart={nav.assignStart}
        onClose={() => (nav.fromEditor ? setNav((n) => ({ ...n, editingId: null, assigningId: null, assignStart: null, fromEditor: false })) : setAssigning(null))}
        onAssignOther={(p, start) => setNav((n) => ({ ...n, assigningId: p.id, assignStart: start }))}
      />
    );
  }

  const section = nav.section || "programs";
  const sectionTabs = (
    <div className="pill-tabs program-sections">
      <button className={`pill-tab ${section === "programs" ? "active" : ""}`} onClick={() => setNav((n) => ({ ...n, section: "programs" }))}>Programs</button>
      <button className={`pill-tab ${section === "exercises" ? "active" : ""}`} onClick={() => setNav((n) => ({ ...n, section: "exercises" }))}>Exercise Library</button>
      <button className={`pill-tab ${section === "rmchart" ? "active" : ""}`} onClick={() => setNav((n) => ({ ...n, section: "rmchart" }))}>1RM Chart</button>
    </div>
  );
  if (section === "exercises") return <ExerciseLibrary sectionTabs={sectionTabs} />;
  if (section === "rmchart") return <RmChartPage sectionTabs={sectionTabs} />;

  return (
    <div className="panel" key={version}>
      {sectionTabs}
      <h2>Programs <small>{programs.length} saved</small></h2>
      {sentCount > 0 && <button className="btn-link no-print" style={{ marginBottom: 8 }} onClick={() => setShowSent(!showSent)}>{showSent ? "Hide" : "Show"} {sentCount} session{sentCount === 1 ? "" : "s"} sent to athletes (group speed and quick strength sessions)</button>}
      <div className="program-crumbs">
        <button className={`program-crumb ${folder === "" ? "here" : ""} ${dropOver === "" ? "drop-over" : ""}`} onClick={() => setFolder("")} {...dropTarget("")}>All programs</button>
        {folder && folder.split("/").map((part, i, parts) => {
          const path = parts.slice(0, i + 1).join("/");
          return (
            <React.Fragment key={path}>
              <span className="program-crumb-sep">›</span>
              <button className={`program-crumb ${path === folder ? "here" : ""} ${dropOver === path ? "drop-over" : ""}`} onClick={() => setFolder(path)} {...dropTarget(path)}>{part}</button>
            </React.Fragment>
          );
        })}
      </div>
      <div className="facility-toolbar">
        <button className="btn-link" onClick={addFolder}>{folder ? "+ New subfolder" : "+ New folder"}</button>
        {folder && <button className="btn-link" onClick={renameFolder}>Rename folder</button>}
        {folder && <button className="btn-link" onClick={deleteFolder}>Delete folder</button>}
        <button className="btn btn-assign" style={{ marginLeft: "auto" }} onClick={() => setNewChoice(newChoice ? null : "ask")}>{`+ New ${folder ? `${leafOf(folder)} ` : ""}program`.toUpperCase()}</button>
      </div>
      {/* "+ New program" first asks how to start: a blank program, or a copy of an existing one to change */}
      {newChoice && (
        <div className="new-program-choice">
          <strong>How do you want to start?</strong>
          <div className="new-program-options">
            <button className="btn btn-assign" onClick={() => { setNewChoice(null); setEditing({}); }}>Build from scratch</button>
            <button className="btn btn-assign" title="Days laid out in sections (Warm-up, Plyometrics, Speed...) and series instead of A1/A2, with each week side by side" onClick={() => { setNewChoice(null); setNav((n) => ({ ...n, editingId: "new-speed", copyFromId: null })); }}>Build a speed program</button>

const facilityAddressLine = (f) => {
  const cityState = [f.city, [f.state, f.zip].filter(Boolean).join(" ")].filter(Boolean).join(", ");

  const norm = (name || "").trim().toLowerCase();

  return window.AthleteStore.allOffseasonFacilities().find((f) => (f.name || "").trim().toLowerCase() === norm) || null;
