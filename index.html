// Add or edit one facility. Empty fields are dropped so the saved record only holds what was entered.
function FacilityForm({ initial, onSave, onCancel }) {
  const [draft, setDraft] = useState(() => ({ ...(initial || {}) }));
  const canSave = (draft.name || "").trim().length > 0;

  const submit = () => {
    if (!canSave) return;
    const rec = {};
    FACILITY_FIELDS.forEach(({ key }) => {
      const v = (draft[key] || "").trim();
      if (v) rec[key] = v;
    });
    if (initial && initial.id) rec.id = initial.id;
    // keep the map coordinates; they're refreshed on the Facilities page if the address itself changes
    if (initial && initial.geo) rec.geo = initial.geo;
    onSave(rec);
  };

  return (
    <div className="facility-form">
      <div className="facility-form-grid">
        {FACILITY_FIELDS.map((f) => (
          <label key={f.key} className={`facility-field ${f.wide ? "wide" : ""}`}>
            <span>{f.label}{f.required ? " *" : ""}</span>
            {f.multiline ? (
              <textarea rows={3} value={draft[f.key] || ""} placeholder={f.placeholder || ""}
                onChange={(e) => setDraft({ ...draft, [f.key]: e.target.value })} />
            ) : (
              <input value={draft[f.key] || ""} placeholder={f.placeholder || ""}
                onChange={(e) => setDraft({ ...draft, [f.key]: e.target.value })} />
            )}
          </label>
        ))}
      </div>
      <div className="facility-form-actions">
        <button className="btn" disabled={!canSave} onClick={submit}>Save facility</button>
        <button className="btn-link" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

// Looks up coordinates for a query with OpenStreetMap's Nominatim service (US only).
// Resolves to { lat, lng }, or null when the service has no match. Throws on network / rate-limit errors.
async function geocodeAddress(q) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${encodeURIComponent(q)}`;
  const res = await fetch(url, { headers: { Accept: "application/json" } });
  if (!res.ok) throw new Error(`geocode failed: HTTP ${res.status}`);
  const rows = await res.json();
  return rows[0] ? { lat: Number(rows[0].lat), lng: Number(rows[0].lon) } : null;
}

// Bump when the lookup changes, so facilities located under the old rules get another try.
const GEO_VERSION = 2;

// Tries the most exact form of the address first, then looser ones: without the suite number, then the city alone.
// A city-only match is marked approximate, since the pin is then only the city's center.
async function locateFacility(f) {
  const street = (f.address1 || "").trim().replace(/\.$/, "");
  const cityState = [f.city, [f.state, f.zip].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const full = facilityAddressLine(f).replace(/\.(?=,|$)/g, "");
  const attempts = [
    street && { q: [street, cityState].filter(Boolean).join(", "), approx: false },
    full && full !== [street, cityState].filter(Boolean).join(", ") && { q: full, approx: false },
    cityState && { q: cityState, approx: true },
  ].filter(Boolean);
  for (let i = 0; i < attempts.length; i++) {
    if (i > 0) await new Promise((r) => setTimeout(r, 1100));
    const hit = await geocodeAddress(attempts[i].q);
    if (hit) return { ...hit, approx: attempts[i].approx };
  }
  return null;
}

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Map of every located facility, centered on the continental US. One dot per facility; click for details.
function FacilityMap({ facilities, color }) {
  const elRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const layerRef = React.useRef(null);

  React.useEffect(() => {
    if (!window.L || !elRef.current) return;
    const map = L.map(elRef.current, { scrollWheelZoom: false }).setView([39.8, -98.6], 4);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    mapRef.current = map;
    layerRef.current = L.layerGroup().addTo(map);
    return () => { map.remove(); mapRef.current = null; layerRef.current = null; };
  }, []);

  // Re-draw only when the pins actually change (not on every render), so panning and zooming survive typing in the search box.
  const pinKey = facilities
    .filter((f) => f.geo && f.geo.lat != null)
    .map((f) => `${f.id}|${f.name}|${f.geo.lat},${f.geo.lng}|${f.phone || ""}|${f.contactName || ""}|${facilityAddressLine(f)}`)
    .join(";");
  React.useEffect(() => {
    if (!mapRef.current || !layerRef.current) return;
    layerRef.current.clearLayers();
    const pts = [];
    facilities.forEach((f) => {
      if (!f.geo || f.geo.lat == null || f.geo.lng == null) return;
      const addr = facilityAddressLine(f);
      const popup = `<strong>${escapeHtml(f.name)}</strong>` +
        (addr ? `<br>${escapeHtml(addr)}` : "") +
        (f.phone ? `<br>${escapeHtml(f.phone)}` : "") +
        (f.contactName ? `<br>Contact: ${escapeHtml(f.contactName)}` : "") +
        (f.geo.approx ? `<br><em>Approximate: only the city could be matched</em>` : "");
      L.circleMarker([f.geo.lat, f.geo.lng], { radius: 7, color: "#fff", weight: 2, fillColor: color, fillOpacity: 0.95 })
        .bindPopup(popup)
        .addTo(layerRef.current);
      pts.push([f.geo.lat, f.geo.lng]);
    });
    if (pts.length > 1) mapRef.current.fitBounds(pts, { padding: [30, 30], maxZoom: 7 });
    else if (pts.length === 1) mapRef.current.setView(pts[0], 7);
    else mapRef.current.setView([39.8, -98.6], 4);
  }, [pinKey, color]);

  return <div ref={elRef} className="facility-map" />;
}

// Facilities tab: the whole shared directory, searchable, with add / edit / delete.
function OffseasonFacilitiesPage() {
  const [editing, setEditing] = useState(null); // null = list, {} = new facility, record = editing that one
  const [query, setQuery] = useState("");
  const [version, setVersion] = useState(0);
  const facilities = window.AthleteStore.allOffseasonFacilities();
  const q = query.trim().toLowerCase();
  const athletes = window.AthleteStore.allAthletes();
  const countAt = (f) => athletes.filter((a) => ((a.offseasonFacility || "").trim().toLowerCase() === (f.name || "").trim().toLowerCase())).length;
  // Most athletes first; facilities with the same count are alphabetical.
  const shown = facilities
    .filter((f) => !q || [f.name, f.city, f.state, f.contactName].some((v) => (v || "").toLowerCase().includes(q)))
    .map((f) => ({ f, n: countAt(f) }))
    .sort((a, b) => b.n - a.n || (a.f.name || "").localeCompare(b.f.name || ""))
    .map((x) => x.f);
  const athletesAt = (f) => athletes
    .filter((a) => ((a.offseasonFacility || "").trim().toLowerCase() === (f.name || "").trim().toLowerCase()))
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  const usedBy = (f) => athletesAt(f).length;

  // Pins need coordinates: any facility whose address has no coordinates yet (or whose address changed) is looked up
  // once, one request a second to respect the geocoding service's limit, and the result is saved on the record.
  const addressKey = facilities.map((f) => `${f.id}:${facilityAddressLine(f)}`).join("|");
  const needsGeo = (f) => {
    const q = facilityAddressLine(f);
    if (!q) return false;
    return !(f.geo && f.geo.q === q && (f.geo.lat != null || f.geo.v === GEO_VERSION));
  };
  const pendingGeo = facilities.filter(needsGeo).length;
  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      for (const f of window.AthleteStore.allOffseasonFacilities()) {
        if (cancelled) return;
        if (!needsGeo(f)) continue;
        const q = facilityAddressLine(f);
        try {
          const hit = await locateFacility(f);
          if (cancelled) return;
          const latest = window.AthleteStore.allOffseasonFacilities().find((x) => x.id === f.id);
          if (latest) {
            window.AthleteStore.saveOffseasonFacility({
              ...latest,
              geo: { q, v: GEO_VERSION, lat: hit ? hit.lat : null, lng: hit ? hit.lng : null, approx: hit ? hit.approx : false },
            });
            setVersion((v) => v + 1);
          }
        } catch (e) {
          // Network or rate-limit error: leave it unlocated and try again the next time the page opens.
          console.warn("Facility map: couldn't locate", f.name, e);
        }
        await new Promise((r) => setTimeout(r, 1100));
      }
    })();
    return () => { cancelled = true; };
  }, [addressKey]);

  const save = (rec) => {
    const old = editing && editing.id ? editing : null;
    const saved = window.AthleteStore.saveOffseasonFacility(rec);
    // Renaming a facility carries the new name over to every athlete already assigned to it.
    if (old && (old.name || "").trim().toLowerCase() !== saved.name.trim().toLowerCase()) {
      const oldNorm = (old.name || "").trim().toLowerCase();
      athletes
        .filter((a) => (a.offseasonFacility || "").trim().toLowerCase() === oldNorm)
        .forEach((a) => window.AthleteStore.updateAthlete(a.id, { offseasonFacility: saved.name }));
    }
    setEditing(null);
    setVersion((v) => v + 1);
  };

  const remove = (f) => {
    const n = usedBy(f);
    const msg = `Delete ${f.name} from the facility directory?` +
      (n ? ` ${n} athlete${n === 1 ? " is" : "s are"} assigned to it; their facility name stays, but it will no longer show an address.` : "");
    if (!window.confirm(msg)) return;
    window.AthleteStore.deleteOffseasonFacility(f.id);
    setVersion((v) => v + 1);
  };

  if (editing) {
    return (
      <div className="panel">
        <h2>{editing.id ? `Edit ${editing.name}` : "Add an off-season facility"}</h2>
        <FacilityForm initial={editing.id ? editing : null} onSave={save} onCancel={() => setEditing(null)} />
      </div>
    );
  }

  return (
    <div className="panel">
      <h2>Off-Season Facilities <small>{facilities.length} in the directory</small></h2>
      <FacilityMap facilities={facilities} color="#0E3386" />
      <div className="facility-map-note">
        {facilities.filter((f) => f.geo && f.geo.lat != null).length} of {facilities.length} on the map
        {pendingGeo > 0 && ` · locating ${pendingGeo} address${pendingGeo === 1 ? "" : "es"}…`}
        {facilities.some((f) => f.geo && f.geo.v === GEO_VERSION && f.geo.lat == null) && " · some addresses weren't found, so check them with Edit"}
      </div>
      <div className="facility-toolbar">
        <input className="facility-search" value={query} placeholder="Search by name, city, or contact" onChange={(e) => setQuery(e.target.value)} />
        <button className="btn" onClick={() => setEditing({})}>+ Add facility</button>
      </div>
      {shown.length === 0 && (
        <div className="empty-state">{facilities.length ? "No facilities match that search." : "No facilities yet. Add one to start the directory."}</div>
      )}
      <div className="facility-list">
        {shown.map((f) => (
          <div className="facility-card" key={f.id}>
            <div className="facility-card-head">
              <strong>{f.name}</strong>
              <span className="facility-used">{usedBy(f)} athlete{usedBy(f) === 1 ? "" : "s"}</span>
            </div>
            {usedBy(f) > 0 && (
              <div className="facility-athletes">
                <span>Training here:</span> {athletesAt(f).map((a) => a.name).join(", ")}
              </div>
            )}
            <FacilityDetails f={f} />
            <div className="facility-card-actions no-print">
              <button className="btn-link" onClick={() => setEditing(f)}>Edit</button>
              <button className="btn-link" onClick={() => remove(f)}>Delete</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// Pulls every rule out of this page's @media print blocks and hands it back as plain, unconditional
// CSS text. html2canvas renders a print-accurate snapshot by injecting this into the *cloned*
// document it snapshots (see renderTabToPdf) — reusing the exact same print styling (colors,
// hidden buttons, print-only marks) the "Print / Save PDF" buttons already rely on, rather than
// maintaining a second copy of those rules just for this feature.
function extractPrintCss() {
  const parts = [];
  for (const sheet of Array.from(document.styleSheets)) {
    let rules;
    try { rules = sheet.cssRules; } catch (e) { continue; } // cross-origin sheet — nothing of ours lives there
    if (!rules) continue;
    for (const rule of Array.from(rules)) {
      if (rule.media && rule.media.mediaText && rule.media.mediaText.includes("print")) {
        for (const inner of Array.from(rule.cssRules)) parts.push(inner.cssText);
      }
    }
  }
  return parts.join("\n");
}

// Blank space kept around every emailed PDF's content, on every page — plain full-bleed pages
// looked cramped right up against the edges.
const PDF_MARGIN_IN = 0.35;
// How hard each page's snapshot is compressed. The package lowers it: the email goes through a function that takes
// about 4.5 MB at most, and a four-part package at full quality comes close to that.
let pdfJpegQuality = 0.92;
// and at what resolution: 2 pixels to every screen pixel, lowered for a PDF too big to email (see renderWithinEmailLimit)
let pdfCaptureScale = 2;
// Pieces a page break shouldn't cut through (a chart with its title, a panel, a table row): their spans are kept on
// each snapshot (see captureElement) and addCanvasAsPages moves a break up above any one that fits on a page.
const PDF_KEEP_TOGETHER = ".panel, .panel > *, .recharts-wrapper, svg, img, canvas, tr, .kpi-card, .metric-strip";

// Slices a (probably page-taller-than-one-page) canvas into a multi-page PDF, one page-height's
// worth of pixels at a time, instead of squashing everything onto a single page. isFirstPage
// controls whether the very first slice reuses the PDF's current page (the normal case) or forces
// a new one first — needed when compositing several elements into one document (see
// renderTeamReportToPdf), where every element after the first must start on its own fresh page.
function addCanvasAsPages(pdf, canvas, pageW, pageH, isFirstPage = true) {
  const usableW = pageW - PDF_MARGIN_IN * 2;
  const usableH = pageH - PDF_MARGIN_IN * 2;
  const pageHeightPx = Math.floor((usableH / usableW) * canvas.width);
  let renderedPx = 0;
  let first = true;
  while (renderedPx < canvas.height) {
    let cut = Math.min(renderedPx + pageHeightPx, canvas.height);
    // the break moves up above anything it would cut through that fits on one page (a chart, a panel), as long as
    // that still leaves a fair amount on this page
    if (cut < canvas.height && canvas.keepTogether) {
      let moved = true;
      while (moved) {
        moved = false;
        for (const [a, b] of canvas.keepTogether) {
          const top = Math.floor(a) - 8;
          if (top > renderedPx && top < cut && b > cut && b - top <= pageHeightPx) { cut = top; moved = true; }
        }
      }
      if (cut - renderedPx < pageHeightPx * 0.15) cut = Math.min(renderedPx + pageHeightPx, canvas.height);
    }
    const sliceHeightPx = cut - renderedPx;
    const slice = document.createElement("canvas");
    slice.width = canvas.width;
    slice.height = sliceHeightPx;
    slice.getContext("2d").drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
    const sliceHeightIn = (sliceHeightPx * usableW) / canvas.width;
    if (!(first && isFirstPage)) pdf.addPage();
    pdf.addImage(slice.toDataURL("image/jpeg", pdfJpegQuality), "JPEG", PDF_MARGIN_IN, PDF_MARGIN_IN, usableW, sliceHeightIn);
    renderedPx += sliceHeightPx;
    first = false;
  }
}

// Snapshots one element at its natural (un-zoomed) size — html2canvas doesn't reproduce CSS zoom
// correctly (it reads back as overlapping, garbled text), so every capture in this file avoids it
// entirely by setting a plain pixel width instead. printCss (see extractPrintCss) is injected into
// html2canvas's cloned document so the snapshot picks up print colors and print-vs-screen element
// swaps, the same as actually printing would.
async function captureElement(el, printCss, width) {
  const savedWidth = el.style.width;
  const savedZoom = el.style.zoom;
  // Two more things that would otherwise clip content out of the snapshot entirely (not garble it
  // like zoom does — just leave it missing): a textarea only shows what fits its current height
  // (the Player Plan's action-plan boxes are the main case), and the plan's week-by-week grid
  // scrolls horizontally in its own container rather than growing the page. Both are plain
  // width/height/overflow changes, so — unlike zoom — html2canvas renders them correctly; expanding
  // every one every time is harmless on tabs that have none.
  const textareas = Array.from(el.querySelectorAll("textarea"));
  const savedTextareas = textareas.map((ta) => ({ ta, height: ta.style.height, overflow: ta.style.overflow }));
  textareas.forEach((ta) => {
    ta.style.overflow = "hidden";
    ta.style.height = "auto";
    ta.style.height = `${ta.scrollHeight + 4}px`;
  });
  const scrollers = Array.from(el.querySelectorAll(".period-scroll"));
  const savedScrollers = scrollers.map((s) => ({ s, width: s.style.width, overflow: s.style.overflow }));
  // Widening a scroller only helps if nothing between it and `el` clips it back down — the plan's
  // own panel around it (.period-visual) hides overflow on purpose on screen, for its rounded
  // corners, which would otherwise cut the now-wider grid right back off before it ever reaches
  // `el` (and so before `el.scrollWidth`, read below, would ever reflect it).
  const savedAncestors = [];
  scrollers.forEach((s) => {
    s.style.overflow = "visible";
    s.style.width = `${s.scrollWidth}px`;
    let node = s.parentElement;
    while (node && node !== el.parentElement) {
      if (getComputedStyle(node).overflow !== "visible" && !savedAncestors.some((a) => a.node === node)) {
        savedAncestors.push({ node, overflow: node.style.overflow });
        node.style.overflow = "visible";
      }
      node = node.parentElement;
    }
  });
  el.style.zoom = "";
  el.style.width = `${width}px`;
  await new Promise((r) => setTimeout(r, 30)); // let layout settle at the new width before snapshotting
  // html2canvas sizes its output canvas from el's own rendered width, not just the target `width`
  // — el's scrollWidth reflects any scrollers just widened above (now that their clipping ancestors
  // are out of the way too), so re-applying it as el's actual width is what makes the wider content
  // actually part of the capture instead of still being cropped off at the original `width`.
  const captureWidth = Math.max(width, el.scrollWidth);
  el.style.width = `${captureWidth}px`;
  await new Promise((r) => setTimeout(r, 30));
  const scale = pdfCaptureScale;
  let keepTogether = [];
  try {
    const canvas = await window.html2canvas(el, {
      backgroundColor: "#ffffff",
      scale,
      useCORS: true,
      windowWidth: captureWidth,
      onclone: (clonedDoc, clonedEl) => {
        // once the clone is laid out as it'll be drawn (after the swaps below), where each piece a page break
        // shouldn't cut sits
        const measure = () => {
          if (!clonedEl) return;
          const top = clonedEl.getBoundingClientRect().top;
          keepTogether = Array.from(clonedEl.querySelectorAll(PDF_KEEP_TOGETHER))
            .map((n) => n.getBoundingClientRect())
            .filter((r) => r.height > 0)
            .map((r) => [(r.top - top) * scale, (r.bottom - top) * scale]);
        };

        const style = clonedDoc.createElement("style");
        style.textContent = printCss;
        clonedDoc.head.appendChild(style);
        // html2canvas approximates native <input>/<select> rendering rather than drawing them
        // properly, and consistently clips text a little at the edges (the assessment header's
        // Name/Date/Coach fields have no print-only text swap like the table cells do, since a
        // real browser print — unlike html2canvas — renders native inputs just fine). Swapping
        // each visible input for a plain text element sidesteps that entirely.
        clonedDoc.querySelectorAll("input").forEach((input) => {
          if (getComputedStyle(input).display === "none") return; // already hidden by printCss
          const replacement = clonedDoc.createElement("div");
          replacement.textContent = input.value || "";
          replacement.style.cssText = getComputedStyle(input).cssText;
          replacement.style.display = "flex";
          replacement.style.alignItems = "center";
          input.replaceWith(replacement);
        });
        // A <textarea> is worse: html2canvas draws its text as one unwrapped line, so anything longer than the box
        // runs off the side (the assessment's Key Takeaways, the plan's notes). Each one becomes a block of the same
        // look with its text wrapped, as tall as the text needs.
        clonedDoc.querySelectorAll("textarea").forEach((ta) => {
          if (getComputedStyle(ta).display === "none") return;
          const replacement = clonedDoc.createElement("div");
          replacement.textContent = ta.value || "";
          replacement.style.cssText = getComputedStyle(ta).cssText;
          Object.assign(replacement.style, { display: "block", height: "auto", minHeight: "1.4em", overflow: "visible", whiteSpace: "pre-wrap", overflowWrap: "anywhere", wordBreak: "break-word", resize: "none" });
          ta.replaceWith(replacement);
        });
        measure();
      },
    });
    canvas.keepTogether = keepTogether;
    return canvas;
  } finally {
    el.style.width = savedWidth;
    el.style.zoom = savedZoom;
    savedScrollers.forEach((s) => { s.s.style.width = s.width; s.s.style.overflow = s.overflow; });
    savedAncestors.forEach((a) => { a.node.style.overflow = a.overflow; });
    savedTextareas.forEach((s) => { s.ta.style.height = s.height; s.ta.style.overflow = s.overflow; });
  }
}

// Scales a canvas to fit within a box (preserving aspect ratio) and draws it centered there.
function addImageFitted(pdf, canvas, x, y, boxW, boxH) {
  const ratio = canvas.width / canvas.height;
  const boxRatio = boxW / boxH;
  const w = ratio > boxRatio ? boxW : boxH * ratio;
  const h = ratio > boxRatio ? boxW / ratio : boxH;
  pdf.addImage(canvas.toDataURL("image/jpeg", pdfJpegQuality), "JPEG", x + (boxW - w) / 2, y + (boxH - h) / 2, w, h);
}

// The assessment's own "Print / Save PDF" lays out its header full-width, then its two columns
// side by side, each independently scaled to fill its half of one landscape page — captured live
// via CSS zoom (see preparePrint in assessment.js), which is exactly what html2canvas can't
// reproduce. This gets the same one-page, three-piece layout a different way: capture the header
// and each column separately at their own natural size, then place each into its own box on one
// PDF page, letting jsPDF's own image scaling do the fitting instead of CSS zoom.
async function renderAssessmentToPdf() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "landscape", unit: "in", format: "letter" });
  await addAssessmentPage(pdf);
  return pdf.output("datauristring").split(",")[1];
}

// A tab's content (data-tab-content) shown for as long as `fn` takes, then hidden again if it was: the package
// email snapshots the assessment and the body comp tab whichever one is open. Charts redraw at their real size
// once shown, so it waits a moment first.
async function withTabShown(name, fn) {
  const el = document.querySelector(`[data-tab-content="${name}"]`);
  if (!el) throw new Error("Couldn't find that part of the profile to render — try reopening it.");
  const hidden = el.classList.contains("tab-hidden");
  if (hidden) { el.classList.remove("tab-hidden"); await new Promise((r) => setTimeout(r, 450)); }
  try { return await fn(el); } finally { if (hidden) el.classList.add("tab-hidden"); }
}

// The parts an emailed package can hold, in the order they go into the PDF
const PACKAGE_PARTS = [
  { key: "assessment", label: "Biomechanical Assessment", short: "biomechanical assessment" },
  { key: "bodycomp", label: "Body Composition", short: "body composition" },
  { key: "nutrition", label: "Nutrition Plan", short: "nutrition plan" },
  { key: "performance", label: "Performance Metrics", short: "performance metrics" },
  { key: "statcast", label: "Statcast Metrics", short: "Statcast metrics" },
];

// A PDF is rendered at each quality in turn, compressed harder each time, until it fits in an email; then, if it still
// doesn't, at a lower resolution. (The package starts lower than a single tab, being several tabs in one.) The send
// (api/send-athlete-email.js) takes at most 4.5 MB, so the PDF is kept under 3.8 MB of base64, leaving room for the message.
async function renderWithinEmailLimit(render, qualities, tooBig) {
  const LIMIT = 3.8 * 1000 * 1000; // of base64
  const last = qualities[qualities.length - 1];
  const steps = qualities.map((q) => ({ q, s: 2 })).concat([{ q: last, s: 1.5 }, { q: last, s: 1.2 }]);
  const saved = [pdfJpegQuality, pdfCaptureScale];
  try {
    for (const { q, s } of steps) {
      pdfJpegQuality = q;
      pdfCaptureScale = s;
      const b64 = await render();
      if (b64.length <= LIMIT) return b64;
    }
  } finally {
    [pdfJpegQuality, pdfCaptureScale] = saved;
  }
  throw new Error(tooBig);
}
function renderAssessmentPackageToPdf(keys) {
  return renderWithinEmailLimit(() => buildAssessmentPackage(keys), [0.8, 0.6, 0.45],
    "That package is too large to email in one go. Untick a part (Statcast is usually the biggest) and send it separately.");
}

// The package, one landscape PDF of the parts chosen: the biomechanical assessment as it's emailed on its own, the
// Body Composition tab fitted to one page (the trends graph, the Evolt scans and the manual sheets), and the
// Performance and Statcast tabs at full width over as many pages as they need, broken between charts.
async function buildAssessmentPackage(keys) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "landscape", unit: "in", format: "letter" });
  const m = PDF_MARGIN_IN;
  let started = false; // the first part goes on the page jsPDF starts with
  for (const key of PACKAGE_PARTS.map((p) => p.key).filter((k) => keys.includes(k))) {
    await withTabShown(key, async (el) => {
      if (key === "assessment") {
        if (started) pdf.addPage("letter", "landscape");
        await addAssessmentPage(pdf);
        return;
      }
      const canvas = await captureElement(el, extractPrintCss(), 1300);
      const pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
      if (key === "bodycomp") {
        if (started) pdf.addPage("letter", "landscape");
        addImageFitted(pdf, canvas, m, m, pageW - m * 2, pageH - m * 2);
      } else {
        addCanvasAsPages(pdf, canvas, pageW, pageH, !started);
      }
    });
    started = true;
  }
  return pdf.output("datauristring").split(",")[1];
}

// "Email Package": the coach ticks which parts go in (the assessment and body comp to start with), and they're sent

// the assessment (header full width, its two columns side by side) onto the PDF's current page
async function addAssessmentPage(pdf) {
  const wrap = document.querySelector(".assess-wrap");
  if (!wrap) throw new Error("Couldn't find this assessment to render — try reopening it.");
  const header = wrap.querySelector(".assess-header");
  const cols = wrap.querySelectorAll(".assess-col");
  if (!header || cols.length !== 2) throw new Error("Unexpected assessment layout — try reopening it.");
  const printCss = extractPrintCss();

  const headerCanvas = await captureElement(header, printCss, 1400);
  const col0Canvas = await captureElement(cols[0], printCss, 900);
  const col1Canvas = await captureElement(cols[1], printCss, 900);

  const m = PDF_MARGIN_IN;
  const pageW = pdf.internal.pageSize.getWidth() - m * 2;
  const pageH = pdf.internal.pageSize.getHeight() - m * 2;
  const gap = 0.15;

  const headerH = Math.min(pageH * 0.25, (headerCanvas.height * pageW) / headerCanvas.width);
  addImageFitted(pdf, headerCanvas, m, m, pageW, headerH);

  const colY = m + headerH + 0.1;
  const colBoxW = (pageW - gap) / 2;
  const colBoxH = pageH - headerH - 0.1;
  addImageFitted(pdf, col0Canvas, m, colY, colBoxW, colBoxH);
  addImageFitted(pdf, col1Canvas, m + colBoxW + gap, colY, colBoxW, colBoxH);
}

// Shared fallback for any tab without a fixed one-page layout to composite (the plan, and the
// chart-heavy Statcast/Performance tabs): capture the whole section at a comfortable natural width
// and let it span as many pages as it needs, rather than shrinking it down to fit one.
async function renderElementToPdf(selector, { width, orientation }) {
  const el = document.querySelector(selector);
  if (!el) throw new Error("Couldn't find this tab's content to render — try reopening it.");
  const printCss = extractPrintCss();
  const canvas = await captureElement(el, printCss, width);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation, unit: "in", format: "letter" });
  addCanvasAsPages(pdf, canvas, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
  return pdf.output("datauristring").split(",")[1];
}

async function renderTabToPdf(tab) {
  if (tab === "assessment") return renderAssessmentToPdf();
  // a long tab (the nutrition plan runs to ten pages) is compressed until it fits in an email
  const tooBig = "This tab is too large to email as one PDF.";
  if (tab === "plan") return renderWithinEmailLimit(() => renderElementToPdf(".period-wrap", { width: 1000, orientation: "portrait" }), [0.92, 0.75, 0.6], tooBig);
  // Statcast/Performance are chart grids with no fixed page design of their own to match — wide
  // landscape gives their side-by-side charts more room than a portrait page would.
  return renderWithinEmailLimit(() => renderElementToPdf(`[data-tab-content="${tab}"]`, { width: 1300, orientation: "landscape" }), [0.92, 0.75, 0.6], tooBig);
}

// The team report is one ".report-sheet" per athlete (same markup "Print / Save PDF" uses,
// prepared per-sheet with its own zoom-based one-page fit — see prepareSheets in TeamReportPage).
// That zoom fit is exactly what html2canvas can't reproduce, so each sheet is captured here at its
// natural size instead and given its own page(s) in the PDF, in roster order.
async function renderTeamReportToPdf() {
  const sheets = Array.from(document.querySelectorAll(".report-sheet")).filter((s) => s.offsetParent !== null);
  if (!sheets.length) throw new Error("This team has no player report sheets to render yet.");
  const printCss = extractPrintCss();
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "portrait", unit: "in", format: "letter" });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  for (let i = 0; i < sheets.length; i++) {
    const canvas = await captureElement(sheets[i], printCss, 900);
    addCanvasAsPages(pdf, canvas, pageW, pageH, i === 0);
  }
  return pdf.output("datauristring").split(",")[1];
}

// Generic "compose + send a PDF" panel — used both for a single athlete's tab and for a team
// report going out to several contacts at once. `renderPdf` does the actual snapshot (different
// for each caller); everything else (recipients, status, error handling) is shared.
function EmailComposer({ title, defaultTo, defaultSubject, defaultBody, attachmentNote, renderPdf, filename, logContext, onClose, extra, canSend = true }) {
  const [to, setTo] = useState(defaultTo || "");
  const [cc, setCc] = useState("");
  const [subject, setSubject] = useState(defaultSubject);
  const [body, setBody] = useState(defaultBody);
  // when the defaults change (the package's parts were changed), the subject and message follow, unless they've been edited
  const lastDefaults = React.useRef({ subject: defaultSubject, body: defaultBody });
  React.useEffect(() => {
    const last = lastDefaults.current;
    setSubject((s) => (s === last.subject ? defaultSubject : s));
    setBody((b) => (b === last.body ? defaultBody : b));
    lastDefaults.current = { subject: defaultSubject, body: defaultBody };
  }, [defaultSubject, defaultBody]);
  const [sending, setSending] = useState(false);
  const [status, setStatus] = useState(""); // progress text while sending
  const [error, setError] = useState("");
  const [sent, setSent] = useState(false);

  const send = async () => {
    setError("");
    const emailRe = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    const toList = to.split(",").map((s) => s.trim()).filter(Boolean);
    if (!toList.length || toList.some((addr) => !emailRe.test(addr))) { setError("Enter at least one valid recipient email."); return; }
    const ccList = cc.split(",").map((s) => s.trim()).filter(Boolean);
    if (ccList.some((addr) => !emailRe.test(addr))) { setError("One of the CC addresses doesn't look like a valid email."); return; }
    if (!subject.trim() || !body.trim()) { setError("Subject and message can't be empty."); return; }
    setSending(true);
    try {
      setStatus("Rendering PDF…");
      const pdfBase64 = await renderPdf();
      setStatus("Sending…");
      const { data } = await window.supabaseClient.auth.getSession();
      const token = data.session && data.session.access_token;
      if (!token) throw new Error("You're not signed in — reload and sign in again.");
      const res = await fetch("/api/send-athlete-email", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ to: toList.join(", "), cc: ccList.join(", "), subject: subject.trim(), body, filename, pdfBase64, ...(logContext || {}) }),
      });
      const json = await res.json().catch(() => ({}));
      if (res.status === 413) throw new Error("The PDF is too large to email. Send fewer parts at a time.");
      if (!res.ok) throw new Error(json.error || `Send failed (${res.status})`);
      setSent(true);
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setSending(false);
      setStatus("");
    }
  };

  return (
    <div className="panel no-print" style={{ marginTop: 10 }}>
      <h2>{title}</h2>
      {sent ? (
        <React.Fragment>
          <div className="success-banner">Sent to {to}{cc.trim() ? ` (cc: ${cc.trim()})` : ""}.</div>
          <button className="btn btn-secondary" style={{ marginTop: 8 }} onClick={onClose}>Close</button>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <div className="form-row">
            <div className="field" style={{ minWidth: 220 }}>
              <label>To</label>
              <input value={to} onChange={(e) => setTo(e.target.value)} placeholder="athlete@example.com" disabled={sending} />
            </div>
            <div className="field" style={{ minWidth: 220 }}>
              <label>CC (optional)</label>
              <input value={cc} onChange={(e) => setCc(e.target.value)} placeholder="parent@example.com, coach@example.com" disabled={sending} />
            </div>
            <div className="field" style={{ flex: 1, minWidth: 260 }}>
              <label>Subject</label>
              <input value={subject} onChange={(e) => setSubject(e.target.value)} disabled={sending} />
            </div>
          </div>
          <div className="field" style={{ marginTop: 10 }}>
            <label>Message</label>
            <textarea rows={6} value={body} onChange={(e) => setBody(e.target.value)} disabled={sending} style={{ width: "100%" }} />
          </div>
          {extra}
          <div className="assess-row-note" style={{ marginTop: 6 }}>{attachmentNote}</div>
          {error && <div className="success-banner" style={{ marginTop: 8, background: "#3a1414", color: "var(--danger)", borderColor: "#5a1f1f" }}>{error}</div>}
          <div style={{ marginTop: 10, display: "flex", gap: 8 }}>
            <button className="btn btn-primary" onClick={send} disabled={sending || !canSend}>{sending ? status || "Sending…" : "Send"}</button>
            <button className="btn btn-secondary" onClick={onClose} disabled={sending}>Cancel</button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// Sends the whole team report (one sheet per athlete) to one or more contacts at once, replacing
// the old per-contact "open a Gmail draft and drag in a PDF the local dev server built" flow —
// that relied on a local server this app no longer runs since moving to Supabase/Vercel.
function EmailTeamReportButton({ team, defaultRecipients }) {
  const [open, setOpen] = useState(false);
  const dateText = new Date().toLocaleDateString(undefined, { year: "numeric", month: "2-digit", day: "2-digit" }).replace(/\//g, "-");
  const provider = team === "Chicago Cubs" ? "Chicago Cubs Strength & Conditioning" : "Dynamic Sports Training";
  return (
    <React.Fragment>
      <button type="button" className="btn btn-secondary no-print" onClick={() => setOpen(true)} title={`Email the ${team} report to its contacts`}>
        Email Team Report
      </button>
      {open && (
        <EmailComposer
          title={`Email ${team} Report`}
          defaultTo={defaultRecipients || ""}
          defaultSubject={`${team} player reports - ${provider}`}
          defaultBody={`Hi,\n\nAttached is the latest ${team} player report from ${provider}, covering each player's periodization, performance metrics and coaching notes.\n\nLet me know if you have any questions.\n\nThank you,`}
          attachmentNote="A PDF with one page per player will be attached, sent from your own email address."
          renderPdf={renderTeamReportToPdf}
          filename={`${team.replace(/[^a-z0-9]+/gi, "_")}-team-report-${dateText}.pdf`}
          logContext={{ kind: "team_report", athleteName: team }}
          onClose={() => setOpen(false)}
        />
      )}
    </React.Fragment>
  );
}

// What's new: the additions to the dashboard, the program builder, Coach Mode and the athletes' app, newest week
// first, from whats_new.js (the same list the Monday "What's new" email to the coaches sends from).
function WhatsNewPage() {
  const kit = window.WhatsNew || { WHATS_NEW: [], AREAS: [] };
  // the Monday of an entry's week, as the email's weeks run (Monday to Sunday)
  const mondayOf = (iso) => { const d = new Date(`${iso}T12:00:00`); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; };
  const fmt = (d, opts) => d.toLocaleDateString("en-US", opts || { month: "short", day: "numeric" });
  const weeks = [];
  kit.WHATS_NEW.forEach((e) => {
    const m = mondayOf(e.date), key = m.toISOString().slice(0, 10);
    let w = weeks.find((x) => x.key === key);
    if (!w) { w = { key, monday: m, items: [] }; weeks.push(w); }
    w.items.push(e);
  });
  weeks.sort((a, b) => b.monday - a.monday);
  const ICON = { "Phone app": "📱", "Program builder": "🏋️", "Coach Mode": "📋", Dashboard: "🖥️" };
  return (
    <div className="panel whats-new">
      <h2>What's new <small>New in the dashboard, the program builder, Coach Mode and the athletes' app</small></h2>
      <p className="whats-new-intro">Each Monday the coaches get these by email too, for the week before.</p>
      {!weeks.length && <p className="whats-new-intro">Nothing listed yet.</p>}
      {weeks.map((w) => {
        const sunday = new Date(w.monday); sunday.setDate(sunday.getDate() + 6);
        const areas = [...kit.AREAS, ...[...new Set(w.items.map((e) => e.area))].filter((a) => !kit.AREAS.includes(a))];
        return (
          <section className="whats-new-week" key={w.key}>
            <h3>Week of {fmt(w.monday)} – {fmt(sunday)}<span>{w.items.length} addition{w.items.length === 1 ? "" : "s"}</span></h3>
            {areas.map((area) => {
              const items = w.items.filter((e) => e.area === area);
              if (!items.length) return null;
              return (
                <div className="whats-new-area" key={area}>
                  <h4>{ICON[area] || "•"} {area}</h4>
                  {items.map((e, i) => (
                    <div className="whats-new-item" key={i}>
                      <strong>{e.title}</strong>
                      <p>{e.detail}</p>
                    </div>
                  ))}
                </div>
              );
            })}
          </section>
        );
      })}
    </div>
  );
}

const FROM_APP = (() => {

    return sessionStorage.getItem("fromApp") === "1";
  } catch (e) { return false; }
})();

// Bottom menu bar: less-used pages live here instead of the top navigation. It sticks to the bottom
// of the window while you scroll.
// The way into Coach Mode (coach.html: several athletes' programs side by side, group speed and testing, for
// running a session from a tablet or phone), drawn as a switch: flipping it on slides the knob across and then
// opens Coach Mode, where the same switch, shown on, flips back to the dashboard.
function CoachModeSwitch() {
  const [on, setOn] = useState(false);
  // coming back with the browser's Back button can restore this page as it was left: put the switch back to off
  React.useEffect(() => {
    const reset = () => setOn(false);
    window.addEventListener("pageshow", reset);
    return () => window.removeEventListener("pageshow", reset);
  }, []);
  const flip = () => { if (on) return; setOn(true); setTimeout(() => { window.location.href = FROM_APP ? "coach.html?from=app" : "coach.html"; }, 320); };
  return (
    <button className={`coach-switch${on ? " on" : ""}`} role="switch" aria-checked={on} title="Switch to Coach Mode" onClick={flip}>
      <span className="coach-switch-label">Coach Mode</span>
      <span className="coach-switch-track"><span className="coach-switch-knob" /></span>
    </button>
  );
}

// Adding a coach: once their login has been made in Supabase (Authentication › Users › Add user), it shows here
// to be added to the Coaches roster under their name. The logins are read again when this opens, so one made
// after the page loaded is there without a reload. Each coach's record is tied to their login (coachUserId), which
// is what Coach Mode, their own app and their quick sessions go by.
function AddCoachForm({ onAdded }) {
  const S = window.AthleteStore;
  const [open, setOpen] = useState(false);
  const [state, setState] = useState("idle"); // idle, loading, error
  const [names, setNames] = useState({}); // login id -> name typed
  const [locs, setLocs] = useState({}); // login id -> locations ticked
  const [added, setAdded] = useState([]);
  const waiting = () => S.accountHolders().filter((a) => !S.allAthletes().some((x) => x.coachUserId === a.id));
  const load = async () => {
    setState("loading");
    try { await S.refreshAccounts(); setState("idle"); } catch (e) { setState("error"); }
  };
  if (!open) {
    return (
      <button className="btn btn-secondary" style={{ marginBottom: 16, marginLeft: 8 }} onClick={() => { setOpen(true); setAdded([]); load(); }}>
        + Add Coach
      </button>
    );
  }
  const list = waiting();
  const add = (acct) => {
    const made = S.addCoachRecord(COACH_ROSTER_GROUP, acct, names[acct.id] != null ? names[acct.id] : coachNameFromEmail(acct.email));
    if (made && (locs[acct.id] || []).length) S.updateAthlete(made.id, { coachLocations: locs[acct.id] });
    if (made) { setAdded((x) => [...x, made.name]); onAdded && onAdded(); }
  };
  return (
    <div className="panel">
      <h2>Add Coach</h2>
      <p className="add-coach-help">
        First make their login in Supabase (Authentication › Users › Add user, with their email and a password). It then
        shows below; add it here and they're on the Coaches roster, with Coach Mode, their own app and quick sessions.
      </p>
      {state === "loading" && <div className="add-coach-note">Checking for new logins…</div>}
      {state === "error" && <div className="add-coach-note">Couldn't read the logins. Check your connection and try again.</div>}
      {added.length > 0 && <div className="success-banner">Added {added.join(", ")} to the Coaches roster.</div>}
      {state !== "loading" && (list.length ? (
        <table className="add-coach-table">
          <thead><tr><th>Login</th><th>Name on the roster</th><th>Locations</th><th></th></tr></thead>
          <tbody>
            {list.map((a) => (
              <tr key={a.id} style={{ cursor: "default" }}>
                <td>{a.email}</td>
                <td><input value={names[a.id] != null ? names[a.id] : coachNameFromEmail(a.email)} onChange={(e) => setNames({ ...names, [a.id]: e.target.value })} aria-label={`Name for ${a.email}`} /></td>
                <td><CoachLocationsPicker value={locs[a.id] || []} onChange={(next) => setLocs({ ...locs, [a.id]: next })} /></td>
                <td><button className="btn" onClick={() => add(a)}>Add</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      ) : (
        <div className="add-coach-note">Everyone with a login is already on the Coaches roster. Made a new login just now? <button className="btn-link" onClick={load}>Check again</button></div>
      ))}
      <div className="facility-form-actions">
        <button className="btn-link" onClick={() => setOpen(false)}>Done</button>
      </div>
    </div>
  );
}

// Adding several athletes at once. Copy the rows from a sheet (Google Sheets or Excel) and paste them in, or
// choose a CSV file. A header row is used if there is one (Name or First/Last, Position, Location, League, Team,
// Jersey, Status); without one the columns are read in that order. The coach sees every row before anything is
// added. A name already on the roster is updated with whatever the sheet has for it rather than added twice.
const IMPORT_FIELDS = {
  name: /^(name|athlete|player|full ?name|nombre)$/i, first: /^(first|first ?name|given ?name)$/i, last: /^(last|last ?name|surname|family ?name)$/i,
  position: /^(pos|position)$/i, location: /^(location|dst ?location|site|facility|gym)$/i, league: /^(league|level)$/i,
  team: /^(team|org|organization|club)$/i, jersey: /^(jersey|jersey ?#|number|#|no\.?)$/i, status: /^(status|roster)$/i,
  phone: /^(phone|mobile|cell|cell ?phone|mobile ?phone|phone ?number|tel)$/i, email: /^(e-?mail|email ?address)$/i,
};
const importPosition = (v) => {
  const s = (v || "").trim().toLowerCase();
  if (!s) return "";
  if (/^(p|rhp|lhp|sp|rp|pitcher|pitchers?)$/.test(s) || s.includes("pitch")) return "Pitcher";
  if (/^(c|catcher)$/.test(s) || s.includes("catch")) return "Catcher";
  if (/^(if|inf|1b|2b|3b|ss|infield|infielder|utl|util)$/.test(s) || s.includes("infield")) return "Infield";
  if (/^(of|lf|cf|rf|outfield|outfielder)$/.test(s) || s.includes("outfield")) return "Outfield";
  return "";
};
const importLocation = (v) => {
  const s = (v || "").trim().toLowerCase();
  if (!s) return "";
  return DST_LOCATIONS.find((l) => l.toLowerCase() === s || l.toLowerCase() === `dst ${s}` || l.toLowerCase().replace(/^dst /, "").startsWith(s)) || "";
};
function parseAthleteSheet(text) {
  const parsed = Papa.parse((text || "").trim(), { skipEmptyLines: "greedy" });
  const grid = (parsed.data || []).map((r) => r.map((c) => String(c == null ? "" : c).trim())).filter((r) => r.some(Boolean));
  if (!grid.length) return [];
  const head = grid[0];
  const hasHeader = head.some((h) => Object.values(IMPORT_FIELDS).some((p) => p.test(h)));
  const col = {};
  if (hasHeader) Object.keys(IMPORT_FIELDS).forEach((k) => { col[k] = head.findIndex((h) => IMPORT_FIELDS[k].test(h)); });
  else ["name", "position", "location", "league", "team", "jersey", "status"].forEach((k, i) => { col[k] = i; });
  const at = (r, k) => (col[k] != null && col[k] >= 0 ? r[col[k]] || "" : "");
  return (hasHeader ? grid.slice(1) : grid).map((r) => {
    let name = at(r, "name") || `${at(r, "first")} ${at(r, "last")}`.trim();
    if (/^[^,]+,[^,]+$/.test(name)) name = name.split(",").map((p) => p.trim()).reverse().join(" "); // "Last, First"
    const status = at(r, "status").toLowerCase();
    return {
      name: name.replace(/\s+/g, " "),
      position: importPosition(at(r, "position")), location: importLocation(at(r, "location")), locationTyped: at(r, "location"),
      league: at(r, "league"), team: at(r, "team"), jersey: at(r, "jersey").replace(/^#/, ""), phone: at(r, "phone"), email: at(r, "email"),
      status: ["active", "inactive", "alumni"].includes(status) ? status : "",
    };
  }).filter((a) => a.name);
}
function ImportAthletes({ onAdded }) {
  const [open, setOpen] = useState(false);
  const [text, setText] = useState("");
  const [location, setLocation] = useState("");
  const [status, setStatus] = useState("active");
  const [done, setDone] = useState("");
  const rows = useMemo(() => parseAthleteSheet(text), [text]);
  const existing = new Set(window.AthleteStore.allAthletes().map((a) => (a.name || "").trim().toLowerCase()));
  const readFile = (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setText(String(reader.result || ""));
    reader.readAsText(file);
  };
  const run = () => {
    rows.forEach((a) => {
      window.AthleteStore.addAthlete({
      // someone already on the roster keeps their own status unless the sheet gives one
      name: a.name, position: a.position || undefined, jersey: a.jersey || undefined, status: a.status || (existing.has(a.name.toLowerCase()) ? undefined : status),
      league: a.league || undefined, team: a.team || undefined, dstLocation: a.location || location || undefined,
      });
      // mobile and email are not part of "add athlete", so they are set on the record just made (or found)
      if (a.phone || a.email) {
        const made = window.AthleteStore.allAthletes().find((x) => (x.name || "").trim().toLowerCase() === a.name.toLowerCase());
        if (made) window.AthleteStore.updateAthlete(made.id, { ...(a.phone ? { phone: a.phone } : {}), ...(a.email ? { email: a.email } : {}) });
      }
    });
    const fresh = rows.filter((a) => !existing.has(a.name.toLowerCase())).length;
    setDone(`Added ${fresh} athlete${fresh === 1 ? "" : "s"}${rows.length - fresh ? ` and updated ${rows.length - fresh} already on the roster` : ""}.`);
    setText("");
    setOpen(false);
    onAdded();
  };
  if (!open) {
    return (
      <span className="import-athletes-closed">
        <button className="btn btn-secondary" style={{ marginBottom: 16 }} onClick={() => { setOpen(true); setDone(""); }}>+ Import Athletes</button>
        {done && <span className="timestamp-note">{done}</span>}
      </span>
    );
  }
  return (
    <div className="panel import-athletes">
      <h2>Import Athletes <small>several at once, from a sheet</small></h2>
      <p className="timestamp-note">
        Copy the rows from Google Sheets or Excel and paste them below, or choose a CSV file. With a header row, use any of:
        Name (or First and Last), Position, Location, League, Team, Jersey, Status, Mobile, Email. Without one, put the columns in that order. Only the name is required.
      </p>
      <textarea rows={6} value={text} onChange={(e) => setText(e.target.value)} placeholder={"Name\tPosition\tLocation\nJohn Smith\tRHP\tNorth\nMike Jones\tOF\tWest"} />
      <div className="form-row" style={{ marginTop: 10 }}>
        <div className="field"><label>CSV file</label><input type="file" accept=".csv,.tsv,.txt,text/csv" onChange={readFile} /></div>
        <div className="field">
          <label>Location, where the sheet has none</label>
          <select value={location} onChange={(e) => setLocation(e.target.value)}>
            <option value="">— none —</option>
            {DST_LOCATIONS.map((l) => <option key={l} value={l}>{l}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Status, where the sheet has none</label>
          <select value={status} onChange={(e) => setStatus(e.target.value)}>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="alumni">Alumni</option>
          </select>
        </div>
      </div>
      {rows.length > 0 && (
        <div className="import-athletes-preview">
          <table>
            <thead><tr><th>Name</th><th>Position</th><th>Location</th><th>League</th><th>Team</th><th>Jersey</th><th>Status</th><th>Mobile</th><th></th></tr></thead>
            <tbody>
              {rows.map((a, i) => (
                <tr key={i}>
                  <td>{a.name}</td><td>{a.position || "Unassigned"}</td>
                  <td>{a.location || location || "—"}{a.locationTyped && !a.location ? <small> (“{a.locationTyped}” not recognised)</small> : null}</td>
                  <td>{a.league || "—"}</td><td>{a.team || "—"}</td><td>{a.jersey || "—"}</td><td>{a.status || status}</td><td>{a.phone || "—"}</td>
                  <td>{existing.has(a.name.toLowerCase()) ? <span className="badge warn">Already on roster: will update</span> : <span className="badge good">New</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
        <button className="btn btn-primary" disabled={!rows.length} onClick={run}>{rows.length ? `Import ${rows.length} athlete${rows.length === 1 ? "" : "s"}` : "Import"}</button>
        <button className="btn btn-secondary" onClick={() => { setOpen(false); setText(""); }}>Cancel</button>
      </div>
    </div>
  );
}

// Cubs roster only: whether the player has been texted and called lately, and when their program starts.
// A flag is green when the last text (or call) was within the past month and grey once a month has gone by,
// when it is due again. Clicking a grey flag marks it done today; clicking a green one clears it. The dates are
// kept on the athlete (lastTexted, lastCalled, programStartDate).
const CONTACT_DAYS = 30;
function ContactFlag({ athlete, field, done, due, onChanged }) {
  const last = athlete[field] || "";
  const days = last ? Math.floor((new Date(new Date().toDateString()) - new Date(`${last}T00:00:00`)) / 864e5) : null;
  const fresh = days != null && days >= 0 && days < CONTACT_DAYS;
  const when = last ? new Date(`${last}T12:00:00`).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
  const flip = (e) => {
    e.stopPropagation();
    const d = new Date();
    const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    window.AthleteStore.updateAthlete(athlete.id, { [field]: fresh ? "" : today });
    if (onChanged) onChanged();
  };
  return (
    <button
      className={`badge status-toggle contact-flag ${fresh ? "good" : "neutral"}`}
      title={fresh ? `${done} ${when}. Due again in ${CONTACT_DAYS - days} day${CONTACT_DAYS - days === 1 ? "" : "s"}. Click to clear.` : last ? `Last ${done.toLowerCase()} ${when}, over a month ago. Click when done.` : `Not ${done.toLowerCase()} yet. Click when done.`}
      onClick={flip}
    >
      {fresh ? `${done} ${when}` : due}
    </button>
  );
}
function ProgramStartInline({ athlete, onChanged }) {
  return (
    <input
      type="date" className="inline-select" value={athlete.programStartDate || ""} title="Program start date" aria-label={`Program start date for ${athlete.name}`}
      onClick={(e) => e.stopPropagation()}
      onChange={(e) => { window.AthleteStore.updateAthlete(athlete.id, { programStartDate: e.target.value }); if (onChanged) onChanged(); }}
    />
  );
}

      <td onClick={(e) => e.stopPropagation()}><ContactFlag athlete={athlete} field="lastCalled" done="Called" due="Call due" onChanged={onChanged} /> {athlete.phone ? <TextCallLinks athlete={athlete} onChanged={onChanged} text={false} /> : null}</td>

// Inactive. Clicking steps to the next coach in the list and, after the last, back to unassigned. Kept on the
// athlete as cubsCoach.
const CUBS_COACHES = [
  { name: "Poppe", color: "#0e3386" }, { name: "Weisman", color: "#c8102e" }, { name: "Garza", color: "#1a7f37" },
  { name: "Simmons", color: "#b45309" }, { name: "Kinsley", color: "#7c3aed" }, { name: "Rooney", color: "#0e7490" },
];
// sorting the Cubs roster by coach follows the order of the list above, with unassigned players last
const COACH_SORT = { key: "coach", label: "Coach", getValue: (r) => { const i = CUBS_COACHES.findIndex((c) => c.name === r.athlete.cubsCoach); return i === -1 ? CUBS_COACHES.length : i; } };
function CubsCoachBadge({ athlete, onChanged }) {
  const at = CUBS_COACHES.findIndex((c) => c.name === athlete.cubsCoach);
  const coach = CUBS_COACHES[at] || null;
  const next = CUBS_COACHES[at + 1] || null; // from unassigned (-1) this is the first coach; after the last, unassigned
  const step = (e) => {
    e.stopPropagation();
    window.AthleteStore.updateAthlete(athlete.id, { cubsCoach: next ? next.name : "" });
    if (onChanged) onChanged();
  };
  return (
    <button
      className="badge status-toggle coach-badge"
      style={coach ? { background: coach.color, color: "#fff" } : null}
      title={`${coach ? `Coach: ${coach.name}` : "No coach set"}. Click for ${next ? next.name : "none"}.`}
      onClick={step}
    >
      {coach ? coach.name : "No coach"}
    </button>
  );
}

function AthleteRow({ athlete, onSelect, onOpenTab, onDataChange, checked, onToggleCheck, showFacility }) {
  const [editing, setEditing] = useState(false);
  const [name, setName] = useState(athlete.name);
  const [jersey, setJersey] = useState(hasJersey(athlete) ? athlete.jersey : "");

  const startEdit = (e) => {
    e.stopPropagation();
    setName(athlete.name);
    setJersey(hasJersey(athlete) ? athlete.jersey : "");
    setEditing(true);
  };

  const saveEdit = (e) => {
    e.stopPropagation();
    if (!name.trim()) return;
    window.AthleteStore.updateAthlete(athlete.id, {
      name: name.trim(),
      jersey: jersey.trim() || "--",
    });
    setEditing(false);
    onDataChange();
  };

  const handleDelete = (e) => {
    e.stopPropagation();
    if (window.confirm(`Remove ${athlete.name} from the roster? This also deletes their wellness, force plate, body comp, plan, and note data. This can't be undone.`)) {
      window.AthleteStore.deleteAthlete(athlete.id);
      onDataChange();
    }
  };

  if (editing) {
    return (
      <tr onClick={(e) => e.stopPropagation()}>
        <td>
          <input type="checkbox" checked={checked} onChange={onToggleCheck} />
        </td>
        <td>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            <input className="inline-select" value={name} onChange={(e) => setName(e.target.value)} placeholder="Name" style={{ maxWidth: 160 }} />
            <input className="inline-select" value={jersey} onChange={(e) => setJersey(e.target.value)} placeholder="Jersey #" style={{ maxWidth: 80 }} />
            <StatusSelect athlete={athlete} onChanged={onDataChange} />
          </div>
        </td>
        <td><PositionSelect athlete={athlete} onChanged={onDataChange} /></td>
        {showFacility && <td onClick={(e) => e.stopPropagation()}><OffseasonFacilityInline athlete={athlete} onChanged={onDataChange} /></td>}
        {showFacility && <CubsContactCells athlete={athlete} onChanged={onDataChange} />}
        {!showFacility && <td></td>}
        <td></td>
        <td></td>
        <td><LeagueSelect athlete={athlete} onChanged={onDataChange} /></td>
        <td><TeamSelectInline key={athlete.league || "none"} athlete={athlete} onChanged={onDataChange} /></td>
        <td><LocationSelect athlete={athlete} onChanged={onDataChange} /></td>
        <td>
          <button className="btn-link" style={{ marginRight: 10 }} onClick={saveEdit}>Save</button>
          <button className="btn-link" onClick={(e) => { e.stopPropagation(); setEditing(false); }}>Cancel</button>
        </td>
      </tr>
    );
  }

  return (
    <tr onClick={() => onSelect(athlete.id)}>
      <td onClick={(e) => e.stopPropagation()}>
        <input type="checkbox" checked={checked} onChange={onToggleCheck} />
      </td>
      <td>
        {/* edit sits at the left of the row, ahead of the name */}
        <button className="row-edit" onClick={startEdit} title={`Edit ${athlete.name}`} aria-label={`Edit ${athlete.name}`}>&#9998;</button>
        <Avatar athlete={athlete} />{displayName(athlete)}
        {/* click to switch between active and inactive */}
        <span className="row-status">{showFacility ? <CubsCoachBadge athlete={athlete} onChanged={onDataChange} /> : <StatusBadge athlete={athlete} onChanged={onDataChange} />}</span>
      </td>
      <td><PositionSelect athlete={athlete} onChanged={onDataChange} /></td>
      {showFacility && <td onClick={(e) => e.stopPropagation()}><OffseasonFacilityInline athlete={athlete} onChanged={onDataChange} /></td>}
      {showFacility && <CubsContactCells athlete={athlete} onChanged={onDataChange} />}
      {!showFacility && <td onClick={(e) => e.stopPropagation()}><WeekOverWeekTicker athleteId={athlete.id} onOpenTab={() => onOpenTab(athlete.id, "performance")} /></td>}
      <td onClick={(e) => e.stopPropagation()}><ProgramStatusBadge athleteId={athlete.id} onOpenTab={() => onOpenTab(athlete.id, "programming")} /></td>
      <td onClick={(e) => e.stopPropagation()}><AssessmentDueBadge athleteId={athlete.id} onOpenTab={(tab) => onOpenTab(athlete.id, tab || "assessment")} /><GoalBadges athleteId={athlete.id} small /></td>
      <td><LeagueSelect athlete={athlete} onChanged={onDataChange} /></td>
      <td><TeamSelectInline key={athlete.league || "none"} athlete={athlete} onChanged={onDataChange} /></td>
      <td><LocationSelect athlete={athlete} onChanged={onDataChange} /></td>
      <td onClick={(e) => e.stopPropagation()}>
        <MergeControl athlete={athlete} onChanged={onDataChange} />
        <button className="btn-link" style={{ color: "var(--danger)" }} onClick={handleDelete}>Remove</button>
      </td>
    </tr>
  );
