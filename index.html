<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

// Light/dark theme — read by any chart below that needs to pick axis/grid colors manually
// (CSS variables repaint everything else; Recharts' stroke/fill props are plain SVG attributes,
// not CSS, so they can't just reference var(--chart-axis) the way the rest of the app does).
const ThemeContext = React.createContext("dark");
function useTheme() { return React.useContext(ThemeContext); }
function useChartColors() {
  const theme = useTheme();
  return theme === "light" ? { grid: "#dddddd", axis: "#555555" } : { grid: "#2a2a2a", axis: "#9a9a9a" };
}
const {
  ResponsiveContainer: RechartsResponsiveContainer,
  LineChart,
  Line,
  ComposedChart,
  Bar,
  XAxis,
  YAxis,
  CartesianGrid,
  Tooltip,
  Legend,

} = Recharts;

// Every chart in the app goes through this wrapper: click a chart to open it larger in a window
// (the same chart, just taller), click outside or press Esc to close. Keeps every chart the same
// base size on the page, so one chart never looks bigger than another just because of its data.
function ResponsiveContainer(props) {
  const [open, setOpen] = React.useState(false);
  React.useEffect(() => {
    if (!open) return undefined;
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open]);
  return (
    <>
      <div className="zoom-chart" title="Click to enlarge" onClick={() => setOpen(true)}>
        <RechartsResponsiveContainer {...props} />
      </div>
      {open && (
        <div className="zoom-overlay no-print" onClick={() => setOpen(false)}>
          <div className="zoom-modal" onClick={(e) => e.stopPropagation()}>
            <button className="zoom-close" onClick={() => setOpen(false)} aria-label="Close">×</button>
            <RechartsResponsiveContainer {...props} width="100%" height={Math.round(window.innerHeight * 0.7)} />
          </div>
        </div>
      )}
    </>
  );
}

function getRoster() {
  return window.AthleteStore.allAthletes();
}

// Tags an athlete as belonging to the separate Chicago Cubs 40-man roster tab rather than the
// regular DST client roster — the two lists share every profile feature (same AthleteDetail,
// same tabs) but are kept out of each other's Team Overview / Team Report rosters.
const CUBS_ROSTER_GROUP = "cubs-40man";

function lastN(arr, n) {
  return arr.slice(Math.max(0, arr.length - n));
}

// A bare "YYYY-MM-DD" is parsed as UTC midnight per the ECMAScript spec, but every date this app
// stores is a calendar date, not a moment in time — reading it back with local getters (getMonth,
// getDate, getFullYear) after that UTC parse rolls it back a day in any timezone behind UTC (all of
// the US). Anchoring to local midnight first is what keeps a "2026-01-26" test showing as 1/26
// instead of 1/25.
function localDateMs(key) {
  return new Date(`${key}T00:00:00`).getTime();
}

function shortDate(key) {
  const d = new Date(`${key}T00:00:00`);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

// Now that force-test history can span several years (Hawkin backfills go back to 2020), a plain
// "10/7" x-axis label is ambiguous — the same label repeats once per year. A *categorical* axis
// (a string per point) can't fix this reliably: Recharts thins out category ticks on its own once
// there are more than a handful of points, so a year appended to just one specific point's label
// routinely gets dropped along with that tick. The fix is a real numeric time axis instead — ticks
// are then positioned by actual elapsed time (Recharts/d3 pick sensible ones on their own) and a
// <ReferenceLine> at a real timestamp always lands in the right place regardless of which ticks
// happen to be drawn. axisDateLabel formats a tick (showing the year whenever the chart's own data
// spans more than one), and yearStartTimestamps gives the Jan-1 boundaries to draw those lines at.
function axisDateLabel(ts, includeYear) {
  const d = new Date(ts);
  const base = `${d.getMonth() + 1}/${d.getDate()}`;
  return includeYear ? `${base}/${String(d.getFullYear()).slice(2)}` : base;
}
function spansMultipleYears(dateKeys) {
  const years = new Set(dateKeys.filter(Boolean).map((k) => new Date(localDateMs(k)).getFullYear()));
  return years.size > 1;
}
function yearStartTimestamps(dateKeys) {
  const years = Array.from(new Set(dateKeys.filter(Boolean).map((k) => new Date(localDateMs(k)).getFullYear()))).sort((a, b) => a - b);
  return years.slice(1).map((y) => new Date(y, 0, 1).getTime()); // skip the first year — no boundary before the data starts
}

function dateRangeKeys(days) {
  const out = [];
  const today = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    out.push(d.toISOString().slice(0, 10));
  }
  return out;
}

// Simple least-squares linear regression over a series' index position (not calendar
// gaps), returned as one value per input point so it can be plotted as its own line
// alongside the raw data. Needs at least 2 real (non-null) points to fit a slope.
function computeLinearTrend(data, key) {
  const valid = [];
  data.forEach((d, i) => {
    if (typeof d[key] === "number") valid.push({ x: i, y: d[key] });
  });
  if (valid.length < 2) return data.map(() => null);

  const n = valid.length;
  const sumX = valid.reduce((s, p) => s + p.x, 0);
  const sumY = valid.reduce((s, p) => s + p.y, 0);
  const sumXY = valid.reduce((s, p) => s + p.x * p.y, 0);
  const sumXX = valid.reduce((s, p) => s + p.x * p.x, 0);
  const denom = n * sumXX - sumX * sumX;

  if (denom === 0) {
    const avg = round2(sumY / n);
    return data.map(() => avg);
  }

  const slope = (n * sumXY - sumX * sumY) / denom;
  const intercept = (sumY - slope * sumX) / n;
  return data.map((_, i) => round2(intercept + slope * i));
}

// Y-axis limits fitted to the data actually plotted (plus a little headroom) instead of
// Recharts' default of starting at zero, which flattens narrow-range metrics like velocity.
// Bounds snap to a 1/2/5 step so the axis ticks still land on round numbers.
function paddedDomain(rows, keys, include) {
  const vals = [];
  rows.forEach((r) => keys.forEach((k) => { if (typeof r[k] === "number" && isFinite(r[k])) vals.push(r[k]); }));
  (include || []).forEach((v) => vals.push(v));
  if (!vals.length) return ["auto", "auto"];
  let lo = Math.min(...vals);
  let hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.15, Math.abs(hi) * 0.01, 0.05);
  lo -= pad;
  hi += pad;
  const raw = (hi - lo) / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const fix = (v) => Math.round(v * 1000) / 1000;
  return [fix(Math.floor(lo / step) * step), fix(Math.ceil(hi / step) * step)];
}

// Date-range options for the Statcast / Performance tabs.
const RANGE_OPTIONS = [
  { key: "90d", label: "Last 90 days" },
  { key: "6m", label: "Last 6 months" },
  { key: "1y", label: "Last year" },
  { key: "all", label: "All-Time" },
];

// A range is one of the preset keys above, or "custom|FROM|TO" (YYYY-MM-DD; either end may be blank).
function parseRange(range) {
  if (typeof range === "string" && range.startsWith("custom")) {
    const [, from = "", to = ""] = range.split("|");
    return { key: "custom", from, to };
  }
  return { key: range, from: "", to: "" };
}

// Earliest date (YYYY-MM-DD) to include for a range option, or null for no limit.
function rangeCutoffKey(range) {
  const r = parseRange(range);
  if (r.key === "custom") return r.from || null;
  const d = new Date();
  if (r.key === "90d") d.setDate(d.getDate() - 90);
  else if (r.key === "6m") d.setMonth(d.getMonth() - 6);
  else if (r.key === "1y") d.setFullYear(d.getFullYear() - 1);
  else return null;
  return d.toISOString().slice(0, 10);
}

// Latest date to include (only custom ranges have an end), or null for no limit.
function rangeEndKey(range) {
  const r = parseRange(range);
  return r.key === "custom" && r.to ? r.to : null;
}

// True when a YYYY-MM-DD date falls inside the selected range.
function dateInRange(dateKey, range) {
  const start = rangeCutoffKey(range);
  const end = rangeEndKey(range);
  return (!start || dateKey >= start) && (!end || dateKey <= end);
}

// Human-readable name of a range, e.g. "Last 90 days" or "Jan 5, 2026 – Mar 1, 2026".
// One test per calendar day for the trend charts: the highest jump height that day wins, so a
// session with several jumps plots a single point rather than a vertical stack of them.
function oneTestPerDay(tests) {
  const best = new Map();
  tests.forEach((t) => {
    const cur = best.get(t.date);
    const jh = typeof t.jumpHeight === "number" ? t.jumpHeight : -Infinity;
    const curJh = cur && typeof cur.jumpHeight === "number" ? cur.jumpHeight : -Infinity;
    if (!cur || jh > curJh) best.set(t.date, t);
  });
  return Array.from(best.values()).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

function rangeLabel(range) {
  const r = parseRange(range);
  if (r.key === "custom") {
    const fmt = (k) => new Date(`${k}T00:00:00`).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    return `${r.from ? fmt(r.from) : "Beginning"} – ${r.to ? fmt(r.to) : "Today"}`;
  }
  return (RANGE_OPTIONS.find((o) => o.key === r.key) || {}).label || "All-Time";
}

function RangeSelector({ range, onChange, note }) {
  const r = parseRange(range);
  const isCustom = r.key === "custom";
  const todayKey = new Date().toISOString().slice(0, 10);
  const startCustom = () => {
    if (isCustom) return;
    const d = new Date();
    d.setDate(d.getDate() - 90);
    onChange(`custom|${d.toISOString().slice(0, 10)}|${todayKey}`); // starts from the last 90 days, then adjust
  };
  const backwards = isCustom && r.from && r.to && r.from > r.to;
  return (
    <div className="no-print" style={{ marginBottom: 14 }}>
      <div className="pill-tabs" style={{ marginBottom: note || isCustom ? 6 : 0 }}>
        {RANGE_OPTIONS.map((o) => (
          <button key={o.key} className={`pill-tab ${r.key === o.key ? "active" : ""}`} onClick={() => onChange(o.key)}>{o.label}</button>
        ))}
        <button className={`pill-tab ${isCustom ? "active" : ""}`} onClick={startCustom}>Custom</button>
      </div>
      {isCustom && (
        <div className="range-custom">
          <label>From <input type="date" value={r.from} max={r.to || undefined} onChange={(e) => onChange(`custom|${e.target.value}|${r.to}`)} /></label>
          <label>To <input type="date" value={r.to} min={r.from || undefined} onChange={(e) => onChange(`custom|${r.from}|${e.target.value}`)} /></label>
          <span>{backwards ? "The start date is after the end date." : "Leave a date blank for no limit on that end."}</span>
        </div>
      )}
      {note && <p className="timestamp-note" style={{ marginTop: 0 }}>{note}</p>}
    </div>
  );
}

function toDateKey(raw) {
  if (!raw) return null;
  const d = new Date(raw);
  if (isNaN(d.getTime())) return null;
  return d.toISOString().slice(0, 10);
}

function latestOf(athlete) {
  const wellnessSeries = window.AthleteStore.getWellnessSeries(athlete);
  const wellness = wellnessSeries.length ? wellnessSeries[wellnessSeries.length - 1] : null;
  const load = athlete.load && athlete.load.length ? athlete.load[athlete.load.length - 1] : null;
  return { wellness, load };
}

function hasJersey(athlete) {
  return !!athlete.jersey && athlete.jersey !== "--";
}

// Names are stored as "First Last" (that's what matching/import/autocomplete rely on) —
// these only reformat for on-screen display, never the underlying stored value.
function lastNameOnly(name) {
  const parts = (name || "").trim().split(/\s+/);
  return parts[parts.length - 1] || "";
}

function lastFirstName(name) {
  const parts = (name || "").trim().split(/\s+/);
  if (parts.length < 2) return name || "";
  const last = parts[parts.length - 1];
  const first = parts.slice(0, -1).join(" ");
  return `${last}, ${first}`;
}

// Rounds to the hundredths place. Used both when storing imported/manual numeric
// values and when displaying anything computed (averages, trend lines, etc.).
function round2(n) {
  if (typeof n !== "number" || isNaN(n)) return n;
  return Math.round(n * 100) / 100;
}

// Display-time rounding for values that may have been stored before this existed,
// or that come from a data source we don't control the precision of.
function fmt2(n) {
  if (n === null || n === undefined || n === "") return n;
  const num = Number(n);
  return isNaN(num) ? n : round2(num);
}

function displayName(athlete) {
  const formatted = lastFirstName(athlete.name);
  return hasJersey(athlete) ? `#${athlete.jersey} ${formatted}` : formatted;
}

// No verified logo source for LMB/Independent/manually-typed teams, so those (and any
// logo that fails to load) fall back to a deterministic abbreviation badge instead —
// same team always gets the same badge, no broken images, no unverified artwork sourcing.
function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (hash << 5) - hash + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function teamAbbreviation(teamName) {
  const skip = new Set(["de", "del", "los", "la", "las", "the", "of", "and", "&"]);
  const words = teamName.split(/\s+/).filter((w) => !skip.has(w.toLowerCase()));
  const letters = words.map((w) => w.charAt(0).toUpperCase()).join("");
  return (letters.slice(0, 3) || teamName.slice(0, 3).toUpperCase());
}

function teamColor(teamName) {
  const hue = hashString(teamName) % 360;
  return `hsl(${hue}, 55%, 38%)`;
}

    <span
      title={team}
      style={{
        display: "inline-flex",
        alignItems: "center",
        justifyContent: "center",
        width: size,
        height: size,
        borderRadius: "50%",

        color: "#fff",

        fontWeight: 700,
        marginRight: 8,
        flexShrink: 0,
        verticalAlign: "middle",
      }}
    >
      {teamAbbreviation(team)}
    </span>
  );
}

function TeamLogo({ team, size = AVATAR_SIZE }) {
  const [broken, setBroken] = useState(false);
  if (!team) return null;

  const mlbId = MLB_TEAM_IDS[team];
  const logoSrc = LOCAL_TEAM_LOGOS[team] || (mlbId ? `https://www.mlbstatic.com/team-logos/${mlbId}.svg` : "");
  if (logoSrc && !broken) {
    return (
      <img
        src={logoSrc}
        alt={team}
        title={team}
        onError={() => setBroken(true)}
        style={{ width: size, height: size, marginRight: 8, verticalAlign: "middle", flexShrink: 0, objectFit: "contain" }}
      />
    );
  }

  return <TeamBadge team={team} size={size} />;
}

// Small athlete photo for table rows — separate from TeamLogo so both can show together
// (team logo, then athlete photo, then name). Renders nothing if no photo is set/loadable.
function AthletePhoto({ athlete }) {
  const [broken, setBroken] = useState(false);
  if (!athlete.photoUrl || broken) return null;
  return (
    <img

function computeAge(dob) {
  if (!dob) return null;
  const birth = new Date(dob);
  if (isNaN(birth.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const m = now.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
  return age;
}

const EXERCISE_PATTERNS = ["Squat", "Hinge", "Lunge / Single-Leg", "Horizontal Push", "Vertical Push", "Horizontal Pull", "Vertical Pull", "Rotation", "Anti-Rotation", "Carry", "Jump", "Sprint", "Med Ball Throw", "Isolation"];
const EXERCISE_REGIONS = ["Lower Body", "Upper Body", "Core", "Full Body"];

// Turns a YouTube or Vimeo link (including YouTube Shorts) into its embeddable player address; null for anything else.
function videoEmbed(url) {
  const u = (url || "").trim();
  let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{6,})/i);
  if (m) return { src: `https://www.youtube.com/embed/${m[1]}`, vertical: /\/shorts\//i.test(u) };
  m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
  if (m) return { src: `https://player.vimeo.com/video/${m[1]}`, vertical: false };
  return null;
}

// ---- Training programs ----------------------------------------------------------------------
// A program is a reusable template: weeks, each with sessions, each with exercises (sets / reps / load / rest).
// Intensity is prescribed, never the weight itself: a percentage, reps in reserve (RIR), RPE, or nothing.
const INTENSITY_UNITS = [["%", "% of max"], ["RIR", "RIR"], ["RPE", "RPE"], ["", "No intensity"]];
const newSetGroup = () => ({ sets: "", reps: "", intensity: "" });
const newExercise = () => ({ id: `ex-${Math.random().toString(36).slice(2, 9)}`, name: "", tempo: "", intensityUnit: "%", groups: [newSetGroup()], rest: "", notes: "" });
// Brings a program saved in the older single sets / reps / load format up to set groups (see ProgramRx in periodization.js).
const normalizeProgramWeeks = (weeks) => (weeks || []).map((w) => ({ ...w, sessions: (w.sessions || []).map((s) => ({ ...s, exercises: (s.exercises || []).map((e) => window.ProgramRx.normalize(e)) })) }));
const DEFAULT_DAYS = 4;
const newSession = (n) => ({ name: `Day ${n}`, exercises: [newExercise()] });
const newWeek = (n) => ({ name: `Week ${n}`, sessions: Array.from({ length: DEFAULT_DAYS }, (_, i) => newSession(i + 1)) });
// A week added to a program starts as a copy of the week before it: same days, exercises and supersets.
const copyWeek = (week, n) => {
  const c = JSON.parse(JSON.stringify(week));
  c.name = `Week ${n}`;
  c.sessions.forEach((s) => s.exercises.forEach((e) => { e.id = newExercise().id; }));
  return c;
};
const programCounts = (p) => {
  const weeks = (p.weeks || []).length;
  const sessions = (p.weeks || []).reduce((s, w) => s + (w.sessions || []).length, 0);
  const exercises = (p.weeks || []).reduce((s, w) => s + (w.sessions || []).reduce((t, x) => t + (x.exercises || []).length, 0), 0);
  return { weeks, sessions, exercises };
};

// Draws a program as a one-page landscape PDF: athlete and program name top left, DST logo top middle,
// then one row per week with its days side by side. The text size steps down until every week fits on the page.
// Returns { pdf, fontSize, fits }.
async function buildProgramPdf(program, athleteName, cubsLogo = false) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "landscape", unit: "pt", format: "letter" });
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
  const M = 28, headH = 44, gutter = 46, pad = 4;

  // Cubs-only athletes get the Cubs logo; everyone else gets DST's. The Cubs logo is an SVG, which the PDF
  // library can't place directly, so it's drawn onto a canvas first. If it can't be loaded, DST's is used.
  const loadImg = (src, cors) => new Promise((res, rej) => { const im = new Image(); if (cors) im.crossOrigin = "anonymous"; im.onload = () => res(im); im.onerror = rej; im.src = src; });
  let logo = null, logoRatio = 1;
  if (cubsLogo) {
    try {
      const im = await loadImg("https://www.mlbstatic.com/team-logos/112.svg", true);
      const c = document.createElement("canvas");
      c.width = 400; c.height = Math.round((400 * (im.naturalHeight || 1)) / (im.naturalWidth || 1));
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      logo = c.toDataURL("image/png");
      logoRatio = c.width / c.height;
    } catch (e) { logo = null; }
  }
  if (!logo) {
    try {
      const im = await loadImg("assets/dst-logo.png");
      logo = im;
      logoRatio = im.naturalWidth / im.naturalHeight;
    } catch (e) { /* no logo file: the page still exports without it */ }
  }
  let logoW = 0;
  if (logo) {
    const h = 38;
    logoW = h * logoRatio;
    pdf.addImage(logo, "PNG", (W - logoW) / 2, M, logoW, h);
  }
  const leftW = (W - logoW) / 2 - M - 12; // names stay clear of the centered logo
  const oneLine = (text) => pdf.splitTextToSize(text, leftW)[0];
  // Colors. DST follows its training sheets: black week blocks, red day bars, red accents and a bright cyan
  // cell for the prescribed intensity. Cubs-only athletes get Cubs blue and red instead.
  const C = cubsLogo
    ? { week: [14, 51, 134], weekText: 255, day: [204, 52, 51], dayText: 255, accent: [14, 51, 134], pct: [214, 226, 247], label: [14, 51, 134] }
    : { week: [0, 0, 0], weekText: 255, day: [200, 16, 46], dayText: 255, accent: [200, 16, 46], pct: [0, 255, 255], label: [0, 0, 0] };
  const theme = C.accent;
  pdf.setTextColor(...theme);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(15);
  pdf.text(oneLine(athleteName || program.name), M, M + 15);
  if (athleteName) {
    pdf.setFont("helvetica", "normal"); pdf.setFontSize(11); pdf.setTextColor(70);
    pdf.text(oneLine(program.name), M, M + 31);
  }

  const Rx = window.ProgramRx;
  // first line of an exercise: label, name, tempo just right of the name, then rest and notes
  const exText = (e, label) => `${label} ${e.name}${e.tempo ? `  ${e.tempo}` : ""}${e.notes ? ` (${e.notes})` : ""}`;

  const weeks = program.weeks || [];
  const maxDays = Math.max(1, ...weeks.map((w) => (w.sessions || []).length));
  const top = M + headH + 8;
  const availH = H - M - top;
  const colW = (W - 2 * M - gutter) / maxDays;

  // Beside each exercise name, every set group is its reps ("5", or "3x1") followed by a line for writing in
  // the weight used, with the prescribed intensity in a colored cell under the line. A rule is drawn between
  // superset groups (A, B, C…).
  const layout = (fs) => {
    pdf.setFont("helvetica", "normal"); pdf.setFontSize(fs);
    // each set group is its reps followed by a write-in line, with the intensity in a colored cell under the line
    const lineH = fs * 1.25, rowH = fs * 1.6, pctH = fs * 1.05, lineW = fs * 4.6, sp = fs * 0.9, bandH = lineH + 3, gap = Math.max(2, fs * 0.35);
    const nameFs = fs * 1.12, nameLH = nameFs * 1.2, noteLH = fs * 1.0;
    const textW = colW - 2 * pad;
    const rows = weeks.map((w) => {
      const cells = (w.sessions || []).map((s, si) => {
        const named = (s.exercises || []).filter((e) => (e.name || "").trim());
        const labels = window.exerciseLabels(named);
        const items = named.map((e, i) => {
          // The write-in lines always sit at the right of the day column, never under the name. Set groups wrap
          // onto more rows once a row would pass rxMax, and every row is pushed against the right edge.
          const rxMax = textW * 0.62;
          const rxLines = [];
          let cur = [], x = 0;
          const gs = Rx.groups(e).map((g) => ({ reps: Rx.repsText(g), int: Rx.intensityText(e, g) }));
          gs.forEach((g) => { g.rw = pdf.getTextWidth(g.reps) * 1.08 + 2.5; }); // reps are drawn bold
          // With several set groups the lines shorten (to no less than 70%) so they still fit on one row.
          const fixed = gs.reduce((t, g) => t + g.rw + sp, 0) - sp;
          const lw = gs.length ? Math.max(lineW * 0.7, Math.min(lineW, (rxMax - fixed) / gs.length)) : lineW;
          gs.forEach((g) => {
            const bw = g.rw + lw + sp;
            if (cur.length && x + bw - sp > rxMax + 0.5) { rxLines.push(cur); cur = []; x = 0; }
            cur.push({ reps: g.reps, int: g.int, x, bw, rw: g.rw, lw });
            x += bw;
          });
          if (cur.length) rxLines.push(cur);
          const rowWs = rxLines.map((ln) => ln.reduce((t, b) => t + b.bw, 0) - sp);
          rxLines.forEach((ln, k) => ln.forEach((b) => { b.x += textW - rowWs[k]; }));
          const rxW = Math.max(0, ...rowWs);
          const hasInt = rxLines.some((ln) => ln.some((b) => b.int));
          const rxH = rowH + (hasInt ? pctH : 0) + 2;
          // the name: bold capitals a little larger than the rest, in the space left of the lines
          const nameW = textW - (rxW ? rxW + 5 : 0);
          pdf.setFont("helvetica", "bold"); pdf.setFontSize(nameFs);
          const lines = pdf.splitTextToSize(`${labels[i]} ${e.name.trim().toUpperCase()}${e.tempo ? `  ${e.tempo}` : ""}`, nameW);
          pdf.setFont("helvetica", "normal"); pdf.setFontSize(fs * 0.85);
          const noteLines = (e.notes || "").trim() ? pdf.splitTextToSize(e.notes.trim(), nameW) : [];
          pdf.setFontSize(fs);
          // rest goes at the bottom right, under the exercise's sets and reps
          const rest = (e.rest || "").trim() ? `Rest ${e.rest.trim()}` : "";
          const restH = rest ? fs * 1.05 + 2 : 0;
          const bodyH = Math.max(lines.length * nameLH + noteLines.length * noteLH, rxLines.length * rxH + restH) + 1;
          return { label: labels[i], lines, noteLines, rxLines, rxH, bodyH, hasInt, rest, newGroup: i > 0 && !e.linked };
        });
        // optional warm-up for the day, printed above the first superset
        const warm = (s.warmup || "").trim();
        const warmLines = warm ? pdf.splitTextToSize(`WARM-UP: ${warm}`, textW) : [];
        const warmH = warmLines.length ? warmLines.length * lineH + gap * 2 : 0;
        const h = warmH + items.reduce((t, it, k) => t + it.bodyH + (k > 0 ? gap * 2 : 0), 0);
        return { name: s.name || `Day ${si + 1}`, items, h, warmLines };
      });
      return { name: w.name || "", cells, h: bandH + pad * 2 + Math.max(lineH, ...cells.map((c) => c.h)) };
    });
    return { rows, lineH, rowH, pctH, lineW, bandH, gap, nameFs, nameLH, noteLH, total: rows.reduce((t, r) => t + r.h, 0) };
  };

  let fs = 10, plan = layout(fs);
  while (plan.total > availH && fs > 3.5) { fs -= 0.5; plan = layout(fs); }
  const fits = plan.total <= availH;
  const { lineH, rowH, pctH, lineW, bandH, gap, nameFs, nameLH, noteLH } = plan;

  pdf.setDrawColor(...theme); pdf.setLineWidth(1.5);
  pdf.line(M, top - 5, W - M, top - 5);

  let y = top;
  plan.rows.forEach((row) => {
    // week name: solid colored block down the left
    pdf.setFillColor(...C.week); pdf.rect(M, y, gutter, row.h, "F");
    pdf.setTextColor(C.weekText); pdf.setFont("helvetica", "bold"); pdf.setFontSize(Math.min(fs + 1, 10));
    pdf.text(pdf.splitTextToSize(row.name, gutter - 2 * pad), M + pad, y + pad + lineH * 0.8);
    for (let i = 0; i < maxDays; i++) {
      const x = M + gutter + i * colW;
      const cell = row.cells[i];
      if (cell) {
        // day name centered on a solid bar
        pdf.setFillColor(...C.day); pdf.rect(x, y, colW, bandH, "F");
        pdf.setTextColor(C.dayText); pdf.setFont("helvetica", "bold"); pdf.setFontSize(fs);
        pdf.text(pdf.splitTextToSize(cell.name.toUpperCase(), colW - 2 * pad)[0], x + colW / 2, y + lineH * 0.8 + 1.5, { align: "center" });
        pdf.setFontSize(fs);
        let cy = y + bandH + pad;
        if (cell.warmLines.length) {
          pdf.setFont("helvetica", "bolditalic"); pdf.setTextColor(20);
          cell.warmLines.forEach((line) => { pdf.text(line, x + pad, cy + lineH * 0.8); cy += lineH; });
          cy += gap;
          pdf.setDrawColor(...theme); pdf.setLineWidth(1);
          pdf.line(x, cy, x + colW, cy);
          cy += gap;
        }
        cell.items.forEach((it, k) => {
          if (k > 0) {
            cy += gap;
            if (it.newGroup) {
              // a solid colored rule across the whole day column separates one superset from the next
              pdf.setDrawColor(...theme); pdf.setLineWidth(1);
            } else {
              // a thin black line separates the exercises inside a superset (A1 from A2)
              pdf.setDrawColor(0); pdf.setLineWidth(0.35);
            }
            pdf.line(x, cy, x + colW, cy);
            cy += gap;
          }
          const itemTop = cy;
          pdf.setFont("helvetica", "bold"); pdf.setFontSize(nameFs);
          it.lines.forEach((line, li) => {
            const base = cy + nameLH * 0.8;
            if (li === 0) {
              // superset label as a small solid tag, like the label cells on the sheets
              const tag = it.label.replace(/\.$/, "");
              const tagW = pdf.getTextWidth(tag) + 3;
              pdf.setFillColor(...C.label); pdf.rect(x + pad, base - nameFs * 0.82, tagW, nameFs * 1.08, "F");
              pdf.setTextColor(255); pdf.text(tag, x + pad + 1.5, base);
              const lw = pdf.getTextWidth(`${it.label} `);
              pdf.setTextColor(20);
              pdf.text(line.slice(it.label.length).trimStart(), x + pad + Math.max(lw, tagW + 2.5), base);
            } else {
              pdf.setTextColor(20);
              pdf.text(line, x + pad, base);
            }
            cy += nameLH;
          });
          pdf.setFont("helvetica", "italic"); pdf.setFontSize(fs * 0.85); pdf.setTextColor(70);
          it.noteLines.forEach((line) => { pdf.text(line, x + pad, cy + noteLH * 0.78); cy += noteLH; });
          pdf.setFontSize(fs);
          // set groups at the right: reps, a line for the weight used, and the intensity in a colored cell under it
          cy = itemTop;
          it.rxLines.forEach((boxes) => {
            pdf.setDrawColor(40); pdf.setLineWidth(0.5);
            boxes.forEach((b) => {
              const bx = x + pad + b.x, lx = bx + b.rw, base = cy + rowH - 2;
              pdf.setFont("helvetica", "bold"); pdf.setFontSize(fs); pdf.setTextColor(20);
              pdf.text(b.reps, bx, base);
              pdf.setDrawColor(40); pdf.setLineWidth(0.6);
              pdf.line(lx, base + 1, lx + b.lw, base + 1);
              if (b.int) {
                pdf.setFillColor(...C.pct); pdf.rect(lx, base + 1.6, b.lw, pctH, "F");
                pdf.setFont("helvetica", "bolditalic"); pdf.setFontSize(fs * 0.85); pdf.setTextColor(0);
                pdf.text(b.int, lx + b.lw / 2, base + 1.6 + pctH * 0.76, { align: "center" });
              }
            });
            pdf.setFontSize(fs);
            cy += it.rxH;
          });
          if (it.rest) {
            pdf.setFont("helvetica", "italic"); pdf.setFontSize(fs * 0.85); pdf.setTextColor(70);
            pdf.text(it.rest, x + colW - pad, cy + fs * 0.75, { align: "right" });
            pdf.setFontSize(fs);
          }
          cy = itemTop + it.bodyH;
        });
      }
      pdf.setDrawColor(170); pdf.setLineWidth(0.5);
      pdf.rect(x, y, colW, row.h);
    }
    y += row.h;
  });
  return { pdf, fontSize: fs, fits };
}

// "Export PDF" with an optional athlete name for the page's top-left corner.
function ProgramPdfButton({ program, disabled }) {
  const [athleteId, setAthleteId] = useState("");
  const athletes = window.AthleteStore.allAthletes()
    .filter((a) => (a.status || "active").toLowerCase() !== "alumni")
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));

  const run = async () => {
    const athlete = athletes.find((a) => String(a.id) === athleteId);
    const name = athlete ? athlete.name : "";
    const { pdf, fits } = await buildProgramPdf(program, name, !!athlete && isCubsOnlyAthlete(athlete));
    if (!fits) window.alert("This program is too long to fit on one page at a readable size, so the bottom of the page is cut off. Try fewer weeks per program.");
    pdf.save(`${[name, program.name].filter(Boolean).join(" - ").replace(/[\\/:*?"<>|]/g, "")}.pdf`);
  };

  return (
    <span className="program-pdf">
      <select value={athleteId} onChange={(e) => setAthleteId(e.target.value)} title="Athlete name to print on the PDF">
        <option value="">No athlete name</option>
        {athletes.map((a) => <option key={a.id} value={String(a.id)}>{a.name}</option>)}
      </select>
      <button className="btn-link" disabled={disabled} onClick={run}>Export PDF</button>
    </span>
  );
}

// Create or edit one program. Works on a copy, so Cancel leaves the saved program untouched.
function ProgramEditor({ initial, onSave, onCancel, onDelete, onDirty, cancelLabel }) {
  const [draft, setDraft] = useState(() => { const d = JSON.parse(JSON.stringify(initial || { name: "", description: "", weeks: [newWeek(1)] })); d.weeks = normalizeProgramWeeks(d.weeks); return d; });
  const edit = (fn) => { if (onDirty) onDirty(); setDraft((d) => { const c = JSON.parse(JSON.stringify(d)); fn(c); return c; }); };

  // Clicking into a week highlights it and dims the others, to keep your place in a long program.
  const [focusWeek, setFocusWeek] = useState(null);
  // The same inside a day: clicking into an exercise highlights its superset (the A's, the B's…) and dims the
  // day's other supersets.
  const [focusSet, setFocusSet] = useState(null); // { wi, si, letter }
  const pickSet = (wi, si, label) => {
    const letter = label.replace(/\d+\.$/, "");
    setFocusSet((f) => (f && f.wi === wi && f.si === si && f.letter === letter ? f : { wi, si, letter }));
  };

  // Swapping an exercise in one week: once the name box is left, offer to make the same swap in every later
  // week, for exercises with the old name on the same day.
  const nameAtFocus = React.useRef(null);
  const offerSwapForward = (wi, si, ei) => {
    const was = nameAtFocus.current;
    nameAtFocus.current = null;
    if (!was || was.wi !== wi || was.si !== si || was.ei !== ei) return;
    const oldName = (was.name || "").trim();
    const newName = (((draft.weeks[wi].sessions[si] || {}).exercises[ei] || {}).name || "").trim();
    if (!oldName || !newName || oldName.toLowerCase() === newName.toLowerCase()) return;
    const same = (e) => (e.name || "").trim().toLowerCase() === oldName.toLowerCase();
    const later = draft.weeks.map((w, i) => i).filter((i) => i > wi && ((draft.weeks[i].sessions[si] || {}).exercises || []).some(same));
    if (!later.length) return;
    const names = later.map((i) => draft.weeks[i].name || `Week ${i + 1}`).join(", ");
    if (!window.confirm(`Also change "${oldName}" to "${newName}" in the following weeks (${names})?`)) return;
    edit((d) => later.forEach((i) => d.weeks[i].sessions[si].exercises.forEach((e) => { if (same(e)) e.name = newName; })));
  };
  const canSave = (draft.name || "").trim().length > 0;

  const save = () => {
    if (!canSave) return;
    const rec = { name: draft.name.trim(), description: (draft.description || "").trim(), weeks: draft.weeks, nextProgramIds: draft.nextProgramIds || [] };
    if (initial && initial.id) rec.id = initial.id;
    onSave(rec);
  };

  // Copies one day's exercises (with their supersets) onto another day in the same week, or into a new day.
  // The target keeps its own name; anything already entered there is replaced, after a confirm.
  const copyDay = (wi, si, target) => {
    if (target === "") return;
    const week = draft.weeks[wi];
    const copyOf = (d) => d.weeks[wi].sessions[si].exercises.map((e) => ({ ...e, id: newExercise().id }));
    if (target === "new") {
      edit((d) => { const s = d.weeks[wi].sessions; s.push({ name: `Day ${s.length + 1}`, warmup: s[si].warmup || "", exercises: copyOf(d) }); });
      return;
    }
    const ti = Number(target);
    const dest = week.sessions[ti];
    const hasWork = dest.exercises.some((e) => (e.name || "").trim());
    if (hasWork && !window.confirm(`Replace the exercises in ${dest.name || `Day ${ti + 1}`} with a copy of ${week.sessions[si].name || `Day ${si + 1}`}?`)) return;
    edit((d) => { d.weeks[wi].sessions[ti].exercises = copyOf(d); d.weeks[wi].sessions[ti].warmup = d.weeks[wi].sessions[si].warmup || ""; });
  };

  const input = (value, onChange, props = {}) => (
    <input value={value || ""} onChange={(e) => onChange(e.target.value)} {...props} />
  );

  return (
    <div className="panel program-editor">
      {/* exercise names suggest from the library; a name that matches links to its library entry */}
      <datalist id="exercise-library-names">
        {window.AthleteStore.allExercises().map((e) => <option key={e.id} value={e.name} />)}
      </datalist>
      <div className="program-editor-top">
        <h2>{initial && initial.id ? "Edit program" : "New program"}</h2>
        <ProgramPdfButton program={{ name: (draft.name || "").trim() || "Program", weeks: draft.weeks }} />
      </div>
      <div className="facility-form-grid">
        <label className="facility-field wide"><span>Program name *</span>
          {input(draft.name, (v) => edit((d) => { d.name = v; }), { placeholder: "e.g. Off-season strength, Phase 1" })}
        </label>
        <label className="facility-field wide"><span>Description</span>
          <textarea rows={2} value={draft.description || ""} onChange={(e) => edit((d) => { d.description = e.target.value; })} placeholder="Goal, who it's for, how it fits in the plan" />
        </label>
        {/* suggested next phase(s): only ever offered as a suggestion when assigning or building, never applied automatically */}
        <div className="facility-field wide"><span>Suggested next phase (optional, a suggestion only)</span>
          <div className="program-next">
            {(draft.nextProgramIds || []).map((id) => {
              const p = window.AthleteStore.allPrograms().find((x) => x.id === id);
              return (
                <span className="program-next-chip" key={id}>
                  {p ? p.name : "(deleted program)"}
                  <button title="Remove this suggestion" onClick={() => edit((d) => { d.nextProgramIds = (d.nextProgramIds || []).filter((x) => x !== id); })}>✕</button>
                </span>
              );
            })}
            <select value="" onChange={(e) => e.target.value && edit((d) => { d.nextProgramIds = [...(d.nextProgramIds || []), e.target.value]; })}>
              <option value="">+ Add a suggested next program…</option>
              {window.AthleteStore.allPrograms().filter((p) => p.id !== (initial && initial.id) && !(draft.nextProgramIds || []).includes(p.id)).map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
        </div>
      </div>

      {(focusSet || (focusWeek != null && draft.weeks.length > 1)) && (
        <button className="btn-link program-show-all" onClick={() => { setFocusWeek(null); setFocusSet(null); }}>Show everything at full brightness</button>
      )}
      {draft.weeks.map((week, wi) => (
        <div
          className={`program-week ${focusWeek === wi ? "focused" : focusWeek != null ? "dimmed" : ""}`}
          key={wi}
          onMouseDown={() => setFocusWeek(wi)}
          onFocusCapture={() => setFocusWeek(wi)}
        >
          <div className="program-week-head">
            {input(week.name, (v) => edit((d) => { d.weeks[wi].name = v; }), { className: "program-week-name", "aria-label": "Week name" })}
            <button className="btn-link" disabled={draft.weeks.length === 1} onClick={() => edit((d) => { d.weeks.splice(wi, 1); })}>Remove week</button>
          </div>

          <div className="program-days">
            {week.sessions.map((session, si) => {
              const labels = window.exerciseLabels(session.exercises);
              const setEx = (ei, key, v) => edit((d) => { d.weeks[wi].sessions[si].exercises[ei][key] = v; });
              return (
                <div className={`program-day ${focusSet && focusSet.wi === wi && focusSet.si !== si ? "day-dimmed" : ""}`} key={si}>
                  <div className="program-session-head">
                    {input(session.name, (v) => edit((d) => { d.weeks[wi].sessions[si].name = v; }), { className: "program-session-name", "aria-label": "Day name" })}
                    <button className="btn-link" title="Remove this day" disabled={week.sessions.length === 1} onClick={() => edit((d) => { d.weeks[wi].sessions.splice(si, 1); })}>✕</button>
                  </div>
                  <textarea
                    className="program-warmup"
                    rows={2}
                    value={session.warmup || ""}
                    placeholder="Warm-up (optional), shown above A1"
                    onChange={(e) => edit((d) => { d.weeks[wi].sessions[si].warmup = e.target.value; })}
                  />
                  {session.exercises.map((ex, ei) => (
                    <div
                      className={`program-ex ${ei > 0 && ex.linked ? "superset-linked" : ""} ${focusSet && focusSet.wi === wi && focusSet.si === si ? (focusSet.letter === labels[ei].replace(/\d+\.$/, "") ? "set-focused" : "set-dimmed") : ""}`}
                      key={ex.id || ei}
                      onMouseDown={() => pickSet(wi, si, labels[ei])}
                      onFocusCapture={() => pickSet(wi, si, labels[ei])}
                    >
                      <div className="program-ex-top">
                        <strong className="superset-label">{labels[ei]}</strong>
                        {input(ex.name, (v) => setEx(ei, "name", v), { placeholder: "Exercise", className: "program-ex-name", list: "exercise-library-names", onFocus: () => { nameAtFocus.current = { wi, si, ei, name: ex.name }; }, onBlur: () => offerSwapForward(wi, si, ei) })}
                        {input(ex.tempo, (v) => setEx(ei, "tempo", v), { placeholder: "Tempo", className: "program-ex-tempo", maxLength: 6, title: "Tempo, optional: eccentric, pause, concentric. 40* = 4 seconds down, no pause, explosive up." })}
                        {window.AthleteStore.findExerciseByName(ex.name) && (
                          <button className="exercise-view-btn" title="View this exercise from the library" onClick={() => window.openExercise(ex.name)}>▶</button>
                        )}
                        {ei > 0 && (
                          <button
                            className={`superset-toggle ${ex.linked ? "on" : ""}`}
                            title={ex.linked ? "Superset with the exercise above. Click to separate." : "Superset with the exercise above"}
                            onClick={() => edit((d) => { const e = d.weeks[wi].sessions[si].exercises[ei]; e.linked = !e.linked; })}
                          >
                            {ex.linked ? "Linked" : "Link"}
                          </button>
                        )}
                        <button className="btn-link" title="Remove exercise" onClick={() => edit((d) => { d.weeks[wi].sessions[si].exercises.splice(ei, 1); })}>✕</button>
                      </div>
                      {/* set groups: each line is sets x reps at an intensity, so the intensity can change set to set */}
                      {ex.groups.map((g, gi) => {
                        const setG = (key, v) => edit((d) => { d.weeks[wi].sessions[si].exercises[ei].groups[gi][key] = v; });
                        return (
                          <div className="program-ex-group" key={gi}>
                            {input(g.sets, (v) => setG("sets", v), { placeholder: "Sets", title: "Sets (leave blank for one set)" })}
                            <span>×</span>
                            {input(g.reps, (v) => setG("reps", v), { placeholder: "Reps", title: "Reps" })}
                            {ex.intensityUnit !== "" && <span>@</span>}
                            {ex.intensityUnit !== "" && input(g.intensity, (v) => setG("intensity", v), { placeholder: ex.intensityUnit === "%" ? "%" : ex.intensityUnit, title: `Intensity (${ex.intensityUnit})` })}
                            <button className="btn-link" title="Remove this line" disabled={ex.groups.length === 1} onClick={() => edit((d) => { d.weeks[wi].sessions[si].exercises[ei].groups.splice(gi, 1); })}>✕</button>
                          </div>
                        );
                      })}
                      <div className="program-ex-nums">
                        <button className="btn-link" title="Add another line of sets at a different intensity" onClick={() => edit((d) => { d.weeks[wi].sessions[si].exercises[ei].groups.push(newSetGroup()); })}>+ Sets</button>
                        <select value={ex.intensityUnit} title="How intensity is prescribed for this exercise" onChange={(e) => setEx(ei, "intensityUnit", e.target.value)}>
                          {INTENSITY_UNITS.map(([v, label]) => <option key={v} value={v}>{label}</option>)}
                        </select>
                        {input(ex.rest, (v) => setEx(ei, "rest", v), { placeholder: "Rest", title: "Rest" })}
                      </div>
                      {window.ProgramRx.text(ex) && <div className="program-ex-preview">{window.ProgramRx.text(ex)}</div>}
                      {input(ex.notes, (v) => setEx(ei, "notes", v), { placeholder: "Notes: cues", className: "program-ex-notes" })}
                    </div>
                  ))}
                  <div className="program-day-actions">
                    <button className="btn-link" onClick={() => edit((d) => { d.weeks[wi].sessions[si].exercises.push(newExercise()); })}>+ Exercise</button>
                    <button className="btn-link" title="Adds an exercise linked to the one above (A1, A2…)" onClick={() => edit((d) => { const xs = d.weeks[wi].sessions[si].exercises; xs.push({ ...newExercise(), linked: xs.length > 0 }); })}>+ Superset</button>
                    <select
                      className="program-copy-day"
                      value=""
                      title="Copy this day's exercises to another day"
                      onChange={(e) => copyDay(wi, si, e.target.value)}
                    >
                      <option value="">Copy to…</option>
                      {week.sessions.map((s, ti) => ti !== si && <option key={ti} value={ti}>{s.name || `Day ${ti + 1}`}</option>)}
                      <option value="new">New day</option>
                    </select>
                  </div>
                </div>
              );
            })}
            <button className="program-add-day" onClick={() => edit((d) => { d.weeks[wi].sessions.push(newSession(d.weeks[wi].sessions.length + 1)); })}>+ Add day</button>
          </div>
        </div>
      ))}
      <button className="btn-link" title="Adds a week that copies the one before it" onClick={() => edit((d) => { const n = d.weeks.length; d.weeks.push(n ? copyWeek(d.weeks[n - 1], n + 1) : newWeek(1)); })}>+ Add week (copies the last week)</button>

      <div className="facility-form-actions">
        <button className="btn" disabled={!canSave} onClick={save}>Save program</button>
        <button className="btn-link" onClick={onCancel}>{cancelLabel || "Cancel"}</button>
        {initial && initial.id && onDelete && <button className="btn-link" style={{ marginLeft: "auto" }} onClick={onDelete}>Delete program</button>}
      </div>
    </div>
  );
}

// Athletes whose periodization chart already has a block linked to this program.
const athletesOnProgram = (programId) =>
  window.AthleteStore.allPeriodizationAthleteIds().filter((id) => {
    const plan = window.AthleteStore.getPeriodization(id);
    return plan && (plan.blocks || []).some((b) => b.programId === programId);
  });

// "Sykora" from "Travis Sykora"; a trailing Jr. / Sr. / II / III is skipped.
const athleteLastName = (name) => {
  const parts = (name || "").trim().split(/\s+/).filter((p) => !/^(jr\.?|sr\.?|ii|iii|iv)$/i.test(p));
  return parts[parts.length - 1] || (name || "").trim();
};

// Individualize an assigned program for one athlete: swap exercises, adjust sets and reps week by week, then
// save it as a new program named "<Last name> - <Program>" and point the athlete's chart at that copy.
function ProgramIndividualize({ program, athlete, onDone }) {
  const S = window.AthleteStore;
  const [weeks, setWeeks] = useState(() => normalizeProgramWeeks(JSON.parse(JSON.stringify(program.weeks || []))));
  const [swaps, setSwaps] = useState({}); // original exercise name -> replacement
  const newName = `${athleteLastName(athlete.name)} - ${program.name}`;
  const named = (e) => (e.name || "").trim();
  const shownName = (e) => (swaps[named(e)] != null && swaps[named(e)].trim() ? swaps[named(e)].trim() : named(e));

  // every exercise in the program, once, in the order it first appears, with the days it's used on
  const unique = [];
  weeks.forEach((w) => (w.sessions || []).forEach((s, si) => (s.exercises || []).forEach((e) => {
    if (!named(e)) return;
    let u = unique.find((x) => x.name === named(e));
    if (!u) { u = { name: named(e), days: [] }; unique.push(u); }
    const day = s.name || `Day ${si + 1}`;
    if (!u.days.includes(day)) u.days.push(day);
  })));
  const changed = unique.filter((u) => swaps[u.name] && swaps[u.name].trim() && swaps[u.name].trim() !== u.name).length;

  const maxDays = Math.max(0, ...weeks.map((w) => (w.sessions || []).length));
  const setCell = (wi, si, ei, gi, key, v) => setWeeks((ws) => { const c = JSON.parse(JSON.stringify(ws)); c[wi].sessions[si].exercises[ei].groups[gi][key] = v; return c; });

  const save = () => {
    const finalWeeks = JSON.parse(JSON.stringify(weeks));
    finalWeeks.forEach((w) => (w.sessions || []).forEach((s) => (s.exercises || []).forEach((e) => { e.name = shownName(e); })));
    const saved = S.saveProgram({ name: newName, description: program.description || "", weeks: finalWeeks, folder: program.folder || "", basedOn: program.id, athleteId: athlete.id, nextProgramIds: program.nextProgramIds || [] });
    // the athlete's chart now points at their own copy instead of the shared program
    const plan = S.getPeriodization(athlete.id);
    if (plan && (plan.blocks || []).some((b) => b.programId === program.id)) {
      const next = JSON.parse(JSON.stringify(plan));
      next.blocks.forEach((b) => { if (b.programId === program.id) { b.programId = saved.id; if (b.label === program.name) b.label = saved.name; } });
      S.setPeriodization(athlete.id, next);
    }
    onDone(saved);
  };

  return (
    <div className="panel">
      <datalist id="individualize-exercise-names">
        {S.allExercises().map((e) => <option key={e.id} value={e.name} />)}
      </datalist>
      <h2>Individualize for {athlete.name} <small>saves as “{newName}”</small></h2>

      <h3 className="indiv-heading">1. Exercises <small>Type a replacement to swap an exercise everywhere it appears. Leave blank to keep it.</small></h3>
      <div className="indiv-swaps">
        {unique.map((u) => (
          <div className="indiv-swap" key={u.name}>
            <div className="indiv-swap-from">
              {S.findExerciseByName(u.name) ? <button className="exercise-link" onClick={() => window.openExercise(u.name)}>{u.name}</button> : u.name}
              <small>{u.days.join(", ")}</small>
            </div>
            <span className="indiv-arrow">→</span>
            <input list="individualize-exercise-names" value={swaps[u.name] || ""} placeholder="Keep as is" onChange={(e) => setSwaps((s) => ({ ...s, [u.name]: e.target.value }))} />
          </div>
        ))}
        {unique.length === 0 && <div className="empty-state">This program has no exercises yet.</div>}
      </div>

      <h3 className="indiv-heading">2. Sets and reps by week <small>{changed ? `${changed} exercise${changed === 1 ? "" : "s"} swapped. ` : ""}Each line is sets × reps @ intensity.</small></h3>
      {Array.from({ length: maxDays }, (_, si) => {
        const rows = Math.max(0, ...weeks.map((w) => ((w.sessions[si] || {}).exercises || []).length));
        const dayName = ((weeks.find((w) => w.sessions[si]) || {}).sessions || [])[si];
        return (
          <div className="indiv-day" key={si}>
            <h4>{(dayName && dayName.name) || `Day ${si + 1}`}</h4>
            <div className="indiv-grid-wrap">
              <table className="indiv-grid">
                <thead><tr><th>Exercise</th>{weeks.map((w, wi) => <th key={wi}>{w.name || `Week ${wi + 1}`}</th>)}</tr></thead>
                <tbody>
                  {Array.from({ length: rows }, (_, ei) => {
                    const first = weeks.map((w) => ((w.sessions[si] || {}).exercises || [])[ei]).find((e) => e && named(e));
                    if (!first) return null;
                    const labels = window.exerciseLabels(((weeks.find((w) => w.sessions[si]) || {}).sessions[si] || {}).exercises || []);
                    return (
                      <tr key={ei}>
                        <td className="indiv-ex"><strong className="superset-label">{labels[ei]}</strong> {shownName(first)}</td>
                        {weeks.map((w, wi) => {
                          const e = ((w.sessions[si] || {}).exercises || [])[ei];
                          if (!e || !named(e)) return <td key={wi} className="indiv-empty">—</td>;
                          const other = shownName(e) !== shownName(first);
                          return (
                            <td key={wi}>
                              {other && <div className="indiv-other">{shownName(e)}</div>}
                              {e.groups.map((g, gi) => (
                                <span className="indiv-cell" key={gi}>
                                  <input value={g.sets || ""} aria-label="Sets" placeholder="1" onChange={(ev) => setCell(wi, si, ei, gi, "sets", ev.target.value)} />
                                  <span>×</span>
                                  <input value={g.reps || ""} aria-label="Reps" onChange={(ev) => setCell(wi, si, ei, gi, "reps", ev.target.value)} />
                                  {e.intensityUnit !== "" && <span>@</span>}
                                  {e.intensityUnit !== "" && <input value={g.intensity || ""} aria-label={`Intensity (${e.intensityUnit})`} placeholder={e.intensityUnit} onChange={(ev) => setCell(wi, si, ei, gi, "intensity", ev.target.value)} />}
                                </span>
                              ))}
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })}

      <div className="facility-form-actions">
        <button className="btn" onClick={save}>Save as “{newName}”</button>
        <button className="btn-link" onClick={() => onDone(null)}>Cancel</button>
      </div>
    </div>
  );
}

// Assign one program to several athletes at once. Each gets a block on their periodization chart, linked to the program.
// The programs suggested to follow this one. An athlete's own copy falls back to its original's suggestions.
const suggestedNextPrograms = (program) => {
  const all = window.AthleteStore.allPrograms();
  const base = program && program.basedOn ? all.find((p) => p.id === program.basedOn) : null;
  const ids = (program && program.nextProgramIds && program.nextProgramIds.length ? program.nextProgramIds : (base && base.nextProgramIds) || []);
  return ids.map((id) => all.find((p) => p.id === id)).filter(Boolean);
};
window.suggestedNextPrograms = suggestedNextPrograms;

function ProgramAssignPanel({ program, onClose, initialStart, onAssignOther }) {
  const lib = window.PeriodizationLib;
  const [startDate, setStartDate] = useState(() => initialStart || lib.mondayOfToday());
  const [laneName, setLaneName] = useState("Strength");
  const [query, setQuery] = useState("");
  const [picked, setPicked] = useState(() => new Set());
  const [result, setResult] = useState(null);
  const already = new Set(athletesOnProgram(program.id).map(String));
  const athletes = window.AthleteStore.allAthletes()
    .filter((a) => (a.status || "active").toLowerCase() !== "alumni")
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  const q = query.trim().toLowerCase();
  const shown = athletes.filter((a) => !q || [a.name, a.team, a.dstLocation, a.position].some((v) => (v || "").toLowerCase().includes(q)));
  const weeks = (program.weeks || []).length;

  const toggle = (id) => setPicked((s) => { const n = new Set(s); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  const pickShown = () => setPicked((s) => { const n = new Set(s); shown.forEach((a) => { if (!already.has(String(a.id))) n.add(a.id); }); return n; });

  const [assigned, setAssigned] = useState([]); // athletes assigned in this visit, offered for individualizing
  const [individualizing, setIndividualizing] = useState(null); // athlete whose copy is being edited
  const [individualized, setIndividualized] = useState({}); // athlete id -> name of the saved copy

  const assign = () => {
    const out = { added: [], created: [], already: [], failed: [] };
    const done = [];
    athletes.filter((a) => picked.has(a.id)).forEach((a) => {
      const r = lib.assignProgram(a.id, program, { startDate, laneName });
      (out[r] || out.failed).push(a.name);
      if (r === "added" || r === "created") done.push(a);
    });
    setResult(out);
    setAssigned((prev) => [...prev, ...done.filter((a) => !prev.some((p) => p.id === a.id))]);
    setPicked(new Set());
  };

  if (individualizing) {
    return (
      <ProgramIndividualize
        program={program}
        athlete={individualizing}
        onDone={(saved) => { if (saved) setIndividualized((m) => ({ ...m, [individualizing.id]: saved.name })); setIndividualizing(null); }}
      />
    );
  }

  return (
    <div className="panel">
      <h2>Assign “{program.name}” <small>{weeks} week{weeks === 1 ? "" : "s"}</small></h2>
      <div className="facility-form-grid">
        <label className="facility-field"><span>Starts the week of</span>
          <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} />
        </label>
        <label className="facility-field"><span>Row on the periodization chart</span>
          <input list="program-assign-lanes" value={laneName} onChange={(e) => setLaneName(e.target.value)} />
          <datalist id="program-assign-lanes">
            {["Phase", "Running", "Strength", "Correctives", "Throwing"].map((n) => <option key={n} value={n} />)}
          </datalist>
        </label>
      </div>
      <div className="facility-toolbar" style={{ marginBottom: 0 }}>
        <input className="facility-search" value={query} placeholder="Search by name, team, location, or position" onChange={(e) => setQuery(e.target.value)} />
        <button className="btn-link" onClick={pickShown}>Select all shown</button>
        <button className="btn-link" onClick={() => setPicked(new Set())}>Clear</button>
      </div>
      <div className="program-assign-list">
        {shown.map((a) => {
          const has = already.has(String(a.id));
          return (
            <label key={a.id}>
              <input type="checkbox" disabled={has} checked={has || picked.has(a.id)} onChange={() => toggle(a.id)} />
              <span>{a.name} {has && <small>(already assigned)</small>}</span>
            </label>
          );
        })}
        {shown.length === 0 && <div className="empty-state">No athletes match that search.</div>}
      </div>
      {result && (
        <div className="program-assign-result">
          {result.added.length > 0 && <div>Added to the chart for: {result.added.join(", ")}.</div>}
          {result.created.length > 0 && <div>New periodization chart started for: {result.created.join(", ")}.</div>}
          {result.already.length > 0 && <div>Already on the chart, left as is: {result.already.join(", ")}.</div>}
          {result.failed.length > 0 && <div>Couldn't be placed (start date is beyond the chart's limit): {result.failed.join(", ")}.</div>}
        </div>
      )}
      {result && onAssignOther && suggestedNextPrograms(program).length > 0 && (() => {
        // the week after this program ends, offered as the start date for the suggested next phase
        const d = new Date(`${startDate}T00:00:00`);
        d.setDate(d.getDate() + Math.max(1, weeks) * 7);
        const nextStart = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        return (
          <div className="indiv-offer">
            <strong>Suggested next phase</strong>
            <span>Only a suggestion. Nothing is assigned unless you choose it; the start date will be set to the week after this program ends ({nextStart}).</span>
            <div className="indiv-offer-list">
              {suggestedNextPrograms(program).map((p) => (
                <button className="btn btn-secondary" key={p.id} onClick={() => onAssignOther(p, nextStart)}>Assign “{p.name}” next</button>
              ))}
            </div>
          </div>
        );
      })()}
      {assigned.length > 0 && (
        <div className="indiv-offer">
          <strong>Individualize this program?</strong>
          <span>Pick an athlete to swap exercises and adjust sets and reps. Their own copy is saved and linked to their chart.</span>
          <div className="indiv-offer-list">
            {assigned.map((a) => (individualized[a.id]
              ? <span className="indiv-done" key={a.id}>✓ {a.name}: saved as “{individualized[a.id]}”</span>
              : <button className="btn btn-secondary" key={a.id} onClick={() => setIndividualizing(a)}>Individualize for {a.name}</button>
            ))}
          </div>
        </div>
      )}
      <div className="facility-form-actions">
        <button className="btn" disabled={picked.size === 0 || !startDate} onClick={assign}>Assign to {picked.size} athlete{picked.size === 1 ? "" : "s"}</button>
        <button className="btn-link" onClick={onClose}>{result ? "Done" : "Cancel"}</button>
      </div>
    </div>
  );
}

// Programs tab: every saved program, plus the editor.
// Which screen of the Programs page is open. Kept by App (not here) so it's part of the Back history.
const PROGRAMS_NAV_HOME = { section: "programs", folder: "", editingId: null, assigningId: null };

function ProgramsPage({ nav, setNav }) {
  const [version, setVersion] = useState(0);
  const S = window.AthleteStore;
  const programs = S.allPrograms();
  const folders = S.getProgramFolders();
  // folder: path of the folder being viewed ("" is the top level). A folder that no longer exists falls back to the top.
  const folder = nav.folder && folders.includes(nav.folder) ? nav.folder : "";
  // editing: null = list, {} = new program, record = editing that one. assigning: the program being assigned, if any.
  const editing = nav.editingId === "new" ? {} : (nav.editingId && programs.find((p) => p.id === nav.editingId)) || null;
  const assigning = (nav.assigningId && programs.find((p) => p.id === nav.assigningId)) || null;
  // Opening a screen adds a step to the Back history; closing one (save, cancel, done) steps back out of it.
  const setEditing = (x) => (x ? setNav((n) => ({ ...n, editingId: x.id || "new" })) : window.history.back());
  const setAssigning = (p) => (p ? setNav((n) => ({ ...n, assigningId: p.id, assignStart: null })) : window.history.back());
  const setFolder = (f, opts) => setNav((n) => ({ ...n, folder: f }), opts);
  const bump = () => setVersion((v) => v + 1);

  // ---- folders: paths like "Strength/Lower Body" ----
  const inFolder = (path, f) => path === f || path.startsWith(`${f}/`);
  const parentOf = (f) => (f.includes("/") ? f.slice(0, f.lastIndexOf("/")) : "");
  const leafOf = (f) => f.slice(f.lastIndexOf("/") + 1);
  const subfolders = folders.filter((f) => parentOf(f) === folder);
  // Search: by program name or coach, and a coach picker. While either is in use the list covers every folder.
  const [query, setQuery] = useState("");
  const [coach, setCoach] = useState("");
  const coachName = (email) => USER_DISPLAY_NAMES[email] || email;
  const coaches = [...new Set(programs.map((p) => p.createdBy).filter(Boolean))].sort((a, b) => coachName(a).localeCompare(coachName(b)));
  const q = query.trim().toLowerCase();
  const searching = !!q || !!coach;
  const here = searching
    ? programs.filter((p) =>
        (!coach || (coach === "__none__" ? !p.createdBy : p.createdBy === coach)) &&
        (!q || [p.name, p.createdBy, p.createdBy && coachName(p.createdBy)].some((v) => (v || "").toLowerCase().includes(q))))
    : programs.filter((p) => (p.folder || "") === folder);
  const countIn = (f) => programs.filter((p) => inFolder(p.folder || "", f)).length;
  const cleanName = (raw) => (raw || "").replace(/\//g, " ").trim();

  const addFolder = () => {
    const name = cleanName(window.prompt(folder ? `New subfolder in ${leafOf(folder)}:` : "New folder name:"));
    if (!name) return;
    const path = folder ? `${folder}/${name}` : name;
    if (folders.some((f) => f.toLowerCase() === path.toLowerCase())) { window.alert("A folder with that name is already here."); return; }
    S.setProgramFolders([...folders, path]);
    bump();
  };

  // Re-roots everything under `from` (the folder, its subfolders and their programs) onto `to`.
  const moveTree = (from, to, keepSelf) => {
    const swap = (path) => (path === from ? to : `${to}${to ? "/" : ""}${path.slice(from.length + 1)}`);
    S.setProgramFolders(folders.filter((f) => keepSelf || f !== from).map((f) => (inFolder(f, from) ? swap(f) : f)).filter(Boolean));
    programs.filter((p) => inFolder(p.folder || "", from)).forEach((p) => S.saveProgram({ ...p, folder: swap(p.folder) }));
  };

  const renameFolder = () => {
    const name = cleanName(window.prompt("Rename this folder:", leafOf(folder)));
    if (!name || name === leafOf(folder)) return;
    const path = parentOf(folder) ? `${parentOf(folder)}/${name}` : name;
    if (folders.some((f) => f.toLowerCase() === path.toLowerCase())) { window.alert("A folder with that name is already here."); return; }
    moveTree(folder, path, true);
    setFolder(path, { replace: true });
    bump();
  };

  const deleteFolder = () => {
    const n = countIn(folder);
    const subs = folders.filter((f) => f !== folder && inFolder(f, folder)).length;
    const where = parentOf(folder) ? leafOf(parentOf(folder)) : "the top level";
    const moved = [n && `${n} program${n === 1 ? "" : "s"}`, subs && `${subs} subfolder${subs === 1 ? "" : "s"}`].filter(Boolean).join(" and ");
    if (!window.confirm(`Delete the folder "${leafOf(folder)}"?${moved ? ` Its ${moved} will move up to ${where}; no programs are deleted.` : ""}`)) return;
    moveTree(folder, parentOf(folder), false);
    setFolder(parentOf(folder), { replace: true });
    bump();
  };

  const moveProgram = (p, to) => { S.saveProgram({ ...p, folder: to }); bump(); };

  // Drag a program card onto a folder tile, or onto a breadcrumb to move it back up.
  const [dropOver, setDropOver] = useState(null); // folder path being hovered while dragging, or null
  const dropTarget = (path) => ({
    onDragOver: (e) => { if (e.dataTransfer.types.includes("application/x-program")) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (dropOver !== path) setDropOver(path); } },
    onDragLeave: () => setDropOver((d) => (d === path ? null : d)),
    onDrop: (e) => {
      e.preventDefault();
      setDropOver(null);
      const p = programs.find((x) => x.id === e.dataTransfer.getData("application/x-program"));
      if (p && (p.folder || "") !== path) moveProgram(p, path);
    },
  });

  const save = (rec) => {
    // an edited program stays in its folder; a new one goes in the folder being viewed
    window.AthleteStore.saveProgram({ ...rec, folder: editing && editing.id ? (editing.folder || "") : folder });
    setEditing(null);
    setVersion((v) => v + 1);
  };

  const remove = (p) => {
    if (!window.confirm(`Delete the program "${p.name}"? This can't be undone.`)) return;
    window.AthleteStore.deleteProgram(p.id);
    setEditing(null);
    setVersion((v) => v + 1);
  };

  if (editing) {
    return (
      <ProgramEditor
        key={editing.id || "new"}
        initial={editing.id ? editing : null}
        onSave={save}
        onCancel={() => setEditing(null)}
        onDelete={editing.id ? () => remove(editing) : null}
      />
    );
  }

  if (assigning) {
    return (
      <ProgramAssignPanel
        key={assigning.id}
        program={assigning}
        initialStart={nav.assignStart}
        onClose={() => setAssigning(null)}
        onAssignOther={(p, start) => setNav((n) => ({ ...n, assigningId: p.id, assignStart: start }))}
      />
    );
  }

  const section = nav.section || "programs";
  const sectionTabs = (
    <div className="pill-tabs program-sections">
      <button className={`pill-tab ${section === "programs" ? "active" : ""}`} onClick={() => setNav((n) => ({ ...n, section: "programs" }))}>Programs</button>
      <button className={`pill-tab ${section === "exercises" ? "active" : ""}`} onClick={() => setNav((n) => ({ ...n, section: "exercises" }))}>Exercise Library</button>
    </div>
  );
  if (section === "exercises") return <ExerciseLibrary sectionTabs={sectionTabs} />;

  return (
    <div className="panel" key={version}>
      {sectionTabs}
      <h2>Programs <small>{programs.length} saved</small></h2>
      <div className="program-crumbs">
        <button className={`program-crumb ${folder === "" ? "here" : ""} ${dropOver === "" ? "drop-over" : ""}`} onClick={() => setFolder("")} {...dropTarget("")}>All programs</button>
        {folder && folder.split("/").map((part, i, parts) => {
          const path = parts.slice(0, i + 1).join("/");
          return (
            <React.Fragment key={path}>
              <span className="program-crumb-sep">›</span>
              <button className={`program-crumb ${path === folder ? "here" : ""} ${dropOver === path ? "drop-over" : ""}`} onClick={() => setFolder(path)} {...dropTarget(path)}>{part}</button>
            </React.Fragment>
          );
        })}
      </div>
      <div className="facility-toolbar">
        <button className="btn-link" onClick={addFolder}>{folder ? "+ New subfolder" : "+ New folder"}</button>
        {folder && <button className="btn-link" onClick={renameFolder}>Rename folder</button>}
        {folder && <button className="btn-link" onClick={deleteFolder}>Delete folder</button>}
        <button className="btn" style={{ marginLeft: "auto" }} onClick={() => setEditing({})}>+ New program{folder ? ` in ${leafOf(folder)}` : ""}</button>
      </div>
      {/* search by name, and by the coach who wrote the program; both look across every folder */}
      <div className="facility-toolbar program-search">
        <input className="facility-search" value={query} placeholder="Search programs by name or coach" onChange={(e) => setQuery(e.target.value)} />
        <select value={coach} onChange={(e) => setCoach(e.target.value)} title="Show programs written by one coach">
          <option value="">All coaches</option>
          {coaches.map((c) => <option key={c} value={c}>{coachName(c)}</option>)}
          {programs.some((p) => !p.createdBy) && <option value="__none__">No coach recorded</option>}
        </select>
        {searching && <button className="btn-link" onClick={() => { setQuery(""); setCoach(""); }}>Clear</button>}
      </div>
      {searching && <div className="facility-note" style={{ marginTop: 0, marginBottom: 10 }}>{here.length} program{here.length === 1 ? "" : "s"} found across all folders.</div>}
      {!searching && subfolders.length > 0 && (
        <div className="program-folders">
          {subfolders.map((f) => (
            <button
              className={`program-folder ${dropOver === f ? "drop-over" : ""}`}
              key={f}
              onClick={() => setFolder(f)}
              {...dropTarget(f)}
            >
              <span className="program-folder-icon" aria-hidden="true" />
              <strong>{leafOf(f)}</strong>
              <small>{countIn(f)} program{countIn(f) === 1 ? "" : "s"}</small>
            </button>
          ))}
        </div>
      )}
      {here.length === 0 && <div className="empty-state">{searching ? "No programs match that search." : folder ? "No programs in this folder yet." : subfolders.length ? "No unfiled programs. Open a folder, or create a program here." : "No programs yet. Create one to get started."}</div>}
      <div className="facility-list">
        {here.map((p) => {
          const c = programCounts(p);
          return (
            <div
              className="facility-card program-card"
              key={p.id}
              draggable
              title="Drag onto a folder to move it"
              onDragStart={(e) => { e.dataTransfer.setData("application/x-program", p.id); e.dataTransfer.effectAllowed = "move"; }}
              onDragEnd={() => setDropOver(null)}
            >
              <div className="facility-card-head">
                <button className="program-name-link" title="Open this program" onClick={() => setEditing(p)}>{p.name}</button>
                <span className="facility-used">{c.weeks} wk · {c.sessions} days · {c.exercises} exercises</span>
              </div>
              {searching && <div className="program-created">In {p.folder ? p.folder.replace(/\//g, " › ") : "All programs (no folder)"}</div>}
              {p.createdBy && (
                <div className="program-created">
                  Created by {USER_DISPLAY_NAMES[p.createdBy] || p.createdBy}
                  {p.createdAt ? ` · ${new Date(p.createdAt).toLocaleDateString()}` : ""}
                </div>
              )}
              {p.description && <div className="facility-notes" style={{ marginTop: 6 }}>{p.description}</div>}
              {(() => {
                const next = suggestedNextPrograms(p);
                const prev = programs.filter((x) => x.id !== p.id && (x.nextProgramIds || []).includes(p.id));
                if (!next.length && !prev.length) return null;
                const links = (list) => list.map((x, i) => (
                  <React.Fragment key={x.id}>{i > 0 && ", "}<button className="exercise-link" onClick={() => setEditing(x)}>{x.name}</button></React.Fragment>
                ));
                return (
                  <div className="program-chain">
                    {prev.length > 0 && <div>Follows: {links(prev)}</div>}
                    {next.length > 0 && <div>Suggested next: {links(next)}</div>}
                  </div>
                );
              })()}
              <div className="facility-card-actions no-print">
                <button className="btn-link" onClick={() => setAssigning(p)}>Assign to athletes</button>
                <span className="facility-used">{athletesOnProgram(p.id).length} assigned</span>
                <select className="program-copy-day" style={{ marginLeft: 0, maxWidth: 150 }} value="" title="Move this program to another folder" onChange={(e) => e.target.value !== "" && moveProgram(p, e.target.value === "__top__" ? "" : e.target.value)}>
                  <option value="">Move to…</option>
                  {(p.folder || "") !== "" && <option value="__top__">All programs (no folder)</option>}
                  {folders.filter((f) => f !== (p.folder || "")).map((f) => <option key={f} value={f}>{f.replace(/\//g, " › ")}</option>)}
                </select>
                <ProgramPdfButton program={p} />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  { key: "address1", label: "Street address", wide: true, placeholder: "123 Main St" },

  { key: "city", label: "City" },
  { key: "state", label: "State" },
  { key: "zip", label: "ZIP" },
  { key: "phone", label: "Facility phone" },
  { key: "website", label: "Website", placeholder: "https://" },
  { key: "contactName", label: "Contact name" },
  { key: "contactEmail", label: "Contact email" },
  { key: "contactPhone", label: "Contact phone" },

const facilityAddressLine = (f) => {
  const cityState = [f.city, [f.state, f.zip].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  return [f.address1, f.address2, cityState].filter(Boolean).join(", ");

const findFacilityByName = (name) => {
  const norm = (name || "").trim().toLowerCase();
  if (!norm) return null;
  return window.AthleteStore.allOffseasonFacilities().find((f) => (f.name || "").trim().toLowerCase() === norm) || null;
};

// Add or edit one facility. Empty fields are dropped so the saved record only holds what was entered.
function FacilityForm({ initial, onSave, onCancel }) {
  const [draft, setDraft] = useState(() => ({ ...(initial || {}) }));
  const canSave = (draft.name || "").trim().length > 0;

  const submit = () => {
    if (!canSave) return;
    const rec = {};
    FACILITY_FIELDS.forEach(({ key }) => {
      const v = (draft[key] || "").trim();
      if (v) rec[key] = v;
    });
    if (initial && initial.id) rec.id = initial.id;
    // keep the map coordinates; they're refreshed on the Facilities page if the address itself changes
    if (initial && initial.geo) rec.geo = initial.geo;
    onSave(rec);
  };

  return (
    <div className="facility-form">
      <div className="facility-form-grid">
        {FACILITY_FIELDS.map((f) => (
          <label key={f.key} className={`facility-field ${f.wide ? "wide" : ""}`}>
            <span>{f.label}{f.required ? " *" : ""}</span>
            {f.multiline ? (
              <textarea rows={3} value={draft[f.key] || ""} placeholder={f.placeholder || ""}
                onChange={(e) => setDraft({ ...draft, [f.key]: e.target.value })} />
            ) : (
              <input value={draft[f.key] || ""} placeholder={f.placeholder || ""}
                onChange={(e) => setDraft({ ...draft, [f.key]: e.target.value })} />
            )}
          </label>
        ))}
      </div>
      <div className="facility-form-actions">
        <button className="btn" disabled={!canSave} onClick={submit}>Save facility</button>
        <button className="btn-link" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

// Cubs Roster only (see rosterGroup) — DST clients don't have an "off-season" distinct from the

function OffseasonFacilityPanel({ athlete, onChanged }) {
  const [editing, setEditing] = useState(false);
  const [value, setValue] = useState("");
  // Set when the typed name isn't in the directory yet: the coach either saves its details to the database or keeps just the name.
  const [unsaved, setUnsaved] = useState(null);
  const current = (athlete.offseasonFacility || "").trim();
  const match = findFacilityByName(current);
  const directory = window.AthleteStore.allOffseasonFacilities();

  const assign = (name) => {
    window.AthleteStore.updateAthlete(athlete.id, { offseasonFacility: (name || "").trim() });
    setEditing(false);
    setUnsaved(null);
    onChanged();
  };

  const startEdit = () => {
    setValue(current);
    setUnsaved(null);
    setEditing(true);
  };

  // A name that's already in the directory is assigned as-is; a new name asks whether to add it to the database.
  const saveValue = () => {
    const name = value.trim();
    if (!name) return assign("");

    setUnsaved(name);

  // Facility details entered here go into the shared directory and are assigned to this athlete at once.
  const saveNewFacility = (rec) => {

    return (
      <div className="panel">
        <h2>Off-Season Training Facility</h2>
