function BulkActionsBar({ selectedIds, roster, onApplied, onClear }) {
  const [status, setStatus] = useState("");
  const [dstLocation, setDstLocation] = useState("");
  const [position, setPosition] = useState("");
  const [league, setLeague] = useState("");

  const handleApply = () => {
    const patch = {};
    if (status) patch.status = status;
    if (dstLocation) patch.dstLocation = dstLocation;
    if (position) patch.position = position;
    if (league) {
      patch.league = league;
      patch.team = ""; // a team from the old league won't be valid in the new one
    }
    if (Object.keys(patch).length === 0) return;

    const names = roster.filter((a) => selectedIds.has(a.id)).map((a) => a.name);
    if (!window.confirm(`Apply this change to ${selectedIds.size} athlete(s)?\n\n${names.join(", ")}`)) return;

    selectedIds.forEach((id) => window.AthleteStore.updateAthlete(id, patch));
    setStatus("");
    setDstLocation("");
    setPosition("");
    setLeague("");
    onApplied();
  };

  return (
    <div className="panel bulk-actions-bar">
      <div className="bulk-actions-header">
        <strong>{selectedIds.size} athlete{selectedIds.size === 1 ? "" : "s"} selected</strong>
        <button className="btn-link" onClick={onClear}>Clear selection</button>
      </div>
      <div className="form-row">
        <div className="field">
          <label>Set Status</label>
          <select value={status} onChange={(e) => setStatus(e.target.value)}>
            <option value="">— no change —</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="alumni">Alumni</option>
          </select>
        </div>
        <div className="field">
          <label>Set DST Location</label>
          <select value={dstLocation} onChange={(e) => setDstLocation(e.target.value)}>
            <option value="">— no change —</option>
            {DST_LOCATIONS.map((l) => <option key={l} value={l}>{l}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Set Position</label>
          <select value={position} onChange={(e) => setPosition(e.target.value)}>
            <option value="">— no change —</option>
            <option value="Unassigned">Unassigned</option>
            <option value="Pitcher">Pitcher</option>
            <option value="Catcher">Catcher</option>
            <option value="Infield">Infield</option>
            <option value="Outfield">Outfield</option>
          </select>
        </div>
        <div className="field">
          <label>Set League</label>
          <select value={league} onChange={(e) => setLeague(e.target.value)}>
            <option value="">— no change —</option>
            {LEAGUES.map((l) => <option key={l} value={l}>{l}</option>)}
          </select>
        </div>
      </div>
      <button className="btn btn-primary" onClick={handleApply}>
        Apply to {selectedIds.size} athlete{selectedIds.size === 1 ? "" : "s"}
      </button>
      {league && (
        <p style={{ fontSize: 11, color: "var(--text-dim)", marginTop: 8 }}>
          Setting League also clears Team for the selected athletes, since their old team may not exist in the new league.
        </p>
      )}
    </div>
  );
}

// Chicago Cubs roster athletes are tagged (CUBS_ROSTER_GROUP) rather than given a real
// dstLocation, so they can behave like just another "location" button here (kept out of the
// default/All view and every DST location's count, shown only when this button is picked)
// without being a real DST training location.
const CUBS_LOCATION_LABEL = "Chicago Cubs";
// The Coaches tile sits with the location buttons the same way: its own bucket, never part of "All".
const COACHES_LABEL = "Coaches";
// A coach's name for their record: the known display name, or one made from the email ("jane.doe@" -> "Jane Doe").
function coachNameFromEmail(email) {
  if (USER_DISPLAY_NAMES[email]) return USER_DISPLAY_NAMES[email];
  const local = String(email || "").split("@")[0];
  return local.split(/[._-]+/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join(" ") || "Coach";
}

// ---- Today: who needs something from a coach right now -------------------------------------------------
// The top of the home page gathers what the roster's flags already say, so nobody has to scan every row:
//   Program gap        a block ended last week and nothing is scheduled in that row this week
//   Ending this week   a block's last week is this one (line up what comes next)
//   Not logging        they have a program this week and nothing has been logged for LOG_QUIET_DAYS days
//   Text due           Cubs players not texted in the past month (the Texted flag on the Cubs roster)
//   Re-assessment due  a monthly re-assessment is due, or due within the week (after a full assessment)
//   Assessment due     no full biomechanical assessment in the last eight months
// Only active players are listed. Each name opens that player on the tab where it gets dealt with.
const LOG_QUIET_DAYS = 5;
// Which athletes are a coach's: with locations set on their coach record (coachLocations), the athletes at those
// locations, plus any remote athlete whose program they assigned or whose assessment they did; with none set,
// everyone. Used by the Today panel (the weekly email applies the same rule in api/weekly-roster-email.js).
const REMOTE_LOCATION = "DST Remote Training";
function coachScopeFor(email) {
  const me = (email || "").toLowerCase();
  const rec = window.AthleteStore.allAthletes().find((a) => a.rosterGroup === COACH_ROSTER_GROUP && (a.coachEmail || "").toLowerCase() === me);
  const locs = coachLocationsOf(rec);
  return { email: me, locs, all: !locs.length };
}
function coachWorksWithRemote(a, email) {
  const S = window.AthleteStore;
  const plan = S.getPeriodization(a.id);
  if (plan && (plan.blocks || []).some((b) => (b.assignedBy || "").toLowerCase() === email)) return true;
  const did = (r) => { const act = r && r._activity; return !!act && [act.createdBy, act.updatedBy].some((x) => (x || "").toLowerCase() === email); };
  return [...S.getAssessments(a.id), ...S.getReassessments(a.id), ...S.getPitchingAssessments(a.id)].some(did);
}
function inCoachScope(a, scope) {
  if (scope.all) return true;
  if (scope.locs.includes(a.dstLocation)) return true;
  return a.dstLocation === REMOTE_LOCATION && !!scope.email && coachWorksWithRemote(a, scope.email);
}
// Needs attention: what the phone's logs say about an athlete between visits, each a reason shown beside the name:
//   weight moving fast   pre-lift weigh-ins (store.bodyweightLog) up or down 2% or more within about a week
//   not logging food     a nutrition plan, and no food logged in 3+ days
//   low protein          a nutrition plan, and protein under 80% of target on average over the days logged this week
// `food` is the last two weeks of food_logs by athlete ({ days: Map day -> entries }), fetched by the panel.
function attentionFor(a, food) {
  const S = window.AthleteStore, out = [];
  const log = S.bodyweightLog ? S.bodyweightLog(a.id) : [];
  if (log.length >= 2) {
    const z = log[log.length - 1], ago = (d) => Math.round((new Date(`${z.date}T12:00:00`) - new Date(`${d}T12:00:00`)) / 864e5);
    const base = log.filter((w) => ago(w.date) >= 5 && ago(w.date) <= 10).pop();
    if (base && ago(z.date) <= 0 && Math.abs(z.lb - base.lb) / base.lb >= 0.02) {
      const d = Math.round((z.lb - base.lb) * 10) / 10;
      out.push({ text: `${d > 0 ? "+" : ""}${d} lb in ${ago(base.date)} days`, tab: "bodycomp" });
    }
  }
  const rec = S.getNutritionPlan ? S.getNutritionPlan(a.id) : null;
  if (food && rec && rec.goal && rec.snapshot) {
    const mine = food.get(String(a.id)), today = new Date(), key = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const eatenOn = (dk) => ((mine && mine.get(dk)) || []).filter((e) => e.name && !e.planned);
    let last = null;
    for (let i = 0; i < 14 && last == null; i += 1) { const d = new Date(today); d.setDate(d.getDate() - i); if (eatenOn(key(d)).length) last = i; }
    if (last == null || last >= 3) out.push({ text: last == null ? "no food logged in 2 weeks" : `no food logged in ${last} days`, tab: "meallog" });
    const week = Array.from({ length: 7 }, (_, i) => { const d = new Date(today); d.setDate(d.getDate() - i); return eatenOn(key(d)); }).filter((l) => l.length);
    const target = rec.snapshot.train && rec.snapshot.train.p;
    if (week.length >= 2 && target) {
      const avg = week.reduce((s, l) => s + l.reduce((t, e) => t + (+e.p || 0), 0), 0) / week.length;
      if (avg < target * 0.8) out.push({ text: `protein ${Math.round((avg / target) * 100)}% of target`, tab: "meallog" });
    }
  }
  return out;
}
function todayItems(food) {
  const S = window.AthleteStore;
  const lib = window.PeriodizationLib;
  const now = new Date(new Date().toDateString());
  const daysSince = (iso) => (iso ? Math.floor((now - new Date(new Date(iso).toDateString())) / 864e5) : null);
  const out = { gap: [], ending: [], quiet: [], text: [], assess: [], reassess: [], attention: [] };
  // Cubs players appear only for Kevin (the same account that gets them in the weekly email); for everyone else
  // the panel covers DST athletes only
  const forKevin = (S.currentUserEmail() || "").toLowerCase() === "kevin@dynamicsportstraining.com";
  const mine = coachScopeFor(S.currentUserEmail());
  getRoster().filter((a) => (a.status || "active").toLowerCase() === "active" && (forKevin || a.rosterGroup !== CUBS_ROSTER_GROUP || a.dstLocation)
    && ((forKevin && a.rosterGroup === CUBS_ROSTER_GROUP) || inCoachScope(a, mine))).forEach((a) => {
    const plan = S.getPeriodization(a.id);
    if (plan && lib) {
      const progress = lib.planProgress(plan);
      if (progress.state === "active") {
        const wk = progress.week - 1;
        const covers = (b) => b.start <= wk && wk < b.start + b.len;
        const lane = (b) => (plan.lanes.find((l) => l.id === b.lane) || {}).name || "Program";
        const ended = plan.blocks.filter((b) => b.start + b.len - 1 === wk - 1 && !plan.blocks.some((o) => o.lane === b.lane && covers(o)));
        const ending = plan.blocks.filter((b) => b.start + b.len - 1 === wk);
        if (ended.length) out.gap.push({ a, note: ended.map(lane).join(", "), tab: "programming" });
        else if (ending.length) out.ending.push({ a, note: ending.map((b) => (b.label || "").trim() || lane(b)).join(", "), tab: "programming" });
        // a program this week (and the plan at least that many days old), but nothing typed in lately
        if (plan.blocks.some((b) => b.programId && covers(b)) && progress.days >= LOG_QUIET_DAYS) {
          const quiet = daysSince(S.lastLoggedAt(a.id));
          if (quiet == null || quiet >= LOG_QUIET_DAYS) out.quiet.push({ a, note: quiet == null ? "nothing logged yet" : `${quiet} days`, tab: "log", sort: quiet == null ? 9999 : quiet });
        }
      }
    }
    const needs = attentionFor(a, food);
    if (needs.length) out.attention.push({ a, note: needs.map((x) => x.text).join(" · "), tab: needs[0].tab, sort: needs.length });
    if (forKevin && a.rosterGroup === CUBS_ROSTER_GROUP) { // texts are Kevin's list only
      const since = daysSince(a.lastTexted ? `${a.lastTexted}T12:00:00` : null);
      if (since == null || since >= CONTACT_DAYS) out.text.push({ a, note: since == null ? "never" : `${since} days`, tab: "plan", sort: since == null ? 9999 : since });
    }
    const assessments = S.getAssessments(a.id);
    const latest = assessments[assessments.length - 1];
    const old = latest ? daysSince(`${latest.date}T12:00:00`) : null;
    // Cubs players are not given DST's biomechanical assessment, so they are left off these lists. With a full
    // assessment in the last eight months, a monthly re-assessment is due instead (see window.ReassessRules)
    if (a.rosterGroup !== CUBS_ROSTER_GROUP || a.dstLocation) { // (a Cubs player who is also a DST client is assessed as one)
      const st = window.reassessStatusFor ? window.reassessStatusFor(a) : null;
      if (!latest || !st || st.state === "assess") out.assess.push({ a, note: latest ? `last ${old} days ago` : "none on file", tab: "assessment", sort: latest ? old : 9999 });
      else if (st.state === "reassess-due" || st.state === "reassess-soon") {
        const when = new Date(`${st.due}T00:00:00`).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
        out.reassess.push({ a, note: st.daysUntil < 0 ? `${-st.daysUntil} days overdue` : st.daysUntil === 0 ? "today" : when, tab: "reassess", sort: -st.daysUntil });
      }
    }
  });
  const byName = (x, y) => lastNameOnly(x.a.name).localeCompare(lastNameOnly(y.a.name));
  const longestFirst = (x, y) => (y.sort || 0) - (x.sort || 0) || byName(x, y);
  return [
    { key: "attention", title: "Needs attention", tone: "danger", hint: "From their app: weight moving fast, food not logged, or protein low", list: out.attention.sort(longestFirst) },
    { key: "gap", title: "Program gap", tone: "danger", hint: "A block ended last week with nothing after it", list: out.gap.sort(byName) },
    { key: "ending", title: "Program ending this week", tone: "warn", hint: "Line up the next phase", list: out.ending.sort(byName) },
    { key: "quiet", title: "Not logging", tone: "warn", hint: `Has a program, nothing logged in ${LOG_QUIET_DAYS}+ days`, list: out.quiet.sort(longestFirst) },
    { key: "text", title: "Text due", tone: "neutral", hint: "Cubs players not texted in the past month", list: out.text.sort(longestFirst) },
    { key: "reassess", title: "Re-assessment due", tone: "warn", hint: "Monthly re-assessment due, or due within a week", list: out.reassess.sort(longestFirst) },
    { key: "assess", title: "Assessment due", tone: "neutral", hint: "DST athletes: no full assessment in the last 8 months", list: out.assess.sort(longestFirst) },
  ];
}
// A coach can × a name (or a whole card) off the Today panel. It stays off until the week turns over on Monday,
// when every flag that still applies comes back. Kept on the login (so it follows them to another device) and on
// this device.
function todayWeekStart() {
  const d = new Date();
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const todayDismissKey = () => `todayDismissed:${(window.AthleteStore.currentUserEmail() || "").toLowerCase()}`;
function readTodayDismissed() {
  try {
    const saved = JSON.parse(localStorage.getItem(todayDismissKey()) || "null");
    return saved && saved.week === todayWeekStart() ? saved.ids || [] : [];
  } catch (e) { return []; }
}
function saveTodayDismissed(ids) {
  const saved = { week: todayWeekStart(), ids };
  try { localStorage.setItem(todayDismissKey(), JSON.stringify(saved)); } catch (e) { /* the login still keeps it */ }
  const sb = window.supabaseClient;
  if (sb) sb.auth.updateUser({ data: { todayDismissed: saved } }).catch(() => {});
}
function TodayPanel({ onOpenTab, dataVersion }) {
  const [open, setOpen] = useState({}); // which lists are showing every name
  const [hidden, setHidden] = useState(() => { try { return localStorage.getItem("todayPanelHidden") === "1"; } catch (e) { return false; } });
  const [dismissed, setDismissed] = useState(readTodayDismissed); // "card:<key>" or "<key>:<athlete id>", this week only
  // what was dismissed on another device this week comes in from the login
  React.useEffect(() => {
    const sb = window.supabaseClient;
    if (!sb) return;
    sb.auth.getUser().then(({ data }) => {
      const saved = data && data.user && (data.user.user_metadata || {}).todayDismissed;
      if (!saved || saved.week !== todayWeekStart() || !Array.isArray(saved.ids)) return;
      setDismissed((d) => {
        const merged = Array.from(new Set([...d, ...saved.ids]));
        if (merged.length === d.length) return d;
        try { localStorage.setItem(todayDismissKey(), JSON.stringify({ week: saved.week, ids: merged })); } catch (e) { /* fine */ }
        return merged;
      });
    }).catch(() => {});
  }, []);
  const dismiss = (id) => setDismissed((d) => { const next = [...d, id]; saveTodayDismissed(next); return next; });
  const restore = () => { setDismissed([]); saveTodayDismissed([]); };
  // the last two weeks of every athlete's food log, for Needs attention (none until migration_023 has been run)
  const [food, setFood] = useState(null);
  React.useEffect(() => {
    const sb = window.supabaseClient;
    if (!sb) return;
    const from = new Date(); from.setDate(from.getDate() - 14);
    const day = `${from.getFullYear()}-${String(from.getMonth() + 1).padStart(2, "0")}-${String(from.getDate()).padStart(2, "0")}`;
    sb.from("food_logs").select("athlete_id,day,entries").gte("day", day).limit(10000).then(({ data, error }) => {
      if (error || !data) return;
      const m = new Map();
      data.forEach((r) => { const id = String(r.athlete_id); if (!m.has(id)) m.set(id, new Map()); m.get(id).set(String(r.day).slice(0, 10), r.entries || []); });
      setFood(m);
    });
  }, [dataVersion]);
  const items = useMemo(() => todayItems(food), [dataVersion, food]) // eslint-disable-line
    .map((it) => (dismissed.includes(`card:${it.key}`) ? { ...it, list: [] } : { ...it, list: it.list.filter(({ a }) => !dismissed.includes(`${it.key}:${a.id}`)) }));
  // form checks remote athletes sent to this coach and nobody has reviewed yet (form_checks.js); each opens the clip
  const checks = window.useOpenFormChecks ? window.useOpenFormChecks() : [];
  const toggle = () => { const next = !hidden; setHidden(next); try { localStorage.setItem("todayPanelHidden", next ? "1" : "0"); } catch (e) { /* not remembered */ } };
  const total = items.reduce((n, it) => n + it.list.length, 0) + checks.length;
  const scopeLocs = coachScopeFor(window.AthleteStore.currentUserEmail()).locs; // a coach's locations narrow the panel
  const SHOWN = 6;
  return (
    <div className="panel today-panel no-print">
      <h2>
        Today <small>{total ? `${total} thing${total === 1 ? "" : "s"} to look at${scopeLocs.length ? ` for ${scopeLocs.map((l) => l.replace(/^DST /, "")).join(", ")} and your remote athletes` : " across the active roster"}` : "Nothing needs attention right now"}</small>
        {dismissed.length > 0 && <button className="btn-link today-restore" onClick={restore} title="Bring back everything you closed this week">Show closed</button>}
        <button className="btn-link today-toggle" onClick={toggle}>{hidden ? "Show" : "Hide"}</button>
      </h2>
      {!hidden && total > 0 && (
        <div className="today-grid">
          {checks.length > 0 && (
            <div className="today-card">
              <div className="today-head"><span className="badge danger">{checks.length}</span><strong>Form checks to review</strong></div>
              <div className="today-hint">Clips remote athletes sent you. Watch and reply.</div>
              <ul>
                {checks.slice(0, open.checks ? checks.length : SHOWN).map((c) => (
                  <li key={c.id}><button className="btn-link" onClick={() => window.openFormCheck(c.id)}>{lastFirstName(c.athleteName || "Athlete")}</button><small> {c.exercise}</small></li>
                ))}
              </ul>
              {checks.length > SHOWN && <button className="btn-link today-more" onClick={() => setOpen((o) => ({ ...o, checks: !o.checks }))}>{open.checks ? "Show fewer" : `+ ${checks.length - SHOWN} more`}</button>}
            </div>
          )}
          {items.filter((it) => it.list.length).map((it) => (
            <div className="today-card" key={it.key}>
              <div className="today-head">
                <span className={`badge ${it.tone}`}>{it.list.length}</span><strong>{it.title}</strong>
                <button className="today-x today-x-card" onClick={() => dismiss(`card:${it.key}`)} title={`Close ${it.title} until Monday`} aria-label={`Close ${it.title} until Monday`}>×</button>
              </div>
              <div className="today-hint">{it.hint}</div>
              <ul>
                {(open[it.key] ? it.list : it.list.slice(0, SHOWN)).map(({ a, note, tab }) => (
                  <li key={a.id}>
                    <button className="btn-link" onClick={() => onOpenTab(a.id, tab)}>{lastFirstName(a.name)}</button>{note ? <small> {note}</small> : null}
                    <button className="today-x" onClick={() => dismiss(`${it.key}:${a.id}`)} title="Close this until Monday" aria-label={`Close ${a.name} until Monday`}>×</button>
                  </li>
                ))}
              </ul>
              {it.list.length > SHOWN && <button className="btn-link today-more" onClick={() => setOpen((o) => ({ ...o, [it.key]: !o[it.key] }))}>{open[it.key] ? "Show fewer" : `+ ${it.list.length - SHOWN} more`}</button>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TeamOverview({ positionFilter, statusFilter, leagueFilter, locationFilter, setLocationFilter, search, rangeDays, onSelect, onOpenTab, dataVersion, onDataChange, filterControls }) {
  const isCubs = (a) => a.rosterGroup === CUBS_ROSTER_GROUP;
  // a Cubs player who is also a DST client (a DST location on file, DST Remote Training say) is on both rosters:
  // the Chicago Cubs button and the DST ones (All, and their location)
  const onDstRoster = (a) => !isCubs(a) || !!a.dstLocation;
  const [sortConfig, setSortConfig] = useState({ key: null, dir: "asc" });
  const [coachFilter, setCoachFilter] = useState("All"); // Cubs roster: one coach, "none", or "All"
  const cubsCoachCount = (name) => getRoster().filter((a) => isCubs(a) && (a.status || "active").toLowerCase() !== "alumni" && (name ? a.cubsCoach === name : !CUBS_COACHES.some((c) => c.name === a.cubsCoach))).length;
  const [selectedIds, setSelectedIds] = useState(() => new Set());

  const handleSort = (key) => {
    setSortConfig((prev) => (prev.key === key ? { key, dir: prev.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" }));
  };

  const toggleSelect = (id) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const clearSelection = () => setSelectedIds(new Set());

  const filtered = useMemo(() => {
    // Coaches are their own bucket too: only the search box applies to them.
    if (locationFilter === COACHES_LABEL) return getCoaches().filter((a) => a.name.toLowerCase().includes(search.toLowerCase()));
    return getRoster().filter((a) => {
      const matchesPos = positionFilter === "All" || a.position === positionFilter;
      const matchesStatus = statusFilter === "All" || (a.status || "active").toLowerCase() === statusFilter.toLowerCase();
      const matchesLeague = leagueFilter === "All" || (a.league || "") === leagueFilter;
      const matchesSearch = a.name.toLowerCase().includes(search.toLowerCase());
      // Chicago Cubs is its own bucket, never part of "All" or any real DST location — shown
      // only when that button is the one actually selected.
      if (locationFilter === CUBS_LOCATION_LABEL) {
        const matchesCoach = coachFilter === "All" || (coachFilter === "none" ? !CUBS_COACHES.some((c) => c.name === a.cubsCoach) : a.cubsCoach === coachFilter);
        return isCubs(a) && matchesPos && matchesStatus && matchesLeague && matchesSearch && matchesCoach;
      }
      const matchesLocation = locationFilter === "All" || (a.dstLocation || "") === locationFilter;
      return onDstRoster(a) && matchesPos && matchesStatus && matchesLeague && matchesLocation && matchesSearch;
    });
    // eslint-disable-next-line
  }, [positionFilter, statusFilter, leagueFilter, locationFilter, search, dataVersion, coachFilter]);

  const rows = useMemo(() => {
    return filtered.map((a) => {
      const { wellness, load } = latestOf(a);
      return { athlete: a, wellness, load };
    });
  }, [filtered, dataVersion]);

  // Alumni are excluded from every top-of-page roster number regardless of the current
  // Status filter — they're former athletes, not part of the active program counts, even
  // when you've filtered the table itself to show them.
  const kpiRows = rows.filter((r) => (r.athlete.status || "active").toLowerCase() !== "alumni");
  const kpiFiltered = filtered.filter((a) => (a.status || "active").toLowerCase() !== "alumni");

  // Location breakdown ignores the location filter itself (though it still respects every
  // other filter) so the counts stay visible for every location even after you've clicked
  // into one — otherwise every other card would collapse to 0 and you couldn't see enough
  // to switch to a different location.
  const forLocationCounts = useMemo(() => {
    return getRoster().filter((a) => {
      const matchesPos = positionFilter === "All" || a.position === positionFilter;
      const matchesStatus = statusFilter === "All" || (a.status || "active").toLowerCase() === statusFilter.toLowerCase();
      const matchesLeague = leagueFilter === "All" || (a.league || "") === leagueFilter;
      const matchesSearch = a.name.toLowerCase().includes(search.toLowerCase());
      return onDstRoster(a) && matchesPos && matchesStatus && matchesLeague && matchesSearch && (a.status || "active").toLowerCase() !== "alumni";
    });
    // eslint-disable-next-line
  }, [positionFilter, statusFilter, leagueFilter, search, dataVersion]);

  // Same filters as the DST location buttons, but counting Cubs roster athletes instead — kept
  // separate from forLocationCounts so Cubs never land in "No Location Set" or any DST count.
  const cubsCount = useMemo(() => {
    return getRoster().filter((a) => {
      const matchesPos = positionFilter === "All" || a.position === positionFilter;
      const matchesStatus = statusFilter === "All" || (a.status || "active").toLowerCase() === statusFilter.toLowerCase();
      const matchesLeague = leagueFilter === "All" || (a.league || "") === leagueFilter;
      const matchesSearch = a.name.toLowerCase().includes(search.toLowerCase());
      return isCubs(a) && matchesPos && matchesStatus && matchesLeague && matchesSearch && (a.status || "active").toLowerCase() !== "alumni";
    }).length;
    // eslint-disable-next-line
  }, [positionFilter, statusFilter, leagueFilter, search, dataVersion]);

  const locationCounts = DST_LOCATIONS.map((loc) => ({
    location: loc,
    count: forLocationCounts.filter((a) => a.dstLocation === loc).length,
  }));
  const noLocationCount = forLocationCounts.filter((a) => !a.dstLocation).length;

  const sortedRows = useMemo(() => {
    if (!sortConfig.key) {
      return [...rows].sort((a, b) => lastNameOnly(a.athlete.name).localeCompare(lastNameOnly(b.athlete.name)));
    }
    const column = [...ROSTER_COLUMNS, COACH_SORT].find((c) => c.key === sortConfig.key);
    const sorted = [...rows].sort((a, b) => {
      const va = column.getValue(a);
      const vb = column.getValue(b);
      if (typeof va === "string" || typeof vb === "string") {
        return String(va).localeCompare(String(vb));
      }
      return (va ?? 0) - (vb ?? 0) || lastNameOnly(a.athlete.name).localeCompare(lastNameOnly(b.athlete.name)); // ties (the same coach) stay A-Z
    });
    if (sortConfig.dir === "desc") sorted.reverse();
    return sorted;
  }, [rows, sortConfig]);

  const allVisibleSelected = sortedRows.length > 0 && sortedRows.every((r) => selectedIds.has(r.athlete.id));
  const toggleSelectAll = () => {
    setSelectedIds((prev) => {
      if (allVisibleSelected) {
        const next = new Set(prev);
        sortedRows.forEach((r) => next.delete(r.athlete.id));
        return next;
      }
      const next = new Set(prev);
      sortedRows.forEach((r) => next.add(r.athlete.id));
      return next;
    });
  };

  if (getRoster().length === 0) {
    return (
      <div>
        <AddAthleteForm onAdded={onDataChange} />
        <AddCoachForm onAdded={onDataChange} />
        <ImportAthletes onAdded={onDataChange} />
        <div className="panel">
          <div className="empty-state">
            No athletes on the roster yet. Sync a Google Sheet on the Player Plans page, import Hawkin Dynamics /
            Evolt360 data, or add someone above to get started.
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <TodayPanel onOpenTab={onOpenTab} dataVersion={dataVersion} />
      <div className="kpi-row">
        <KpiCard
          label={locationFilter === "All" ? "Roster (filtered)" : `Roster (${locationFilter}) — click to show all`}
          value={kpiRows.length}
          active={locationFilter === "All"}
          onClick={() => setLocationFilter("All")}
        />
      </div>

      <div className="panel">
        <h2>Roster by Location <small>Click a location to filter the roster below</small></h2>
        <div className="location-kpi-row">
          {locationCounts.map(({ location, count }) => (
            <KpiCard
              key={location}
              label={location}
              value={count}
              active={locationFilter === location}
              onClick={() => setLocationFilter(locationFilter === location ? "All" : location)}
            />
          ))}
          {noLocationCount > 0 && <KpiCard label="No Location Set" value={noLocationCount} tone="warn" />}
          <KpiCard
            label={CUBS_LOCATION_LABEL}
            value={cubsCount}
            active={locationFilter === CUBS_LOCATION_LABEL}
            onClick={() => setLocationFilter(locationFilter === CUBS_LOCATION_LABEL ? "All" : CUBS_LOCATION_LABEL)}
          />
          {/* everyone with a login; opening it makes sure each has a record to build a plan on */}
          <KpiCard
            label={COACHES_LABEL}
            value={window.AthleteStore.accountHolders().length}
            active={locationFilter === COACHES_LABEL}
            onClick={() => {
              if (locationFilter === COACHES_LABEL) { setLocationFilter("All"); return; }
              if (window.AthleteStore.ensureCoachRecords(COACH_ROSTER_GROUP, coachNameFromEmail) > 0) onDataChange();
              setLocationFilter(COACHES_LABEL);
            }}
          />
        </div>
      </div>

      {filterControls}

      <div className="tour-anchor" data-tour="add">
        <AddAthleteForm onAdded={onDataChange} />
        <AddCoachForm onAdded={onDataChange} />
        <ImportAthletes onAdded={onDataChange} />
      </div>
      {selectedIds.size > 0 && (
        <BulkActionsBar
          selectedIds={selectedIds}
          roster={getRoster()}
          onApplied={() => { onDataChange(); clearSelection(); }}
          onClear={clearSelection}
        />
      )}
      <div className="panel" data-tour="status">
        <h2>
          Athlete Status <small>Sorted A-Z by default &middot; click a column header to sort &middot; click a row for detail</small>
        </h2>
        {/* Cubs roster: narrow the list to one coach's players, or put the list in coach order */}
        {locationFilter === CUBS_LOCATION_LABEL && (
          <div className="cubs-coach-controls no-print">
            <label>Coach
              <select value={coachFilter} onChange={(e) => setCoachFilter(e.target.value)}>
                <option value="All">All coaches</option>
                {CUBS_COACHES.map((c) => <option key={c.name} value={c.name}>{c.name} ({cubsCoachCount(c.name)})</option>)}
                <option value="none">No coach ({cubsCoachCount("")})</option>
              </select>
            </label>
            <button className={`btn btn-small-grey${sortConfig.key === "coach" ? " on" : ""}`} onClick={() => handleSort("coach")} title="Group the list by coach, in the order Poppe, Weisman, Garza, Simmons, Kinsley, Rooney, then no coach. Click again to reverse.">
              Sort by coach{sortConfig.key === "coach" ? (sortConfig.dir === "asc" ? " ▲" : " ▼") : ""}
            </button>
            {sortConfig.key === "coach" && <button className="btn-link" onClick={() => setSortConfig({ key: null, dir: "asc" })}>Back to A-Z</button>}
            <label className="text-template" title="What the Text links type out for you. {first} becomes the player's first name. Kept on this device.">Text message
              <input defaultValue={getTextTemplate()} placeholder="Hey {first}, checking in. How is training going?" onChange={(e) => setTextTemplate(e.target.value)} />
            </label>
          </div>
        )}
        {sortedRows.length ? (
          <table>
            <thead>
              <tr>
                <th>
                  <input type="checkbox" checked={allVisibleSelected} onChange={toggleSelectAll} />
                </th>
                {ROSTER_COLUMNS.slice(0, 2).map((col) => (
                  <SortableHeader key={col.key} column={col} sortConfig={sortConfig} onSort={handleSort} />
                ))}
                {locationFilter === CUBS_LOCATION_LABEL && <th>Off-Season Facility / Contact</th>}
                {locationFilter === CUBS_LOCATION_LABEL && <React.Fragment><th title="Green when texted in the past month. Click a flag to change it.">Texted</th><th title="Green when called in the past month. Click a flag to change it.">Called</th><th>Program Start</th></React.Fragment>}
                {/* no This Week column on the Cubs roster */}
                {locationFilter !== CUBS_LOCATION_LABEL && <th title="Latest force-plate test vs. the closest one from about a week earlier. Click to jump to Performance Metrics.">This Week</th>}
                <th title="Any periodization block ending this week or that ended last week with nothing lined up">Program</th>
                <th title="Red: no assessment on file. Yellow: latest one is 3+ weeks old. Green: current. Click to jump to it.">Assessment</th>
                {/* no Roster column: active or inactive is the badge beside each name */}
                {ROSTER_COLUMNS.slice(2).filter((col) => col.key !== "roster").map((col) => (
                  <SortableHeader
                    key={col.key}
                    column={locationFilter === CUBS_LOCATION_LABEL && col.key === "location" ? { ...col, label: "Location" } : col}
                    sortConfig={sortConfig}
                    onSort={handleSort}
                  />
                ))}
                <th></th>
              </tr>
            </thead>
            <tbody>
              {sortedRows.map(({ athlete }) => (
                <AthleteRow
                  key={athlete.id}
                  athlete={athlete}
                  onSelect={onSelect}
                  onOpenTab={onOpenTab}
                  onDataChange={onDataChange}
                  checked={selectedIds.has(athlete.id)}
                  onToggleCheck={() => toggleSelect(athlete.id)}
                  showFacility={locationFilter === CUBS_LOCATION_LABEL}
                />
              ))}
            </tbody>
          </table>
        ) : (
          <div className="empty-state">No athletes match the current filters.</div>
        )}
      </div>
    </div>
  );

// Shared definition of the "individual KPI trend" metrics requested for both the player
// profile and team report — one entry per metric, with how to pull its value off a raw
// Hawkin Dynamics force test record. Body Weight and mRSI are derived/renamed from the
// underlying systemWeight (N) and rsiModified fields respectively.
// Tests synced before jumpMomentum was stored as its own field still carry it in the raw Hawkin record.
function jumpMomentumOf(t) {
  if (typeof t.jumpMomentum === "number") return round2(t.jumpMomentum);
  const v = t.raw && t.raw["Jump Momentum(kg.m/s)"];
  return typeof v === "number" ? round2(v) : null;
}

// Hawkin reports this as a negative displacement (how far below standing height the dip went);
// shown here as a positive depth since that's the more natural read on a KPI trend chart ("how
// deep" rather than "how negative"). Falls back to the raw Hawkin record (in meters) for tests
// synced before countermovementDepth was stored as its own field, same as jumpMomentumOf above.
function countermovementDepthOf(t) {
  if (typeof t.countermovementDepth === "number") return Math.abs(round2(t.countermovementDepth));
  const v = t.raw && t.raw["Countermovement Depth(m)"];
  return typeof v === "number" ? Math.abs(round2(v * 39.3701)) : null;
}

const FORCE_KPI_METRICS = [
  { key: "bodyWeightLbs", label: "Body Weight", unit: "lbs", getValue: (t) => (typeof t.systemWeight === "number" ? round2(t.systemWeight / N_TO_LBF) : null) },
  { key: "jumpHeight", label: "Jump Height", unit: "in", getValue: (t) => (typeof t.jumpHeight === "number" ? t.jumpHeight : null) },
  { key: "jumpMomentum", label: "Jump Momentum", unit: "kg·m/s", getValue: jumpMomentumOf },
  { key: "peakPower", label: "Peak Power", unit: "W", getValue: (t) => (typeof t.peakPower === "number" ? t.peakPower : null) },
  { key: "countermovementDepth", label: "Countermovement Depth", unit: "in", getValue: countermovementDepthOf },
  { key: "relativePeakPower", label: "Relative Peak Power", unit: "W/kg", getValue: (t) => (typeof t.relativePeakPower === "number" ? t.relativePeakPower : null) },
  { key: "takeoffVelocity", label: "Takeoff Velocity", unit: "m/s", getValue: (t) => (typeof t.takeoffVelocity === "number" ? t.takeoffVelocity : null) },
  { key: "totalImpulse", label: "Propulsive Net Impulse", unit: "Ns", getValue: (t) => (typeof t.totalImpulse === "number" ? t.totalImpulse : null) },
  { key: "mRSI", label: "mRSI", unit: "", getValue: (t) => (typeof t.rsiModified === "number" ? t.rsiModified : null) },
];

// Roster-row ticker: body weight / jump height / relative peak power, latest force test vs. the
// closest one from roughly a week earlier. "Roughly" because testing isn't always on a strict
// weekly cadence — this walks back from the latest test to the first one at least 4 days earlier,
// rather than requiring exactly 7, so a slightly early or late session still counts as "last week"
// instead of the ticker just going blank. Two guards keep it from reaching past "recent", though:
// the latest test itself has to actually be from about this week (not an athlete's last test ever,
// however old), and the comparison test has to be from about last week too, not just however far
// back happens to be the next one on file — an athlete tested this week and then not again since
// February shouldn't show a "week over week" change spanning that whole gap.
const WEEK_TICKER_METRICS = ["bodyWeightLbs", "jumpHeight", "relativePeakPower"];
const WEEK_TICKER_MIN_GAP_DAYS = 4;
const WEEK_TICKER_MAX_GAP_DAYS = 10;
const WEEK_TICKER_MAX_RECENCY_DAYS = 10;

function weekOverWeekDelta(tests, metric) {
  const withValue = tests
    .map((t) => ({ t, v: metric.getValue(t) }))
    .filter((r) => typeof r.v === "number")
    .sort((a, b) => a.t.date.localeCompare(b.t.date));
  if (!withValue.length) return null;
  const latest = withValue[withValue.length - 1];
  const latestMs = new Date(`${latest.t.date}T00:00:00`).getTime();
  if ((Date.now() - latestMs) / 864e5 > WEEK_TICKER_MAX_RECENCY_DAYS) return null; // no test from this week — nothing to show
  let prev = null;
  for (let i = withValue.length - 2; i >= 0; i--) {
    const daysBack = (latestMs - new Date(`${withValue[i].t.date}T00:00:00`).getTime()) / 864e5;
    if (daysBack > WEEK_TICKER_MAX_GAP_DAYS) break; // everything from here back is even further away — give up
    if (daysBack >= WEEK_TICKER_MIN_GAP_DAYS) { prev = withValue[i]; break; }
  }
  if (!prev || !prev.v) return null;
  return { metric, latestVal: latest.v, latestDate: latest.t.date, prevVal: prev.v, prevDate: prev.t.date, delta: latest.v - prev.v };
}

// A plain left-click navigates within the app (no full reload); a modified click (ctrl/cmd/shift/
// middle button) is left alone so the browser's own "open in new tab" still works off the real href.
function handleAppLinkClick(e, onOpenTab) {
  e.stopPropagation();
  if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  onOpenTab();
}

function WeekOverWeekTicker({ athleteId, onOpenTab }) {
  const tests = window.AthleteStore.getForceTests(athleteId);
  const href = `?athlete=${athleteId}&tab=performance`;
  const entries = tests.length
    ? WEEK_TICKER_METRICS.map((key) => {
        const metric = FORCE_KPI_METRICS.find((m) => m.key === key);
        return { metric, change: weekOverWeekDelta(tests, metric) };
      }).filter((e) => e.change)
    : [];
  if (!entries.length) {
    return <a href={href} className="week-ticker-empty week-ticker-link" onClick={(e) => handleAppLinkClick(e, onOpenTab)} title="View Performance Metrics">—</a>;
  }
  return (
    <a href={href} className="week-ticker week-ticker-link" onClick={(e) => handleAppLinkClick(e, onOpenTab)}>
      {entries.map(({ metric, change }) => {
        const flat = Math.abs(change.delta) < 0.05;
        const dir = flat ? "flat" : change.delta > 0 ? "up" : "down";
        const arrow = flat ? "▬" : change.delta > 0 ? "▲" : "▼";
        const abbrev = metric.key === "bodyWeightLbs" ? "BW" : metric.key === "jumpHeight" ? "JH" : "RPP";
        const title = `${metric.label}: ${fmt2(change.latestVal)} ${metric.unit} on ${shortDate(change.latestDate)} vs ${fmt2(change.prevVal)} ${metric.unit} on ${shortDate(change.prevDate)}`;
        return (
          <span key={metric.key} className={`week-ticker-item week-ticker-${dir}`} title={title}>
            {abbrev} {arrow}{fmt2(Math.abs(change.delta))}
          </span>
        );
      })}
    </a>
  );
}

// Roster-row flag: is a training block (any lane — Strength, Running/Speed, Throwing, whatever the
// plan uses) ending this week or did one end last week with nothing picking it up. Only athletes
// with an actual saved periodization plan show anything here — most of the roster has none.
// Yellow: some block's last week is this week (line up what's next). Red: some block's last week
// was last week and nothing in that lane covers this week either (the athlete's plan has a gap
// right now). Green: an active plan, but no block boundary to flag — mid-block is the normal case.
function ProgramStatusBadge({ athleteId, onOpenTab }) {
  const plan = window.AthleteStore.getPeriodization(athleteId);
  if (!plan || !window.PeriodizationLib) {
    return <span className="badge neutral" title="No periodization plan saved for this athlete">No Program</span>;
  }
  const progress = window.PeriodizationLib.planProgress(plan);
  if (progress.state === "upcoming") {
    return <span className="badge neutral" title={`Plan starts ${shortDate(plan.startDate)}`}>Upcoming</span>;
  }
  if (progress.state === "complete") {
    return <span className="badge neutral" title={`${plan.weeks}-week plan finished`}>Complete</span>;
  }
  const wk = progress.week - 1; // 0-based
  const endsThisWeek = plan.blocks.filter((b) => b.start + b.len - 1 === wk);
  const endedLastWeek = plan.blocks.filter((b) => b.start + b.len - 1 === wk - 1 && !plan.blocks.some((o) => o.lane === b.lane && o.start <= wk && wk < o.start + o.len));
  const laneName = (b) => (plan.lanes.find((l) => l.id === b.lane) || {}).name || "Program";
  if (endedLastWeek.length) {
    const title = `Ended last week with nothing scheduled this week: ${endedLastWeek.map((b) => `${laneName(b)} (${b.label || "untitled"})`).join(", ")}`;
    return <span className="badge danger" title={title}>Program gap</span>;
  }
  if (endsThisWeek.length) {
    const title = `Ending this week: ${endsThisWeek.map((b) => `${laneName(b)} (${b.label || "untitled"})`).join(", ")}`;
    return <span className="badge warn" title={title}>Ending this week</span>;
  }
  // Green: mid-block, nothing to flag. The flag carries the name of the phase the athlete is in right now (the
  // block covering this week: the Strength row's if it has one, as the program builder on their plan opens
  // on, otherwise any block with a program, otherwise any block), and clicking it goes to that program.
  const now = plan.blocks.filter((b) => b.start <= wk && wk < b.start + b.len);
  const current = now.find((b) => b.programId && /strength/i.test(laneName(b))) || now.find((b) => b.programId) || now.find((b) => /phase/i.test(laneName(b))) || now[0] || null;
  const phase = current ? (current.label || "").trim() || laneName(current) : "On track";
  const open = (e) => {
    e.preventDefault();
    if (!onOpenTab) return;
    onOpenTab();
    // the plan tab opens at its top; bring the program builder into view once it has drawn
    setTimeout(() => { const el = document.querySelector(".ppt-title"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 450);
  };
  return (
    <a href="#" onClick={open} className="badge good badge-link program-phase-badge" title={`${phase} · week ${progress.week} of ${plan.weeks}, on track. Click to open their program.`}>
      {phase}
    </a>
  );
}

// Roster-row flag: whether a biomechanical assessment is on file and how current it is. All three

// Red: nothing on file. Yellow: latest assessment is 3+ weeks old — assuming a roughly monthly

// A player's top three physical goals from their Player Plan (the first three in its priority order), as small

const GOAL_COLORS = [

  ["yellow", /strength|strong|speed|quick|power|explosiv|output|velo|mph|jump|sprint|accelerat|force|rfd|impulse|rsi|squat|deadlift|bench|press|pull-?ups?|chin-?ups?|1 ?rm|max|throw|exit velo|bat speed|agility|10-yard|60-yard|\bcmj\b|peak/i],
  ["green", /body ?comp|lean|body fat|fat mass|% ?fat|\bfat\b|muscle mass|\bmass\b|weight|\blbs?\b|pounds|\bkg\b|nutrition|diet|calorie|protein|eat|meal|hydrat|bulk|cut\b|gain|lose/i],
];
const goalColor = (text) => (GOAL_COLORS.find(([, pattern]) => pattern.test(text || "")) || ["none"])[0];

// After a full assessment, athletes are re-assessed every four weeks (reassessment.js; the rules are

      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3.5 1.5v13" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" /><path d="M4.3 2.3h8.2l-2.1 3.1 2.1 3.1H4.3z" fill="currentColor" /></svg>

// ---- Automated CMJ summary ----
// Rule-based (no AI): the latest values, the jump-height trend, and which other metrics are moving.
// A "trend" is the least-squares slope across the tests in the selected range, expressed as the
// estimated % change over that span; anything within +/-2% counts as holding steady.
const CMJ_STEADY_BAND_PCT = 2;

function cmjTrend(tests, metric) {
  const pts = tests
    .map((t) => ({ x: new Date(`${t.date}T00:00:00`).getTime() / 864e5, y: metric.getValue(t) }))
    .filter((p) => typeof p.y === "number");
  if (pts.length < 3) return null;
  const n = pts.length;
  const mx = pts.reduce((s, p) => s + p.x, 0) / n;
  const my = pts.reduce((s, p) => s + p.y, 0) / n;
  const sxx = pts.reduce((s, p) => s + (p.x - mx) ** 2, 0);
  if (!sxx || !my) return null;
  const slope = pts.reduce((s, p) => s + (p.x - mx) * (p.y - my), 0) / sxx;
  return { pct: ((slope * (pts[n - 1].x - pts[0].x)) / Math.abs(my)) * 100 };
}

function summarizeCmj(tests, athleteName) {
  if (!tests.length) return "";
  const who = (athleteName || "").trim().split(/\s+/)[0] || "The athlete";
  const metricOf = (key) => FORCE_KPI_METRICS.find((m) => m.key === key);
  const withUnit = (m, v) => `${fmt2(v)}${m.unit ? ` ${m.unit}` : ""}`;
  const signed = (pct) => `${pct > 0 ? "+" : pct < 0 ? "−" : ""}${Math.abs(pct).toFixed(1)}%`;
  const last = tests[tests.length - 1];
  const first = tests[0];

  // 1) latest test snapshot
  const snap = [["jumpHeight", "jump height"], ["mRSI", "mRSI"], ["peakPower", "peak power"]]
    .map(([key, label]) => { const m = metricOf(key); const v = m.getValue(last); return typeof v === "number" ? `${label} ${withUnit(m, v)}` : null; })
    .filter(Boolean);
  let s = `Latest test (${shortDate(last.date)})${snap.length ? `: ${snap.join(", ")}` : ""}.`;
  const jumpM = metricOf("jumpHeight");
  const jumps = tests.map((t) => jumpM.getValue(t)).filter((v) => typeof v === "number");
  if (jumps.length > 1 && typeof jumpM.getValue(last) === "number") {
    const best = Math.max(...jumps);
    if (jumpM.getValue(last) < best) s += ` The best jump in this range is ${withUnit(jumpM, best)}.`;
    else s += " That is the best jump in this range.";
  }

  // 2) trends
  if (tests.length < 3) {
    return `${s} Only ${tests.length} test${tests.length === 1 ? "" : "s"} in this range — at least 3 are needed to show a trend.`;
  }
  const span = `${tests.length} tests, ${shortDate(first.date)} – ${shortDate(last.date)}`;
  const jt = cmjTrend(tests, jumpM);
  if (jt) {
    const dir = Math.abs(jt.pct) < CMJ_STEADY_BAND_PCT ? "holding steady" : jt.pct > 0 ? `trending up (${signed(jt.pct)})` : `trending down (${signed(jt.pct)})`;
    s += ` Across ${span}, jump height is ${dir}.`;
  } else {
    s += ` Across ${span}.`;
  }
  const up = [], down = [], steady = [];
  FORCE_KPI_METRICS.filter((m) => m.key !== "jumpHeight").forEach((m) => {
    const t = cmjTrend(tests, m);
    if (!t) return;
    const name = m.key === "mRSI" ? "mRSI" : m.label.toLowerCase();
    if (Math.abs(t.pct) < CMJ_STEADY_BAND_PCT) steady.push(name);
    else if (t.pct > 0) up.push(`${name} (${signed(t.pct)})`);
    else down.push(`${name} (${signed(t.pct)})`);
  });
  const parts = [];
  if (up.length) parts.push(`up: ${up.join(", ")}`);
  if (down.length) parts.push(`down: ${down.join(", ")}`);
  if (steady.length) parts.push(`steady: ${steady.join(", ")}`);
  if (parts.length) s += ` Other metrics — ${parts.join("; ")}.`;
  return s;
}

function CmjSummary({ tests, athleteId }) {
  const athlete = getPeople().find((a) => a.id === athleteId);
  const text = summarizeCmj(tests, athlete && athlete.name);
  if (!text) return null;
  return <p className="auto-caption"><strong>Summary:</strong> {text}</p>;
}

function MiniTrendChart({ title, unit, data, dataKey, color, showTrend = true, showCounts = false, yearLines }) {
  const { grid, axis } = useChartColors();
  const theme = useTheme();
  const hasData = data.some((d) => typeof d[dataKey] === "number");
  const withValue = data.filter((d) => typeof d[dataKey] === "number").length;
  const trend = showTrend ? computeLinearTrend(data, dataKey) : null;
  const chartData = data.map((d, i) => ({ ...d, __trend: trend ? trend[i] : null }));
  const domain = paddedDomain(chartData, showTrend ? [dataKey, "__trend"] : [dataKey]);
  // `date` is a numeric timestamp (see ForcePlatePanel/AthletePerformanceGraphs) so ticks land at
  // real time intervals instead of Recharts spacing out arbitrary category strings, and a
  // <ReferenceLine> at a real timestamp always lands correctly regardless of which ticks are drawn.
  const showYear = spansMultipleYears(data.map((d) => d.date));
  const axisProps = { dataKey: "date", type: "number", domain: ["dataMin", "dataMax"], scale: "time", tickFormatter: (ts) => axisDateLabel(ts, showYear) };
  return (
    <div className="panel">
      <h2>{title} {unit ? <small>({unit})</small> : null}</h2>
      {showCounts && data.length > 0 && (
        <p className="timestamp-note" style={{ marginTop: -4, marginBottom: 4 }}>
          {withValue} of {data.length} tests have a value{withValue < data.length ? " — the rest are blank in the table below" : ""}
        </p>
      )}
      {hasData ? (
        <ResponsiveContainer width="100%" height={160}>
          <LineChart data={chartData}>
            <CartesianGrid strokeDasharray="3 3" stroke={grid} />
            <XAxis {...axisProps} stroke={axis} fontSize={10} />
            <YAxis stroke={axis} fontSize={10} width={40} domain={domain} />
            <Tooltip contentStyle={theme === "light" ? { background: "#ffffff", border: "1px solid #c7cbd1", color: "#1a1a1a" } : { background: "#141414", border: "1px solid #3a3a3a" }} labelFormatter={(ts) => axisDateLabel(ts, true)} />
            {/* no draw-in animation: charts are always in their final state (matters for printing / emailed PDFs) */}
            <Line type="monotone" dataKey={dataKey} stroke={color || "#b5283a"} strokeWidth={2} dot={{ r: 2 }} connectNulls isAnimationActive={false} />
            {showTrend && <Line type="monotone" dataKey="__trend" stroke="#f59e0b" strokeWidth={1.5} strokeDasharray="6 3" dot={false} connectNulls isAnimationActive={false} />}
            {(yearLines || []).map((ts) => <ReferenceLine key={ts} x={ts} stroke={theme === "light" ? "#555555" : "#fff"} strokeOpacity={0.5} />)}
          </LineChart>
        </ResponsiveContainer>
      ) : (
        <div className="empty-state">No data yet.</div>
      )}
    </div>
  );
}

// ---- Positional CMJ profile: Hawkin + VALD MLB norms -------------------------------------------
const BAND_COLORS = { Elite: "#16a34a", Good: "#4ade80", Average: "#9ca3af", Below: "#f59e0b", Poor: "#ef4444" };
const NORM_ZONES = [
  { from: 0, to: 27.5, color: "#5b1a1a" },
  { from: 27.5, to: 47.5, color: "#5a4210" },
  { from: 47.5, to: 52.5, color: "#3a3a3a" },
  { from: 52.5, to: 77.5, color: "#1f4a2c" },
  { from: 77.5, to: 100, color: "#14532d" },
];

function pctLabel(p) {
  if (p === null || p === undefined) return "—";
  if (p < 5) return "<5th";
  if (p >= 99) return "99th+";
  return ordinal(Math.round(p));
}

function NormBar({ pct, zoned, title }) {
  if (pct === null || pct === undefined) return <div className="norm-bar-empty">no norm</div>;
  const b = window.CmjNorms.band(pct);
  return (
    <div className="norm-bar-wrap" title={title}>
      <div className="norm-bar">
        {zoned
          ? NORM_ZONES.map((z) => <div key={z.from} className="norm-zone" style={{ left: `${z.from}%`, width: `${z.to - z.from}%`, background: z.color }} />)
          : <div className="norm-zone" style={{ left: 0, width: `${pct}%`, background: "#1e3a5f" }} />}
        {[25, 50, 75].map((t) => <div key={t} className="norm-tick" style={{ left: `${t}%` }} />)}
        <div className="norm-marker" style={{ left: `${Math.max(1, Math.min(99, pct))}%`, background: BAND_COLORS[b] }} />
      </div>
      <span className="norm-pct" style={{ color: BAND_COLORS[b] }}>{pctLabel(pct)}</span>
    </div>
  );
}

// Hawkin and VALD are two different MLB samples scored two different ways — averaging them into one
// number would imply an agreement/precision that isn't really there. Showing the span between the two
// is the more honest read, so jump height and relative peak power (the two metrics requested) render
// as a range instead of collapsing to a point.
function NormRangeBar({ lo, hi, title }) {
  if (lo === null || hi === null) return <div className="norm-bar-empty">no norm</div>;
  const loB = window.CmjNorms.band(lo), hiB = window.CmjNorms.band(hi);
  const left = Math.max(1, Math.min(99, lo)), right = Math.max(1, Math.min(99, hi));
  return (
    <div className="norm-bar-wrap" title={title}>
      <div className="norm-bar">
        {NORM_ZONES.map((z) => <div key={z.from} className="norm-zone" style={{ left: `${z.from}%`, width: `${z.to - z.from}%`, background: z.color }} />)}
        {[25, 50, 75].map((t) => <div key={t} className="norm-tick" style={{ left: `${t}%` }} />)}
        <div className="norm-range-band" style={{ left: `${left}%`, width: `${Math.max(2, right - left)}%` }} />
        <div className="norm-marker norm-marker-sm" style={{ left: `${left}%`, background: BAND_COLORS[loB] }} />
        <div className="norm-marker norm-marker-sm" style={{ left: `${right}%`, background: BAND_COLORS[hiB] }} />
      </div>
      <span className="norm-pct">{pctLabel(lo)}–{pctLabel(hi)}</span>
    </div>
  );
}

// Jump height and relative peak power: show the Hawkin/VALD span when both exist, otherwise whichever
// one does. mRSI: Hawkin only, even though VALD also publishes it — picking one keeps that metric
// simple since it's the "speed of movement" figure the recommendations are built on. Everything else
// only ever has one source to begin with.
const NORM_RANGE_METRICS = new Set(["jumpHeight", "peakRelPropPower"]);
function combinedPercentile(r) {
  if (NORM_RANGE_METRICS.has(r.key) && r.hawkinPct !== null && r.valdPct !== null) {
    return { type: "range", lo: Math.min(r.hawkinPct, r.valdPct), hi: Math.max(r.hawkinPct, r.valdPct) };
  }
  if (r.key === "mRSI") return { type: "point", pct: r.hawkinPct, title: "Hawkin MLB norm" };
  if (r.hawkinPct !== null) return { type: "point", pct: r.hawkinPct, title: "Hawkin MLB norm" };
  return { type: "point", pct: r.valdPct, title: "VALD MLB norm" };
}
const hasNorm = (c) => (c.type === "range" ? c.lo != null && c.hi != null : c.pct != null);

function formatProfileValue(r) {
  if (r.value === null) return "—";
  const v = r.displayValue.toFixed(r.decimals);
  const extra = r.key === "jumpHeight" ? ` (${(r.value * 100).toFixed(1)} cm)` : "";
  return `${v}${r.unit ? " " + r.unit : ""}${extra}`;
}

const PROFILE_TONE = { good: "var(--good)", warn: "var(--warn)", info: "var(--info)" };

// Offseason percentile history for one metric, in the {year, value} shape TrendSpark already expects
// (same component used for the Percentile Rankings trend) — "year" here is an offseason label like
// '24-'25 rather than a calendar year, but TrendSpark only ever treats it as a point label.
function offseasonSpark(trendPoints, key) {
  if (!trendPoints) return null;
  return trendPoints.map((p) => ({ year: p.offseason, value: p[key] }));
}

  // Short enough that the outward-pointing labels on the left/right points of the radar don't run

  const radarData = profile.rows.filter((r) => r.hawkinPct !== null).map((r) => ({ metric: radarLabel[r.key] || r.label, pct: Math.round(r.hawkinPct), median: 50 }));
  const bodyMassRow = profile.rows.find((r) => r.key === "bodyMassKg");

  const trendPoints = N.offseasonTrend(tests, groupKey);

  return (
    <div className={compact ? "cmj-mini" : "panel"}>
      <h2>
        Positional CMJ Profile{" "}
        <small>
          {profile.testCount} hands-on-hips CMJ{profile.testCount === 1 ? "" : "s"} averaged · {range}
        </small>
      </h2>
      <div className="profile-controls no-print">
        <label>

          <select value={groupKey} onChange={(e) => setGroupKey(e.target.value)}>
