    // Start with every team in the league (so teams with nobody rostered still get a tile),
    // then add rostered athletes — including teams typed in by hand that aren't in the list.
    const byTeam = new Map();
    (LEAGUE_TEAMS[selectedLeague] || []).forEach((team) => byTeam.set(team, []));
    roster.forEach((a) => {
      if (a.league !== selectedLeague || !a.team) return;
      if (!byTeam.has(a.team)) byTeam.set(a.team, []);
      byTeam.get(a.team).push(a);
    });
    return Array.from(byTeam.entries())
      .map(([team, athletes]) => ({ team, athletes }))
      .sort((a, b) => a.team.localeCompare(b.team));
    // eslint-disable-next-line
  }, [selectedLeague, dataVersion]);

  const teamAthletes = selectedTeam ? roster.filter((a) => a.team === selectedTeam) : [];

  const rows = useMemo(() => {
    return teamAthletes.map((a) => ({ athlete: a }));
    // eslint-disable-next-line
  }, [selectedTeam, dataVersion]);

  const activeCount = rows.filter((r) => (r.athlete.status || "active").toLowerCase() === "active").length;

  // ---- printing: one athlete sheet per portrait Letter page ----
  // Each sheet keeps its on-screen width, is measured, and is scaled down (never up) so the whole
  // sheet fits one page; a page break follows every sheet. Cleaned up again after printing.
  const sheetPrint = React.useRef(null);
  const prepareSheets = () => {
    if (sheetPrint.current) return;
    const sheets = [...document.querySelectorAll(".report-sheet")].filter((s) => s.offsetParent !== null);
    if (!sheets.length) return;
    const PAGE_W = 725; // printable area of a Letter portrait page (0.35in margins), in CSS px, with headroom
    const PAGE_H = 925;
    sheets.forEach((s) => {
      const w = s.offsetWidth;
      s.style.zoom = "";
      s.style.width = `${w}px`;
      s.classList.add("measuring"); // hides screen-only controls so we measure what will print
      const h = s.scrollHeight;
      s.classList.remove("measuring");
      s.style.zoom = String(Math.min(1, PAGE_W / w, PAGE_H / h));
    });
    const pageStyle = document.createElement("style");
    pageStyle.textContent = "@page { size: letter portrait; margin: 0.35in; }";
    document.head.appendChild(pageStyle);
    document.body.classList.add("print-team-sheets");
    sheetPrint.current = { sheets, pageStyle };
  };
  const cleanupSheets = () => {
    const s = sheetPrint.current;
    if (!s) return;
    sheetPrint.current = null;
    document.body.classList.remove("print-team-sheets");
    if (s.pageStyle.parentNode) s.pageStyle.parentNode.removeChild(s.pageStyle);
    s.sheets.forEach((el) => { el.style.zoom = ""; el.style.width = ""; });
  };
  const printTeamReport = () => { prepareSheets(); window.print(); };

  React.useEffect(() => {
    if (!selectedTeam) return undefined;
    window.addEventListener("beforeprint", prepareSheets); // also covers Ctrl+P
    window.addEventListener("afterprint", cleanupSheets);
    return () => {
      window.removeEventListener("beforeprint", prepareSheets);
      window.removeEventListener("afterprint", cleanupSheets);
      cleanupSheets();
    };
    // eslint-disable-next-line
  }, [selectedTeam]);

  return (
    <div>
      {!selectedLeague && (
        <div className="panel no-print">
          <h2>Team Reports <small>Select a league</small></h2>
          <div className="team-select-grid">
            {leagues.map((league) => {
              const count = roster.filter((a) => a.league === league).length;
              const logo = LEAGUE_LOGOS[league];
              return (
                <button key={league} className="team-select-btn league-select-btn" onClick={() => { setSelectedLeague(league); setSelectedTeam(""); }}>
                  {logo ? (
                    <img src={logo} alt={league} className="league-tile-logo" />
                  ) : (
                    <div className="league-tile-word">{league}</div>
                  )}
                  {logo && <div className="team-select-name">{league}</div>}
                  <div className="team-select-count">{count}</div>
                  <div className="team-select-names">athlete{count === 1 ? "" : "s"}</div>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {selectedLeague && !selectedTeam && (
        <div className="panel">
          <button className="btn-link no-print" onClick={() => setSelectedLeague("")}>&larr; All leagues</button>
          <h2>{selectedLeague} Teams</h2>
          {teamsInLeague.length ? (
            <div className="team-select-grid">
              {teamsInLeague.map(({ team, athletes }) => (
                <button key={team} className={`team-select-btn ${athletes.length === 0 ? "team-select-empty" : ""}`} onClick={() => setSelectedTeam(team)}>
                  <TeamLogo team={team} size={TEAM_TILE_LOGO_SIZE} />
                  <div className="team-select-name">{team}</div>
                  <div className="team-select-count">{athletes.length}</div>
                  <div className="team-select-names">
                    {athletes.map((a) => <div key={a.id}>{lastFirstName(a.name)}</div>)}
                  </div>
                </button>
              ))}
            </div>
          ) : (
            <div className="empty-state">No teams in {selectedLeague} yet — set a Team on an athlete's roster entry to add one.</div>
          )}
        </div>
      )}

      {selectedTeam && (
        <div>
          <div className="report-header no-print">
            <TeamLogo team={selectedTeam} />
            <div>
              <button className="btn-link no-print" onClick={() => setSelectedTeam("")}>&larr; Back to {selectedLeague} teams</button>
              <h1 className="report-title">{selectedTeam}</h1>
              <div className="report-subtitle">
                {rows.length} player{rows.length === 1 ? "" : "s"} monitored &middot; one sheet per athlete &middot; generated {new Date().toLocaleDateString()}
              </div>
            </div>
            <div className="no-print" style={{ marginLeft: "auto", display: "flex", gap: 10 }}>
              <button className="btn btn-secondary" onClick={printTeamReport} title="Prints one page per athlete">
                Print / Save PDF
              </button>
              <EmailTeamReportButton
                team={selectedTeam}
                defaultRecipients={
                  window.MLB_TEAM_CONTACTS && window.MLB_TEAM_CONTACTS[selectedTeam]
                    ? window.MLB_TEAM_CONTACTS[selectedTeam].contacts.flatMap((c) => c.e).join(", ")
                    : ""
                }
              />
            </div>
          </div>

          <div className="kpi-row no-print">
            <KpiCard label="Players" value={rows.length} />
            <KpiCard label="Active" value={activeCount} />
          </div>

          {selectedLeague === "MLB" && <TeamContactsPanel team={selectedTeam} />}

          <h2 className="no-print" style={{ marginBottom: 14 }}>Players <small style={{ color: "var(--text-dim)", fontSize: 12 }}>One sheet per athlete &middot; click a name to open their profile</small></h2>
          <RangeSelector range={perfRange} onChange={setPerfRange} />
          {rows.length ? (
            rows.map(({ athlete }) => {
              const plan = window.AthleteStore.getPeriodization(athlete.id);
              const hasPlan = !!plan && plan.blocks.length > 0;
              const rangeText = rangeLabel(perfRange);
              return (
                <div className="report-sheet" key={athlete.id}>
                  {window.PlanSheetHeader && (
                    <window.PlanSheetHeader
                      athlete={athlete}
                      title="Player Report"
                      subtitle={`${selectedTeam} · generated ${new Date().toLocaleDateString()}`}
                      onOpen={() => onSelect(athlete.id)}
                    />
                  )}

                  <div className="panel report-section">
                    <h2>
                      Periodization
                      <button className="btn-link no-print" style={{ marginLeft: 12 }} onClick={() => onEditPeriodization(athlete.id)}>
                        {hasPlan ? "Edit plan" : "Build plan"} &rarr;
                      </button>
                    </h2>
                    {hasPlan && window.PeriodizationView
                      ? <window.PeriodizationView athleteId={athlete.id} bare showGoals={false} />
                      : <div className="empty-state">No periodization saved for this athlete yet.</div>}
                  </div>

                  <div className="panel report-section">
                    <h2>Performance Metrics <small>{rangeText}</small></h2>
                    <AthletePerformanceGraphs athleteId={athlete.id} range={perfRange} />
                  </div>

                  <div className="panel report-section">
                    <NotesPanel athleteId={athlete.id} embedded />
                  </div>
                </div>
              );
            })
          ) : (
            <div className="panel"><div className="empty-state">No athletes on {selectedTeam} yet.</div></div>
          )}
        </div>
      )}
    </div>
  );
}

// The old Player Plans page (Google Sheet sync + summary table). It now lives under Import & Manual Entry.
function PlayerPlansSyncPage({ onSelect, onImported }) {
  const [method, setMethod] = useState("url");
  const [sheetUrl, setSheetUrl] = useState("");
  const [pasteText, setPasteText] = useState("");
  const [columnSpec, setColumnSpec] = useState("");
  const [allHeaders, setAllHeaders] = useState([]);
  const [headers, setHeaders] = useState([]);
  const [rawRows, setRawRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [result, setResult] = useState(null);
  const [search, setSearch] = useState("");

  const parseCsvText = (text) => {
    const results = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
    const fields = results.meta.fields || [];
    if (!fields.length || !results.data.length) {
      setError("Couldn't find any rows/columns in that data. Check the sheet has a header row and at least one data row.");
      return;
    }
    setAllHeaders(fields);
    setRawRows(results.data);
    const filtered = applyColumnFilter(fields, columnSpec);
    setHeaders(filtered);
    setMapping(guessMapping(filtered, PLAYER_PLAN_FIELD_DEFS));
    setError("");
    setResult(null);
  };

  const applyFilter = () => {
    const filtered = applyColumnFilter(allHeaders, columnSpec);
    setHeaders(filtered);
    setMapping(guessMapping(filtered, PLAYER_PLAN_FIELD_DEFS));
  };

  const handleFetchUrl = async () => {
    if (!sheetUrl.trim()) {
      setError("Paste a Google Sheet link first.");
      return;
    }
    setLoading(true);
    setError("");
    try {
      const url = toGvizCsvUrl(sheetUrl);
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`Request failed (HTTP ${res.status}).`);
      }
      const text = await res.text();
      parseCsvText(text);
    } catch (e) {
      setError(
        `Couldn't fetch that sheet (${e.message}). This is usually because the sheet isn't shared as "Anyone with the link can view" / published to the web, or the browser blocked the cross-origin request. Try "Paste CSV/Text" below instead — open the sheet, select the range (including headers), copy, and paste it in.`
      );
    } finally {
      setLoading(false);
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setError("");
    const reader = new FileReader();
    reader.onload = (ev) => parseCsvText(ev.target.result);
    reader.readAsText(file);
  };

  const handleImport = () => {
    let skipped = 0;
    let duplicatesCollapsed = 0;
    const beforeCount = window.AthleteStore.allAthletes().length;
    const mappedCols = new Set(Object.values(mapping).filter(Boolean));
    const extraHeaders = headers.filter((h) => !mappedCols.has(h));
    const entryByAthleteId = new Map();

    rawRows.forEach((row) => {
      const rawName = resolveRowName(row, mapping);
      if (!rawName) {
        skipped++;
        return;
      }
      // Every name becomes (or matches) a roster entry, so the sheet's athlete
      // list drives who shows up across the dashboard, not just the mock roster.
      const athlete = window.AthleteStore.findOrCreateAthlete(rawName);
      const entry = { athleteId: athlete.id };
      PLAYER_PLAN_FIELD_DEFS.forEach((f) => {
        if (f.key === "athleteName" || f.key === "firstName" || f.key === "lastName") return;
        const col = mapping[f.key];
        if (!col) return;
        const val = row[col];
        if (val === undefined || val === null || val === "") return;
        entry[f.key] = val;
      });
      const extra = {};
      extraHeaders.forEach((h) => {
        const val = row[h];
        if (val !== undefined && val !== null && val !== "") extra[h] = val;
      });
      if (Object.keys(extra).length) entry.extra = extra;

      if (entryByAthleteId.has(athlete.id)) duplicatesCollapsed++;
      // Sheet rows are in submission order, so the last row for a given
      // athlete is the most recent one — overwrite rather than keep both.
      entryByAthleteId.set(athlete.id, entry);
    });

    const entries = Array.from(entryByAthleteId.values());
    window.AthleteStore.setPlayerPlans(entries);
    const afterCount = window.AthleteStore.allAthletes().length;
    setResult({
      imported: entries.length,
      skipped,
      duplicatesCollapsed,
      newAthletes: afterCount - beforeCount,
    });
    setAllHeaders([]);
    setHeaders([]);
    setRawRows([]);
    onImported();
  };

  const syncedAt = window.AthleteStore.getPlayerPlansSyncedAt();
  const allPlans = window.AthleteStore
    .getAllPlayerPlans()
    .map((p) => ({ plan: p, athlete: getRoster().find((a) => a.id === p.athleteId) }))
    .filter((row) => row.athlete && row.athlete.name.toLowerCase().includes(search.toLowerCase()));

  return (
    <div>
      <div className="panel">
        <h2>Sync Player Plans from Google Sheets</h2>
        <p style={{ color: "var(--text-dim)", fontSize: 13, marginTop: -6 }}>
          Each sync replaces the current plan list with what's in the sheet — this is meant to mirror the sheet's
          current state, not build up history. You need either a single Full Name column mapped, or both First Name
          and Last Name columns — plus whichever of Focus Area, Goal, Target Date, Status, Coach, and Notes your
          sheet has. Any column naming works, you'll confirm the mapping below.
        </p>

        <div className="sync-row" style={{ marginBottom: 4 }}>
          <div className="field">
            <label>Columns to include (optional)</label>
            <input
              placeholder="e.g. I,J,K,N,O,P,AC-AX — leave blank to include every column"
              value={columnSpec}
              onChange={(e) => setColumnSpec(e.target.value)}
            />
          </div>
          <button className="btn btn-secondary" onClick={applyFilter} disabled={!allHeaders.length}>
            Apply Filter
          </button>
        </div>
        <p style={{ fontSize: 11, color: "var(--text-dim)", marginTop: 0, marginBottom: 14 }}>
          Use spreadsheet column letters, comma-separated, with ranges like <code>AC-AX</code>. Columns you don't map
          to a field below are still imported and shown as additional data on each athlete's Player Plan panel — they
          just won't clutter the mapping list or the summary table here.
        </p>

        <div className="method-switch">
          <button className={method === "url" ? "active" : ""} onClick={() => setMethod("url")}>Google Sheet link</button>
          <button className={method === "paste" ? "active" : ""} onClick={() => setMethod("paste")}>Paste CSV / Text</button>
          <button className={method === "file" ? "active" : ""} onClick={() => setMethod("file")}>Upload File</button>
        </div>

        {error && (
          <div className="success-banner" style={{ background: "#3a1414", color: "var(--danger)", borderColor: "#5a1f1f" }}>
            {error}
          </div>
        )}
        {result && (
          <div className="success-banner">
            Synced plans for {result.imported} athlete{result.imported === 1 ? "" : "s"}
            {result.newAthletes > 0 ? ` — ${result.newAthletes} new athlete profile${result.newAthletes === 1 ? "" : "s"} added to the roster` : ""}.
            {result.duplicatesCollapsed > 0
              ? ` ${result.duplicatesCollapsed} repeat submission${result.duplicatesCollapsed === 1 ? "" : "s"} from the same athlete collapsed to their most recent entry.`
              : ""}
            {result.skipped > 0 ? ` Skipped ${result.skipped} row(s) missing an athlete name.` : ""}
          </div>
        )}

        {method === "url" && (
          <div className="sync-row">
            <div className="field">
              <label>Published Google Sheet link</label>
              <input
                placeholder="https://docs.google.com/spreadsheets/d/.../edit#gid=0"
                value={sheetUrl}
                onChange={(e) => setSheetUrl(e.target.value)}
              />
            </div>
            <button className="btn btn-primary" onClick={handleFetchUrl} disabled={loading}>
              {loading ? "Fetching..." : "Fetch"}
            </button>
          </div>
        )}

        {method === "paste" && (
          <div>
            <div className="field">
              <label>Paste CSV or copied sheet cells</label>
              <textarea rows={6} value={pasteText} onChange={(e) => setPasteText(e.target.value)} />
            </div>
            <button className="btn btn-primary" style={{ marginTop: 8 }} onClick={() => parseCsvText(pasteText)}>
              Parse
            </button>
          </div>
        )}

        {method === "file" && (
          <div className="file-drop">
            <input type="file" accept=".csv,.tsv,.txt" onChange={handleFileUpload} />
            <span style={{ color: "var(--text-dim)", fontSize: 12 }}>Accepts a CSV exported from Google Sheets (File &gt; Download &gt; CSV).</span>
          </div>
        )}

        {syncedAt && (
          <p className="timestamp-note">Last synced {new Date(syncedAt).toLocaleString()}</p>
        )}

        {rawRows.length > 0 && (
          <div style={{ marginTop: 16 }}>
            <p style={{ fontSize: 12, color: "var(--text-dim)" }}>{rawRows.length} rows detected. Confirm the mapping below.</p>
            <MappingPreviewImport
              headers={headers}
              rawRows={rawRows}
              fieldDefs={PLAYER_PLAN_FIELD_DEFS}
              mapping={mapping}
              setMapping={setMapping}
              onCommit={handleImport}
              disabled={!mapping.athleteName && !(mapping.firstName && mapping.lastName)}
              disabledHint="Map either a Full Name column, or both First Name and Last Name columns, before syncing."
              commitLabel={`Sync ${rawRows.length} rows (replaces current plans)`}
            />
          </div>
        )}
      </div>

      <div className="panel">
        <h2>
          Player Plans <small>{allPlans.length} plan{allPlans.length === 1 ? "" : "s"} on file</small>
        </h2>
        <input
          placeholder="Search athlete..."
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          style={{ marginBottom: 12, maxWidth: 260 }}
        />
        {allPlans.length ? (
          <table>
            <thead>
              <tr>
                <th>Athlete</th>
                <th>Focus Area</th>
                <th>Goal</th>
                <th>Target Date</th>
                <th>Status</th>
                <th>Coach</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody>
              {allPlans.map(({ plan, athlete }, i) => (
                <tr key={i} onClick={() => onSelect(athlete.id)}>
                  <td><Avatar athlete={athlete} />{displayName(athlete)}</td>
                  <td>{plan.focusArea || "—"}</td>
                  <td>{plan.goal || "—"}</td>
                  <td>{plan.targetDate || "—"}</td>
                  <td><Badge tone={planStatusTone(plan.status)}>{plan.status || "No Status"}</Badge></td>
                  <td>{plan.coach || "—"}</td>
                  <td>{plan.notes || "—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        ) : (
          <div className="empty-state">No player plans synced yet — pull them in from a Google Sheet above.</div>
        )}
      </div>
    </div>
  );
}

// `embedded` renders the notes inside another panel (e.g. an athlete block on the Team Report)
// instead of as its own card. Notes are stored per athlete, so they're shared with the player page.
function NotesPanel({ athleteId, embedded = false }) {
  const [text, setText] = useState("");
  const [tick, setTick] = useState(0);
  const notes = useMemo(() => window.AthleteStore.getNotes(athleteId), [athleteId, tick]);

  const handleAdd = () => {
    if (!text.trim()) return;
    window.AthleteStore.addNote(athleteId, text.trim());
    setText("");
    setTick((t) => t + 1);
  };

  const handleDelete = (id) => {
    window.AthleteStore.deleteNote(id);
    setTick((t) => t + 1);
  };

  return (
    <div className={embedded ? "team-athlete-notes" : "panel"}>
      <h2>Notes</h2>
      <div className="no-print">
        <div className="field" style={{ marginBottom: 10 }}>
          <textarea
            rows={3}
            placeholder="Log a note for this athlete... (e.g. observations from today's session)"
            value={text}
            onChange={(e) => setText(e.target.value)}
          />
        </div>
        <button className="btn btn-primary" disabled={!text.trim()} onClick={handleAdd}>Add Note</button>
      </div>

      {notes.length ? (
        <div className="notes-log">
          {notes.map((n) => (
            <div className="note-entry" key={n.id}>
              <div className="note-meta">
                <span>{new Date(n.timestamp).toLocaleString()}</span>
                <button className="btn-link no-print" onClick={() => handleDelete(n.id)}>Delete</button>
              </div>
              <div className="note-text">{n.text}</div>
            </div>
          ))}
        </div>
      ) : (
        <div className="empty-state">No notes logged yet.</div>
      )}
    </div>
  );
}

// Reuses an MLBAM id already captured in photoUrl (from the mlbstatic.com headshot CDN
// pattern) when no explicit id has been set, so athletes already photo-matched don't
// need a second manual lookup.
function extractMlbamId(athlete) {
  if (athlete.mlbamId) return String(athlete.mlbamId).trim();
  const m = /\/people\/(\d+)\//.exec(athlete.photoUrl || "");
  return m ? m[1] : null;
}

async function fetchSavantText(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.text();
}

async function fetchSavantCsv(url) {
  const text = await fetchSavantText(url);
  const parsed = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
  return parsed.data;
}

// Same as fetchSavantCsv but swallows failures (rate limits, dropped connections, etc.) and
// returns an empty result instead of throwing — used anywhere we fire off many requests, so
// one bad request doesn't wipe out an entire refresh that would otherwise have succeeded.
async function fetchSavantCsvSafe(url) {
  try {
    return await fetchSavantCsv(url);
  } catch (e) {
    console.warn("Savant fetch failed, skipping:", url, e);
    return [];
  }
}

function findByPlayerId(rows, idKey, id) {
  return rows.find((r) => String(r[idKey] || "").trim() === String(id));
}

// Raw pitch-level export (not a pre-aggregated leaderboard) so we can derive both the
// average AND peak fastball velocity for a given season from one source.
async function fetchFastballVelocityForYear(mlbamId, yr) {
  const url =
    `https://baseballsavant.mlb.com/statcast_search/csv?all=true&hfPT=FF%7C&hfSea=${yr}%7C&player_type=pitcher` +
    `&pitchers_lookup%5B%5D=${mlbamId}&min_pitches=0&min_results=0&group_by=name&sort_col=pitches` +
    `&player_event_sort=api_p_release_speed&sort_order=desc&min_abs=0&type=details`;
  const rows = await fetchSavantCsvSafe(url);
  const speeds = rows.map((r) => Number(r.release_speed)).filter((v) => !isNaN(v) && v > 0);
  if (!speeds.length) return { avg: null, peak: null };
  return {
    avg: round2(speeds.reduce((s, v) => s + v, 0) / speeds.length),
    peak: round2(Math.max(...speeds)),
  };
}

async function fetchSprintSpeedForYear(mlbamId, yr) {
  const rows = await fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/sprint_speed?year=${yr}&position=&team=&min=0&csv=true`);
  const row = findByPlayerId(rows, "player_id", mlbamId);
  return row && row.sprint_speed ? round2(Number(row.sprint_speed)) : null;
}

// Raw batted-ball export (same pitch-level search endpoint, queried as a batter) so we can
// derive both average and peak exit velocity for a season, same approach as fastball velo.
async function fetchExitVelocityForYear(mlbamId, yr) {
  const url =
    `https://baseballsavant.mlb.com/statcast_search/csv?all=true&hfSea=${yr}%7C&player_type=batter` +
    `&batters_lookup%5B%5D=${mlbamId}&min_pitches=0&min_results=0&group_by=name&sort_col=pitches` +
    `&player_event_sort=api_p_release_speed&sort_order=desc&min_abs=0&type=details`;
  const rows = await fetchSavantCsvSafe(url);
  const speeds = rows.map((r) => Number(r.launch_speed)).filter((v) => !isNaN(v) && v > 0);
  if (!speeds.length) return { avg: null, peak: null };
  return {
    avg: round2(speeds.reduce((s, v) => s + v, 0) / speeds.length),
    peak: round2(Math.max(...speeds)),
  };
}

// Savant's leaderboards silently default to fastball-only unless a pitch type is explicitly
// requested (an empty/omitted pitch_type param does NOT mean "all types") — so a full arsenal
// requires one request per type, per endpoint.
const PITCH_TYPE_CODES = ["FF", "SI", "FC", "SL", "ST", "SV", "CU", "KC", "CH", "FS", "FO", "KN", "EP", "SC"];

// Combines the pitch-movement leaderboard (shape: velo, induced vertical break, horizontal
// break, usage%) with the pitch-arsenal-stats leaderboard (results: whiff%, hard-hit%, run
// value) into one row per pitch type actually thrown — current season only.
// Fetches in small batches (not all 14 types x 2 endpoints at once) and uses the "safe" fetch
// wrapper, so a single rate-limited/dropped request only drops that one pitch type instead of
// failing the whole arsenal (and taking the rest of the refresh down with it).
async function fetchPitchArsenal(mlbamId, yr) {
  const BATCH_SIZE = 3;
  const perType = [];
  for (let i = 0; i < PITCH_TYPE_CODES.length; i += BATCH_SIZE) {
    const batch = PITCH_TYPE_CODES.slice(i, i + BATCH_SIZE);
    const batchResults = await Promise.all(
      batch.map(async (code) => {
        const [movementRows, statsRows] = await Promise.all([
          fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/pitch-movement?year=${yr}&team=&min=1&pitch_type=${code}&pitcherHand=&csv=true`),
          fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/pitch-arsenal-stats?type=pitcher&pitchType=${code}&year=${yr}&min=1&csv=true`),
        ]);
        const moveRow = findByPlayerId(movementRows, "pitcher_id", mlbamId);
        const statRow = findByPlayerId(statsRows, "player_id", mlbamId);
        if (!moveRow && !statRow) return null;
        return {
          pitchType: code,
          pitchName: (moveRow && moveRow.pitch_type_name) || (statRow && statRow.pitch_name) || code,
          usagePct: moveRow && moveRow.pitch_per ? Number(moveRow.pitch_per) : statRow && statRow.pitch_usage ? Number(statRow.pitch_usage) : null,
          avgVelo: moveRow && moveRow.avg_speed ? Number(moveRow.avg_speed) : null,
          inducedVertBreak: moveRow && moveRow.pitcher_break_z_induced ? Number(moveRow.pitcher_break_z_induced) : null,
          horizBreak: moveRow && moveRow.pitcher_break_x ? Number(moveRow.pitcher_break_x) : null,
          whiffPct: statRow && statRow.whiff_percent ? Number(statRow.whiff_percent) : null,
          hardHitPct: statRow && statRow.hard_hit_percent ? Number(statRow.hard_hit_percent) : null,
          runValuePer100: statRow && statRow.run_value_per_100 ? Number(statRow.run_value_per_100) : null,
        };
      })
    );
    perType.push(...batchResults);
  }
  return perType.filter(Boolean).sort((a, b) => (b.usagePct || 0) - (a.usagePct || 0));
}

// ---- MLB Research tool snapshot (research_snapshots.js) ---------------------------------
// Tracked data for athletes Baseball Savant doesn't cover (mostly minor leaguers), copied
// from research.mlb.com. It's a point-in-time snapshot, not a live feed.

function findResearchEntry(athlete) {
  const list = window.MLB_RESEARCH || [];
  const id = extractMlbamId(athlete);
  const norm = (s) => stripAccents(s || "").toLowerCase().replace(/\s+/g, " ").trim();
  return (
    list.find((e) => id && String(e.id) === String(id)) ||
    list.find((e) => norm(e.name) === norm(athlete.name)) ||
    null
  );
}

function ResearchLineChart({ title, unit, data, lines, trendKey, height }) {
  const hasData = data.some((d) => lines.some((l) => typeof d[l.key] === "number"));
  const trend = trendKey ? computeLinearTrend(data, trendKey) : null;
  const chartData = data.map((d, i) => ({ ...d, __trend: trend ? trend[i] : null }));
  const domain = paddedDomain(chartData, lines.map((l) => l.key).concat(trend ? ["__trend"] : []));
  const tip = ({ active, payload }) => {
    if (!active || !payload || !payload.length) return null;
    const row = payload[0].payload;
    return (
      <div style={{ background: "#141414", border: "1px solid #3a3a3a", padding: "6px 10px", fontSize: 12 }}>
        <div><strong>{row.date}</strong>{row.matchup ? ` · ${row.matchup}` : ""}</div>
        {row.play && <div style={{ color: "#9a9a9a" }}>{row.play}</div>}
        {lines.map((l) => (
          typeof row[l.key] === "number" ? <div key={l.key} style={{ color: l.color }}>{l.name}: {fmt2(row[l.key])}</div> : null
        ))}
      </div>
    );
  };
  return (
    <div className="panel">
      <h2>{title} {unit ? <small>{unit}</small> : null}</h2>
      {hasData ? (
        <ResponsiveContainer width="100%" height={height || 220}>
          <LineChart data={chartData}>
            <CartesianGrid strokeDasharray="3 3" stroke="#2a2a2a" />
            <XAxis dataKey="date" stroke="#9a9a9a" fontSize={11} tickFormatter={(d) => (/^\d{4}-\d{2}-\d{2}$/.test(d) ? shortDate(d) : d)} minTickGap={24} />
            <YAxis stroke="#9a9a9a" fontSize={11} width={40} domain={domain} />
            <Tooltip content={tip} />
            {lines.length > 1 && <Legend />}
            {lines.map((l) => (
              <Line key={l.key} type="monotone" dataKey={l.key} name={l.name} stroke={l.color} strokeWidth={2} strokeDasharray={l.dashed ? "4 3" : undefined} dot={{ r: 2 }} connectNulls />
            ))}
            {trend && <Line type="monotone" dataKey="__trend" name="Trend" stroke="#f59e0b" strokeWidth={1.5} strokeDasharray="6 3" dot={false} connectNulls />}
          </LineChart>
        </ResponsiveContainer>
      ) : (
        <div className="empty-state">No tracked data.</div>
      )}
    </div>
  );
}

function MlbResearchPanel({ athlete, range }) {
  const e = findResearchEntry(athlete);
  if (!e) return null;
  const p = e.pitching;
  const f = (v, unit) => (v != null ? `${fmt2(v)}${unit ? " " + unit : ""}` : "—");

  // Everything below is derived from the per-game rows so the date-range option applies to
  // both the charts and the summary tiles.
  const inRange = (g) => dateInRange(g[0], range);
  const maxOf = (rows, i) => { const v = rows.map((g) => g[i]).filter((x) => typeof x === "number"); return v.length ? Math.max(...v) : null; };
  const wAvg = (rows, vi, ni) => {
    const n = rows.reduce((s, g) => s + (g[ni] || 0), 0);
    return n ? rows.reduce((s, g) => s + (g[vi] || 0) * (g[ni] || 0), 0) / n : null;
  };
  const runGames = e.running ? e.running.games.filter(inRange) : [];
  const hitGames = e.hitting ? e.hitting.games.filter(inRange) : [];
  const pitchGames = p ? p.games.filter(inRange) : [];
  const topRun = runGames.reduce((m, g) => (m === null || g[3] > m[3] ? g : m), null);
  const rangeKey = parseRange(range).key;
  const scopeLabel = rangeKey === "all" || !rangeKey ? "all tracked games" : rangeKey === "custom" ? rangeLabel(range) : rangeLabel(range).toLowerCase();

  // Year-to-year view: only seasons that actually have velocity data (no empty gaps).
  const yearRows = p
    ? Object.keys(p.seasons).sort()
        .map((y) => ({ date: y, avgFB: p.seasons[y].avgFB, peak: p.seasons[y].maxFB }))
        .filter((r) => typeof r.avgFB === "number" || typeof r.peak === "number")
    : [];

  return (
    <div style={{ marginBottom: 20 }}>
      <div className="panel" style={{ marginBottom: 14 }}>
        <h2>MLB Research Tool <small>tracked data &middot; snapshot copied {e.pulled} &middot; {scopeLabel}</small></h2>
        {e.note && <div className="empty-state">{e.note}</div>}

        {(e.running || e.hitting) && (
          <div>
            <div className="location-kpi-row">
              <KpiCard label="Top Sprint Speed" value={f(topRun && topRun[3], "ft/s")} />
              <KpiCard label="Top Exit Velo" value={f(maxOf(hitGames, 3), "mph")} />
              <KpiCard label="Avg Exit Velo" value={f(wAvg(hitGames, 4, 5), "mph")} />
              <KpiCard label="Top Bat Speed" value={f(maxOf(hitGames, 6), "mph")} />
              <KpiCard label="Avg Bat Speed" value={f(wAvg(hitGames, 7, 8), "mph")} />
            </div>
            {topRun && (
              <p className="timestamp-note">Top sprint: {topRun[0]} {topRun[1]} {topRun[4]}</p>
            )}
          </div>
        )}

        {p && (
          <div className="location-kpi-row">
            <KpiCard label="Avg Fastball Velo" value={f(wAvg(pitchGames, 6, 7), "mph")} />
            <KpiCard label="Peak Fastball Velo" value={f(maxOf(pitchGames, 8), "mph")} />
            <KpiCard label="Pitches Tracked" value={pitchGames.reduce((s, g) => s + (g[3] || 0), 0)} />
          </div>
        )}
      </div>

      {e.running && (
        <ResearchLineChart
          title="Sprint Speed" unit="top per game, ft/s"
          data={runGames.map((g) => ({ date: g[0], matchup: g[1], play: g[4], top: g[3] }))}
          lines={[{ key: "top", name: "Top sprint", color: "#b5283a" }]}
          trendKey="top"
        />
      )}
      {e.hitting && (
        <div>
          <ResearchLineChart
            title="Bat Speed" unit="top per game, mph"
            data={hitGames.map((g) => ({ date: g[0], matchup: g[1], top: g[6] }))}
            lines={[{ key: "top", name: "Top bat speed", color: "#38bdf8" }]}
            trendKey="top"
          />
          <ResearchLineChart
            title="Exit Velocity" unit="top per game, mph"
            data={hitGames.map((g) => ({ date: g[0], matchup: g[1], top: g[3] }))}
            lines={[{ key: "top", name: "Top exit velo", color: "#22c55e" }]}
            trendKey="top"
          />
        </div>
      )}

      {p && (
        <div>
          <ResearchLineChart
            title="Velocity, Game to Game" unit={`${scopeLabel}, mph`}
            data={pitchGames.map((g) => ({ date: g[0], matchup: g[1], avgFB: g[6], peak: g[8] }))}
            lines={[
              { key: "avgFB", name: "Avg fastball", color: "#b5283a" },
              { key: "peak", name: "Peak fastball", color: "#f59e0b", dashed: true },
            ]}
            height={260}
          />
          <ResearchLineChart
            title="Velocity, Year to Year" unit="mph, all seasons"
            data={yearRows}
            lines={[
              { key: "avgFB", name: "Avg fastball", color: "#b5283a" },
              { key: "peak", name: "Peak", color: "#f59e0b", dashed: true },
            ]}
            height={220}
          />
          <div className="panel">
            <h2>Pitch Repertoire <small>{p.season} season &middot; shape, usage &amp; results{rangeKey && rangeKey !== "all" ? " (full season, not date-filtered)" : ""}</small></h2>
            <table>
              <thead>
                <tr>
                  <th>Pitch</th><th>No.</th><th>Usage</th><th>Avg Velo</th><th>Max Velo</th><th>Spin</th>
                  <th>H-Break</th><th>V-Break</th><th>IVB (est.)</th><th>Ext.</th><th>Whiff %</th><th>CSW %</th>
                </tr>
              </thead>
              <tbody>
                {p.repertoire.map((r) => (
                  <tr key={r.type} style={{ cursor: "default" }}>
                    <td>{r.type}</td>
                    <td>{r.n}</td>
                    <td>{f(r.usage, "%")}</td>
                    <td>{f(r.avgV, "mph")}</td>
                    <td>{f(r.maxV, "mph")}</td>
                    <td>{r.spin != null ? `${r.spin} rpm` : "—"}</td>
                    <td>{f(r.hb, "in")}</td>
                    <td>{f(r.vb, "in")}</td>
                    <td>{f(r.ivbEst, "in")}</td>
                    <td>{f(r.ext, "ft")}</td>
                    <td>{r.swings >= 10 ? f(r.whiffPct, "%") : "—"}</td>
                    <td>{f(r.cswPct, "%")}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <p className="timestamp-note">
        Source: MLB Research tool tracking data, copied as a snapshot &mdash; games only appear where tracking was available.
        {e.hitting ? " Bat speed and exit velocity cover swings and batted balls that were tracked." : ""}
        {p ? " “Fastball” = four-seam, sinker and cutter as classified by the tool. V-Break includes gravity; IVB (est.) adds back an estimated gravity drop, so treat it as approximate. Whiff % = swings and misses per swing (shown for 10+ swings); CSW % = called strikes + whiffs per pitch. Year-to-year velocity leaves out seasons without tracking, and a season's peak is only shown where pitch-level data was pulled for it." : ""}
      </p>
    </div>
  );
}

const MLB_TREND_YEARS = 6; // current season + 5 prior, for the year-over-year charts

function MlbStatsPanel({ athlete, onChanged }) {
  const [idInput, setIdInput] = useState(athlete.mlbamId || "");
  const [loading, setLoading] = useState(false);
  const [loadingNote, setLoadingNote] = useState("");
  const [error, setError] = useState("");
  const resolvedId = extractMlbamId(athlete);
  const stats = athlete.mlbStats;
  const year = new Date().getFullYear();

  const saveId = () => {
    if (!idInput.trim()) return;
    window.AthleteStore.updateAthlete(athlete.id, { mlbamId: idInput.trim() });
    onChanged();
  };

  // Position now fully drives which side of Statcast we fetch/show — safe to do since
  // Position is a directly user-editable dropdown on the roster, not an unreliable synced
  // field. Pitchers get pitching metrics only (fastball velocity, pitch arsenal); Catcher /
  // Infield / Outfield get fielding+hitting metrics only (throwing velocity, exit velocity,
  // sprint speed, bat speed).
  const isPitcher = athlete.position === "Pitcher";

  const refresh = async () => {
    if (!resolvedId) return;
    setLoading(true);
    setError("");
    try {
      const years = [];
      for (let y = year - (MLB_TREND_YEARS - 1); y <= year; y++) years.push(y);

      let batRow = null;
      let armRow = null;
      const sprintSpeedTrend = [];
      const fastballVeloAvgTrend = [];
      const fastballVeloPeakTrend = [];
      let exitVeloAvg = null;
      let exitVeloPeak = null;
      let pitchArsenal = [];

      if (isPitcher) {
        for (const y of years) {
          setLoadingNote(`Fetching ${y} fastball velocity…`);
          const velo = await fetchFastballVelocityForYear(resolvedId, y);
          fastballVeloAvgTrend.push({ year: y, fastballVeloAvg: velo.avg });
          fastballVeloPeakTrend.push({ year: y, fastballVeloPeak: velo.peak });
        }
        setLoadingNote("Fetching pitch arsenal (shape, usage, results)…");
        pitchArsenal = await fetchPitchArsenal(resolvedId, year);
      } else {
        setLoadingNote("Fetching current-season bat speed & arm strength…");
        const [bat, arm] = await Promise.all([
          fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/bat-tracking?year=${year}&csv=true`),
          fetchSavantCsvSafe(`https://baseballsavant.mlb.com/leaderboard/arm-strength?year=${year}&csv=true`),
        ]);
        batRow = findByPlayerId(bat, "id", resolvedId);
        armRow = findByPlayerId(arm, "player_id", resolvedId);

        for (const y of years) {
          setLoadingNote(`Fetching ${y} sprint speed…`);
          sprintSpeedTrend.push({ year: y, sprintSpeed: await fetchSprintSpeedForYear(resolvedId, y) });
        }
        setLoadingNote("Fetching exit velocity…");
        const exitVelo = await fetchExitVelocityForYear(resolvedId, year);
        exitVeloAvg = exitVelo.avg;
        exitVeloPeak = exitVelo.peak;
      }

      const currentSprint = sprintSpeedTrend.find((d) => d.year === year);
      const currentVeloAvg = fastballVeloAvgTrend.find((d) => d.year === year);
      const currentVeloPeak = fastballVeloPeakTrend.find((d) => d.year === year);

      const anyData = isPitcher
        ? fastballVeloAvgTrend.some((d) => d.fastballVeloAvg != null) || pitchArsenal.length > 0
        : batRow || armRow || sprintSpeedTrend.some((d) => d.sprintSpeed != null) || exitVeloAvg != null;
      if (!anyData) {
        setError(
          isPitcher
            ? "No matching Statcast pitching data found for this player ID — they may not have enough qualifying pitches tracked in any of the last few seasons (common for minor leaguers, since Savant mainly covers MLB games), the ID may be incorrect, or their Position may be set to Pitcher when they're actually a position player."
            : "No matching Statcast fielding/hitting data found for this player ID — they may not have enough qualifying plate appearances/throws tracked in any of the last few seasons (common for minor leaguers, since Savant mainly covers MLB games), the ID may be incorrect, or their Position may need to be set to Pitcher if they actually pitch."
        );
      }

      window.AthleteStore.updateAthlete(athlete.id, {
        mlbStats: {
          sprintSpeed: currentSprint ? currentSprint.sprintSpeed : null,
          batSpeed: batRow && batRow.avg_bat_speed ? Number(batRow.avg_bat_speed) : null,
          armStrength: armRow && armRow.arm_overall ? Number(armRow.arm_overall) : null,
          fastballVeloAvg: currentVeloAvg ? currentVeloAvg.fastballVeloAvg : null,
          fastballVeloPeak: currentVeloPeak ? currentVeloPeak.fastballVeloPeak : null,
          exitVeloAvg,
          exitVeloPeak,
          pitchArsenal,
          sprintSpeedTrend,
          fastballVeloAvgTrend,
          fastballVeloPeakTrend,
          fetchedAt: new Date().toISOString(),
          year,
        },
      });
      onChanged();
    } catch (e) {
      setError(
        `Couldn't fetch from Baseball Savant (${e.message}). This is most likely a cross-origin (CORS) restriction on Savant's end blocking the browser request — if this keeps happening, let me know and I'll look into a workaround.`
      );
    } finally {
      setLoading(false);
      setLoadingNote("");
    }
  };

  const fastballYoYData = stats && stats.fastballVeloAvgTrend
    ? stats.fastballVeloAvgTrend.map((d, i) => ({
        date: String(d.year),
        avg: d.fastballVeloAvg,
        peak: stats.fastballVeloPeakTrend && stats.fastballVeloPeakTrend[i] ? stats.fastballVeloPeakTrend[i].fastballVeloPeak : null,
      }))
      // seasons with no data at all are left off the chart entirely rather than plotted as gaps
      .filter((d) => d.avg != null || d.peak != null)
    : [];
  const fastballYoYHasData = fastballYoYData.length > 0;
  const fastballYoYDomain = paddedDomain(fastballYoYData, ["avg", "peak"]);

  const sprintYoYData = stats && stats.sprintSpeedTrend
    ? stats.sprintSpeedTrend
        .map((d) => ({ date: String(d.year), sprintSpeed: d.sprintSpeed }))
        .filter((d) => d.sprintSpeed != null)
    : [];

  return (
    <div className="panel">
      <h2>
        MLB Statcast <small>Baseball Savant &middot; {year} season, plus {MLB_TREND_YEARS}-year trends</small>
      </h2>
      {!resolvedId ? (
        <div>
          <div className="empty-state">
            No MLB player ID linked for this athlete yet. If they already have a photo pulled from MLB/MiLB, their ID
            may already be usable once you save it below — otherwise find their numeric MLBAM ID from their
            mlb.com/milb.com player page URL (e.g. mlb.com/player/name-<strong>669713</strong>).
          </div>
          <div className="form-row" style={{ marginTop: 10 }}>
            <div className="field">
              <label>MLB Player ID (MLBAM)</label>
              <input value={idInput} onChange={(e) => setIdInput(e.target.value)} placeholder="e.g. 669713" style={{ maxWidth: 160 }} />
            </div>
          </div>
          <button className="btn btn-secondary" disabled={!idInput.trim()} onClick={saveId}>Save ID</button>
        </div>
      ) : (
        <div>
          <p className="timestamp-note">
            Resolved MLBAM ID: <strong>{resolvedId}</strong> — if this looks wrong, correct it via the field below and Refresh.
            {" "}
            <span className="no-print">
              <a href={`https://baseballsavant.mlb.com/savant-player/${resolvedId}`} target="_blank" rel="noopener noreferrer">Baseball Savant profile</a>
              {" · "}
              <a href={`https://www.mlb.com/player/${resolvedId}`} target="_blank" rel="noopener noreferrer">MLB.com profile</a>
            </span>
          </p>
          <div className="form-row">
            <div className="field">
              <label>MLB Player ID (MLBAM)</label>
              <input value={idInput} onChange={(e) => setIdInput(e.target.value)} placeholder="e.g. 669713" style={{ maxWidth: 160 }} />
            </div>
            <button className="btn btn-secondary" disabled={!idInput.trim() || idInput.trim() === resolvedId} onClick={saveId} style={{ alignSelf: "flex-end" }}>
              Save ID
            </button>
          </div>
          {error && (
            <div className="success-banner" style={{ background: "#3a1414", color: "var(--danger)", borderColor: "#5a1f1f" }}>
              {error}
            </div>
          )}
          <div className="location-kpi-row">
            {isPitcher ? (
              <>
                <KpiCard label="Fastball Velo (Avg)" value={stats && stats.fastballVeloAvg != null ? `${fmt2(stats.fastballVeloAvg)} mph` : "—"} />
                <KpiCard label="Fastball Velo (Peak)" value={stats && stats.fastballVeloPeak != null ? `${fmt2(stats.fastballVeloPeak)} mph` : "—"} />
              </>
            ) : (
              <>
                <KpiCard label="Sprint Speed" value={stats && stats.sprintSpeed != null ? `${fmt2(stats.sprintSpeed)} ft/s` : "—"} />
                <KpiCard label="Bat Speed" value={stats && stats.batSpeed != null ? `${fmt2(stats.batSpeed)} mph` : "—"} />
                <KpiCard label="Throwing Velocity" value={stats && stats.armStrength != null ? `${fmt2(stats.armStrength)} mph` : "—"} />
                <KpiCard label="Exit Velo (Avg)" value={stats && stats.exitVeloAvg != null ? `${fmt2(stats.exitVeloAvg)} mph` : "—"} />
                <KpiCard label="Exit Velo (Peak)" value={stats && stats.exitVeloPeak != null ? `${fmt2(stats.exitVeloPeak)} mph` : "—"} />
              </>
            )}
          </div>
          <p style={{ fontSize: 11, color: "var(--text-dim)", marginTop: 8 }}>
            {isPitcher
              ? "Position is set to Pitcher — Refresh pulls fastball velocity and full pitch arsenal only."
              : "Position is set to " + (athlete.position || "Unassigned") + " — Refresh pulls throwing velocity, exit velocity, sprint speed, and bat speed only. Change Position to Pitcher above if this player actually pitches."}
          </p>
          <button className="btn btn-primary" disabled={loading} onClick={refresh} style={{ marginTop: 14 }}>
            {loading ? "Fetching…" : "Refresh from Baseball Savant"}
          </button>
          {loading && loadingNote && <p className="timestamp-note">{loadingNote}</p>}
          {!loading && stats && stats.fetchedAt && (
            <p className="timestamp-note">Last refreshed {new Date(stats.fetchedAt).toLocaleString()} &middot; {stats.year} season snapshot</p>
          )}

          {fastballYoYHasData && (
            <div className="panel" style={{ marginTop: 14 }}>
              <h2>Fastball Velocity <small>Year over year — average &amp; peak</small></h2>
              <ResponsiveContainer width="100%" height={200}>
                <LineChart data={fastballYoYData}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#2a2a2a" />
                  <XAxis dataKey="date" stroke="#9a9a9a" fontSize={11} />
                  <YAxis stroke="#9a9a9a" fontSize={11} domain={fastballYoYDomain} />
                  <Tooltip contentStyle={{ background: "#141414", border: "1px solid #3a3a3a" }} />
                  <Legend />
                  <Line type="monotone" dataKey="avg" name="Avg (mph)" stroke="#b5283a" strokeWidth={2} dot={{ r: 3 }} connectNulls />
                  <Line type="monotone" dataKey="peak" name="Peak (mph)" stroke="#f59e0b" strokeWidth={2} dot={{ r: 3 }} connectNulls />
                </LineChart>
              </ResponsiveContainer>
            </div>
          )}

          {stats && stats.pitchArsenal && stats.pitchArsenal.length > 0 && (
            <div className="panel" style={{ marginTop: 14 }}>
              <h2>Pitch Arsenal <small>{stats.year} season &middot; shape, usage &amp; results</small></h2>
              <table>
                <thead>
                  <tr>
                    <th>Pitch</th>
                    <th>Usage</th>
                    <th>Velo</th>
                    <th>Induced Vert. Break</th>
                    <th>Horizontal Break</th>
                    <th>Whiff %</th>
                    <th>Hard Hit %</th>
                    <th>Run Value/100</th>
                  </tr>
                </thead>
                <tbody>
                  {stats.pitchArsenal.map((p, i) => (
                    <tr key={i} style={{ cursor: "default" }}>
                      <td>{p.pitchName || p.pitchType || "—"}</td>
                      <td>{p.usagePct != null ? `${fmt2(p.usagePct)}%` : "—"}</td>
                      <td>{p.avgVelo != null ? `${fmt2(p.avgVelo)} mph` : "—"}</td>
                      <td>{p.inducedVertBreak != null ? `${fmt2(p.inducedVertBreak)} in` : "—"}</td>
                      <td>{p.horizBreak != null ? `${fmt2(p.horizBreak)} in` : "—"}</td>
                      <td>{p.whiffPct != null ? `${fmt2(p.whiffPct)}%` : "—"}</td>
                      <td>{p.hardHitPct != null ? `${fmt2(p.hardHitPct)}%` : "—"}</td>
                      <td>{p.runValuePer100 != null ? fmt2(p.runValuePer100) : "—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {sprintYoYData.length > 0 && (
            <div style={{ marginTop: 14 }}>
              <MiniTrendChart title="Sprint Speed" unit="ft/s, year over year" data={sprintYoYData} dataKey="sprintSpeed" showTrend={false} />
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function PlayerPlanPanel({ athleteId }) {
  const plans = window.AthleteStore.getPlayerPlans(athleteId);
  if (!plans.length) {
    return (
      <div className="panel">
        <h2>Player Plan</h2>
        <div className="empty-state">No player plan synced for this athlete yet.</div>
      </div>
    );
  }
  return (
    <div className="panel">
      <h2>Player Plan</h2>
      <table>
        <thead>
          <tr>
            <th>Focus Area</th>
            <th>Goal</th>
            <th>Target Date</th>
            <th>Status</th>
            <th>Coach</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>
          {plans.map((p, i) => (
            <tr key={i} style={{ cursor: "default" }}>
              <td>{p.focusArea || "—"}</td>
              <td>{p.goal || "—"}</td>
              <td>{p.targetDate || "—"}</td>
              <td><Badge tone={planStatusTone(p.status)}>{p.status || "No Status"}</Badge></td>
              <td>{p.coach || "—"}</td>
              <td>{p.notes || "—"}</td>
            </tr>
          ))}
        </tbody>
      </table>

      {plans.some((p) => p.extra && Object.keys(p.extra).length) && (
        <div style={{ marginTop: 16 }}>
          <h2 style={{ fontSize: 13 }}>Additional Plan Data</h2>
          {plans.map((p, i) =>
            p.extra && Object.keys(p.extra).length ? (
              <table key={i} style={{ marginBottom: 12 }}>
                <thead>
                  <tr>
                    {Object.keys(p.extra).map((label) => <th key={label}>{label}</th>)}
                  </tr>
                </thead>
                <tbody>
                  <tr style={{ cursor: "default" }}>
                    {Object.values(p.extra).map((val, vi) => <td key={vi}>{val}</td>)}
                  </tr>
                </tbody>
              </table>
            ) : null
          )}
        </div>
      )}
    </div>
  );
}

// Reads ?athlete=<id>&tab=<tabKey> from the URL, once, for deep-linking straight to a specific
// athlete's tab — used by the "Email to Athlete" PDF rendering (a headless page load navigates
// here directly instead of clicking through Team Overview → search → profile → tab) and doubles
// as a shareable link for a coach's own use.
function readDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const athlete = Number(params.get("athlete"));
  const tab = params.get("tab") || "";
  return Number.isFinite(athlete) && athlete > 0 ? { athlete, tab } : null;
}

function App({ userEmail, onLogout }) {
  const deepLink = useMemo(() => readDeepLink(), []);
  const [view, setView] = useState(deepLink ? "athlete" : "team");
  const [selectedId, setSelectedId] = useState(deepLink ? deepLink.athlete : null);
  const [positionFilter, setPositionFilter] = useState("All");
  const [statusFilter, setStatusFilter] = useState("Active");
  const [leagueFilter, setLeagueFilter] = useState("All");
  const [locationFilter, setLocationFilter] = useState("All");
  const [search, setSearch] = useState("");
  const [rangeDays, setRangeDays] = useState(30);
  const [dataVersion, setDataVersion] = useState(0);

  const bumpVersion = () => setDataVersion((v) => v + 1);

  const goHome = () => {
    setView("team");
    setSelectedId(null);
  };

  const goImport = () => setView("import");
  const goTeamReport = () => setView("teamreport");
  const goPlayers = () => setView("players");
  const goNews = () => setView("news");

  // Which tab the profile opens on: normally Overview, or the Player Plan tab when arriving from an
  // "Edit plan" link on the team report (or whatever tab a deep link asked for).
  const [profileTab, setProfileTab] = useState(deepLink ? deepLink.tab : "");
  // Opening a different page or athlete should land at the top, not wherever the list was scrolled to.
  React.useEffect(() => { window.scrollTo(0, 0); }, [view, selectedId]);
  const editPeriodization = (id) => {
    setSelectedId(id);
    setProfileTab("plan");
    setView("athlete");
  };

  const selectAthlete = (id) => {
    setSelectedId(id);
    setProfileTab("");
    setView("athlete");
  };

  // Roster-row badge/ticker links (performance ticker, assessment flag) jump straight to that
  // athlete's tab instead of just the overview.
  const openAthleteTab = (id, tab) => {
    setSelectedId(id);
    setProfileTab(tab);
    setView("athlete");
  };

  return (
    <div className="app">
      <TopBar
        view={view}
        onHome={goHome}
        onGoTeamReport={goTeamReport}
        onGoPlayers={goPlayers}
        onGoNews={goNews}
        userEmail={userEmail}
        onLogout={onLogout}
      />
      <div className="main">
        {view === "team" && (
          <TeamOverview
            positionFilter={positionFilter}
            statusFilter={statusFilter}
            leagueFilter={leagueFilter}
            locationFilter={locationFilter}
            setLocationFilter={setLocationFilter}
            search={search}
            rangeDays={rangeDays}
            onSelect={selectAthlete}
            onOpenTab={openAthleteTab}
            dataVersion={dataVersion}
            onDataChange={bumpVersion}
            filterControls={
              <FilterControls
                positionFilter={positionFilter}
                setPositionFilter={setPositionFilter}
                statusFilter={statusFilter}
                setStatusFilter={setStatusFilter}
                leagueFilter={leagueFilter}
                setLeagueFilter={setLeagueFilter}
                locationFilter={locationFilter}
                setLocationFilter={setLocationFilter}
                search={search}
                setSearch={setSearch}
                rangeDays={rangeDays}
                setRangeDays={setRangeDays}
              />
            }
          />
        )}
        {view === "athlete" && (
          <AthleteDetail
            athleteId={selectedId}
            rangeDays={rangeDays}
            onBack={goHome}
            dataVersion={dataVersion}
            onDataChange={bumpVersion}
            initialTab={profileTab}
          />
        )}
        {view === "teamreport" && <TeamReportPage onSelect={selectAthlete} dataVersion={dataVersion} onEditPeriodization={editPeriodization} />}
        {view === "players" && <PlayerProfilesPage onSelect={selectAthlete} dataVersion={dataVersion} />}
        {view === "news" && (window.NewsPage
          ? <window.NewsPage dataVersion={dataVersion} />
          : <div className="panel"><div className="empty-state">The In the News page didn't load — make sure news.js is next to index.html and that you're opening the dashboard through start-dashboard.bat (localhost).</div></div>)}
        {view === "import" && <ImportPage onImported={bumpVersion} onSelect={selectAthlete} />}
      </div>
      <div className="footer-note">
        Roster is built from Player Plan syncs, imports, and manual adds &middot; force plate &amp; body comp data comes from your imports
      </div>
      <BottomMenu view={view} onGoImport={goImport} />
    </div>
  );
}

// ---- Sign-in gate: nothing in the dashboard renders until someone's logged in and the roster
// has finished loading from Supabase (every read AthleteStore does is synchronous, so `state`
// needs real data in it *before* <App/> mounts, not streamed in after). ----
function LoadingGate({ message }) {
  return (
    <div style={{ padding: 60, textAlign: "center", color: "var(--text-dim)" }}>
      <img src="assets/dst-logo-light.png" alt="" style={{ height: 40, marginBottom: 18, opacity: 0.85 }} />
      <div>{message}</div>
    </div>
  );
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    setError("");
    const { error } = await window.supabaseClient.auth.signInWithPassword({ email: email.trim(), password });
    setBusy(false);
    if (error) setError(error.message || "Sign-in failed.");
    // On success, the onAuthStateChange listener in Root picks it up and swaps to the dashboard.
  };

  return (
    <div className="login-screen">
      <form className="login-card" onSubmit={submit}>
        <img className="brand-logo" src="assets/dst-logo-light.png" alt="Dynamic Sports Training" />
        <h1>Professional Baseball Dashboard</h1>
        <p className="login-sub">Sign in with the account your admin created for you.</p>
        <div className="field">
          <label>Email</label>
          <input type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} required />
        </div>
        <div className="field">
          <label>Password</label>
          <input type="password" autoComplete="current-password" value={password} onChange={(e) => setPassword(e.target.value)} required />
        </div>
        {error && <div className="login-error">{error}</div>}
        <button className="btn btn-primary" type="submit" disabled={busy} style={{ width: "100%" }}>
          {busy ? "Signing in…" : "Sign In"}
        </button>
        <p className="login-note">Don't have a login yet? Ask whoever manages this dashboard to add you in Supabase (Authentication &rarr; Users).</p>
      </form>
    </div>
  );
}

function Root() {
  const [status, setStatus] = useState("loading"); // loading | signedOut | ready
  const [session, setSession] = useState(null);

  React.useEffect(() => {
    let mounted = true;
    const enterWithSession = async (s) => {
      window.AthleteStore.setCurrentUser({ id: s.user.id, email: s.user.email });
      await window.AthleteStore.initFromSupabase();
      if (!mounted) return;
      setSession(s);
      setStatus("ready");
    };
    window.supabaseClient.auth.getSession().then(({ data }) => {
      if (!mounted) return;
      if (data.session) enterWithSession(data.session);
      else setStatus("signedOut");
    });
    const { data: listener } = window.supabaseClient.auth.onAuthStateChange((event, s) => {
      if (!mounted) return;
      if (event === "SIGNED_IN" && s) enterWithSession(s);
      else if (event === "SIGNED_OUT") { setSession(null); setStatus("signedOut"); }
    });
    return () => { mounted = false; listener.subscription.unsubscribe(); };
  }, []);

  if (status === "loading") return <LoadingGate message="Loading…" />;
  if (status === "signedOut") return <LoginScreen />;
  return <App userEmail={session.user.email} onLogout={() => window.supabaseClient.auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
