          Hawkin MLB: {profile.groupLabel} · VALD 2025 MLB: {profile.valdGroupLabel || "no matching group"}
        </span>
      </div>

      <div className="profile-layout" style={planView ? { gridTemplateColumns: "1fr" } : undefined}>
        {!planView && (
          <div className="profile-radar">
            <ResponsiveContainer width="100%" height={320}>
              <RadarChart data={radarData} outerRadius="58%" margin={{ top: 16, right: 36, bottom: 16, left: 36 }}>
                <PolarGrid stroke={theme === "light" ? "#dddddd" : "#2e2e2e"} />
                <PolarAngleAxis dataKey="metric" tick={{ fill: theme === "light" ? "#444" : "#bbb", fontSize: 10 }} />
                <PolarRadiusAxis domain={[0, 100]} tickCount={5} tick={{ fill: theme === "light" ? "#777" : "#666", fontSize: 9 }} axisLine={false} />
                <Radar name="MLB median" dataKey="median" stroke="#6b7280" strokeDasharray="4 3" fill="none" isAnimationActive={false} />
                <Radar name="Percentile" dataKey="pct" stroke={chartLineColor} fill={chartLineColor} fillOpacity={0.35} isAnimationActive={false} />
                <Tooltip contentStyle={theme === "light" ? { background: "#ffffff", border: "1px solid #c7cbd1", color: "#1a1a1a" } : { background: "#141414", border: "1px solid #3a3a3a" }} formatter={(v, n) => [n === "Percentile" ? ordinal(v) : "50th", n]} />
              </RadarChart>
            </ResponsiveContainer>
            <p className="timestamp-note" style={{ textAlign: "center" }}>Hawkin MLB percentile by metric · dashed ring = MLB median</p>
          </div>
        )}

        <div className="profile-table">
          <div className="profile-row profile-head">
            <span>Metric</span><span>Athlete</span><span>MLB Percentile</span>
            <span>
              Offseason Trend
              {trendPoints && <small> {trendPoints[0].offseason}{trendPoints.length > 1 ? `–${trendPoints[trendPoints.length - 1].offseason}` : ""}</small>}
            </span>
          </div>
          {bodyMassRow && bodyMassRow.value !== null && hasNorm(combinedPercentile(bodyMassRow)) && (() => {
            const c = combinedPercentile(bodyMassRow);
            const spark = offseasonSpark(trendPoints, "bodyMassKg");
            return (
              <div className="profile-row">
                <span className="profile-metric" title="Context, not a performance output — shown first since it shapes how to read every other row.">{bodyMassRow.label}</span>
                <span className="profile-value">{formatProfileValue(bodyMassRow)}</span>
                <NormBar pct={c.pct} title={c.title} zoned />
                {spark ? <TrendSpark points={spark} width={56} height={24} domain={[0, 100]} describe={describePercentilePoint} /> : <span />}
              </div>
            );
          })()}
          {hawkinRows.map((r) => {
            const c = combinedPercentile(r);
            const spark = offseasonSpark(trendPoints, r.key);
            return (
              <div key={r.key} className="profile-row">
                <span className="profile-metric">{r.label}{r.lowerIsBetter ? <em> (lower is better)</em> : null}</span>
                <span className="profile-value">{formatProfileValue(r)}</span>
                {c.type === "range"
                  ? <NormRangeBar lo={c.lo} hi={c.hi} title={`Hawkin: ${pctLabel(r.hawkinPct)} · VALD: ${pctLabel(r.valdPct)}`} />
                  : <NormBar pct={c.pct} title={c.title} zoned />}
                {spark ? <TrendSpark points={spark} width={56} height={24} domain={[0, 100]} describe={describePercentilePoint} /> : <span />}
              </div>
            );
          })}
          {!compact && (
            <div className="profile-legend">
              {Object.entries(BAND_COLORS).map(([k, c]) => <span key={k}><i style={{ background: c }} />{k}</span>)}
              <span className="timestamp-note">Jump Height and Relative Peak Power show the Hawkin–VALD span when both have a norm, rather than averaging two differently-built MLB samples into one number.</span>
            </div>
          )}
          {!compact && trendPoints && (
            <p className="timestamp-note">
              Offseason trend: one point per Sep 1 – May 31 offseason (in-season Jun–Aug CMJs aren't included), scored against
              the same {profile.groupLabel} norms as the bar — only as far back as this athlete has tracked data. A gap means no
              CMJ that offseason, not zero.
            </p>
          )}
        </div>
      </div>

      {!planView && (
        <React.Fragment>
          <h2 style={{ marginTop: 18 }}>Profile Summary &amp; Recommendations</h2>
          <ul className="profile-recs">
            {recs.map((r, i) => <li key={i} style={{ borderLeftColor: PROFILE_TONE[r.tone] }}>{r.text}</li>)}
          </ul>
          <p className="timestamp-note">
            Norms: Hawkin Dynamics MLB normative data (CMJ hands on hips) and VALD's 2025 MLB ForceDecks report. Profile averages every
            hands-on-hips CMJ in the {N.PROFILE_WINDOW_DAYS} days up to the latest one{profile.excludedVariants ? `; ${profile.excludedVariants} arm-swing/weighted/other CMJ variants are left out` : ""}.
          </p>
        </React.Fragment>
      )}
    </div>
  );
}

function ForcePlatePanel({ athleteId, range, onChanged }) {
  const { grid, axis } = useChartColors();
  const theme = useTheme();
  // a bad test (two people on the plates, a stumble) can be taken out from the table, and put back from the
  // Removed tests list under it (AthleteStore.removeForceTest)
  const [removed, setRemoved] = useState(null);
  const [ftBusy, setFtBusy] = useState(false);
  const [ftMsg, setFtMsg] = useState("");
  const loadRemoved = () => window.AthleteStore.getRemovedForceTests(athleteId).then(setRemoved, () => setRemoved([]));
  React.useEffect(() => { setRemoved(null); setFtMsg(""); loadRemoved(); }, [athleteId]); // eslint-disable-line
  const ftDay = (k) => { const d = new Date(`${k}T00:00:00`); return `${d.getMonth() + 1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}`; };
  const ftLine = (t) => [typeof t.systemWeight === "number" ? `${fmt2(t.systemWeight / N_TO_LBF)} lb` : null, t.jumpHeight != null ? `jump ${fmt2(t.jumpHeight)} in` : "no jump height"].filter(Boolean).join(", ");
  const removeTest = async (t) => {
    const ok = await window.askConfirm({ title: `Remove the ${ftDay(t.date)} test?`, text: `${ftLine(t)}. It comes off the graphs, the trends and the athlete's app, and the Hawkin sync won't bring it back. It's kept under Removed tests below the table, where you can put it back.`, ok: "Remove", danger: true });
    if (!ok) return;
    setFtBusy(true); setFtMsg("");
    try {
      const done = await window.AthleteStore.removeForceTest(t, window.AthleteStore.currentUserEmail());
      setFtMsg(done ? `Removed the ${ftDay(t.date)} test.` : "Couldn't find that test's saved copy. Reload the page and try again.");
      if (done) { await loadRemoved(); if (onChanged) onChanged(); }
    } catch (e) { setFtMsg("Couldn't remove it. Check your connection and try again."); }
    setFtBusy(false);
  };
  const restoreTest = async (r) => {
    setFtBusy(true); setFtMsg("");
    try {
      const done = await window.AthleteStore.restoreForceTest(r.rowId);
      setFtMsg(done ? `Put back the ${ftDay(r.date)} test.` : "That test was already put back.");
      await loadRemoved(); if (onChanged) onChanged();
    } catch (e) { setFtMsg("Couldn't put it back. Check your connection and try again."); }
    setFtBusy(false);
  };
  const removedList = (
    <React.Fragment>
      {ftMsg && <p className="timestamp-note no-print" role="status" style={{ marginTop: 10 }}>{ftMsg}</p>}
      {removed && removed.length > 0 && (
        <details className="ft-removed no-print">
          <summary>Removed tests ({removed.length})</summary>
          {removed.map((r) => (
            <div key={r.rowId} className="ft-removed-row">
              <span>{ftDay(r.date)} · {ftLine(r.record || {})} <small>removed {ftDay(String(r.removedAt).slice(0, 10))}{r.by ? ` by ${r.by}` : ""}</small></span>
              <button className="btn btn-secondary" disabled={ftBusy} onClick={() => restoreTest(r)}>Put back</button>
            </div>
          ))}
        </details>
      )}
    </React.Fragment>
  );
  const tooltipStyle = theme === "light" ? { background: "#ffffff", border: "1px solid #c7cbd1", color: "#1a1a1a" } : { background: "#141414", border: "1px solid #3a3a3a" };
  const refLineColor = theme === "light" ? "#555555" : "#fff";
  const chartLineColor = isCubsOnlyAthlete(getPeople().find((a) => a.id === athleteId)) ? CUBS_CHART_COLOR : DST_CHART_COLOR;
  const allTests = window.AthleteStore.getForceTests(athleteId);
  const tests = oneTestPerDay(allTests.filter((t) => dateInRange(t.date, range)));
  if (!allTests.length) {
    return (
      <div className="panel">
        <h2>Countermovement Jump <small>Hawkin Dynamics</small></h2>
        <div className="empty-state">
          No force plate tests on file for this athlete yet. Sync or import them from Hawkin Dynamics on the
          Import page (bottom bar).
        </div>
        {removedList}
      </div>
    );
  }
  if (!tests.length) {
    return (
      <div className="panel">
        <h2>Countermovement Jump <small>Hawkin Dynamics</small></h2>
        <div className="empty-state">
          No force plate tests in this date range ({allTests.length} on file overall) — try a longer range.
        </div>
        {removedList}
      </div>
    );
  }

  const testDates = tests.map((t) => t.date);
  const showYear = spansMultipleYears(testDates);
  const yearLines = yearStartTimestamps(testDates);
  const axisProps = { dataKey: "date", type: "number", domain: ["dataMin", "dataMax"], scale: "time", tickFormatter: (ts) => axisDateLabel(ts, showYear) };
  const tooltipLabelFormatter = (ts) => axisDateLabel(ts, true);

  const chartDataBase = tests.map((t) => ({
    date: localDateMs(t.date),
    jumpHeight: t.jumpHeight ?? null,
  }));
  const jumpTrend = computeLinearTrend(chartDataBase, "jumpHeight");
  const chartData = chartDataBase.map((d, i) => ({ ...d, jumpTrend: jumpTrend[i] }));
  const jumpDomain = paddedDomain(chartData, ["jumpHeight", "jumpTrend"]);
  const latest = tests[tests.length - 1];

  const kpiChartData = tests.map((t) => {
    const point = { date: localDateMs(t.date) };
    FORCE_KPI_METRICS.forEach((m) => { point[m.key] = m.getValue(t); });
    return point;
  });

  return (
    <div className="panel">
      <h2>
        Countermovement Jump <small>Hawkin Dynamics &middot; {tests.length} test{tests.length === 1 ? "" : "s"} on file</small>
      </h2>
      <CmjSummary tests={tests} athleteId={athleteId} />
      <div className="metric-strip" style={{ gridTemplateColumns: "repeat(2, 1fr)" }}>
        <KpiCard label="Latest Jump Height" value={latest.jumpHeight != null ? `${fmt2(latest.jumpHeight)} in` : "—"} />
        <KpiCard label="Latest RSI-Modified" value={latest.rsiModified != null ? fmt2(latest.rsiModified) : "—"} />
      </div>
      <ResponsiveContainer width="100%" height={160}>
        <LineChart data={chartData}>
          <CartesianGrid strokeDasharray="3 3" stroke={grid} />
          <XAxis {...axisProps} stroke={axis} fontSize={12} />
          <YAxis yAxisId="jump" stroke={axis} fontSize={12} domain={jumpDomain} />
          <Tooltip contentStyle={tooltipStyle} labelFormatter={tooltipLabelFormatter} />
          <Legend />
          <Line yAxisId="jump" type="monotone" dataKey="jumpHeight" name="Jump Height (in)" stroke={chartLineColor} strokeWidth={2} dot={{ r: 3 }} connectNulls />
          <Line yAxisId="jump" type="monotone" dataKey="jumpTrend" name="Jump Height Trend" stroke="#f59e0b" strokeWidth={2} strokeDasharray="6 3" dot={false} connectNulls />
          {yearLines.map((ts) => <ReferenceLine key={ts} yAxisId="jump" x={ts} stroke={refLineColor} strokeOpacity={0.5} />)}
        </LineChart>
      </ResponsiveContainer>

      <h2 style={{ marginTop: 18 }}>Individual KPI Trends</h2>
      <div className="kpi-trend-grid">
        {FORCE_KPI_METRICS.map((m) => (
          <MiniTrendChart key={m.key} title={m.label} unit={m.unit} data={kpiChartData} dataKey={m.key} yearLines={yearLines} showCounts color={chartLineColor} />
        ))}
      </div>

      <table className="no-print" style={{ marginTop: 14 }}>
        <thead>
          <tr>
            <th>Date</th>
            <th>Test Type</th>
            <th>Body Weight (lbs)</th>
            <th>Jump Height</th>
            <th>Jump Momentum</th>
            <th>mRSI</th>
            <th>Peak Power</th>
            <th>Relative Peak Power</th>
            <th>Takeoff Velocity</th>
            <th>Total Impulse</th>
            <th>Braking RFD</th>
            <th>Concentric Impulse</th>
            <th aria-label="Remove"></th>
          </tr>
        </thead>
        <tbody>
          {[...tests].reverse().map((t, i) => (
            <tr key={i} style={{ cursor: "default" }}>
              <td>{shortDate(t.date)}</td>
              <td>{t.testType || "—"}</td>
              <td>{typeof t.systemWeight === "number" ? fmt2(t.systemWeight / N_TO_LBF) : "—"}</td>
              <td>{fmt2(t.jumpHeight) ?? "—"}</td>
              <td>{jumpMomentumOf(t) ?? "—"}</td>
              <td>{fmt2(t.rsiModified) ?? "—"}</td>
              <td>{fmt2(t.peakPower) ?? "—"}</td>
              <td>{fmt2(t.relativePeakPower) ?? "—"}</td>
              <td>{fmt2(t.takeoffVelocity) ?? "—"}</td>
              <td>{fmt2(t.totalImpulse) ?? "—"}</td>
              <td>{fmt2(t.brakingRfd) ?? "—"}</td>
              <td>{fmt2(t.concentricImpulse) ?? "—"}</td>
              <td><button className="ft-x" title="Remove this test (bad data)" aria-label={`Remove the ${shortDate(t.date)} test`} disabled={ftBusy} onClick={() => removeTest(t)}>✕</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      {removedList}
    </div>
  );
}

// An athlete's Evolt scans, oldest first. Evolt scans are in pounds (evolt_import.js); anything entered in
// kilograms before that is shown in pounds too.
function bodyCompScansLb(athleteId) {
  const lb = (s, lbKey, kgKey) => (s[lbKey] != null ? s[lbKey] : s[kgKey] != null ? Math.round(s[kgKey] * 2.20462 * 10) / 10 : null);
  return window.AthleteStore.getBodyComp(athleteId).map((s) => ({ ...s, weightLb: lb(s, "weightLb", "weightKg"), smmLb: lb(s, "smmLb", "skeletalMuscleKg") }));
}

// The Body Composition tab's chart: the Evolt scans, the manual body comp sheets (bodycomp_sheet.js), or both on
// one chart. Together only draws the two on the same axes; each stays its own record, Evolt scans in body_comp
// and sheets in assessments. Which source and figure were last shown is remembered on this device.
const BODYCOMP_METRICS = [
  { key: "pctFat", label: "Body fat", unit: "%", evolt: (s) => s.bodyFatPct, sheet: (m) => m.pctFat },
  { key: "weight", label: "Weight", unit: "lb", evolt: (s) => s.weightLb, sheet: (m) => m.weightLb },
  { key: "lean", label: "Lean mass", unit: "lb", evolt: (s) => s.lbmLb, sheet: (m) => m.leanLb },
  { key: "fat", label: "Fat mass", unit: "lb", evolt: (s) => s.bodyFatLb, sheet: (m) => m.fatLb },
  { key: "muscle", label: "Muscle", unit: "lb", evolt: (s) => s.smmLb, sheet: (m) => m.muscleLb },
];
const BODYCOMP_SOURCES = { evolt: "Evolt", sheet: "Manual sheet", both: "Together" };
const BODYCOMP_RANGES = [
  { key: "90d", label: "90 days", days: 90 },
  { key: "6m", label: "6 months", days: 183 },
  { key: "1y", label: "1 year", days: 365 },
  { key: "all", label: "All time", days: 0 },
];
const BODYCOMP_SHEET_COLOR = "#f59e0b";
const BODYCOMP_WEIGH_COLOR = "#3b82f6";
function BodyCompTrends({ athleteId }) {
  const { grid, axis } = useChartColors();
  const theme = useTheme();
  const tooltipStyle = theme === "light" ? { background: "#ffffff", border: "1px solid #c7cbd1", color: "#1a1a1a" } : { background: "#141414", border: "1px solid #3a3a3a" };
  const evoltColor = isCubsOnlyAthlete(getPeople().find((a) => a.id === athleteId)) ? CUBS_CHART_COLOR : DST_CHART_COLOR;
  const [, redraw] = useState(0);
  React.useEffect(() => { // a sheet saved or deleted below
    const f = () => redraw((x) => x + 1);
    window.addEventListener("dst-bodycomp-changed", f);
    return () => window.removeEventListener("dst-bodycomp-changed", f);
  }, []);
  const [view, setViewState] = useState(() => { try { return JSON.parse(localStorage.getItem("bodyCompView") || "{}") || {}; } catch (e) { return {}; } });
  const setView = (patch) => {
    const next = { ...view, ...patch };
    setViewState(next);
    try { localStorage.setItem("bodyCompView", JSON.stringify(next)); } catch (e) { /* private window: not remembered */ }
  };

  const scans = bodyCompScansLb(athleteId);
  const sheets = window.AthleteStore.getBodyCompSheets(athleteId).filter((s) => s.date && s.summary);
  // the pre-lift weigh-ins the athlete (or a coach) logs on the phone's Program page, drawn with Weight
  const weighs = window.AthleteStore.bodyweightLog ? window.AthleteStore.bodyweightLog(athleteId) : [];
  if (!scans.length && !sheets.length && !weighs.length) return null;
  const has = { evolt: scans.length > 0, sheet: sheets.length > 0 };
  const source = has.evolt && has.sheet ? (BODYCOMP_SOURCES[view.source] ? view.source : "evolt") : has.evolt ? "evolt" : "sheet";
  const metrics = has.evolt || has.sheet ? BODYCOMP_METRICS : BODYCOMP_METRICS.filter((m) => m.key === "weight"); // weigh-ins alone: just Weight
  const metric = metrics.find((m) => m.key === view.metric) || metrics[0];
  const num = (v) => (typeof v === "number" && isFinite(v) ? Math.round(v * 10) / 10 : null);
  const at = (date, time) => new Date(`${date}T${time || "12:00"}:00`).getTime();
  const rows = [];
  if (source !== "sheet") scans.forEach((s) => { const v = num(metric.evolt(s)); if (v != null) rows.push({ t: at(s.date, s.time), evolt: v }); });
  if (source !== "evolt") sheets.forEach((s) => { const v = num(metric.sheet(s.summary)); if (v != null) rows.push({ t: at(s.date), sheet: v }); });
  const withWeighs = metric.key === "weight" && weighs.length > 0;
  if (withWeighs) weighs.forEach((w) => rows.push({ t: at(w.date), weigh: num(w.lb) }));
  rows.sort((a, b) => a.t - b.t);
  // the time window, counted back from today
  const range = BODYCOMP_RANGES.find((r) => r.key === view.range) || BODYCOMP_RANGES[BODYCOMP_RANGES.length - 1];
  if (range.days) {
    const from = Date.now() - range.days * 86400000;
    while (rows.length && rows[0].t < from) rows.shift();
  }
  // Together: every measurement, Evolt or sheet, as one series in date order (just for the graph)
  const both = source === "both";
  if (both) rows.forEach((r) => { r.all = r.evolt != null ? r.evolt : r.sheet; });
  // a straight-line trend, spaced by date: through the one source, or through every point together (weigh-ins alone:
  // through them)
  const along = both ? "all" : has.evolt || has.sheet ? source : "weigh";
  const fit = rows.filter((r) => r[along] != null);
  if (fit.length >= 2) {
    const mx = fit.reduce((n, r) => n + r.t, 0) / fit.length, my = fit.reduce((n, r) => n + r[along], 0) / fit.length;
    const den = fit.reduce((n, r) => n + (r.t - mx) ** 2, 0);
    const slope = den ? fit.reduce((n, r) => n + (r.t - mx) * (r[along] - my), 0) / den : 0;
    rows.forEach((r) => { r.trend = Math.round((my + slope * (r.t - mx)) * 10) / 10; });
  }
  const day = (ms) => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}`; };
  const counts = [has.evolt && `${scans.length} Evolt scan${scans.length === 1 ? "" : "s"}`, has.sheet && `${sheets.length} manual sheet${sheets.length === 1 ? "" : "s"}`, weighs.length > 0 && `${weighs.length} weigh-in${weighs.length === 1 ? "" : "s"}`].filter(Boolean).join(" · ");
  // the weigh-ins in brief: the latest, this week's average, and the change from the week before
  const weighText = (() => {
    if (!weighs.length) return "";
    const z = weighs[weighs.length - 1], dayMs = 86400000, end = at(z.date);
    const avg = (list) => (list.length ? Math.round((list.reduce((n, w) => n + w.lb, 0) / list.length) * 10) / 10 : null);
    const wk = weighs.filter((w) => at(w.date) > end - 7 * dayMs), prev = weighs.filter((w) => at(w.date) <= end - 7 * dayMs && at(w.date) > end - 14 * dayMs);
    const a = avg(wk), b = avg(prev), d = b != null ? Math.round((a - b) * 10) / 10 : null;
    return `Pre-lift weigh-ins: latest ${z.lb} lb (${shortDate(z.date)}) · 7-day average ${a} lb (${wk.length} weigh-in${wk.length === 1 ? "" : "s"})${d != null ? ` · ${d > 0 ? "+" : ""}${d} lb from the week before` : ""}`;
  })();

  return (
    <div className="panel">
      <h2>Body Composition Trends <small>{counts}</small></h2>
      <div className="bc-controls no-print">
        {has.evolt && has.sheet && (
          <div className="pill-tabs bc-pills" role="group" aria-label="Which measurements">
            {Object.entries(BODYCOMP_SOURCES).map(([k, label]) => <button key={k} className={`pill-tab ${source === k ? "active" : ""}`} onClick={() => setView({ source: k })}>{label}</button>)}
          </div>
        )}
        {metrics.length > 1 && (
          <div className="pill-tabs bc-pills" role="group" aria-label="Which figure">
            {metrics.map((m) => <button key={m.key} className={`pill-tab ${metric.key === m.key ? "active" : ""}`} onClick={() => setView({ metric: m.key })}>{m.label}</button>)}
          </div>
        )}
        <div className="pill-tabs bc-pills" role="group" aria-label="Time window">
          {BODYCOMP_RANGES.map((r) => <button key={r.key} className={`pill-tab ${range.key === r.key ? "active" : ""}`} onClick={() => setView({ range: r.key })}>{r.label}</button>)}
        </div>
      </div>
      {rows.length ? (
        <ResponsiveContainer width="100%" height={260}>
          <LineChart data={rows}>
            <CartesianGrid strokeDasharray="3 3" stroke={grid} />
            <XAxis dataKey="t" type="number" scale="time" domain={["dataMin", "dataMax"]} tickFormatter={day} stroke={axis} fontSize={12} minTickGap={36} />
            <YAxis stroke={axis} fontSize={12} domain={paddedDomain(rows, ["evolt", "sheet", "weigh", "trend"])} unit={metric.unit === "%" ? "%" : ""} />
            <Tooltip contentStyle={tooltipStyle} labelFormatter={day} formatter={(v, name) => [`${v}${metric.unit === "%" ? "%" : ` ${metric.unit}`}`, name]} />
            <Legend />
            {/* Together: one line through every point, with each point in its source's color */}
            {both && <Line type="monotone" dataKey="all" name="All measurements" stroke={axis} strokeWidth={2} dot={false} activeDot={false} connectNulls legendType="line" tooltipType="none" />}
            {source !== "sheet" && <Line type="monotone" dataKey="evolt" name={`Evolt ${metric.label.toLowerCase()} (${metric.unit})`} stroke={both ? "none" : evoltColor} strokeWidth={2} dot={{ r: both ? 4 : 3, fill: evoltColor, stroke: evoltColor }} connectNulls legendType="circle" />}
            {source !== "evolt" && <Line type="monotone" dataKey="sheet" name={`Manual sheet ${metric.label.toLowerCase()} (${metric.unit})`} stroke={both ? "none" : BODYCOMP_SHEET_COLOR} strokeWidth={2} dot={{ r: 4, fill: BODYCOMP_SHEET_COLOR, stroke: BODYCOMP_SHEET_COLOR }} connectNulls legendType="circle" />}
            {withWeighs && <Line type="monotone" dataKey="weigh" name="Pre-lift weigh-ins (lb)" stroke={BODYCOMP_WEIGH_COLOR} strokeWidth={1.5} dot={{ r: 2, fill: BODYCOMP_WEIGH_COLOR, stroke: BODYCOMP_WEIGH_COLOR }} connectNulls legendType="circle" />}
            {fit.length >= 2 && <Line type="linear" dataKey="trend" name={both ? "Trend (all)" : along === "weigh" ? "Trend (weigh-ins)" : "Trend"} stroke="#6b7280" strokeWidth={2} strokeDasharray="6 3" dot={false} activeDot={false} />}
          </LineChart>
        </ResponsiveContainer>
      ) : (
        <div className="empty-state">No {metric.label.toLowerCase()} recorded on the {source === "sheet" ? "manual sheets" : source === "evolt" ? "Evolt scans" : "scans or sheets"}{range.days ? ` in the last ${range.label.toLowerCase()}. All time shows everything on file` : ""}.</div>
      )}
      {weighText && <p className="bc-note bc-weigh">{weighText}. The nutrition plan follows the weigh-ins between scans.</p>}
      {source === "both" && (
        <p className="bc-note">The line runs through every measurement in date order, Evolt and manual sheet alike, with the dashed trend through all of them. This is only how they're drawn: the Evolt scans and the manual sheets stay separate records. The two measure differently (a scan against skinfolds, and Evolt's skeletal muscle against the sheet's girth-based muscle estimate), so the line can step up or down where it changes from one to the other.</p>
      )}
    </div>
  );
}

// The Evolt scans on file, latest first. Clicking a scan opens it to correct its figures (or its date), or delete it;
// the change saves to that scan's record and the trends graph follows.
const BODYCOMP_EDIT_FIELDS = [
  ["weightLb", "Weight (lb)"], ["bodyFatPct", "Body Fat %"], ["bodyFatLb", "Fat Mass (lb)"], ["smmLb", "Skeletal Muscle (lb)"],
  ["lbmLb", "Lean Mass (lb)"], ["visceralFat", "Visceral Fat"], ["bwi", "BWI"], ["bioAge", "Bio Age"], ["bmi", "BMI"],
];
function BodyCompPanel({ athleteId }) {
  // with the year, since a history can run over several years: 9/22/26
  const scanDate = (k) => { const [y, m, d] = (k || "").split("-"); return y ? `${Number(m)}/${Number(d)}/${y.slice(2)}` : ""; };
  const [, bump] = useState(0);
  const [editing, setEditing] = useState(null); // { match, form } for the scan open for editing
  const scans = bodyCompScansLb(athleteId);
  if (!scans.length) {
    return (
      <div className="panel">
        <h2>Body Composition <small>Evolt360</small></h2>
        <div className="empty-state">
          No body composition scans on file for this athlete yet. Import Evolt's Result Activity Report on the
          Import page (bottom bar).
        </div>
      </div>
    );
  }

  const latest = scans[scans.length - 1];
  const first = scans[0];
  // the change since the first scan on file, beside each latest figure
  const since = (key, unit) => {
    if (scans.length < 2 || latest[key] == null || first[key] == null) return null;
    const d = Math.round((latest[key] - first[key]) * 10) / 10;
    return `${d > 0 ? "+" : ""}${d}${unit} since ${scanDate(first.date)}`;
  };
  const keyOf = (s) => `${s.evoltId || ""}|${s.date}|${s.time || ""}`;
  const open = (s) => setEditing({ match: { evoltId: s.evoltId, date: s.date, time: s.time }, key: keyOf(s), form: { date: s.date || "", ...Object.fromEntries(BODYCOMP_EDIT_FIELDS.map(([k]) => [k, s[k] == null ? "" : String(s[k])])) } });
  const changed = () => { window.dispatchEvent(new Event("dst-bodycomp-changed")); bump((x) => x + 1); };
  const save = () => {
    const f = editing.form;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) { window.alert("Give the scan a date."); return; }
    const patch = { date: f.date };
    BODYCOMP_EDIT_FIELDS.forEach(([k]) => { const v = String(f[k]).trim(); patch[k] = v === "" || isNaN(Number(v)) ? null : Math.round(Number(v) * 100) / 100; });
    // weights edited here are in pounds, so the old kilogram figures they were worked out from are dropped
    patch.weightKg = null; patch.skeletalMuscleKg = null;
    if (!window.AthleteStore.updateBodyComp(athleteId, editing.match, patch)) { window.alert("That scan couldn't be saved. Reload the page and try again."); return; }
    setEditing(null);
    changed();
  };
  const remove = () => {
    if (!window.confirm(`Delete the scan from ${scanDate(editing.form.date)}? This can't be undone.`)) return;
    if (!window.AthleteStore.deleteBodyComp(athleteId, editing.match)) { window.alert("That scan couldn't be deleted. Reload the page and try again."); return; }
    setEditing(null);
    changed();
  };
  const setForm = (k, v) => setEditing((e) => ({ ...e, form: { ...e.form, [k]: v } }));

  return (
    <div className="panel">
      <h2>
        Body Composition <small>Evolt360 &middot; {scans.length} scan{scans.length === 1 ? "" : "s"} on file &middot; click a scan to edit it</small>
      </h2>
      <div className="metric-strip">
        <KpiCard label="Latest Weight" value={latest.weightLb != null ? `${fmt2(latest.weightLb)} lb` : "—"} sub={since("weightLb", " lb")} />
        <KpiCard label="Latest Body Fat" value={latest.bodyFatPct != null ? `${fmt2(latest.bodyFatPct)}%` : "—"} sub={since("bodyFatPct", "%")} />
        <KpiCard label="Skeletal Muscle Mass" value={latest.smmLb != null ? `${fmt2(latest.smmLb)} lb` : "—"} sub={since("smmLb", " lb")} />
        {latest.bwi != null && <KpiCard label="BWI" value={`${fmt2(latest.bwi)} / 10`} />}
      </div>
      {/* the graph of these is Body Composition Trends, above */}
      <div className="bodycomp-scroll">
        <table style={{ marginTop: 14 }}>
          <thead>
            <tr>
              <th>Date</th>
              {BODYCOMP_EDIT_FIELDS.map(([k, label]) => <th key={k}>{label}</th>)}
            </tr>
          </thead>
          <tbody>
            {[...scans].reverse().map((s, i) => (editing && editing.key === keyOf(s) ? (
              <tr key={keyOf(s) || i} className="bodycomp-edit-row no-print">
                <td><input type="date" value={editing.form.date} onChange={(e) => setForm("date", e.target.value)} aria-label="Scan date" /></td>
                {BODYCOMP_EDIT_FIELDS.map(([k, label]) => (
                  <td key={k}><input inputMode="decimal" value={editing.form[k]} onChange={(e) => setForm(k, e.target.value)} aria-label={label} /></td>
                ))}
              </tr>
            ) : (
              <tr key={keyOf(s) || i} className="bodycomp-row" title="Click to edit this scan" onClick={() => open(s)}>
                <td>{scanDate(s.date)}</td>
                {BODYCOMP_EDIT_FIELDS.map(([k]) => <td key={k}>{fmt2(s[k]) ?? "—"}</td>)}
              </tr>
            )))}
          </tbody>
        </table>
      </div>
      {editing && (
        <div className="bodycomp-edit-actions no-print">
          <button className="btn btn-assign" onClick={save}>Save scan</button>
          <button className="btn btn-secondary" onClick={() => setEditing(null)}>Cancel</button>
          <button className="btn-link" style={{ marginLeft: "auto", color: "var(--danger)" }} onClick={remove}>Delete this scan</button>
        </div>
      )}
    </div>
  );
}

// A small "signature" line — who created/last touched this record and when — fed by the
// created_by/updated_by columns Supabase stamps server-side (see supabase/migration_002_activity_tracking.sql).
// Renders nothing for records saved before that migration ran (no _activity) or fully offline.
function ActivitySignature({ activity, className }) {
  if (!activity || (!activity.createdBy && !activity.updatedBy)) return null;
  const fmt = (iso) => (iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "");
  const parts = [];
  if (activity.createdBy) parts.push(`Created by ${activity.createdBy}${activity.createdAt ? ` on ${fmt(activity.createdAt)}` : ""}`);
  if (activity.updatedBy && activity.updatedAt !== activity.createdAt) {
    parts.push(`Last updated by ${activity.updatedBy}${activity.updatedAt ? ` on ${fmt(activity.updatedAt)}` : ""}`);
  }
  return <div className={`activity-signature no-print ${className || ""}`}>{parts.join(" · ")}</div>;
}

// The player's name at the top of their profile, with ✎ beside it: the same edits as the pencil on the roster (name
// and jersey number, saved with Save; league, team and DST location, which save as they're picked). Position, status
// and the photo sit in the header already.
// "B/T R/R", or just the one that's known, for the profile header
const batsThrows = (a) => (a.bats && a.throws ? `B/T ${a.bats}/${a.throws}` : a.throws ? `Throws ${a.throws}` : a.bats ? `Bats ${a.bats}` : "");

function ProfileNameEdit({ athlete, onDataChange }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState(athlete.name);
  const [jersey, setJersey] = useState(hasJersey(athlete) ? athlete.jersey : "");
  const [throws, setThrows] = useState(athlete.throws || ""); // R or L (the Bullpens comps use it)
  const [bats, setBats] = useState(athlete.bats || ""); // R, L or S
  // a player linked to MLB before hands were kept: fill them in from MLB's player record the first time the profile opens
  React.useEffect(() => {
    if (!athlete.mlbamId || (athlete.throws && athlete.bats)) return;
    let off = false;
    fetch(`https://statsapi.mlb.com/api/v1/people/${athlete.mlbamId}`).then((r) => (r.ok ? r.json() : null)).then((j) => {
      const p = j && j.people && j.people[0];
      if (off || !p) return;
      const patch = {};
      if (!athlete.throws && p.pitchHand && /^[RL]$/.test(p.pitchHand.code)) patch.throws = p.pitchHand.code;
      if (!athlete.bats && p.batSide && /^[RLS]$/.test(p.batSide.code)) patch.bats = p.batSide.code;
      if (Object.keys(patch).length) { window.AthleteStore.updateAthlete(athlete.id, patch); onDataChange(); }
    }).catch(() => { /* offline: left for next time */ });
    return () => { off = true; };
  }, [athlete.id, athlete.mlbamId]); // eslint-disable-line
  const start = () => { setName(athlete.name); setJersey(hasJersey(athlete) ? athlete.jersey : ""); setThrows(athlete.throws || ""); setBats(athlete.bats || ""); setOpen(true); };
  const save = () => {
    if (!name.trim()) return;
    window.AthleteStore.updateAthlete(athlete.id, { name: name.trim(), jersey: jersey.trim() || "--", throws, bats });
    setOpen(false);
    onDataChange();
  };
  return (
    <React.Fragment>
      <h2>
        {lastFirstName(athlete.name)} <GoalBadges athleteId={athlete.id} />
        {!open && <button className="profile-edit-btn no-print" onClick={start} title={`Edit ${athlete.name}`} aria-label={`Edit ${athlete.name}`}>&#9998;</button>}
      </h2>
      {open && (
        <div className="profile-edit no-print" onKeyDown={(e) => { if (e.key === "Enter" && e.target.tagName === "INPUT") save(); if (e.key === "Escape") setOpen(false); }}>
          <label><span>Name</span><input className="inline-select" value={name} autoFocus onChange={(e) => setName(e.target.value)} placeholder="First Last" /></label>
          <label><span>Jersey #</span><input className="inline-select" value={jersey} onChange={(e) => setJersey(e.target.value)} placeholder="#" style={{ width: 70 }} /></label>
          <label><span>Throws</span><select className="inline-select" value={throws} onChange={(e) => setThrows(e.target.value)}><option value="">–</option><option value="R">Right</option><option value="L">Left</option></select></label>
          <label><span>Bats</span><select className="inline-select" value={bats} onChange={(e) => setBats(e.target.value)}><option value="">–</option><option value="R">Right</option><option value="L">Left</option><option value="S">Switch</option></select></label>
          <label><span>League</span><LeagueSelect athlete={athlete} onChanged={onDataChange} /></label>
          <label><span>Team</span><TeamSelectInline key={athlete.league || "none"} athlete={athlete} onChanged={onDataChange} /></label>
          <label><span>DST location</span><LocationSelect athlete={athlete} onChanged={onDataChange} /></label>
          <span className="profile-edit-actions">
            <button className="btn btn-primary" disabled={!name.trim()} onClick={save}>Save</button>
            <button className="btn-link" onClick={() => setOpen(false)}>Cancel</button>
          </span>
        </div>
      )}
    </React.Fragment>
  );
}

// The Pitching tab's Throwing view: any throwing program on the pitcher's plan (a block whose program is built in
// the throwing layout, or sits in a Throwing lane), with its weeks, above their Throwing Progression. Open takes you
// to that block on the Programming tab.
function ThrowingProgramsPanel({ athlete, onOpen }) {
  const S = window.AthleteStore;
  const plan = S.getPeriodization(athlete.id);
  const programs = S.allPrograms();
  const lanes = (plan && plan.lanes) || [];
  const day = (wk) => { const d = new Date(`${plan.startDate}T00:00:00`); d.setDate(d.getDate() + wk * 7); return d; };
  const nowWk = plan && plan.startDate ? Math.floor((Date.now() - new Date(`${plan.startDate}T00:00:00`).getTime()) / (7 * 864e5)) : -1;
  const rows = ((plan && plan.blocks) || []).map((b) => {
    const p = b.programId ? programs.find((x) => String(x.id) === String(b.programId)) : null;
    const lane = lanes.find((l) => l.id === b.lane);
    return { b, p, lane };
  }).filter(({ p, lane }) => (p && p.layout === "throwing") || (lane && /throw/i.test(lane.name || "")))
    .sort((x, y) => x.b.start - y.b.start);
  const md = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return (
    <div className="panel">
      <h2>Throwing programs <small>on {athlete.name}'s plan</small></h2>
      {!plan || !rows.length
        ? <p className="assess-row-note">No throwing program on the plan yet. Put one in a Throwing row on the Player Plan (build one under Programs › Build a throwing program).</p>
        : rows.map(({ b, p, lane }) => {
          const when = nowWk >= b.start && nowWk < b.start + b.len ? "Now" : nowWk < b.start ? "Coming up" : "Done";
          return (
            <div key={b.id} className="thr-plan-row">
              <span className={`thr-plan-when thr-plan-${when === "Now" ? "now" : when === "Done" ? "done" : "next"}`}>{when}</span>
              <span className="thr-plan-name">{p ? p.name : b.label || "No program yet"}<small>{lane ? ` · ${lane.name}` : ""} · weeks {b.start + 1}–{b.start + b.len} ({md(day(b.start))} – {md(new Date(day(b.start + b.len).getTime() - 864e5))})</small></span>
              <button className="btn btn-secondary" onClick={() => onOpen({ laneId: b.lane, blockId: b.id })}>Open</button>
            </div>
          );
        })}
    </div>
  );
}

  { key: "testType", label: "Test Type", required: false, guesses: ["test type", "type", "movement", "exercise"], excludes: ["date", "time"] },

  { key: "rsiModified", label: "RSI-Modified (mRSI)", required: false, guesses: ["rsi", "mrsi"] },
  { key: "systemWeight", label: "System Weight (N)", required: false, guesses: ["system weight", "bodyweight", "body weight"] },
  // "excludes" keeps the W/kg (relative) column from also being picked up as absolute peak power.
  { key: "peakPower", label: "Peak Power (W)", required: false, guesses: ["peak power", "power"], excludes: ["relative", "/bm", "/ bm", "/kg", "w/kg", "per kg", "per bm", "bm"] },
  { key: "relativePeakPower", label: "Relative Peak Power (W/kg)", required: false, guesses: ["relative peak power", "peak power / bm", "peak power/bm", "power/bm", "w/kg"] },
  { key: "takeoffVelocity", label: "Takeoff Velocity (m/s)", required: false, guesses: ["takeoff velocity", "take-off velocity", "takeoff vel"] },
  { key: "totalImpulse", label: "Total Impulse (Ns)", required: false, guesses: ["total impulse"] },
  { key: "brakingRfd", label: "Braking RFD (N/s)", required: false, guesses: ["braking rfd", "rfd"] },
  { key: "concentricImpulse", label: "Concentric Impulse (Ns)", required: false, guesses: ["concentric impulse"] },
];
const HAWKIN_NUMERIC_KEYS = [
  "jumpHeight", "rsiModified", "systemWeight", "peakPower", "relativePeakPower",
  "takeoffVelocity", "totalImpulse", "brakingRfd", "concentricImpulse",
];

// Pound-force per Newton (also equals kg->lb mass conversion under standard gravity,
// so "System Weight in Newtons -> lbs" comes out the same either way you derive it).
const N_TO_LBF = 4.4482216152605;

// ---- VALD ForceDecks CSV import (Cubs Roster force plate tests) --------------------------
// VALD's export shares no field names or units with Hawkin's, and several values the rest of the
// app expects aren't exported directly - they're derived here from what VALD does give (e.g. jump
// momentum = bodyweight x takeoff velocity). Two things VALD's standard CMJ export has no honest
// equivalent for: a true NET impulse for either phase (only raw per-sub-phase concentric impulse
// is given) - so Propulsive Net Impulse and Braking Net Impulse are left blank for VALD-sourced
// tests rather than filled with a number that isn't really that metric.
const VALD_G = 9.80665;

const VALD_FIELD_DEFS = [
  { key: "athleteName", label: "Athlete Name", required: true, guesses: ["name"], excludes: ["external"] },
  { key: "date", label: "Test Date", required: true, guesses: ["date"] },
  { key: "testType", label: "Test Type", required: false, guesses: ["test type"] },
  { key: "bodyWeightKg", label: "Body Weight (kg)", required: false, guesses: ["bw [kg]", "bodyweight in kilograms", "kilograms"] },
  { key: "jumpHeightCm", label: "Jump Height (cm)", required: false, guesses: ["jump height"] },
  { key: "countermovementDepthCm", label: "Countermovement Depth (cm)", required: false, guesses: ["countermovement depth"] },
  { key: "peakPowerW", label: "Peak Power (W)", required: false, guesses: ["peak power"] },
  { key: "p1ConcentricImpulse", label: "P1 Concentric Impulse (Ns)", required: false, guesses: ["p1 concentric impulse"] },
  { key: "p2ConcentricImpulse", label: "P2 Concentric Impulse (Ns)", required: false, guesses: ["p2 concentric impulse"] },
  { key: "takeoffVelocity", label: "Takeoff Velocity (m/s)", required: false, guesses: ["takeoff"] },
  { key: "rsiModified", label: "RSI-Modified", required: false, guesses: ["rsi-modified", "rsi modified"] },
];
const VALD_NUMERIC_KEYS = [
  "bodyWeightKg", "jumpHeightCm", "countermovementDepthCm", "peakPowerW",
  "p1ConcentricImpulse", "p2ConcentricImpulse", "takeoffVelocity", "rsiModified",
];

// VALD's "CMJ" is the hands-on-hips test the MLB norms apply to; every other CMJ variant (e.g.
// "ABCMJ" = arm-swing) is kept out of the Positional CMJ Profile the same way Hawkin's non-
// "Countermovement Jump" variants are - tagged so it's still visible/countable, just excluded.
function valdTestType(code) {
  return (code || "").trim().toUpperCase() === "CMJ" ? "Countermovement Jump" : "Arm Swing Countermovement Jump";
}

function resolveValdAthlete(rawName) {
  const athlete = window.AthleteStore.findAthleteByName(rawName);
  return athlete ? { status: "matched", athlete } : { status: "no-match" };
}

// Converts one mapped VALD row into the same normalized force-test shape every other source
// produces, plus a synthetic Hawkin-field-named `raw` blob - the Positional CMJ Profile
// (cmj_norms.js) only scores tests that carry a `.raw` object shaped like Hawkin's API response,
// so this is what lets a VALD-sourced test show up there at all.
function valdTransformEntry(entry) {
  const bwKg = typeof entry.bodyWeightKg === "number" ? entry.bodyWeightKg : null;
  const jumpHeightM = typeof entry.jumpHeightCm === "number" ? entry.jumpHeightCm / 100 : null;
  const depthIn = typeof entry.countermovementDepthCm === "number" ? round2(entry.countermovementDepthCm * 0.393701) : null;
  const peakPowerW = typeof entry.peakPowerW === "number" ? entry.peakPowerW : null;
  const p1 = typeof entry.p1ConcentricImpulse === "number" ? entry.p1ConcentricImpulse : null;
  const p2 = typeof entry.p2ConcentricImpulse === "number" ? entry.p2ConcentricImpulse : null;
  const concentricImpulse = p1 !== null && p2 !== null ? round2(p1 + p2) : null;
  const relativePeakPower = bwKg && peakPowerW !== null ? round2(peakPowerW / bwKg) : null;
  const jumpMomentum = bwKg && typeof entry.takeoffVelocity === "number" ? round2(bwKg * entry.takeoffVelocity) : null;
  const systemWeightN = bwKg ? round2(bwKg * VALD_G) : null;
  const rsiModified = typeof entry.rsiModified === "number" ? entry.rsiModified : null;

  return {
    athleteId: entry.athleteId,
    date: entry.date,
    testType: valdTestType(entry.testType),
    source: "vald-import",
    jumpHeight: jumpHeightM !== null ? round2(jumpHeightM * 39.3701) : null,
    countermovementDepth: depthIn,
    peakPower: peakPowerW,
    relativePeakPower,
    takeoffVelocity: typeof entry.takeoffVelocity === "number" ? entry.takeoffVelocity : null,
    rsiModified,
    systemWeight: systemWeightN,
    jumpMomentum,
    concentricImpulse,
    raw: {
      "System Weight(N)": systemWeightN,
      "Jump Height(m)": jumpHeightM,
      "Jump Momentum(kg.m/s)": jumpMomentum,
      "Peak Relative Propulsive Power(W/kg)": relativePeakPower,
      "mRSI": rsiModified,
    },
  };
}

function guessMapping(headers, fieldDefs) {
  const mapping = {};
  fieldDefs.forEach((f) => {
    const found = headers.find((h) => {
      const hl = h.toLowerCase();
      if ((f.excludes || []).some((x) => hl.includes(x))) return false;
      return f.guesses.some((g) => hl.includes(g));
    });
    mapping[f.key] = found || "";
  });
  return mapping;
}

function CsvImporter({ title, description, fieldDefs, numericKeys, saveEntry, onImported, dedupe, resolveAthlete, transformEntry }) {
  const [fileName, setFileName] = useState("");
  const [headers, setHeaders] = useState([]);
  const [rawRows, setRawRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setError("");
    setResult(null);
    setFileName(file.name);
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const fields = results.meta.fields || [];
        if (!fields.length || !results.data.length) {
          setError("Couldn't find any rows/columns in that file. Is it a valid CSV export?");
          setHeaders([]);
          setRawRows([]);
          return;
        }
        setHeaders(fields);
        setRawRows(results.data);
        setMapping(guessMapping(fields, fieldDefs));
      },
      error: (err) => setError(`Failed to parse CSV: ${err.message}`),
    });
  };

  const requiredMissing = fieldDefs.some((f) => f.required && !mapping[f.key]);

  const previewRows = rawRows.slice(0, 5).map((row) => {
    const out = {};
    fieldDefs.forEach((f) => {
      out[f.key] = mapping[f.key] ? row[mapping[f.key]] : "";
    });
    return out;
  });

  const handleImport = () => {
    let skipped = 0;
    let noMatch = 0;
    let ambiguous = 0;
    const athleteNamesUsed = new Set();
    const beforeCount = window.AthleteStore.allAthletes().length;
    let entries = [];

    rawRows.forEach((row) => {
      const rawName = mapping.athleteName ? row[mapping.athleteName] : "";
      const rawDate = mapping.date ? row[mapping.date] : "";
      const dateKey = toDateKey(rawDate);
      if (!rawName || !dateKey) {
        skipped++;
        return;
      }
      let athlete;
      if (resolveAthlete) {
        const resolved = resolveAthlete(rawName);
        if (resolved.status === "no-match") { noMatch++; return; }
        if (resolved.status === "ambiguous") { ambiguous++; return; }
        athlete = resolved.athlete;
      } else {
        athlete = window.AthleteStore.findOrCreateAthlete(rawName);
      }
      athleteNamesUsed.add(athlete.name);
      const entry = { athleteId: athlete.id, date: dateKey };
      fieldDefs.forEach((f) => {
        if (f.key === "athleteName" || f.key === "date") return;
        const col = mapping[f.key];
        if (!col) return;
        const val = row[col];
        if (val === undefined || val === null || val === "") return;
        entry[f.key] = numericKeys.includes(f.key) ? round2(Number(val)) : val;
      });
      entries.push(transformEntry ? transformEntry(entry) : entry);
    });

    const beforeDedupe = entries.length;
    if (dedupe) entries = dedupe(entries);
    const dedupedCount = beforeDedupe - entries.length;

    entries.forEach((entry) => saveEntry(entry));

    const afterCount = window.AthleteStore.allAthletes().length;
    setResult({
      imported: entries.length,
      skipped,
      noMatch,
      ambiguous,
      dedupedCount,
      athleteCount: athleteNamesUsed.size,
      newAthletes: afterCount - beforeCount,
    });
    onImported();
  };

  const reset = () => {
    setFileName("");
    setHeaders([]);
    setRawRows([]);
    setMapping({});
    setResult(null);
    setError("");
  };

  return (
    <div className="panel">
      <h2>{title}</h2>
      <p style={{ color: "var(--text-dim)", fontSize: 13, marginTop: -6 }}>{description}</p>

      {error && <div className="success-banner" style={{ background: "#3a1414", color: "var(--danger)", borderColor: "#5a1f1f" }}>{error}</div>}

      {result && (
        <div className="success-banner">
          Imported {result.imported} row{result.imported === 1 ? "" : "s"} across {result.athleteCount} athlete
          {result.athleteCount === 1 ? "" : "s"}
          {result.newAthletes > 0 ? ` (${result.newAthletes} new athlete profile${result.newAthletes === 1 ? "" : "s"} created)` : ""}.
          {result.dedupedCount > 0 ? ` Kept only the best test per athlete/date — ${result.dedupedCount} duplicate or already-imported row${result.dedupedCount === 1 ? "" : "s"} skipped.` : ""}
          {result.skipped > 0 ? ` Skipped ${result.skipped} row(s) missing an athlete name or a parseable date.` : ""}
          {result.noMatch > 0 ? ` Skipped ${result.noMatch} row(s) that didn't match anyone currently on the roster.` : ""}
          {result.ambiguous > 0 ? ` Skipped ${result.ambiguous} row(s) where more than one roster athlete shares that first name + last initial — add those manually instead.` : ""}
          {" "}
          <button className="btn-link" onClick={reset}>Import another file</button>
        </div>
      )}

      {!rawRows.length && !result && (
        <div className="file-drop">
          <input type="file" accept=".csv" onChange={handleFile} />
          <span style={{ color: "var(--text-dim)", fontSize: 12 }}>Accepts a .csv export.</span>
        </div>
      )}

      {rawRows.length > 0 && !result && (
        <div>
          <p style={{ fontSize: 12, color: "var(--text-dim)" }}>
            Loaded <strong style={{ color: "var(--text)" }}>{fileName}</strong> &middot; {rawRows.length} rows detected.
            Confirm which column maps to each field below (auto-guessed where possible).
          </p>
          <table className="mapping-table">
            <tbody>
              {fieldDefs.map((f) => (
                <tr key={f.key}>
                  <td style={{ width: 220 }}>
                    {f.label}
                    {f.required && <span className="required-mark">*</span>}
                  </td>
                  <td>
                    <select
                      value={mapping[f.key] || ""}
                      onChange={(e) => setMapping({ ...mapping, [f.key]: e.target.value })}
                    >
                      <option value="">— none —</option>
                      {headers.map((h) => (
                        <option key={h} value={h}>{h}</option>
                      ))}
                    </select>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          <h2 style={{ fontSize: 13 }}>Preview (first 5 rows)</h2>
          <table>
            <thead>
              <tr>
                {fieldDefs.map((f) => <th key={f.key}>{f.label}</th>)}
              </tr>
            </thead>
            <tbody>
              {previewRows.map((row, i) => (
                <tr key={i} style={{ cursor: "default" }}>
                  {fieldDefs.map((f) => <td key={f.key}>{row[f.key] || "—"}</td>)}
                </tr>
              ))}
            </tbody>
          </table>

          <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
            <button className="btn btn-primary" disabled={requiredMissing} onClick={handleImport}>
              Import {rawRows.length} rows
            </button>
            <button className="btn btn-secondary" onClick={reset}>Cancel</button>
          </div>
          {requiredMissing && (
            <p style={{ fontSize: 12, color: "var(--warn)", marginTop: 8 }}>
              Map all required (*) fields before importing.
            </p>
          )}
        </div>
      )}
    </div>
  );
}

// ---- MLB / MiLB profile + photo linker -------------------------------------------------
// Looks each roster athlete up in MLB's official player database (MLB + MiLB), links their
// MLBAM ID (which is also their Baseball Savant ID — it powers the Statcast tab), and sets
// their headshot. Birth date is used to confirm matches when we have it on file.

const MLB_HEADSHOT = (id) =>
  `https://img.mlbstatic.com/mlb-photos/image/upload/w_213,d_people:generic:headshot:67:current.png,q_auto:best,f_auto/v1/people/${id}/headshot/67/current`;

const NAME_ALIAS_MAP = (() => {
  const groups = [
    ["gabriel", "gabe"], ["cameron", "cam"], ["alexander", "alex", "lex"], ["nicholas", "nick", "nico", "nicolas"],
    ["joshua", "josh"], ["zachary", "zach", "zac"], ["matthew", "matt"], ["michael", "mike", "mikey"],
    ["robert", "rob", "robby", "bobby", "bob"], ["daniel", "dan", "danny"], ["jonathan", "jon", "jonny"],
    ["thomas", "tom", "tommy"], ["patrick", "pat"], ["joseph", "joe"], ["christopher", "chris"],
    ["anthony", "tony"], ["benjamin", "ben"], ["nathan", "nate"], ["charles", "chuck", "chuckie", "charlie"],
    ["william", "will", "bill", "billy"], ["samuel", "sam"], ["timothy", "tim"], ["andrew", "andy", "drew"],
    ["jacob", "jake", "jakob"], ["lucas", "luke"], ["calvin", "cal"], ["connor", "conor"],
    ["james", "jim", "jimmy"], ["jeffrey", "jeff"], ["kenneth", "kenny", "ken"], ["steven", "steve"],
    ["edward", "ed", "eddie"], ["richard", "rick", "rich", "ricky"], ["david", "dave"], ["stanley", "stan"],
  ];
  const map = {};
  groups.forEach((g) => g.forEach((n) => { map[n] = g.filter((x) => x !== n); }));
  return map;
})();

const mlbSearchCache = new Map();

function stripAccents(s) {
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
}

async function mlbSearchPlayers(name) {
  if (mlbSearchCache.has(name)) return mlbSearchCache.get(name);
  const res = await fetch(`https://statsapi.mlb.com/api/v1/people/search?names=${encodeURIComponent(name)}&hydrate=currentTeam`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  // Drop historical players (the database includes everyone back to the 1800s).
  const people = (json.people || []).filter(
    (p) => p.isPlayer !== false && (p.active || (p.birthDate && Number(p.birthDate.slice(0, 4)) >= 1975))
  );
  mlbSearchCache.set(name, people);
  return people;
}

// Tries the roster name as-is, then common nickname/formal-name swaps (Gabriel <-> Gabe,
// Cam <-> Cameron, ...), stopping at the first spelling that finds anyone.
async function findMlbCandidates(fullName) {
  const clean = stripAccents(fullName).trim().replace(/\s+/g, " ");
  const parts = clean.split(" ");
  const first = (parts[0] || "").toLowerCase();
  const rest = parts.slice(1).join(" ");
  const variants = [clean, ...(NAME_ALIAS_MAP[first] || []).map((alt) => `${alt} ${rest}`)];
  for (const v of variants) {
    const found = await mlbSearchPlayers(v);
    if (found.length) return found;
  }
  return [];
}

function mapMlbPosition(abbr) {
  const a = (abbr || "").toUpperCase();
  if (a === "P") return "Pitcher";
  if (a === "C") return "Catcher";
  if (["1B", "2B", "3B", "SS", "IF"].includes(a)) return "Infield";
  if (["LF", "CF", "RF", "OF"].includes(a)) return "Outfield";
  return null;
}

function describeMlbCandidate(c) {
  const pos = c.primaryPosition ? c.primaryPosition.abbreviation : "?";
  const team = c.currentTeam ? c.currentTeam.name : "no current team";
  return `${c.fullName} · b. ${c.birthDate || "?"} · ${pos} · ${team} · #${c.id}`;
}

function classifyMlbMatch(athlete, candidates) {
  if (!candidates.length) return { status: "not-found", candidates };
  const dobHits = athlete.dob ? candidates.filter((c) => c.birthDate === athlete.dob) : [];
  if (dobHits.length === 1) return { status: "auto", pick: dobHits[0], reason: "name + birth date match", candidates };
  if (athlete.dob && !dobHits.length) {
    return { status: "review", candidates, reason: "the birth date on file doesn't match any player with this name" };
  }
  if (!athlete.dob && candidates.length === 1) {
    const c = candidates[0];
    if (c.active && c.currentTeam) {
      return { status: "auto", pick: c, reason: "only active player with this name (no birth date on file to confirm)", candidates };
    }
    return { status: "review", candidates, reason: "only match isn't currently active with a team" };
  }
  return { status: "review", candidates, reason: "more than one player has this name" };
}

function applyMlbMatch(athlete, cand) {
  const patch = { mlbamId: String(cand.id) };
  const hasManualPhoto = athlete.photoUrl && !/img\.mlbstatic\.com/.test(athlete.photoUrl);
  if (!hasManualPhoto) patch.photoUrl = MLB_HEADSHOT(cand.id);
  if (!athlete.position || athlete.position === "Unassigned") {
    const pos = mapMlbPosition(cand.primaryPosition && cand.primaryPosition.abbreviation);
    if (pos) patch.position = pos;
  }
  // throwing hand and batting side, unless a coach already set them
  if (!athlete.throws && cand.pitchHand && /^[RL]$/.test(cand.pitchHand.code)) patch.throws = cand.pitchHand.code;
  if (!athlete.bats && cand.batSide && /^[RLS]$/.test(cand.batSide.code)) patch.bats = cand.batSide.code;
  window.AthleteStore.updateAthlete(athlete.id, patch);
}

function MlbLinkRow({ row, onUpdate, onChanged }) {
  const [choice, setChoice] = useState(row.candidates && row.candidates[0] ? String(row.candidates[0].id) : "");
  const [manualId, setManualId] = useState("");
  const athlete = window.AthleteStore.allAthletes().find((a) => a.id === row.athleteId);
  if (!athlete) return null;

  const links = (id) => (
    <span style={{ marginLeft: 8, fontSize: 12 }}>
      <a href={`https://www.mlb.com/player/${id}`} target="_blank" rel="noopener noreferrer">MLB.com</a>
      {" · "}
      <a href={`https://baseballsavant.mlb.com/savant-player/${id}`} target="_blank" rel="noopener noreferrer">Savant</a>
    </span>
  );

  const applyPick = (cand) => {
    applyMlbMatch(athlete, cand);
    onUpdate(row.athleteId, { status: "applied", pick: cand, reason: "confirmed manually" });
    onChanged();
  };

  const unlink = () => {
    const isMlbPhoto = /img\.mlbstatic\.com/.test(athlete.photoUrl || "");
    window.AthleteStore.updateAthlete(athlete.id, {
      mlbamId: "",
      photoUrl: isMlbPhoto ? "" : athlete.photoUrl,
      mlbStats: null,
    });
    onUpdate(row.athleteId, { status: "not-found", pick: null, reason: "unlinked", candidates: row.candidates || [] });
    onChanged();
  };

  let tone = "neutral";
  let label = "Not found";
  let body = null;

  if (row.status === "applied") {
    tone = "good";
    label = "Linked";
    body = (
      <span>
        {describeMlbCandidate(row.pick)}
        {links(row.pick.id)}
        <div style={{ fontSize: 11, color: "var(--text-dim)" }}>{row.reason}</div>
        <button className="btn-link" onClick={unlink}>Unlink</button>
      </span>
    );
  } else if (row.status === "linked") {
    label = "Already linked";
    body = <span>MLBAM #{row.mlbamId}{links(row.mlbamId)}</span>;
  } else if (row.status === "review") {
    tone = "warn";
    label = "Needs review";
    body = (
      <span>
        <div style={{ fontSize: 11, color: "var(--text-dim)", marginBottom: 4 }}>{row.reason}</div>
        <select value={choice} onChange={(e) => setChoice(e.target.value)} style={{ maxWidth: 420 }}>
          {row.candidates.map((c) => (
            <option key={c.id} value={String(c.id)}>{describeMlbCandidate(c)}</option>
          ))}
        </select>{" "}
        <button
          className="btn-link"
          onClick={() => applyPick(row.candidates.find((c) => String(c.id) === choice) || row.candidates[0])}
        >
          Use this one
        </button>
        {choice && links(choice)}
      </span>
    );
  } else if (row.status === "error") {
    tone = "danger";
    label = "Error";
    body = <span>{row.reason}</span>;
  } else {
    body = (
      <span>
        <span style={{ fontSize: 11, color: "var(--text-dim)" }}>
          No MLB/MiLB profile found by name — paste their MLBAM ID if you know it:
        </span>{" "}
        <input
          className="inline-select"
          style={{ width: 110 }}
          placeholder="e.g. 680755"
          value={manualId}
          onChange={(e) => setManualId(e.target.value)}
        />{" "}
        <button
          className="btn-link"
          disabled={!/^\d+$/.test(manualId.trim())}
          onClick={() => applyPick({ id: manualId.trim(), fullName: athlete.name })}
        >
          Link
        </button>
      </span>
    );
  }

  return (
    <tr style={{ cursor: "default" }}>
      <td>{lastFirstName(athlete.name)}</td>
      <td><Badge tone={tone}>{label}</Badge></td>
      <td>{body}</td>
    </tr>
  );
}

function MlbLinkerPanel({ onImported }) {
  const [recheck, setRecheck] = useState(false);
  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState({ done: 0, total: 0 });
  const [rows, setRows] = useState(null);
  const [listText, setListText] = useState("");

  // Plain-text export of the active roster (name, position, MLBAM ID, team, birth date) so it
  // can be pasted somewhere else — e.g. to line athletes up with the research tool.
  const showRosterList = () => {
    const active = getRoster()
      .filter((a) => (a.status || "active").toLowerCase() === "active")
      .sort((a, b) => lastNameOnly(a.name).localeCompare(lastNameOnly(b.name)));
    const text = ["Name\tPosition\tMLBAM ID\tLeague\tTeam\tBirth date"]
      .concat(active.map((a) => [a.name, a.position || "", extractMlbamId(a) || "", a.league || "", a.team || "", a.dob || ""].join("\t")))
      .join("\n");
    setListText(text);
    try { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {}); } catch (e) { /* the box below still works */ }
  };

  const run = async () => {
    setRunning(true);
    setRows(null);
    const roster = getRoster();
    const out = [];
    const todo = [];
    roster.forEach((a) => {
      const existing = extractMlbamId(a);
      if (existing && !recheck) {
        if (!a.photoUrl) window.AthleteStore.updateAthlete(a.id, { photoUrl: MLB_HEADSHOT(existing) });
        out.push({ athleteId: a.id, status: "linked", mlbamId: existing });
      } else {
        todo.push(a);
      }
    });

    setProgress({ done: 0, total: todo.length });
    let done = 0;
    const queue = [...todo];
    const worker = async () => {
      while (queue.length) {
        const a = queue.shift();
        try {
          const candidates = await findMlbCandidates(a.name);
          const cls = classifyMlbMatch(a, candidates);
          const existing = extractMlbamId(a);
          if (cls.status === "auto" && existing && String(cls.pick.id) === existing) {
            out.push({ athleteId: a.id, status: "linked", mlbamId: existing });
          } else if (cls.status === "auto" && existing) {
            out.push({
              athleteId: a.id,
              status: "review",
              candidates: candidates,
              reason: `differs from the currently linked ID (#${existing})`,
            });
          } else if (cls.status === "auto") {
            applyMlbMatch(a, cls.pick);
            out.push({ athleteId: a.id, status: "applied", pick: cls.pick, reason: cls.reason });
          } else {
            out.push({ athleteId: a.id, ...cls });
          }
        } catch (e) {
          out.push({ athleteId: a.id, status: "error", reason: `Lookup failed (${e.message})` });
        }
        done++;
        setProgress({ done, total: todo.length });
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);

    const order = { review: 0, "not-found": 1, error: 2, applied: 3, linked: 4 };
    const nameOf = (r) => {
      const a = window.AthleteStore.allAthletes().find((x) => x.id === r.athleteId);
      return a ? lastNameOnly(a.name) : "";
    };
    out.sort((x, y) => order[x.status] - order[y.status] || nameOf(x).localeCompare(nameOf(y)));
    setRows(out);
    setRunning(false);
    onImported();
  };

  const updateRow = (athleteId, patch) => {
    setRows((prev) => prev.map((r) => (r.athleteId === athleteId ? { ...r, ...patch } : r)));
  };

  const count = (s) => (rows ? rows.filter((r) => r.status === s).length : 0);

  return (
    <div className="panel">
      <h2>MLB / MiLB Profiles &amp; Photos</h2>
      <p style={{ color: "var(--text-dim)", fontSize: 13, marginTop: -6 }}>
        Looks up every athlete on the roster in MLB's official player database (MLB and MiLB), links their MLBAM ID —
        the same ID Baseball Savant uses, so their Statcast tab works — and sets their headshot. Birth date is used to
        confirm a match when it's on file. Athletes that can't be matched with confidence are listed for you to check
        rather than guessed. Existing manual photos are never overwritten, and a blank Position is filled in from
        their MLB position.
      </p>

      <label style={{ fontSize: 13, display: "block", marginBottom: 10 }}>
        <input type="checkbox" checked={recheck} onChange={(e) => setRecheck(e.target.checked)} disabled={running} />{" "}
        Also re-check athletes who are already linked (flags any whose ID looks different)
      </label>

      <button className="btn btn-primary" disabled={running} onClick={run}>
        {running ? `Looking up… ${progress.done} / ${progress.total}` : "Find MLB profiles & photos for the roster"}
      </button>{" "}
      <button className="btn btn-secondary" disabled={running} onClick={showRosterList}>
        Copy active roster list
      </button>
      {listText && (
        <div style={{ marginTop: 10 }}>
          <p className="timestamp-note" style={{ marginTop: 0 }}>
            Copied to your clipboard (also in the box below in case that didn't work) — {listText.split("\n").length - 1} active athletes.
          </p>
          <textarea readOnly value={listText} rows={8} style={{ width: "100%", fontFamily: "monospace", fontSize: 12 }} onFocus={(e) => e.target.select()} />
        </div>
      )}

      {rows && (
        <div style={{ marginTop: 16 }}>
          <div className="store-stats">
            <span><strong>{count("applied")}</strong> newly linked</span>
            <span><strong>{count("linked")}</strong> already linked</span>
            <span><strong>{count("review")}</strong> need review</span>
            <span><strong>{count("not-found")}</strong> not found</span>
            {count("error") > 0 && <span><strong>{count("error")}</strong> errors</span>}
          </div>
          <table style={{ marginTop: 10 }}>
            <thead>
              <tr>
                <th>Athlete</th>
                <th>Result</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <MlbLinkRow key={r.athleteId} row={r} onUpdate={updateRow} onChanged={onImported} />
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// Status + manual trigger for the daily Hawkin Dynamics sync (api/sync-hawkin.js, runs on its own
// once a day via Vercel Cron). "Sync Now" calls the same function on demand, authenticated with
// the coach's own logged-in session instead of the cron secret (which never reaches the browser).
function HawkinSyncPanel({ onImported }) {
  const [lastSynced, setLastSynced] = useState(undefined); // undefined = loading, null = never run yet
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);

  const loadLastSynced = async () => {
    const { data, error } = await window.supabaseClient.from("app_meta").select("value").eq("key", "hawkinLastRunAt").maybeSingle();
    setLastSynced(!error && data ? data.value : null);
  };
  React.useEffect(() => { loadLastSynced(); }, []);

  const syncNow = async () => {
    setBusy(true);
    setResult(null);
    try {
      const { data: sessionData } = await window.supabaseClient.auth.getSession();
      const token = sessionData.session && sessionData.session.access_token;
      const res = await fetch("/api/sync-hawkin", { headers: { Authorization: `Bearer ${token}` } });
      const json = await res.json();
      setResult(json);
      await loadLastSynced();
      if (json.ok && json.inserted) onImported();
    } catch (e) {
      setResult({ ok: false, errors: [String((e && e.message) || e)] });
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="panel">
      <h2 style={{ fontSize: 13 }}>Hawkin Dynamics Sync</h2>
      <p className="timestamp-note">
        Runs automatically once a day &middot; Last synced: {lastSynced === undefined ? "checking…" : lastSynced == null ? "never" : new Date(lastSynced * 1000).toLocaleString()}
      </p>
      <button className="btn btn-secondary" style={{ marginTop: 6 }} onClick={syncNow} disabled={busy}>
        {busy ? "Syncing…" : "Sync Now"}
      </button>
      {result && (
        result.ok ? (
          <p style={{ fontSize: 12, marginTop: 8, color: "var(--good)" }}>
            {result.inserted} new test{result.inserted === 1 ? "" : "s"} synced
            {result.skippedAthletes && result.skippedAthletes.length ? ` (${result.skippedAthletes.length} non-roster athlete name${result.skippedAthletes.length === 1 ? "" : "s"} skipped)` : ""}.
          </p>
        ) : (
          <p style={{ fontSize: 12, marginTop: 8, color: "var(--danger)" }}>
            Sync failed: {(result.errors && result.errors[0]) || result.error || "unknown error"}
          </p>
        )
      )}
    </div>
  );
}

      </div>

      {source === "mlb" && <MlbLinkerPanel onImported={onImported} />}

      {source === "hawkin" && <HawkinSyncPanel onImported={onImported} />}
      {source === "hawkin" && <NoJumpDataPanel />}
      {source === "hawkin" && (
        <CsvImporter
          title="Hawkin Dynamics — Force Plate Tests"
          description="Upload a CSV exported from Hawkin Dynamics Cloud (trial/test export). Map your columns below — export layouts vary by account, so confirm the guesses before importing. If an athlete has multiple tests on the same date, only the one with the highest jump height is kept, and dates already on file for that athlete are skipped, so re-importing an overlapping export is safe."
          fieldDefs={HAWKIN_FIELD_DEFS}
          numericKeys={HAWKIN_NUMERIC_KEYS}
          saveEntry={(entry) => window.AthleteStore.addForceTest(entry)}
          onImported={onImported}
          dedupe={(allEntries) => {
            const storedDates = new Map();
            const hasStored = (entry) => {
              if (!storedDates.has(entry.athleteId)) {
                storedDates.set(entry.athleteId, new Set(window.AthleteStore.getForceTests(entry.athleteId).map((t) => t.date)));
              }
              return storedDates.get(entry.athleteId).has(entry.date);
            };
            const entries = allEntries.filter((entry) => !hasStored(entry));
            const best = new Map();
            entries.forEach((entry) => {
              const key = `${entry.athleteId}|${entry.date}`;
              const existing = best.get(key);
              const jumpHeight = typeof entry.jumpHeight === "number" ? entry.jumpHeight : -Infinity;
              const existingJumpHeight = existing && typeof existing.jumpHeight === "number" ? existing.jumpHeight : -Infinity;
              if (!existing || jumpHeight > existingJumpHeight) {
                best.set(key, entry);
              }
            });
            return Array.from(best.values());
          }}
        />
      )}
      {/* OVR's sprint and agility export, saved as testing results (ovr_import.js) */}
      {source === "ovr" && window.OvrImporter && <window.OvrImporter onImported={onImported} />}
      {/* the Result Activity Report from Evolt Insights (evolt_import.js) */}
      {source === "evolt" && window.EvoltImporter && <window.EvoltImporter onImported={onImported} />}
      {source === "vald" && (
        <CsvImporter
          title="VALD ForceDecks — Cubs Roster Force Plate Tests"
          description="Upload a CSV test export from VALD ForceDecks. Rows are matched against the existing roster only (nobody new gets created) — map the columns below and confirm the guesses before importing. Only hands-on-hips CMJ counts toward the Positional CMJ Profile's MLB norms; other CMJ variants (e.g. arm-swing) are kept on file but excluded the same way Hawkin's are. If an athlete already has a test for a given date and test type, that row is skipped; otherwise the highest jump height for that date/type is kept."
          fieldDefs={VALD_FIELD_DEFS}
          numericKeys={VALD_NUMERIC_KEYS}
          saveEntry={(entry) => window.AthleteStore.addForceTest(entry)}
          onImported={onImported}
          resolveAthlete={resolveValdAthlete}
          transformEntry={valdTransformEntry}
          dedupe={(allEntries) => {
            const storedKeys = new Map();
            const hasStored = (entry) => {
              if (!storedKeys.has(entry.athleteId)) {
                storedKeys.set(entry.athleteId, new Set(window.AthleteStore.getForceTests(entry.athleteId).map((t) => `${t.date}|${t.testType}`)));
              }
              return storedKeys.get(entry.athleteId).has(`${entry.date}|${entry.testType}`);
            };
            const entries = allEntries.filter((entry) => !hasStored(entry));
            const best = new Map();
            entries.forEach((entry) => {
              const key = `${entry.athleteId}|${entry.date}|${entry.testType}`;
              const existing = best.get(key);
              const jumpHeight = typeof entry.jumpHeight === "number" ? entry.jumpHeight : -Infinity;
              const existingJumpHeight = existing && typeof existing.jumpHeight === "number" ? existing.jumpHeight : -Infinity;
              if (!existing || jumpHeight > existingJumpHeight) best.set(key, entry);
            });
            return Array.from(best.values());
          }}
        />
      )}

      <div className="panel">
        <h2 style={{ fontSize: 13 }}>Stored on this device</h2>
        <div className="store-stats">
          <span><strong>{stats.customAthletes}</strong> athlete profile(s) created from imports</span>
          <span><strong>{stats.forceTests}</strong> force plate tests</span>
          <span><strong>{stats.bodyComp}</strong> body composition scans</span>
          <span><strong>{stats.manualWellness}</strong> manual wellness check-ins</span>
        </div>
        <p style={{ fontSize: 11, color: "var(--text-dim)", marginTop: 10 }}>
          This data is shared with every coach logged into the dashboard (stored in Supabase), with a local copy kept in this browser only as an offline fallback.
        </p>
        <button className="btn btn-secondary" style={{ marginTop: 6 }} onClick={handleClear}>
          Clear imported &amp; manual data
        </button>
      </div>
    </div>
  );
}

// Player Profiles page: Active players and Alumni as two tabs (Alumni used to be its own top-level page).
// Pencil at the top left of a player card: opens the card for editing (name, jersey, position, status)
// without opening the profile. Position and status save as soon as they are picked, like on the roster table.
// A coach's locations (coachLocations on their record): the dashboard opens on that location's roster when they
// sign in, and their weekly email covers only those locations' athletes. None ticked means all locations.
const coachLocationsOf = (a) => (a && Array.isArray(a.coachLocations) ? a.coachLocations.filter((l) => DST_LOCATIONS.includes(l)) : []);
const coachLocationsText = (a) => { const l = coachLocationsOf(a); return l.length ? l.join(", ") : "All locations"; };
function CoachLocationsPicker({ athlete, value, onChange }) {
  const current = value !== undefined ? value : coachLocationsOf(athlete);
  const flip = (loc) => {
    const next = current.includes(loc) ? current.filter((l) => l !== loc) : DST_LOCATIONS.filter((l) => l === loc || current.includes(l));
    if (onChange) onChange(next);
    else window.AthleteStore.updateAthlete(athlete.id, { coachLocations: next });
  };
  return (
    <div className="coach-locs" onClick={(e) => e.stopPropagation()}>
      <span className="coach-locs-label">Locations <small>(none = all)</small></span>
      {DST_LOCATIONS.map((l) => (
        <label key={l}><input type="checkbox" checked={current.includes(l)} onChange={() => flip(l)} /> {l.replace(/^DST /, "")}</label>
      ))}
    </div>
  );
}

function PlayerCardEdit({ athlete, onChanged }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState(athlete.name);
  const [jersey, setJersey] = useState(hasJersey(athlete) ? athlete.jersey : "");
  const stop = (e) => e.stopPropagation();
  if (!open) {
    return (
      <button
        className="card-edit"
        title={`Edit ${athlete.name}`}
        aria-label={`Edit ${athlete.name}`}
        onClick={(e) => { stop(e); setName(athlete.name); setJersey(hasJersey(athlete) ? athlete.jersey : ""); setOpen(true); }}
      >&#9998;</button>
    );
  }
  const save = (e) => {
    stop(e);
    if (!name.trim()) return;
    window.AthleteStore.updateAthlete(athlete.id, { name: name.trim(), jersey: jersey.trim() || "--" });
    setOpen(false);
    onChanged();
  };
  return (
    <div className="card-edit-form" onClick={stop}>
      <input className="inline-select" value={name} onChange={(e) => setName(e.target.value)} placeholder="Name" aria-label="Name" onKeyDown={(e) => { if (e.key === "Enter") save(e); }} />
      <input className="inline-select" value={jersey} onChange={(e) => setJersey(e.target.value)} placeholder="Jersey #" aria-label="Jersey number" onKeyDown={(e) => { if (e.key === "Enter") save(e); }} />
      <PositionSelect athlete={athlete} onChanged={onChanged} />
      <StatusSelect athlete={athlete} onChanged={onChanged} />
      {athlete.rosterGroup === COACH_ROSTER_GROUP && <CoachLocationsPicker athlete={athlete} onChange={(next) => { window.AthleteStore.updateAthlete(athlete.id, { coachLocations: next }); onChanged(); }} />}

        <button className="btn-link" onClick={save}>Save</button>
        <button className="btn-link" onClick={(e) => { stop(e); setOpen(false); }}>Cancel</button>
      </div>
    </div>
  );
}
